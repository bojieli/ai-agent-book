<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="118.956mm" viewBox="0 0 900 1010" role="img" aria-labelledby="title desc">
<title id="title">Flujo de LLM como juez (LLM-as-a-Judge)</title><desc id="desc">Ejemplo de calificación de una respuesta de reembolso con todas las condiciones de la tarea.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1010" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Tarea y material de referencia</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">Reembolso enviado: $150 · llegada prevista en 3–5 días hábiles</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.6" font-weight="400" fill="#292929">Al medio de pago original; la respuesta debe indicar importe, plazo y vía</text><rect x="20" y="200" width="410" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="200" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="233" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Rubric</text><text x="225" y="280" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Veracidad: obligatorio</text><text x="225" y="312" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Completitud: importante</text><text x="225" y="344" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Claridad: importante</text><text x="225" y="376" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hechos inventados: veto</text><rect x="470" y="200" width="410" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="200" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="233" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Respuesta candidata</text><text x="675" y="280" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.3" font-weight="400" fill="#292929">Reembolso enviado; los $150</text><text x="675" y="312" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">llegarán en 3–5 días hábiles.</text><path d="M225 415 L225 435 L675 435 L675 415" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 435 L450 465" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="465" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="465" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="498" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Modelo juez</text><text x="450" y="545" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">Contrasta cada criterio con la referencia → nota + evidencia + justificación</text><path d="M450 570 L450 605" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="605" width="860" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="605" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="638" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ejemplo de resultado estructurado</text><text x="450" y="685" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hechos: 4/4, importe y plazo correctos</text><text x="450" y="717" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Completitud: 2/4, no indica que vuelve al medio original</text><text x="450" y="749" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Expresión: 4/4 · Alucinación: PASS</text><path d="M450 780 L450 815" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="815" width="860" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="815" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="848" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Reglas de agregación y revisión fijadas de antemano</text><text x="450" y="895" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ponderar por importancia; si salta un veto → tarea fallida</text><text x="450" y="927" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Varios jueces independientes → revisión humana si discrepan</text><text x="450" y="959" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Vincular criterios con nota baja a respuesta y trayectoria</text><defs /></svg>
