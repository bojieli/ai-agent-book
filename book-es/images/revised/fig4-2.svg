<title id="title">Coincidencia jerárquica de herramientas (búsqueda semántica en dos niveles: servidor → herramienta)</title><desc id="desc">Puntuaciones ilustrativas: primero se elige el servidor GitHub y luego se devuelven tres candidatas según la similitud de las herramientas. El número de herramientas por servidor y las puntuaciones solo ilustran el proceso.</desc>
