<ns0:title id="title">Llamadas a herramientas dirigidas por el modelo: bucle en el cliente y bucle alojado en el servidor</ns0:title><ns0:desc id="desc">En la búsqueda con Kimi, el cliente organiza el bucle; en la búsqueda y la ejecución de código alojadas, lo organiza el servidor. Se muestran la tarea, las consultas, los resultados devueltos y los pasos de análisis.</ns0:desc>
