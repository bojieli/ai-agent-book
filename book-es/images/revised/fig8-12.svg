<title id="title">Diseño experimental de GeneralPoints (entrenamiento y prueba de las variantes GP-L y GP-VL)</title><desc id="desc">Ejemplo de cartas, cambio de distribución, inicialización común y dos ramas de entrenamiento.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
