<title id="title">Estructura del contexto tras el descubrimiento dinámico: los schemas de herramientas quedan repartidos por la trayectoria</title><desc id="desc">Dos rondas de descubrimiento de herramientas, con una consulta de cotización y un análisis de colaboradores de GitHub. Las nuevas definiciones entran en el historial con tool_search_output y conservan su posición en las solicitudes posteriores.</desc>
