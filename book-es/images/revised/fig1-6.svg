<ns0:title id="title">Bucle de ejecución de un Agente autónomo</ns0:title><ns0:desc id="desc">Se conservan el razonamiento, la acción, la observación y todas las condiciones de salida; si la tarea se completa, se entrega tras verificarla; ante errores o presupuesto agotado, se guarda el progreso y se informa.</ns0:desc>
