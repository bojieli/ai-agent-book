<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="103.880mm" viewBox="0 0 900 882" role="img" aria-labelledby="title desc">
<title id="title">Bucle de ejecución de un Agente autónomo</title><desc id="desc">Se conservan el razonamiento, la acción, la observación y todas las condiciones de salida; si la tarea se completa, se entrega tras verificarla; ante errores o presupuesto agotado, se guarda el progreso y se informa.</desc>
