<text x="440" y="208" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Continuar</text><rect x="190" y="237" width="360" height="142" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="370" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Razonar y decidir</text><text x="370" y="305" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">(Reasoning)</text><text x="370" y="345" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">«Faltan datos» / responder</text><path d="M275 379 L275 449" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
