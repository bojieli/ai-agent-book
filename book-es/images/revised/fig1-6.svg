<text x="692" y="614" text-anchor="start" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Superada</text><rect x="520" y="644" width="320" height="85" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
