<ns0:title id="title">Cuatro puntos de actualización de un Agente de imágenes médicas</ns0:title><ns0:desc id="desc">Un mismo sistema reconoce imágenes con un modelo, calcula indicadores con un programa, consulta guías clínicas y organiza los resultados según las normas de redacción de informes.</ns0:desc>
