<title id="title">Arquitectura de un sistema de RAG agéntico</title><desc id="desc">Dentro del Agente, el modelo y el Harness organizan el bucle de recuperación; las herramientas externas ejecutan las búsquedas y devuelven observaciones. La interfaz de búsqueda en la base de conocimiento puede conectarse a distintos backends de índice.</desc>
