<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="89.511mm" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<ns0:title id="title">Ajuste de resolución y escalado bidireccional de coordenadas</ns0:title><ns0:desc id="desc">Marca el mismo punto central en el escritorio y en la captura de la herramienta, y muestra la conversión inversa.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="760" fill="#ffffff" y="0" />
<ns0:text x="201" y="48" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Pantalla real</ns0:text><ns0:text x="691" y="48" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Captura de la tool</ns0:text><ns0:rect x="31.0" y="75" width="368" height="207" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M201 178.5 L229 178.5" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M215 164.5 L215 192.5" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="207.78" y="316" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">2560 × 1440</ns0:text><ns0:rect x="589.0" y="112" width="232" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M691 177 L719 177" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M705 163 L705 191" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="697.79" y="276" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">1366 × 768</ns0:text><ns0:path d="M410 176 L575 176" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="481" y="148" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Escala</ns0:text><ns0:path d="M790 242 L790 350 L65 350 L65 282" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="441" y="389" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Punto del modelo (683, 384) → centro del escritorio</ns0:text><ns0:rect x="20" y="420" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="420" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="453" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Convertir con la escala real de cada eje</ns0:text><ns0:text x="442.78" y="500" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">x = 683 × 2560 / 1366 = 1280</ns0:text><ns0:text x="442.79" y="532" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">y = 384 × 1440 / 768 = 720</ns0:text><ns0:path d="M450 570 L450 606" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="606" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="606" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="639" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Clic en (1280, 720) y nueva captura para verificar</ns0:text><ns0:text x="437" y="686" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Con márgenes: restar el relleno y dividir por la escala</ns0:text><ns0:text x="437" y="718" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Con recorte o varias pantallas: sumar el origen</ns0:text><ns0:defs /></ns0:svg>
