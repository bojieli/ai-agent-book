<text x="135" y="242" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant</text><text x="563" y="242" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">call_1 → phone_call(company="Xfinity")</text><rect x="20" y="275" width="860" height="56" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
