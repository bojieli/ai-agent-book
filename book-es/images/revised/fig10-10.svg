<ns0:text x="436" y="208" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Flujo de memoria · entradas de ejemplo</ns0:text><ns0:text x="442.79" y="255" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">08:30 abre el café: importancia 4, recencia 0.60</ns0:text><ns0:text x="442.78" y="287" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">09:15 habla con Klaus: importancia 5, recencia 0.70</ns0:text><ns0:text x="442.79" y="319" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">10:00 planifica la fiesta: importancia 9, recencia 0.80</ns0:text><ns0:text x="442.79" y="351" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">11:30 invita a Maria: importancia 8, recencia 0.85</ns0:text><ns0:text x="442.78" y="383" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">14:00 pide ayuda a Maria: importancia 7, recencia 0.90</ns0:text><ns0:text x="437" y="415" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Recuperación: combina recencia, importancia y relevancia</ns0:text><ns0:path d="M450 455 L450 475 L225 475 L225 500" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
