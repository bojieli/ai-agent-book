<ns0:title id="title">Arquitecturas de Q-learning y Agente LLM en la búsqueda del tesoro</ns0:title><ns0:desc id="desc">Dos rutas de decisión en el mismo entorno y dos condiciones de medición: evaluación tras entrenar y primera ejecución.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="790" fill="#ffffff" y="0" />
