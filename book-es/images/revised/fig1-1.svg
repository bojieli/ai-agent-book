<ns0:title id="title">Interacción en bucle cerrado entre Agent y Environment, y la estructura Model–Harness dentro del Agente</ns0:title><ns0:desc id="desc">El Agente contiene Model y Harness en paralelo. El Harness organiza el contexto, despacha herramientas y gestiona la ejecución; el entorno recibe acciones, actualiza su estado y devuelve observaciones.</ns0:desc>
