<ns0:text x="216" y="394" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Herramienta de hora</ns0:text><ns0:text x="222.78" y="431" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">call_abc123</ns0:text><ns0:text x="217" y="466" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hora actual en Vancouver</ns0:text><ns0:rect x="460" y="360" width="420" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
