<ns0:title id="title">Secuencia completa de dos llamadas a la API del modelo</ns0:title><ns0:desc id="desc">Hora y clima en Vancouver: el modelo emite dos llamadas independientes, el Harness las ejecuta y devuelve los resultados con su ID, y el modelo genera la respuesta final.</ns0:desc>
