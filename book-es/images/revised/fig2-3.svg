<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="91.867mm" viewBox="0 0 900 780" role="img" aria-labelledby="title desc">
<title id="title">Secuencia completa de dos llamadas a la API del modelo</title><desc id="desc">Hora y tiempo en Vancouver: el modelo emite dos llamadas independientes, el Harness las ejecuta y devuelve los resultados con su ID, y el modelo genera la respuesta final.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="780" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="56" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Primera llamada al modelo</text><text x="450" y="93" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">messages: system + user · tools: hora + tiempo</text><path d="M450 120 L450 157" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="157" width="860" height="145" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="193" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant: tool_calls</text><text x="450" y="235" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">call_abc123 → get_current_time(timezone="America/Vancouver")</text><text x="450" y="276" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">call_def456 → get_weather(city="Vancouver", unit="celsius")</text><path d="M450 302 L450 325 L230 325 L230 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 325 L670 325 L670 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="360" width="420" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="230" y="394" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Herramienta de hora</text><text x="230" y="431" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">call_abc123</text><text x="230" y="466" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hora actual en Vancouver</text><rect x="460" y="360" width="420" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="670" y="394" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Herramienta meteorológica</text><text x="670" y="431" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">call_def456</text><text x="670" y="466" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Temperatura y estado</text><text x="450" y="348" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Independientes · en paralelo</text><path d="M230 485 L230 516 L450 516" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M670 485 L670 516 L450 516 L450 550" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="550" width="860" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="585" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Segunda llamada al modelo · mismas tools</text><text x="450" y="625" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">messages previos + assistant + 2 resultados (tool_call_id)</text><path d="M450 650 L450 683" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="683" width="860" height="77" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="714" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant: respuesta final (fin del bucle)</text><text x="450" y="747" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">«En Vancouver son las…, el tiempo…»</text><defs /></svg>
