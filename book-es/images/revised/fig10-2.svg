<ns0:title id="title">Estructura de montaje en cuatro zonas del sistema de archivos virtual del Agente</ns0:title><ns0:desc id="desc">Interfaz de archivos unificada con cuatro tipos de permisos y ciclos de vida, más las entradas del usuario y de recursos externos.</ns0:desc>
