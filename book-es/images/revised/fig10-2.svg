<ns0:text x="436" y="213" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Sistema de archivos virtual</ns0:text><ns0:text x="444.96" y="260" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Interfaz unificada: read_file · write_file · list_dir</ns0:text><ns0:text x="437" y="292" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Montaje y autorización → acceso por zonas</ns0:text><ns0:path d="M225 325 L225 370" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
