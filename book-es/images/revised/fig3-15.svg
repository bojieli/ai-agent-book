<title id="title">Pipeline de extracción de conocimiento estructurado</title><desc id="desc">A partir de material de casos se descubren campos modulares, se extraen registros estructurados y, tras codificar, estandarizar y agrupar, se forman prototipos; los pesos de las características se explican por las diferencias entre centroides.</desc>
