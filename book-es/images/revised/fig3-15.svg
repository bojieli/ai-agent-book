<ns0:text x="436" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Fase 1: extracción y estructuración</ns0:text><ns0:rect x="40" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
