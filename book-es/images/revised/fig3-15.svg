<ns0:title id="title">Pipeline de extracción de conocimiento estructurado</ns0:title><ns0:desc id="desc">A partir de material de casos se descubren campos modulares, se extraen registros estructurados y, tras codificar, estandarizar y agrupar, se forman prototipos; los pesos de las características se explican por las diferencias entre centroides.</ns0:desc>
