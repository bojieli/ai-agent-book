<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="111.889mm" viewBox="0 0 900 950" role="img" aria-labelledby="title desc">
<title id="title">Flujo de consulta RAG: recuperación, aumento y generación</title><desc id="desc">La pregunta sobre reembolsos recupera fragmentos de política y de procedimiento; estos, junto con la pregunta, forman la entrada del modelo, que genera una respuesta concreta.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="950" fill="#ffffff" y="0" />
<rect x="20" y="20" width="290" height="110" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="165" y="58" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.6" font-weight="700" fill="#292929">Pregunta del usuario</text><text x="165" y="99" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">¿Cómo pido un reembolso?</text><rect x="440" y="20" width="440" height="110" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="660" y="58" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Base de conocimiento</text><text x="660" y="99" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Política · guía de uso · plazos de abono</text><path d="M165 130 L165 175 L290 175" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M660 130 L660 175 L610 175" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="290" y="145" width="320" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="183" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Recuperar Top-k</text><text x="450" y="222" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Vector denso / BM25</text><path d="M450 245 L450 280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="280" width="860" height="195" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="317" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Resultados de la recuperación</text><text x="450" y="361" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">① Reembolso total hasta 7 días tras la entrega, con el n.º de pedido.</text><text x="450" y="404" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">El reembolso se abona en 3–5 días hábiles.</text><text x="450" y="447" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">② Mis pedidos → elegir pedido → solicitar reembolso.</text><path d="M450 475 L450 515" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="515" width="860" height="125" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="554" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Entrada aumentada del modelo</text><text x="450" y="601" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Instrucción + pregunta + fragmentos con su fuente</text><path d="M450 640 L450 675" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="290" y="675" width="320" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="717" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">El LLM responde</text><path d="M450 740 L450 780" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="780" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="818" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Respuesta</text><text x="450" y="861" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">En los 7 días posteriores a la entrega, entre en «Mis pedidos», elija el pedido</text><text x="450" y="900" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">y solicite el reembolso con el n.º de pedido; se abonará en 3–5 días hábiles.</text><defs /></svg>
