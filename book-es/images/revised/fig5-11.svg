<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="105.764mm" viewBox="0 0 900 898" role="img" aria-labelledby="title desc">
<title id="title">Pipeline de un Agente que crea Agentes</title><desc id="desc">Dos rutas de generación con los mismos criterios de aceptación; se registran calidad y coste de creación.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="898" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Requisito del usuario</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">Crear Agente revisor: lee checks de despliegue y decide si publicar</text><path d="M450 140 L450 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 190 L225 160 L675 160 L675 190" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ruta A: desde cero</text><text x="225" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.8" font-weight="400" fill="#292929">Escribir el bucle y los mensajes</text><text x="225" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Protocolo y herramientas de dominio</text><text x="225" y="334" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Añadir CLI y pruebas</text><rect x="470" y="190" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="190" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.5" font-weight="700" fill="#292929">Ruta B: adaptar referencia</text><text x="675" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.1" font-weight="400" fill="#292929">Copiar un marco que lee registros</text><text x="675" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">Campos de estado y criterios</text><text x="675" y="334" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">Prompts, herramientas y docs</text><path d="M225 370 L225 415 L675 415 L675 370" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 415 L450 460" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="460" width="860" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="460" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="493" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Aceptación común</text><text x="450" y="540" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.1" font-weight="400" fill="#292929">Estructura y compilación → pruebas generadas → emparejamiento de llamadas</text><text x="450" y="572" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.5" font-weight="400" fill="#292929">Tarea con modelo real → estado multiturno → recorte de contexto y límites</text><path d="M450 625 L450 645" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 670 L225 645 L675 645 L675 670" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="670" width="410" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="670" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="703" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Calidad de la tarea</text><text x="225" y="750" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">¿Se completa la tarea?</text><text x="225" y="782" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929">¿Mensajes y resultados ligados?</text><text x="225" y="814" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.3" font-weight="400" fill="#292929">¿Estado y salida correctos?</text><rect x="470" y="670" width="410" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="670" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="703" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Coste de creación</text><text x="675" y="750" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tiempo de creación</text><text x="675" y="782" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tokens de entrada y salida</text><text x="675" y="814" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">Rondas de edición y validación</text><defs /></svg>
