<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="95.400mm" viewBox="0 0 900 810" role="img" aria-labelledby="title desc">
<title id="title">Predicción del siguiente token en el preentrenamiento</title><desc id="desc">Tres prefijos y objetivos de una misma frase de entrenamiento; la primera posición se despliega en una distribución de probabilidad de ejemplo y su pérdida.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="810" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ejemplo de entrenamiento</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">El Agente debe ejecutar tareas en un entorno real</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.6" font-weight="400" fill="#292929">Tokenización ilustrativa; los límites reales los decide el tokenizer</text><text x="300" y="215" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Prefijo ya leído</text><text x="718" y="215" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Siguiente token real</text><rect x="20" y="244" width="558" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="286" y="284" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">El / Agente / debe / ejecutar / tareas</text><path d="M578 274 L635 274" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="635" y="244" width="245" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="757" y="284" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">en</text><rect x="20" y="318" width="558" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="299" y="358" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">… / tareas / en</text><path d="M578 348 L635 348" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="635" y="318" width="245" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="757" y="358" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">un</text><rect x="20" y="392" width="558" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="299" y="432" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">… / tareas / en / un</text><path d="M578 422 L635 422" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="635" y="392" width="245" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="757" y="432" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">entorno</text><rect x="20" y="500" width="860" height="153" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="500" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="533" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Primera fila: ¿qué probabilidad da el modelo a “en”?</text><text x="450" y="580" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Predicción: en 42 % · dentro 28 % · bajo 15 % · otros 15 %</text><text x="450" y="612" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Pérdida en esta posición: −ln(0.42) ≈ 0.87</text><path d="M450 653 L450 688" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="688" width="860" height="108" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="688" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="721" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.7" font-weight="700" fill="#292929">Combinar las pérdidas de todas las posiciones y actualizar</text><text x="450" y="768" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">L = −Σₜ log P(xₜ | x₁,…,xₜ₋₁) → gradiente → optimizador</text><defs /></svg>
