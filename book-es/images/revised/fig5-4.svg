<ns0:title id="title">Cinco métodos de edición de archivos</ns0:title><ns0:desc id="desc">Modificando la función foo como ejemplo: localización y comprobaciones de cada método.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="764" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="220.59" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Diff + Apply Model</ns0:text><ns0:text x="218.53" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">− def foo(x): return x</ns0:text><ns0:text x="218.23" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">+ def foo(x, y=0): return x+y</ns0:text><ns0:text x="212" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">El modelo describe; otro lo aplica</ns0:text><ns0:text x="212" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.0" font-weight="400" fill="#292929">Verifica: diff aplicado y pruebas</ns0:text><ns0:rect x="470" y="20" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="666.64" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Old String → New String</ns0:text><ns0:text x="668.53" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">old: def foo(x): return x</ns0:text><ns0:text x="668.23" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">new: def foo(x,y=0): return x+y</ns0:text><ns0:text x="662" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sustituye el texto exacto</ns0:text><ns0:text x="662" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Verifica: nº de coincidencias</ns0:text><ns0:rect x="20" y="272" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="272" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="305" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Por número de línea</ns0:text><ns0:text x="212" y="352" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Rango: líneas 42–43</ns0:text><ns0:text x="212" y="384" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Sustituir por la nueva definición</ns0:text><ns0:text x="212" y="416" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Rango compacto para bloques grandes</ns0:text><ns0:text x="212" y="448" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">Verifica: versión y desfases</ns0:text><ns0:rect x="470" y="272" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="272" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="305" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Comandos tipo Vim</ns0:text><ns0:text x="662" y="352" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">42G: ir · cw: cambiar palabra</ns0:text><ns0:text x="662" y="384" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.6" font-weight="400" fill="#292929">dd: borrar línea · yy / p: copiar</ns0:text><ns0:text x="662" y="416" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Combina operaciones con estado</ns0:text><ns0:text x="662" y="448" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Verifica: modo, cursor y diff real</ns0:text><ns0:rect x="20" y="524" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="524" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="557" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Inicio y fin</ns0:text><ns0:text x="221.39" y="604" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">start: def foo(x):</ns0:text><ns0:text x="218.53" y="636" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">end: return x</ns0:text><ns0:text x="212" y="668" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">new: la función nueva completa</ns0:text><ns0:text x="212" y="700" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Verifica: límites y rango</ns0:text><ns0:rect x="470" y="524" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="524" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="557" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Verificación común</ns0:text><ns0:text x="662" y="604" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">Leer el contexto → localizar</ns0:text><ns0:text x="662" y="636" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">Aplicar el cambio → ver el diff</ns0:text><ns0:text x="662" y="668" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.5" font-weight="400" fill="#292929">Ejecutar pruebas → tratar fallos</ns0:text><ns0:text x="662" y="700" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">Guardar versión y punto de retorno</ns0:text><ns0:defs /></ns0:svg>
