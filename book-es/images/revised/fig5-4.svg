<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="89.982mm" viewBox="0 0 900 764" role="img" aria-labelledby="title desc">
<title id="title">Cinco métodos de edición de archivos</title><desc id="desc">Modificando la función foo como ejemplo: localización y comprobaciones de cada método.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="764" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Diff + Apply Model</text><text x="225" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">− def foo(x): return x</text><text x="225" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">+ def foo(x, y=0): return x+y</text><text x="225" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">El modelo describe; otro lo aplica</text><text x="225" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.0" font-weight="400" fill="#292929">Verifica: diff aplicado y pruebas</text><rect x="470" y="20" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Old String → New String</text><text x="675" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">old: def foo(x): return x</text><text x="675" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">new: def foo(x,y=0): return x+y</text><text x="675" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sustituye el texto exacto</text><text x="675" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Verifica: nº de coincidencias</text><rect x="20" y="272" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="272" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="305" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Por número de línea</text><text x="225" y="352" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Rango: líneas 42–43</text><text x="225" y="384" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Sustituir por la nueva definición</text><text x="225" y="416" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Rango compacto para bloques grandes</text><text x="225" y="448" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">Verifica: versión y desfases</text><rect x="470" y="272" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="272" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="305" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Comandos tipo Vim</text><text x="675" y="352" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">42G: ir · cw: cambiar palabra</text><text x="675" y="384" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.6" font-weight="400" fill="#292929">dd: borrar línea · yy / p: copiar</text><text x="675" y="416" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Combina operaciones con estado</text><text x="675" y="448" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Verifica: modo, cursor y diff real</text><rect x="20" y="524" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="524" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="557" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Inicio y fin</text><text x="225" y="604" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">start: def foo(x):</text><text x="225" y="636" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">end: return x</text><text x="225" y="668" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">new: la función nueva completa</text><text x="225" y="700" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Verifica: límites y rango</text><rect x="470" y="524" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="524" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="557" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Verificación común</text><text x="675" y="604" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">Leer el contexto → localizar</text><text x="675" y="636" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">Aplicar el cambio → ver el diff</text><text x="675" y="668" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.5" font-weight="400" fill="#292929">Ejecutar pruebas → tratar fallos</text><text x="675" y="700" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">Guardar versión y punto de retorno</text><defs /></svg>
