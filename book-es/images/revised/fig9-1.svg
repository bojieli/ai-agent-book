<rect x="70" y="518" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="551" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Validar y publicar</text><text x="450" y="598" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tareas independientes · regresión ·</text><text x="450" y="629.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">despliegue gradual · monitorización · reversión</text><path d="M830 583 L865 583 L865 718 L35 718 L35 85 L70 85" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
