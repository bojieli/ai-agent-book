<ns0:title id="title">Arquitectura de pensamiento rápido/lento y comparación de soluciones</ns0:title><ns0:desc id="desc">Tres formas de organizar la confirmación de la tarea, las sugerencias en segundo plano, la formulación y la expresión.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="1103" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
