<title id="title">Arquitectura de pensamiento rápido/lento y comparación de soluciones</title><desc id="desc">Tres formas de organizar la confirmación de la tarea, las sugerencias en segundo plano, la formulación y la expresión.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
