<text x="450" y="383" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Respuesta integrada</text><text x="450" y="430" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Recomendar tras verificar; seguir lo ya dicho al usuario</text><rect x="20" y="485" width="860" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
