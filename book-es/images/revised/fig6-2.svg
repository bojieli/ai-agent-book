<title id="title">Capa de entrada: adaptadores, sobre unificado y registro de entrada</title><desc id="desc">Cada fuente escribe en el registro de entrada mediante su adaptador; el enrutador despacha al runtime y la respuesta vuelve al canal de conversación por el adaptador de salida.</desc>
