<ns0:text x="436" y="701" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ Cómo influyen los resultados en la siguiente ronda</ns0:text><ns0:text x="443.92" y="748" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">Estadística pareada y causas de fallo: comparar modelos o el Harness</ns0:text><ns0:text x="437" y="780" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Añadir tareas de regresión a partir de los fallos</ns0:text><ns0:path d="M20 742 L7 742 L7 339 L20 339" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
