<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="123.667mm" viewBox="0 0 900 1050" role="img" aria-labelledby="title desc">
<title id="title">Optimización de la KV Cache en la carga dinámica de herramientas</title><desc id="desc">A la izquierda, modificar la lista de herramientas al principio obliga a recalcular desde el punto de cambio; a la derecha, se conserva el prefijo y los resultados del descubrimiento se añaden al final del historial. El acierto de caché también depende de la política del servicio.</desc>
