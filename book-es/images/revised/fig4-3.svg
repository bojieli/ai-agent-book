<ns0:title id="title">Optimización de la KV Cache en la carga dinámica de herramientas</ns0:title><ns0:desc id="desc">A la izquierda, modificar la lista de herramientas al principio obliga a recalcular desde el punto de cambio; a la derecha, se conserva el prefijo y los resultados del descubrimiento se añaden al final del historial. El acierto de caché también depende de la política del servicio.</ns0:desc>
