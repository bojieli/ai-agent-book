<ns0:text x="662" y="105" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Resultados completos</ns0:text><ns0:rect x="20" y="157" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
