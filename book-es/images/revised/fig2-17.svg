<ns0:title id="title">Flujo de procesamiento de las seis estrategias de compresión</ns0:title><ns0:desc id="desc">Las seis estrategias difieren en cómo organizan el material, el contexto de la tarea, los enlaces de origen y el umbral de la ventana.</ns0:desc>
