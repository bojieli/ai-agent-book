<title id="title">Recuperación consciente del contexto</title><desc id="desc">El documento original y el fragmento objetivo entran juntos al modelo, que genera un prefijo de contexto; luego se indexan el prefijo y el texto original. El ejemplo conserva el fragmento completo sobre el crecimiento del 3 % de los ingresos de ACME en el segundo trimestre de 2025.</desc>
