<ns0:text x="436" y="373" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Optimización token a token</ns0:text><ns0:text x="445.61" y="420" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">L = −Σₜ log P(yₜ | x, y₁,…,yₜ₋₁)</ns0:text><ns0:text x="437" y="452" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.3" font-weight="400" fill="#292929">Respuesta y acciones objetivo en la pérdida; la entrada, como contexto</ns0:text><ns0:path d="M450 480 L450 515" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
