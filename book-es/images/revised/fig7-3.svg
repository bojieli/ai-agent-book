<ns0:rect width="900" height="643" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="410" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Herramientas · código</ns0:text><ns0:text x="212" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">Usa herramientas, lee resultados</ns0:text><ns0:rect x="470" y="20" width="410" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
