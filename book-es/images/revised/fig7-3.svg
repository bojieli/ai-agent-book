<ns0:path d="M225 350 L225 395" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M675 350 L675 395" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
