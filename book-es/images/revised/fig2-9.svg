<title id="title">Mensaje de usuario y resultado de herramienta en la plantilla de Qwen3</title><desc id="desc">El mismo texto procede del usuario o de una herramienta. Ambos empiezan con la marca user; el resultado de la herramienta lleva además la etiqueta tool_response.</desc>
