<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="80.089mm" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
<title id="title">Agente = LLM + contexto + herramientas</title><desc id="desc">Se lee de arriba abajo a partir de un encargo sobre una factura. El modelo decide primero consultar la factura y la herramienta devuelve el detalle; el detalle entra en el contexto y, con él, el modelo decide el siguiente paso.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="680" fill="#ffffff" y="0" />
<rect x="24" y="20" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="20" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="76" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Contexto</text><text x="544" y="76" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Encargo: aclarar el cobro de más de este mes</text><path d="M544 110 L544 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="154" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="154" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="210" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM</text><text x="544" y="210" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Decide consultar primero la factura del mes</text><path d="M544 244 L544 284" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="288" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="288" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="344" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.8" font-weight="700" fill="#292929">Herramienta</text><text x="544" y="344" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.3" font-weight="400" fill="#292929">La API de facturas devuelve un cargo de roaming</text><path d="M544 378 L544 418" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="422" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="422" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="478" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Contexto</text><text x="544" y="478" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Aquí están el encargo y el detalle obtenido</text><path d="M544 512 L544 552" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="556" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="556" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="612" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM</text><text x="544" y="612" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23" font-weight="400" fill="#292929">Decide preguntar a soporte por qué se cobró el roaming</text><defs /></svg>
