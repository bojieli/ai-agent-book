<rect x="20" y="703" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="736" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">El ejecutor comprueba que sea visible e interactuable</text><text x="450" y="783" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Clic en Submit y leer la página actualizada</text><path d="M450 818 L450 859" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
