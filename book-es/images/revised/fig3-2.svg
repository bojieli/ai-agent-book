<title id="title">Comparación de cuatro estrategias de memoria</title><desc id="desc">Los cuatro formatos de memoria conservan hechos, contexto, campos y relaciones con distinta granularidad.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="735" fill="#ffffff" y="0" />
