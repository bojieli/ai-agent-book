<text x="675" y="258" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">El párrafo guarda el contexto</text><text x="675" y="288" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Lo repetido exige actualizar todo</text><rect x="20" y="365" width="410" height="350" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
