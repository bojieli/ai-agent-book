<text x="225" y="258" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Acceso por clave: O(1) medio</text><text x="225" y="288" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">Relacionar exige ID o búsqueda</text><rect x="470" y="20" width="410" height="305" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
