<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="106.000mm" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Doble bucle de ejecución en línea y evolución fuera de línea</title><desc id="desc">A la izquierda, se consulta según la versión actual y se espera el acuse; a la derecha, se aprende de los registros. La nueva versión que supera la validación se usa en tareas posteriores.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="900" fill="#ffffff" y="0" />
<rect x="20" y="20" width="360" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="200" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ejecución en línea</text><text x="200" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929">Tramitar con versión actual</text><text x="200" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929">Registrar acciones y acuses</text><text x="200" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.3" font-weight="400" fill="#292929">Avisar al usuario al cerrar</text><rect x="520" y="20" width="360" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="700" fill="#292929">Evolución fuera de línea</text><text x="700" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Agregar trayectorias</text><text x="700" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">y diagnósticos; buscar</text><text x="700" y="163.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">causas raíz comunes</text><rect x="20" y="350" width="360" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="350" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="200" y="383" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Esperar el trámite</text><text x="200" y="430" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22" font-weight="400" fill="#292929">Reanudar al recibir el aviso</text><text x="200" y="462" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22" font-weight="400" fill="#292929">o consultar a la hora fijada</text><path d="M120 220 L120 350" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="65" y="292" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">En</text><text x="65" y="323.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">curso</text><path d="M278 350 L278 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="290" y="312" text-anchor="start" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Reanudar</text><path d="M380 120 L520 120" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="95" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bitácora</text><rect x="520" y="270" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="270" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="303" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Cambios candidatos</text><text x="700" y="350" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.9" font-weight="400" fill="#292929">Conocimiento · instrucciones</text><text x="700" y="382" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Programas · parámetros</text><path d="M700 220 L700 270" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M700 435 L700 490" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="520" y="490" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="490" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="523" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="700" fill="#292929">Validación independiente</text><text x="700" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">Tareas nuevas y previas</text><text x="700" y="602" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Regresión y seguridad</text><path d="M520 575 L485 575 L485 352 L520 352" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="432" y="460" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="400" fill="#292929">Rehacer</text><path d="M700 655 L700 710" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="520" y="710" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="710" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="743" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.4" font-weight="700" fill="#292929">Publicar y monitorizar</text><text x="700" y="790" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Despliegue gradual</text><text x="700" y="822" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">Pasar a estable / revertir</text><path d="M520 792 L8 792 L8 120 L20 120" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="260" y="775" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">Las tareas posteriores usan la nueva versión</text><defs /></svg>
