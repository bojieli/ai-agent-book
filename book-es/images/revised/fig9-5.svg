<ns0:text x="686" y="303" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Cambios candidatos</ns0:text><ns0:text x="687" y="350" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.9" font-weight="400" fill="#292929">Conocimiento · instrucciones</ns0:text><ns0:text x="687" y="382" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Programas · parámetros</ns0:text><ns0:path d="M700 220 L700 270" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M700 435 L700 490" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="520" y="490" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
