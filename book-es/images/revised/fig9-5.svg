<ns0:text x="247" y="775" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">Las tareas posteriores usan la nueva versión</ns0:text><ns0:defs /></ns0:svg>
