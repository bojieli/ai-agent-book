<ns0:title id="title">Arquitectura de llamada a herramientas con un LLM local</ns0:title><ns0:desc id="desc">Tarea de hora y clima en Vancouver: el cliente mantiene los mensajes, llama al modelo local, despacha dos herramientas y devuelve las observaciones al modelo.</ns0:desc>
