<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="115.776mm" viewBox="0 0 900 983" role="img" aria-labelledby="title desc">
<ns0:title id="title">Pipeline de artículo a vídeo explicativo</ns0:title><ns0:desc id="desc">Dos etapas: generación y revisión de diapositivas; narración por página y montaje de audio y vídeo.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="983" fill="#ffffff" y="0" />
<ns0:rect x="100" y="20" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="100" y="20" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Análisis del artículo y planificación</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Extraer secciones, aportaciones y figuras</ns0:text><ns0:text x="437" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">Planificar páginas y asignar figuras a cada tesis</ns0:text><ns0:path d="M450 175 L450 215" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="100" y="215" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="100" y="215" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="248" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Generación y revisión en Slidev</ns0:text><ns0:text x="437" y="295" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mezclar código, texto y figuras</ns0:text><ns0:text x="437" y="327" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Renderizar página → revisión visual → corregir</ns0:text><ns0:path d="M450 370 L450 410" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="100" y="410" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="100" y="410" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="443" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Capturas y guion por página</ns0:text><ns0:text x="437" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mantener el orden y la relación con las figuras</ns0:text><ns0:text x="437" y="522" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Narración oral para cada página</ns0:text><ns0:path d="M450 565 L450 605" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="100" y="605" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="100" y="605" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="638" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ TTS y sincronización audio-imagen</ns0:text><ns0:text x="437" y="685" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sintetizar voz por página y leer su duración</ns0:text><ns0:text x="437" y="717" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.7" font-weight="400" fill="#292929">Ajustar la duración de cada captura; revisar transiciones</ns0:text><ns0:path d="M450 760 L450 800" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="100" y="800" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="100" y="800" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="833" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑤ Montaje y revisión del vídeo</ns0:text><ns0:text x="437" y="880" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">FFmpeg combina pista de audio e imagen</ns0:text><ns0:text x="437" y="912" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">Revisar figuras, narración y sincronía audio-imagen</ns0:text><ns0:defs /></ns0:svg>
