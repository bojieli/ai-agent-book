<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="101.524mm" viewBox="0 0 900 862" role="img" aria-labelledby="title desc">
<title id="title">Coordinación secuencial del Manager</title><desc id="desc">El Manager invoca por turnos a los miembros de recopilación, análisis y redacción, y recibe sus resultados.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="862" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Manager · planificación y despacho</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Herramientas: call_agent_A / call_agent_B / call_agent_C</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Herramientas auxiliares: search / write_file</text><text x="450" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Decide el siguiente paso según los resultados devueltos</text><path d="M125 200 L125 834" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="255" width="550" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="255" width="550" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="575" y="288" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="700" fill="#292929">Agent A · recopilación de información</text><text x="575" y="335" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Busca documentación técnica</text><text x="575" y="367" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Extrae hechos clave y fuentes</text><path d="M125 285 L300 285" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">1. Invocar</text><path d="M300 375 L125 375" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="410" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fuentes</text><rect x="300" y="449" width="550" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="449" width="550" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="575" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent B · análisis de datos</text><text x="575" y="529" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Compara soluciones y estadísticas</text><text x="575" y="561" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ordena conclusiones y su base</text><path d="M125 479 L300 479" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="464" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">2. Invocar</text><path d="M300 569 L125 569" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="604" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Análisis</text><rect x="300" y="643" width="550" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="643" width="550" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="575" y="676" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent C · generación del informe</text><text x="575" y="723" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Organiza la estructura del informe</text><text x="575" y="755" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Maqueta y escribe según lo pedido</text><path d="M125 673 L300 673" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="658" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">3. Invocar</text><path d="M300 763 L125 763" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="798" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Informe</text><defs /></svg>
