<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="109.769mm" viewBox="0 0 900 932" role="img" aria-labelledby="title desc">
<ns0:title id="title">De las trayectorias evaluadas a un documento de conocimiento experiencial</ns0:title><ns0:desc id="desc">Con el ejemplo de un tiempo de espera agotado en una consulta, se contrastan los éxitos y fallos de los registros originales y se valida la experiencia candidata en tareas nuevas.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="932" fill="#ffffff" y="0" />
<ns0:rect x="70" y="20" width="760" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="20" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Trayectoria original</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.7" font-weight="400" fill="#292929">La herramienta A agota el tiempo; con B se obtiene el resultado.</ns0:text><ns0:path d="M450 136 L450 171" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="171" width="760" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="171" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="204" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Evaluación individual: plantear una hipótesis</ns0:text><ns0:text x="437" y="251" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.1" font-weight="400" fill="#292929">Ante otro timeout, ¿cambiar directamente de herramienta?</ns0:text><ns0:path d="M450 287 L450 322" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="322" width="760" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="322" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="355" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.0" font-weight="700" fill="#292929">Comparación entre trayectorias: buscar contraejemplos</ns0:text><ns0:text x="437" y="402" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.8" font-weight="400" fill="#292929">Otra consulta similar agotó el tiempo, y reintentar A funcionó.</ns0:text><ns0:text x="437" y="434" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">Ambos registros guardan versión, error y valor devuelto.</ns0:text><ns0:path d="M450 472 L450 507" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="507" width="760" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="507" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="540" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Experiencia candidata: precisar cuándo aplica</ns0:text><ns0:text x="437" y="587" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Si hay timeout, reintentar; si persiste, usar la alternativa.</ns0:text><ns0:text x="437" y="619" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.6" font-weight="400" fill="#292929">Adjuntar los registros que apoyan y refutan esta recomendación.</ns0:text><ns0:path d="M450 657 L450 692" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="692" width="760" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="692" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="725" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Validación independiente y, luego, indexación</ns0:text><ns0:text x="437" y="772" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">Comparar tasa de éxito y tiempo en consultas reservadas.</ns0:text><ns0:text x="437" y="804" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.0" font-weight="400" fill="#292929">Tras adoptarla, seguir registrando el resultado de cada consulta.</ns0:text><ns0:path d="M830 767 L865 767 L865 902 L30 902 L30 397 L70 397" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="437" y="880" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Nueva evidencia: revisar condiciones / actualizar / retirar</ns0:text><ns0:defs /></ns0:svg>
