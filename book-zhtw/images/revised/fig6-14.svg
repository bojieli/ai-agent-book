<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="122.136mm" viewBox="0 0 900 1037" role="img" aria-labelledby="title desc">
<title id="title">Set-of-Mark 與結構化元素索引（browser-use 實作）</title><desc id="desc">視覺候選與DOM候選共享可引用標記，並保留元素示例。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
