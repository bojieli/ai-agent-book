<ns0:title id="title">Agent = LLM + 上下文 + 工具</ns0:title><ns0:desc id="desc">從一項帳單委託開始，自上而下讀。模型先決定查詢帳單，工具回傳明細；明細進入上下文，模型據此決定下一步。</ns0:desc>
