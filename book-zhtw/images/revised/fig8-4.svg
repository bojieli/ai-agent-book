<rect x="20" y="390" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="423" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">α = 0.2，γ = 0.99</text><text x="450" y="470" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">TD 目標：4.5 + 0.99 × 0.63 = 5.1237</text><text x="450" y="502" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">TD 誤差：5.1237 − 0.25 = 4.8737</text><text x="450" y="534" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">新估計：0.25 + 0.2 × 4.8737 = 1.22474</text><defs /></svg>
