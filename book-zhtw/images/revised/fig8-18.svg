<text x="450" y="161" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">結果或錯誤</text><path d="M625 184 L275 184" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
