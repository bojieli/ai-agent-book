<rect x="30" y="618" width="840" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="651" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">論文計時：單節點順序執行 → 分散式執行</text><text x="450" y="698" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">採集軌跡：7,695 秒 → 525 秒（約 14.6 倍）</text><text x="450" y="730" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">更新參數：兩組均為 144 秒</text><defs /></svg>
