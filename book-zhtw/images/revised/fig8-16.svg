<ns0:rect x="177" y="20" width="545" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="440.89" y="53" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">策略模型 πθ</ns0:text><ns0:text x="436.5" y="100" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">生成搜尋、程式碼、文件呼叫或回答</ns0:text><ns0:path d="M450 138 L450 190" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="177" y="190" width="545" height="118" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="177" y="190" width="545" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="442.57" y="223" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Harness</ns0:text><ns0:text x="436.5" y="270" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">組織上下文，校驗參數與權限，記錄軌跡</ns0:text><ns0:path d="M450 308 L450 361" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="177" y="361" width="545" height="118" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="177" y="361" width="545" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="435.5" y="394" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">工具與環境</ns0:text><ns0:text x="436.5" y="441" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">執行 API 或沙箱程式，回傳結果、錯誤及狀態</ns0:text><ns0:path d="M722 420 L862 420 L862 250 L722 250" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
