<rect x="20" y="160" width="260" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="160" width="260" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="150" y="193" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">任務 T1</text><text x="150" y="240" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">每個 tick 增長 3%</text><text x="150" y="272" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">最先完成</text><path d="M450 120 L450 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
