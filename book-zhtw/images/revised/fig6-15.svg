<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="89.511mm" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">解析度匹配與雙向座標縮放</title><desc id="desc">在桌面與工具截圖中標出同一中心點並示範如何逆向換算。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="760" fill="#ffffff" y="0" />
<text x="215" y="48" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">實際螢幕</text><text x="705" y="48" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">工具輸出截圖</text><rect x="31.0" y="75" width="368" height="207" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<path d="M201 178.5 L229 178.5" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M215 164.5 L215 192.5" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="215" y="316" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">2560 × 1440</text><rect x="589.0" y="112" width="232" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<path d="M691 177 L719 177" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M705 163 L705 191" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="705" y="276" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">1366 × 768</text><path d="M410 176 L575 176" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="494" y="148" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">縮放</text><path d="M790 242 L790 350 L65 350 L65 282" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="455" y="389" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">模型點 (683, 384) 映回桌面中心</text><rect x="20" y="420" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="420" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="453" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">按兩個方向的實際比例換算</text><text x="450" y="500" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">x = 683 × 2560 / 1366 = 1280</text><text x="450" y="532" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">y = 384 × 1440 / 768 = 720</text><path d="M450 570 L450 606" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="606" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="606" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="639" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">點選 (1280, 720)，重新截圖檢查結果</text><text x="450" y="686" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">有留白時先減填充偏移，再除縮放係數</text><text x="450" y="718" text-anchor="middle" font-family="&quot;Noto Sans CJK TC&quot;, &quot;Source Han Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">有裁剪或多個螢幕時，再加對應的原點偏移</text><defs /></svg>
