<ns0:rect x="20" y="605" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="638" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">RoboTwin2 · SAPIEN 시뮬레이션 환경</ns0:text><ns0:text x="437" y="685" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">move_can_pot: 물체, 냄비, 양팔 로봇</ns0:text><ns0:text x="437" y="717" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">위치 / 방향 / 외형 무작위화 · 충돌 / 접촉 / 마찰</ns0:text><ns0:text x="437" y="749" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">제어 실행 → 물체·관절 상태 갱신 → 카메라 관측</ns0:text><ns0:path d="M20 700 L6 700 L6 250 L20 250" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M450 790 L450 835" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
