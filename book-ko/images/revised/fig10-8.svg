<ns0:title id="title">병렬 검색의 메시지 순서</ns0:title><ns0:desc id="desc">열 명의 멤버가 병렬로 검색한다. Manager는 첫 유효 후보를 검증한 뒤 아직 검색 중인 멤버에게 취소를 보내고 확인 응답을 기다린다.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="907" fill="#ffffff" y="0" />
<ns0:text x="435" y="42" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">교육용 예시: 멤버 10명이 교수 한 명을 병렬 검색</ns0:text><ns0:rect x="47" y="72" width="182" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="131.9" y="112" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Manager</ns0:text><ns0:rect x="269" y="72" width="182" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
