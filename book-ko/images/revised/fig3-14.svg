<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="104.940mm" viewBox="0 0 900 891" role="img" aria-labelledby="title desc">
<title id="title">컨텍스트 인식 검색</title><desc id="desc">원본 문서와 대상 청크를 함께 모델에 입력해 배경 접두사를 생성하고, 접두사와 원문을 함께 색인한다. 예시는 ACME사 2025년 2분기 매출 3% 증가의 전체 조각을 유지한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
