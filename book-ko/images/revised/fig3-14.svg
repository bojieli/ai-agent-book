<rect x="180" y="686" width="540" height="85" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="721" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM 컨텍스트 접두사 생성</text><text x="450" y="756" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">같은 문서 호출은 프롬프트 캐시 재사용</text><path d="M450 771 L450 806" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
