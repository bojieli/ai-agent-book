<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="98.933mm" viewBox="0 0 900 840" role="img" aria-labelledby="title desc">
<ns0:title id="title">책의 구성: 에이전트 구축과 능력 향상</ns0:title><ns0:desc id="desc">1~6장은 구축 방법을 세우고, 7장은 평가 피드백을 제공하며, 8~10장은 파라미터, 시스템 갱신, 협업으로 능력을 높인다.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="840" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="214.11" y="60" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">제1부: 에이전트 구축 방법</ns0:text><ns0:rect x="480" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="666" y="60" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">제2부: 능력 향상 방법</ns0:text><ns0:text x="206" y="138" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">1장 AI 에이전트 입문</ns0:text><ns0:text x="207" y="180" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">모델은 도구를 어떻게 호출하나?</ns0:text><ns0:path d="M20 224 L420 224" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="206" y="262" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">2장 컨텍스트 엔지니어링</ns0:text><ns0:text x="207" y="304" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">이번 결정에 필요한 정보는?</ns0:text><ns0:path d="M20 348 L420 348" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="206" y="386" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">3장 사용자 메모리·지식 베이스</ns0:text><ns0:text x="207" y="428" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">지난 대화를 어떻게 되찾나?</ns0:text><ns0:path d="M20 472 L420 472" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="206" y="510" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">4장 도구</ns0:text><ns0:text x="207" y="552" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">상태 조회·업무 처리 방법은?</ns0:text><ns0:path d="M20 596 L420 596" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="214.11" y="634" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">5장 코딩 에이전트와</ns0:text><ns0:text x="214.11" y="666" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">범용 에이전트</ns0:text><ns0:text x="207" y="706" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">프로그램을 짜서 처리할 수 있나?</ns0:text><ns0:path d="M20 720 L420 720" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="206" y="758" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">6장 상호작용</ns0:text><ns0:text x="207" y="800" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">사용자가 중간에 끼어들면?</ns0:text><ns0:rect x="480" y="110" width="400" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="666" y="153" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">7장 에이전트 평가</ns0:text><ns0:text x="667" y="204" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">어디서 틀렸나? 고친 효과는?</ns0:text><ns0:path d="M680 225 L680 247 L500 247 L500 747" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M500 347 L522 347" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="522" y="282" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="687" y="328" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">8장 모델 사후 학습</ns0:text><ns0:text x="688" y="376" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">학습으로 모델을 바꾸려면?</ns0:text><ns0:path d="M500 547 L522 547" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="522" y="482" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="687" y="528" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">9장 지속적 진화</ns0:text><ns0:text x="688" y="576" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">운영 경험으로 개선하려면?</ns0:text><ns0:path d="M500 747 L522 747" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="522" y="682" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="687" y="728" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">10장 멀티 에이전트 협업</ns0:text><ns0:text x="688" y="776" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">여럿이 어떻게 분담·인계하나?</ns0:text><ns0:defs /></ns0:svg>
