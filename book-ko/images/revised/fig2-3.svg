<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="91.867mm" viewBox="0 0 900 780" role="img" aria-labelledby="title desc">
<ns0:title id="title">두 번의 모델 API 호출에 대한 전체 상호작용 과정</ns0:title><ns0:desc id="desc">밴쿠버의 시간과 날씨: 모델이 독립적인 호출 두 개를 만들고, 하네스가 실행해 ID가 붙은 결과를 돌려주면 모델이 최종 답변을 생성한다.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="780" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="56" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">첫 번째 모델 호출</ns0:text><ns0:text x="437" y="93" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">messages: system + user    tools: 시간 도구 + 날씨 도구</ns0:text><ns0:path d="M450 120 L450 157" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="157" width="860" height="145" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="443.07" y="193" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant: tool_calls</ns0:text><ns0:text x="445.61" y="235" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">call_abc123 → get_current_time(timezone="America/Vancouver")</ns0:text><ns0:text x="445.61" y="276" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">call_def456 → get_weather(city="Vancouver", unit="celsius")</ns0:text><ns0:path d="M450 302 L450 325 L230 325 L230 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M450 325 L670 325 L670 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="360" width="420" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="216" y="394" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">시간 도구</ns0:text><ns0:text x="222.78" y="431" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">call_abc123</ns0:text><ns0:text x="217" y="466" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">밴쿠버 현재 시간 반환</ns0:text><ns0:rect x="460" y="360" width="420" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="656" y="394" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">날씨 도구</ns0:text><ns0:text x="662.79" y="431" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">call_def456</ns0:text><ns0:text x="657" y="466" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">기온과 날씨 상태 반환</ns0:text><ns0:text x="437" y="348" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">독립 호출 · 하네스가 병렬 실행</ns0:text><ns0:path d="M230 485 L230 516 L450 516" fill="none" stroke="#333333" stroke-width="1.8" />
