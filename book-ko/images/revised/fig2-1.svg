<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="99.051mm" viewBox="0 0 900 841" role="img" aria-labelledby="title desc">
<ns0:title id="title">컨텍스트 창의 구성 개요</ns0:title><ns0:desc id="desc">베이징 날씨 예시: 시스템 지시, 날씨 도구 정의, 호출 ID가 붙은 대화 기록, 이번 라운드의 추론과 답변 생성 위치.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="841" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="795" height="781" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="35" y="35" width="765" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="403" y="68" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">시스템 프롬프트(System Prompt)</ns0:text><ns0:text x="413.39" y="107" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">You are a helpful assistant. Answer concisely.</ns0:text><ns0:text x="413.39" y="141" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Use tools for real-time information.</ns0:text><ns0:rect x="35" y="170" width="765" height="205" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="403" y="203" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">도구 정의(Tool Definitions)</ns0:text><ns0:text x="413.39" y="242" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">{"name": "get_weather", "description": "도시 날씨 조회",</ns0:text><ns0:text x="412.61" y="276" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">"parameters": {"type": "object", "properties": {</ns0:text><ns0:text x="412.61" y="310" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">"city": {"type": "string"}}, "required": ["city"]}}</ns0:text><ns0:rect x="35" y="390" width="765" height="176" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="403" y="423" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">대화 기록(Conversation History)</ns0:text><ns0:text x="404" y="462" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">user: 오늘 베이징 날씨 어때?</ns0:text><ns0:text x="412.61" y="496" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">assistant: call_1 → get_weather(city="베이징")</ns0:text><ns0:text x="412.61" y="530" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tool(call_1): {"temp": "23°C", "conditions": "맑음"}</ns0:text><ns0:rect x="35" y="581" width="765" height="125" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="403" y="614" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">이번 라운드의 추론(Reasoning)</ns0:text><ns0:text x="409.78" y="653" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">&lt;think&gt;베이징 날씨를 얻었으니 답변을 정리하자.&lt;/think&gt;</ns0:text><ns0:rect x="35" y="721" width="765" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="403" y="761" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant: 오늘 베이징은 맑고 기온 23°C…</ns0:text><ns0:path d="M835 35 L855 35 L855 706 L835 706" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="866" y="335" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">컨</ns0:text><ns0:text x="866" y="370" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">텍</ns0:text><ns0:text x="866" y="405" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">스</ns0:text><ns0:text x="866" y="440" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">트</ns0:text><ns0:text x="866" y="475" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">창</ns0:text><ns0:text x="437" y="828" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">현재 생성 위치</ns0:text><ns0:path d="M450 806 L450 787" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:defs /></ns0:svg>
