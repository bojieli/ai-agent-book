<title id="title">자율 에이전트의 실행 루프</title><desc id="desc">추론, 행동, 관찰과 모든 종료 조건을 보여 준다. 작업이 완료되면 검증을 거쳐 전달하고, 오류나 예산 초과 시에는 진행 상황을 저장하고 보고한다.</desc>
