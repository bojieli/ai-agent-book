<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="71.491mm" viewBox="0 0 900 607" role="img" aria-labelledby="title desc">
<title id="title">의료 영상 에이전트의 네 가지 업데이트 지점</title><desc id="desc">하나의 시스템이 모델로 영상을 인식하고, 프로그램으로 지표를 계산하고, 지침을 검색한 뒤, 보고 규정에 따라 결과를 정리한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="607" fill="#ffffff" y="0" />
<text x="450" y="48" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">같은 영상 판독 보고서, 어디를 고칠 수 있을까?</text><rect x="48" y="90" width="350" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="48" y="90" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="123" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">모델 파라미터</text><text x="223" y="170" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">영상에서 대상 인식</text><text x="223" y="202" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">오인식 시 지각 모델 개선</text><rect x="500" y="90" width="352" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="500" y="90" width="352" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="123" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">프로그램</text><text x="676" y="170" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">인식 결과로 지표 계산</text><text x="676" y="202" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">규칙 변경 시 코드 수정</text><path d="M398 167 L500 167" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="48" y="324" width="350" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="48" y="324" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="357" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">지식 베이스</text><text x="223" y="404" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">해당 지침 검색</text><text x="223" y="436" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">개정되면 출처 업데이트</text><rect x="500" y="324" width="352" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="500" y="324" width="352" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="357" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">지시 (Skill)</text><text x="676" y="404" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="25.0" font-weight="400" fill="#292929">규정에 따라 계산 결과 정리</text><text x="676" y="436" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="23.5" font-weight="400" fill="#292929">사용한 지침·버전 명시</text><path d="M398 400 L500 400" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M676 235 L676 324" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="565" y="288" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">지표 수치</text><path d="M676 469 L676 505" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="505" width="412" height="74" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="553" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">보고서 초안, 사람이 재검토</text><defs /></svg>
