<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="105.647mm" viewBox="0 0 900 897" role="img" aria-labelledby="title desc">
<title id="title">동기 인터페이스의 런타임 적응과 모델 네이티브 비동기</title><desc id="desc">백그라운드 작업 핸들, 원래 호출 ID와 중간 안내.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="897" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="244" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">동기 인터페이스의 런타임 적응</text><text x="225" y="100" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">도구가 task_id와 pending 반환</text><text x="225" y="132" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">이번 호출 결과를 요청과 짝지음</text><text x="225" y="164" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">모델은 다른 메시지 처리</text><text x="225" y="196" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">백그라운드 완료 → 새 이벤트</text><text x="225" y="228" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">task_id로 작업 컨텍스트 복원</text><rect x="470" y="20" width="410" height="244" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">모델 네이티브 비동기 도구</text><text x="675" y="100" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">도구에 async: true 선언</text><text x="675" y="132" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">도구 실행 중 모델은 작업 계속</text><text x="675" y="164" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">결과를 원래 call_id와 연결</text><text x="675" y="196" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">결과를 최신 응답 상태에 반영</text><text x="675" y="228" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">새 결과를 종합해 결정 계속</text><rect x="20" y="309" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="309" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="342" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">장소 조회: 실행 중 사용자 업데이트 수신</text><text x="450" y="389" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">초기 조건: 예산 2000위안, 20명</text><text x="450" y="421" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">A: 1800위안 / 30명 · B: 900위안 / 12명 · C: 600위안 / 8명</text><path d="M450 459 L450 479 L225 479 L225 499" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 479 L675 479 L675 499" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="499" width="410" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="499" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="532" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">조회 미완료</text><text x="225" y="579" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">백그라운드에서 장소 조회</text><text x="225" y="611" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">포그라운드에서 일정·준비물 정리</text><rect x="470" y="499" width="410" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="499" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="532" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">사용자 중간 안내</text><text x="675" y="579" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="25.8" font-weight="400" fill="#292929">업데이트: 예산 1000위안, 10명</text><text x="675" y="611" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">업데이트 출처와 반영 상태 기록</text><path d="M225 644 L225 679 L675 679 L675 644" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 679 L450 719" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="719" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="719" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="752" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">결과와 업데이트를 함께 결정에 반영</text><text x="450" y="799" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">초기 조건이면 A, 새 조건이면 B 선택</text><text x="450" y="831" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">런타임은 도구 상태 관리, 모델은 업데이트된 조건 채택</text><defs /></svg>
