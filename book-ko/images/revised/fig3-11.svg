<ns0:title id="title">GraphRAG 엔터티 관계 지식 그래프</ns0:title><ns0:desc id="desc">두 장 의사는 서로 다른 엔터티 식별자와 관계를 가진다. 치과 의사의 주소는 사용자, 의사, 병원, 주소 순으로 검색한다.</ns0:desc>
