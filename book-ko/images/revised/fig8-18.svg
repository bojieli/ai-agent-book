<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="94.811mm" viewBox="0 0 900 805" role="img" aria-labelledby="title desc">
<title id="title">AWorld-train의 도구 호출과 학습 루프</title><desc id="desc">위쪽은 궤적 하나 안의 도구 상호작용, 아래쪽은 궤적 묶음을 수집한 뒤의 정책 갱신.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="805" fill="#ffffff" y="0" />
<text x="450" y="40" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">작업 하나: 같은 정책이 도구를 연속 호출</text><rect x="30" y="82" width="245" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="82" width="245" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="152.5" y="115" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">AgentLoop</text><text x="152.5" y="162" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">현재 정책</text><text x="152.5" y="194" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">행동 선택</text><rect x="625" y="82" width="245" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
