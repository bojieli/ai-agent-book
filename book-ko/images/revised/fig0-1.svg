<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="80.089mm" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
<ns0:title id="title">에이전트 = LLM + 컨텍스트 + 도구</ns0:title><ns0:desc id="desc">청구서 문의 하나에서 시작해 위에서 아래로 읽는다. 모델이 먼저 청구서 조회를 결정하고 도구가 내역을 반환한다. 내역이 컨텍스트에 들어가면 모델은 이를 바탕으로 다음 단계를 정한다.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="680" fill="#ffffff" y="0" />
<ns0:rect x="24" y="20" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="214" y="20" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="100" y="76" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">컨텍스트</ns0:text><ns0:text x="531" y="76" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">사용자 요청: 이번 달 과다 청구 금액 확인</ns0:text><ns0:path d="M544 110 L544 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="24" y="154" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="214" y="154" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="102.06" y="210" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM</ns0:text><ns0:text x="531" y="210" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">이번 달 청구서부터 조회하기로 결정</ns0:text><ns0:path d="M544 244 L544 284" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="24" y="288" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="214" y="288" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="100" y="344" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">도구</ns0:text><ns0:text x="531" y="344" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">청구 API가 로밍 요금 한 건 반환</ns0:text><ns0:path d="M544 378 L544 418" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="24" y="422" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="214" y="422" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="100" y="478" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">컨텍스트</ns0:text><ns0:text x="531" y="478" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">사용자 요청과 조회한 내역이 모두 여기에</ns0:text><ns0:path d="M544 512 L544 552" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
