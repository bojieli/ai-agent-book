<ns0:rect x="214" y="556" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="102.06" y="612" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM</ns0:text><ns0:text x="531" y="612" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">고객센터에 로밍 요금 부과 근거를 묻기로 결정</ns0:text><ns0:defs /></ns0:svg>
