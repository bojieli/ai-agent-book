<ns0:title id="title">에이전트와 환경의 폐루프 상호작용, 그리고 에이전트 내부의 Model–Harness 구조</ns0:title><ns0:desc id="desc">에이전트는 나란히 놓인 Model과 Harness로 이루어진다. Harness는 컨텍스트를 구성하고 도구를 호출하며 실행을 관리한다. 환경은 행동을 받아 상태를 갱신하고 관찰을 돌려준다.</ns0:desc>
