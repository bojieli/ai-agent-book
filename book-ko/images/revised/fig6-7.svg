<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">오디오 수집과 전송</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">브라우저 AudioWorklet → WebSocket</text><text x="450" y="132" text-anchor="middle" font-family="&quot;Noto Sans CJK KR&quot;, &quot;Source Han Sans KR&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">오디오 청크 → 리샘플링 / 포맷 변환</text><path d="M450 165 L450 200" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
