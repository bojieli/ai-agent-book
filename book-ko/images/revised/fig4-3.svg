<title id="title">동적 도구 로딩의 KV Cache 최적화</title><desc id="desc">왼쪽은 앞부분의 도구 목록을 수정해 변경 지점부터 다시 계산하는 경우이고, 오른쪽은 접두부를 유지하고 기록 끝에 발견 결과를 추가하는 경우다. 캐시 적중은 서비스 정책의 영향도 받는다.</desc>
