<title id="title">רצף ההודעות בחיפוש מקבילי</title><desc id="desc">עשרה סוכנים מחפשים במקביל. לאחר שהמנהל מאמת את המועמד התקף הראשון, הוא שולח ביטול לסוכנים שעדיין מחפשים וממתין לאישורם.</desc>
