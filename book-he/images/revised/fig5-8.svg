<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="88.687mm" viewBox="0 0 900 753" role="img" aria-labelledby="title desc">
<title id="title">מה הגיש טופס הטיסה</title><desc id="desc">בייג'ינג באה מבקשת המשתמש, ארבעת השדות האחרים מהדפדפן. שני מקורות המידע מתאחדים בתשובת המודל.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
