<ns0:title id="title">מה הגיש טופס הטיסה</ns0:title><ns0:desc id="desc">בייג'ינג באה מבקשת המשתמש, ארבעת השדות האחרים מהדפדפן. שני מקורות המידע מתאחדים בתשובת המודל.</ns0:desc>
