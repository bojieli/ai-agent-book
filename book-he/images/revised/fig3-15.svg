<title id="title">צינור חילוץ ידע מובנה</title><desc id="desc">מגלים שדות מודולריים בחומרי המקרים, מחלצים רשומות מובנות, ובאמצעות קידוד, תקנון ואשכול יוצרים אבות טיפוס; משקלי המאפיינים מוסברים לפי הפרשי מרכזי האשכולות.</desc>
