<title id="title">אינדקס היררכי עצי של RAPTOR</title><desc id="desc">המסמך המקורי מפורק לחלקים, החלקים מאושכלים לפי שיכונים ומסוכמים, והסיכומים מצטרפים ברקורסיה לרמות גבוהות יותר. החצים מראים את כיוון בניית האינדקס.</desc>
