<title id="title">מבנה האינדקס של HNSW</title><desc id="desc">אותו צומת מסומן באותה אות בכל השכבות. החיפוש יוצא מנקודת הכניסה בשכבה העליונה, יורד שכבה אחר שכבה ומרחיב מועמדים בשכבה התחתונה. החצים הכהים מסמנים מסלול חיפוש לדוגמה.</desc>
