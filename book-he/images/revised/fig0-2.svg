<ns0:title id="title">מבנה הספר: בניית סוכנים ושיפור יכולותיהם</ns0:title><ns0:desc id="desc">פרקים 1 עד 6 מבססים את שיטות הבנייה, פרק 7 מספק משוב מהערכה, ופרקים 8 עד 10 משפרים את היכולות דרך פרמטרים, עדכוני מערכת ושיתוף פעולה.</ns0:desc>
