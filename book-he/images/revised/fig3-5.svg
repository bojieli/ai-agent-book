<ns0:text x="436" y="818" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">תשובה</ns0:text><ns0:text x="437" y="861" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929" direction="rtl">תוך 7 ימים מהקבלה היכנסו ל"ההזמנות שלי", בחרו את ההזמנה ובקשו החזר.</ns0:text><ns0:text x="437" y="900" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">צרפו את מספר ההזמנה; ההחזר צפוי תוך 3–5 ימי עסקים.</ns0:text><ns0:defs /></ns0:svg>
