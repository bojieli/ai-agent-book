<ns0:text x="151" y="58" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">שאלת המשתמש</ns0:text><ns0:text x="152" y="99" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="23.6" font-weight="400" fill="#292929" direction="rtl">איך מבקשים החזר כספי?</ns0:text><ns0:rect x="440" y="20" width="440" height="110" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
