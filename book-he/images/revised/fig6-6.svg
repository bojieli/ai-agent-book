<ns0:text x="211" y="53" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="22.9" font-weight="700" fill="#292929" direction="rtl">התאמת סביבת הריצה לממשק סינכרוני</ns0:text><ns0:text x="217.67" y="100" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="25.8" font-weight="400" fill="#292929" direction="rtl">הכלי מחזיר task_id ו‑pending</ns0:text><ns0:text x="212" y="132" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">תוצאת הקריאה מזווגת לבקשה</ns0:text><ns0:text x="212" y="164" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">המודל מטפל בהודעות אחרות</ns0:text><ns0:text x="212" y="196" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">סיום ברקע ← אירוע חדש</ns0:text><ns0:text x="212" y="228" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929" direction="rtl">שחזור הקשר המשימה לפי task_id</ns0:text><ns0:rect x="470" y="20" width="410" height="244" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="53" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="25.1" font-weight="700" fill="#292929" direction="rtl">כלים אסינכרוניים מובנים במודל</ns0:text><ns0:text x="667.8" y="100" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">הכרזה על הכלי async: true</ns0:text><ns0:text x="662" y="132" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929" direction="rtl">המודל ממשיך לעבוד בזמן ריצת הכלי</ns0:text><ns0:text x="666.94" y="164" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929" direction="rtl">התוצאה משויכת ל‑call_id המקורי</ns0:text><ns0:text x="662" y="196" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929" direction="rtl">התוצאה נקלטת במצב התגובה העדכני</ns0:text><ns0:text x="662" y="228" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929" direction="rtl">המודל משלב את התוצאה וממשיך להחליט</ns0:text><ns0:rect x="20" y="309" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="309" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="342" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">בירור מקום: קבלת עדכוני משתמש בזמן הביצוע</ns0:text><ns0:text x="437" y="389" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">תנאים התחלתיים: תקציב 2000 יואן, 20 איש</ns0:text><ns0:text x="437" y="421" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">A: 1800 יואן / 30 איש · B: 900 יואן / 12 איש · C: 600 יואן / 8 איש</ns0:text><ns0:path d="M450 459 L450 479 L225 479 L225 499" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
