<text x="450" y="638" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">דוגמה לתוצאה מובנית</text><text x="450" y="685" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">עובדות: 4/4, הסכום והמועד תואמים</text><text x="450" y="717" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">שלמות: 2/4, חסר הסבר על החזר לאמצעי המקורי</text><text x="450" y="749" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">ניסוח: 4/4 · הזיות: PASS</text><path d="M450 780 L450 815" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="815" width="860" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="815" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="848" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">כללי צבירה ובדיקה חוזרת שנקבעו מראש</text><text x="450" y="895" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">שקלול לפי חשיבות; הפעלת פסילה → המשימה נכשלת</text><text x="450" y="927" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">כמה שופטים מנקדים בנפרד → דגימות במחלוקת לבדיקה אנושית</text><text x="450" y="959" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">פריטים בציון נמוך מקושרים לתשובה ולמסלול המקורי</text><defs /></svg>
