<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="118.956mm" viewBox="0 0 900 1010" role="img" aria-labelledby="title desc">
<title id="title">צינור ה‑LLM‑as‑a‑Judge</title><desc id="desc">דוגמת ניקוד של תשובת החזר כספי עם תנאי משימה מלאים.</desc>
