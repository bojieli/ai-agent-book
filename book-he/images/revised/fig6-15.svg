<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="89.511mm" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<ns0:title id="title">התאמת רזולוציה ושינוי קנה מידה דו‑כיווני של קואורדינטות</ns0:title><ns0:desc id="desc">סימון אותה נקודת מרכז בשולחן העבודה ובצילום הכלי, והדגמת ההמרה ההפוכה.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="760" fill="#ffffff" y="0" />
<ns0:text x="201" y="48" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">מסך אמיתי</ns0:text><ns0:text x="691" y="48" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">צילום מסך מפלט הכלי</ns0:text><ns0:rect x="31.0" y="75" width="368" height="207" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M201 178.5 L229 178.5" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M215 164.5 L215 192.5" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="207.78" y="316" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">2560 × 1440 פיקסלים</ns0:text><ns0:rect x="589.0" y="112" width="232" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M691 177 L719 177" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M705 163 L705 191" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="697.79" y="276" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">1366 × 768 פ׳</ns0:text><ns0:path d="M410 176 L575 176" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="481" y="148" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">שינוי קנה מידה</ns0:text><ns0:path d="M790 242 L790 350 L65 350 L65 282" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="441" y="389" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">נקודת המודל (683, 384) ממופה חזרה למרכז שולחן העבודה</ns0:text><ns0:rect x="20" y="420" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="420" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="453" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">המרה לפי היחס בפועל בכל כיוון</ns0:text><ns0:text x="442.78" y="500" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">x = 683 × 2560 / 1366 = 1280</ns0:text><ns0:text x="442.79" y="532" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">y = 384 × 1440 / 768 = 720</ns0:text><ns0:path d="M450 570 L450 606" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="606" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="606" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="639" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">לחיצה ב‑(1280, 720), וצילום מחדש לבדיקת התוצאה</ns0:text><ns0:text x="437" y="686" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">אם יש שוליים: קודם מחסירים ריפוד, אחר כך מחלקים בקנה המידה</ns0:text><ns0:text x="437" y="718" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">אם יש חיתוך או כמה מסכים: מוסיפים את היסט הראשית המתאים</ns0:text><ns0:defs /></ns0:svg>
