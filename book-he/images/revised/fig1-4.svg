<ns0:text x="436" y="57" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">קידומת יציבה יחסית</ns0:text><ns0:text x="444.96" y="91" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929" direction="rtl">הנחיית מערכת + הגדרות כלים: convert_currency, code_interpreter</ns0:text><ns0:rect x="110" y="135" width="770" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
