<title id="title">מסלול הסוכן: לולאת ReAct במשימת צבירה רב‑מטבעית</title><desc id="desc">הנחיית המערכת והגדרות הכלים משמשות קידומת יציבה, ובכל סבב מצטרפת היסטוריית ההודעות המצטברת. שלושת הסבבים ממירים מטבע, מחשבים ומוסרים את התוצאה.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1210" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="57" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">קידומת יציבה יחסית</text><text x="450" y="91" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929" direction="rtl">הנחיית מערכת + הגדרות כלים: convert_currency, code_interpreter</text><rect x="110" y="135" width="770" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="495" y="168" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">user</text><text x="495" y="203" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">רבעון 1: 2.5 מיליון USD; רבעון 2: 2.1 מיליון EUR</text><text x="495" y="236" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929" direction="rtl">רבעון 3: 1.8 מיליון GBP; רבעון 4: 380 מיליון JPY; חשבו סך שנתי וממוצע רבעוני</text><text x="60" y="320" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">סבב 1</text><rect x="110" y="285" width="770" height="235" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
