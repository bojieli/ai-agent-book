<ns0:title id="title">מסלול הסוכן: לולאת ReAct במשימת צבירה רב‑מטבעית</ns0:title><ns0:desc id="desc">הנחיית המערכת והגדרות הכלים משמשות קידומת יציבה, ובכל סבב מצטרפת היסטוריית ההודעות המצטברת. שלושת הסבבים ממירים מטבע, מחשבים ומוסרים את התוצאה.</ns0:desc>
