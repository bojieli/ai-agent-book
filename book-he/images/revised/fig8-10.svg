<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">הגדרת המשימה וייצור הדגמות</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">הדגמות אנושיות · ייצור בידי מורה · מסלולים מוצלחים או מתוקנים</text><text x="450" y="132" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">קלט x: משימה, הקשר, הגדרות כלים; יעד y: תשובה או פעולה</text><path d="M450 165 L450 200" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="200" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="200" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="233" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">סינון וחלוקה</text><text x="450" y="280" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929" direction="rtl">אימות תוכן, פורמט ותוצאות כלים ← הסרת כפילויות ← חלוקה לאימון ולמשימות מוחזקות</text><path d="M450 305 L450 340" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="340" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="340" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="373" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">אופטימיזציה ברמת הטוקן</text><text x="450" y="420" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="ltr">L = −Σₜ log P(yₜ | x, y₁,…,yₜ₋₁)</text><text x="450" y="452" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">תשובות ופעולות היעד נכנסות להפסד; הקלט משמש הקשר</text><path d="M450 480 L450 515" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="515" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
