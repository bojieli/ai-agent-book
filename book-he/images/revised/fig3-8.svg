<text x="135" y="104" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="27.8" font-weight="700" fill="#292929" direction="rtl">רוויית תדירות</text><text x="565" y="58" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">k₁ = 1.5, המסמך באורך הממוצע בדיוק</text><text x="565" y="103" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">מופיע פעם, פעמיים, 3 פעמים</text><text x="565" y="150" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">גורם תדירות: 1.00 ← 1.43 ← 1.67</text><rect x="20" y="190" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="135" y="274" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">נרמול אורך</text><text x="565" y="228" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">k₁ = 1.5, b = 0.75, תדירות 1</text><text x="565" y="273" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">אורך המסמך גדל מהממוצע לכפליים</text><text x="565" y="320" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">גורם תדירות: 1.00 ← 0.69</text><rect x="20" y="360" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="360" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="135" y="444" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.3" font-weight="700" fill="#292929" direction="rtl">תדירות מסמך הופכית</text><text x="565" y="398" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">קורפוס של 10 מסמכים</text><text x="565" y="443" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">‏"מודל" ב‑3 מסמכים, "זיקוק" ב‑2</text><text x="565" y="490" text-anchor="middle" font-family="&quot;Noto Sans Hebrew&quot;, &quot;Noto Serif Hebrew&quot;, &quot;Arial Hebrew&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">IDF: "מודל" 0.762, "זיקוק" 1.224</text><defs /></svg>
