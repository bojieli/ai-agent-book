<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 820 530" width="820" height="530" style="background:#ffffff">
<title>Зураг 1-5: «Model as Agent» архитектур — төрөлх хэрэгсэл дуудах</title>
<desc>LLM нь серверийн Harness-ийн ажиллуулдаг хаалттай давталтад web_search, code_interpreter зэрэг төрөлх хэрэгслийг дуудна. Хэрэглэгчийн оролт ба эцсийн гаралт давталтын гадна байна; дотор нь Thought, Action, Observation нь ReAct мөчлөгийг бүрдүүлнэ. «Клиент талд гараар бичсэн ReAct давталт байхгүй» гэдэг нь зөвхөн Responses API замд (Туршилт 1-3) хамаарна; Kimi K3 замд (Туршилт 1-2) хэрэгслүүд сервер талд ажиллах ч давталтыг клиент код удирдана.</desc>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333333"/></marker><marker id="ah-light" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#999999"/></marker></defs>

