<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/>
    </marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:15.5px;font-weight:700}
      .s{font-size:11.6px;fill:#52636d}
      .label{font-size:10.1px;font-weight:700;fill:#2f617a}
      .value{font-size:11.6px;fill:#3f515c}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <text x="500" y="30" text-anchor="middle" class="t h">Траекторын гурван давхар шалгалт: нотолгоог бодит орчноос авна</text>

  <!-- 三类验证器 -->
  <rect x="30" y="76" width="245" height="82" rx="8" class="box"/>
  <text x="152.5" y="107" text-anchor="middle" class="t h">Үр дүнгийн шалгагч</text>
  <text x="152.5" y="135" text-anchor="middle" class="t s">Тест, дүн, захиалгын эцсийн төлөв</text>

  <rect x="30" y="174" width="245" height="82" rx="8" class="box"/>
  <text x="152.5" y="205" text-anchor="middle" class="t h">Явцын шалгагч</text>
  <text x="152.5" y="233" text-anchor="middle" class="t s" style="font-size:9.3px">Бодлого, зөвшөөрөл, үйлдэл, амлалт</text>

  <rect x="30" y="272" width="245" height="82" rx="8" class="accent"/>
  <text x="152.5" y="303" text-anchor="middle" class="t h">LLM рубрик</text>
  <text x="152.5" y="331" text-anchor="middle" class="t s" style="font-size:8.6px">Байгалийн байдал, товч байдал, нийцсэн тойрох шийдэл</text>

  <!-- 结构化评价：改用纵向字段，避免中文字体宽度导致双列重叠 -->
  <rect x="342" y="62" width="320" height="340" rx="10" class="accent"/>
  <text x="502" y="97" text-anchor="middle" class="t h">Бүтэцтэй траекторын үнэлгээ</text>
  <line x1="374" y1="117" x2="630" y2="117" stroke="#89a0ac"/>

  <text x="376" y="145" class="t label">Ажлын үр дүн</text>
  <text x="376" y="168" class="t value">Амжилт, хэсэгчилсэн амжилт эсвэл бүтэлгүйтэл</text>

  <text x="376" y="198" class="t label">Хэмжээс тус бүрийн оноо</text>
  <text x="376" y="221" class="t value">Нийтээр бус зүйл бүрээр оноолох</text>

  <text x="376" y="251" class="t label">Нотолгооны байршил</text>
  <text x="376" y="274" class="t value">Ээлж ба хэрэгслийн төлөвийг тэмдэглэх</text>

  <text x="376" y="304" class="t label">Алдааны шошго</text>
  <text x="376" y="327" class="t value">Дараа оношлохын тулд асуудлын төрлийг хадгалах</text>

  <line x1="374" y1="348" x2="630" y2="348" stroke="#b6c7cf"/>
  <text x="502" y="378" text-anchor="middle" class="t s">Нотолгоо хангалтгүй бол оноо өгөхөөс татгалзаж болно</text>

  <!-- 供进化模块使用的诊断信号 -->
  <rect x="712" y="119" width="258" height="202" rx="10" class="box"/>
  <text x="841" y="156" text-anchor="middle" class="t h" style="font-size:12.8px">Суралцаж болох оношилгооны дохио</text>
  <text x="841" y="199" text-anchor="middle" class="t s" style="font-size:9.7px">Амжилт, алдаа гарсан газрыг хадгална</text>
  <text x="841" y="234" text-anchor="middle" class="t s" style="font-size:10.1px">Нотолгоо ба асуудлын төрлийг заана</text>
  <text x="841" y="269" text-anchor="middle" class="t s" style="font-size:7.7px">Юуг шинэчлэхийг сонгуулахаар тусдаа модульд дамжуулна</text>

  <!-- 数据流 -->
  <path d="M275 117 H307 V151 H340" class="line"/>
  <path d="M275 215 H340" class="line"/>
  <path d="M275 313 H307 V279 H340" class="line"/>
  <path d="M662 220 H710" class="line"/>
</svg>
