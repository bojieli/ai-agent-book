<text x="395" y="137" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.9" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Нөхцөлт лог магадлалыг ихэсгэх</text>
