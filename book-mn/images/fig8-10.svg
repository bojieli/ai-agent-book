<text x="142" y="297" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.4" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Хэв маяг удирдах протокол</text>
<text x="142" y="315" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.9" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Тембр + Хэлний бус тэмдэглэгээ</text>
<text x="307" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.4" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Олон хэлт SFT</text>
