<text x="307" y="315" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">"Шинжилгээ → Таамаг → Шалгалт → Хураангуй"</text>
<text x="472" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.4" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Prompt нэрэлт</text>
<text x="472" y="297" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Багшийн гаралтын зураглал</text>
<text x="472" y="315" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Урт prompt → Prompt-гүй шууд гаралт</text>
<text x="637" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.4" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">Хэрэгсэл дуудах SFT</text>
<text x="637" y="297" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="8.6" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Интерфэйсийн форматын протокол</text>
