<text x="395" y="181" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.8" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">Хэдэн цагт нийлнэ</text>
