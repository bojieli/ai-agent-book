  <text x="255" y="258" text-anchor="middle" class="detail">нэг дамжуулалт</text>
  <line x1="330" y1="241" x2="357" y2="241" class="flow"/>
  <rect x="357" y="212" width="150" height="58" rx="6" class="box new"/>
  <text x="432" y="238" text-anchor="middle" class="label" style="font-size:12px">зөвхөн ADD хадгалалт</text>
