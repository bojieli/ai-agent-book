  <text x="90" y="84" text-anchor="middle" class="label">Яриа</text>
  <line x1="153" y1="79" x2="180" y2="79" class="flow"/>
  <rect x="180" y="50" width="135" height="58" rx="6" class="box"/>
  <text x="248" y="76" text-anchor="middle" class="label">LLM задлах</text>
  <text x="248" y="96" text-anchor="middle" class="detail">нэр дэвшигч баримт</text>
