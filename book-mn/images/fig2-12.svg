<text x="62" y="322" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#333333" text-anchor="start" dominant-baseline="central">{ role: "tool", content: "Skill эхлүүлж байна: pptx" }   ← placeholder</text>

