<ns0:text x="661" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Нэрээр тааруулах (Glob)</ns0:text><ns0:text x="668.23" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хайлт: **/test_*.py</ns0:text><ns0:text x="668.23" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tests/test_api.py</ns0:text><ns0:text x="668.23" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tests/test_auth.py</ns0:text><ns0:text x="668.23" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tests/unit/test_parser.py</ns0:text><ns0:text x="662" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Замын загвараар файл олно</ns0:text><ns0:rect x="20" y="294" width="410" height="244" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
