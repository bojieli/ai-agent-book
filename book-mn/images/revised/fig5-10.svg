<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="92.220mm" viewBox="0 0 900 783" role="img" aria-labelledby="title desc">
<ns0:title id="title">Agent-ийн өөрийгөө бүтээх давталт</ns0:title><ns0:desc id="desc">Агаарын тээврийн жишиг хэрэгжүүлэлтээс цахим худалдааны харилцагчийн үйлчилгээ үүсгэж, олон үеийн тестийн үр дүнгээр засах эсвэл хадгална.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="783" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Жишиг хэрэгжүүлэлт: агаарын тээврийн үйлчилгээ</ns0:text><ns0:text x="444.96" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.3" font-weight="400" fill="#292929">Prompt цуцлалт ба шилжүүлгийг тохиролцож, Tool нь cancel_order</ns0:text><ns0:text x="437" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">Tool сонгох → шалгаж гүйцэтгэх → үр дүн бичих → үргэлжлүүлэх/гарах</ns0:text><ns0:path d="M450 170 L450 207" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="207" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="207" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="240" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Бүтээгч хүрээг хуулж, цахим худалдаанд тааруулж засна</ns0:text><ns0:text x="444.96" y="287" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.0" font-weight="400" fill="#292929">Буцаан олголт, хүргэлтийн дүрэм рүү сольж, refund_order холбоно</ns0:text><ns0:text x="437" y="319" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">Дуудлагын холбоо, үеийн төлөв, төсөв, гарах нөхцөлийг хадгална</ns0:text><ns0:path d="M450 357 L450 394" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="394" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="394" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="427" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Шинээр үүсгэсэн цахим худалдааны үйлчилгээг шалгах</ns0:text><ns0:text x="437" y="474" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Бүтэц, хөрвүүлэлт, Tool-ийн хүсэлт-хариу хос эсэхийг шалгах</ns0:text><ns0:text x="437" y="506" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.8" font-weight="400" fill="#292929">Буцаан олголтын даалгавар гүйцэтгэж, Tool ба олон үеийн төлөвийг тулгах</ns0:text><ns0:path d="M230 544 L230 600" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M680 544 L680 600" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="600" width="410" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="600" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="633" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Амжилтгүй: засаад дахин</ns0:text><ns0:text x="212" y="680" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">Алдааг олж, бүтээгчид буцаах</ns0:text><ns0:rect x="470" y="600" width="410" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="600" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="633" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Тэнцсэн: хадгалах</ns0:text><ns0:text x="662" y="680" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">Ерөнхий засвар хүрээнд буцна</ns0:text><ns0:text x="662" y="712" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Салбарын тест Agent-тэй хадгалагдана</ns0:text><ns0:path d="M20 661 L5 661 L5 278 L20 278" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:defs /></ns0:svg>
