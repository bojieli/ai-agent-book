<text x="450" y="473" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Нэг эрдэнэсийн орчин</text><text x="450" y="520" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.1" font-weight="400" fill="#292929">Байрлал · эд зүйл · хаалга · харуул → үйлдэл гүйцэтгэх → ажиглалт ба шагнал</text><path d="M20 490 L7 490 L7 110 L20 110" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
