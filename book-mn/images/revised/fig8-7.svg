<title id="title">Эрдэнэс хайх тоглоом дахь Q-learning ба LLM Agent-ийн архитектурын харьцуулалт</title><desc id="desc">Нэг орчин дахь шийдвэрийн хоёр зам, мөн сургалтын дараах үнэлгээ ба анхны ажиллагаа гэсэн хоёр хэмжилтийн нөхцөл.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
