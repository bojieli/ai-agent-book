<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="103.644mm" viewBox="0 0 900 880" role="img" aria-labelledby="title desc">
<title id="title">Марковын шийдвэрийн процесс (MDP)-ын бүдүүвч</title><desc id="desc">Өрөө бол төлвийн зөвхөн нэг бүрэлдэхүүн; шилжилт эд зүйл, хаалга ба харуулаас ч хамаарна.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="880" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">MDP: S · A · P · R · γ</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">Төлөв · үйлдэл · шилжилтийн тархалт · шагнал · хямдруулах коэффициент</text><rect x="20" y="165" width="860" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="165" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="198" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Байрлалын бүрэлдэхүүн: 5 өрөө</text><text x="450" y="245" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Орцны танхим · агуулах · хойд коридор · харуулын өрөө · эрдэнэсийн өрөө</text><rect x="20" y="315" width="410" height="210" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="315" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="348" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Одоогийн төлөв s</text><text x="225" y="395" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Байрлал: агуулах</text><text x="225" y="427" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Эд зүйл: улаан түлхүүртэй</text><text x="225" y="459" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хаалга: цоожтой</text><text x="225" y="491" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Харуул: амьд</text><rect x="470" y="315" width="410" height="210" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="315" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="348" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Үйлдэл a</text><text x="675" y="395" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Зүүн / баруун / өмнө / хойд</text><text x="675" y="427" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Эд зүйл авах / довтлох / нийлүүлэх</text><text x="675" y="459" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.9" font-weight="400" fill="#292929">Параметр: чиглэл эсвэл эд зүйл</text><path d="M225 525 L225 548 L675 548 L675 525" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 548 L450 575" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="575" width="860" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="575" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="608" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Шилжилт P(s′ | s, a) ба шагнал R</text><text x="450" y="655" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.0" font-weight="400" fill="#292929">Түлхүүртэй + цоожтой хаалгаар гарах → байрлал ба хаалганы төлөв шинэчлэгдэнэ</text><text x="450" y="687" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">Мөнгөн сэлэмтэй + харуул руу довтлох → харуулын төлөв шинэчлэгдэнэ</text><text x="450" y="719" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Эрдэнэс авах → дуусна, r = +100</text><rect x="20" y="790" width="860" height="55" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="826" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хямдруулах коэффициент γ = 0.99</text><defs /></svg>
