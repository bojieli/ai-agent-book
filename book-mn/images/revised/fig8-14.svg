<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="79.853mm" viewBox="0 0 900 678" role="img" aria-labelledby="title desc">
<title id="title">Нэг ээлжит RL ба олон ээлжит RL-ийн харьцуулалт</title><desc id="desc">Хөзрийн хариулт ба тасралтгүй навигацийн харилцан үйлчлэлийн хүрээ, санал хүсэлт ба төлвийн зохион байгуулалт.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="678" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
