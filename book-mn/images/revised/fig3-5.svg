<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="111.889mm" viewBox="0 0 900 950" role="img" aria-labelledby="title desc">
<title id="title">RAG хайлтын урсгал: хайлт, баяжуулалт ба үүсгэлт</title><desc id="desc">Мөнгө буцаах асуултаар журам ба үйлдлийн хэсгүүдийг хайж олоод, хэсгүүд асуулттай хамт Model-ийн оролтыг бүрдүүлж, тодорхой хариулт үүсгэнэ.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="950" fill="#ffffff" y="0" />
<rect x="20" y="20" width="290" height="110" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="165" y="58" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="700" fill="#292929">Хэрэглэгчийн асуулт</text><text x="165" y="99" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">Яаж буцаалт хүсэх вэ?</text><rect x="440" y="20" width="440" height="110" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="660" y="58" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Мэдлэгийн сан</text><text x="660" y="99" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Журам · заавар · орох хугацаа</text><path d="M165 130 L165 175 L290 175" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M660 130 L660 175 L610 175" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="290" y="145" width="320" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="183" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Top-k хэсэг хайх</text><text x="450" y="222" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Нягт вектор / BM25</text><path d="M450 245 L450 280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="280" width="860" height="195" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="317" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Хайлтын үр дүн</text><text x="450" y="361" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">① 7 хоногт бүтэн буцаалт хүснэ, захиалгын дугаар шаардана.</text><text x="450" y="404" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Мөнгө 3–5 ажлын өдөрт орж ирнэ.</text><text x="450" y="447" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">② Миний захиалга → захиалга сонгох → буцаалт хүсэх.</text><path d="M450 475 L450 515" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="515" width="860" height="125" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="554" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Баяжуулсан Model-ийн оролт</text><text x="450" y="601" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929">Даалгаврын заавар + хэрэглэгчийн асуулт + хэсгүүд ба эх сурвалжийн тэмдэг</text><path d="M450 640 L450 675" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="290" y="675" width="320" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="717" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM хариулт үүсгэнэ</text><path d="M450 740 L450 780" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="780" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="818" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Хариулт</text><text x="450" y="861" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">7 хоногт «Миний захиалга» → захиалга → буцаалт хүснэ үү.</text><text x="450" y="900" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Захиалгын дугаараа өгнө; мөнгө ойролцоогоор 3–5 ажлын өдөрт орж ирнэ.</text><defs /></svg>
