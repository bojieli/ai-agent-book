<rect x="70" y="255" width="760" height="148" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="255" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="288" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Байршуулах ба бүтэцтэй тайлан</text><text x="450" y="335" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Траектор, үе, шаардлагын зүйлийг холбох</text><text x="450" y="367" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Тайлан: ач холбогдол, модуль, илрэл, нотолгоо, санал</text><path d="M450 403 L450 458" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="458" width="760" height="148" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="458" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="491" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Регрессийн тест</text><text x="450" y="538" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">Гурван тест: алдаатай хувилбарт унаж, засварласанд давна</text><text x="450" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Алхам байгаа эсэх → дараалал, үр дүн, төлөвийн баталгаа</text><path d="M450 606 L450 661" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
