<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="105.647mm" viewBox="0 0 900 897" role="img" aria-labelledby="title desc">
<ns0:title id="title">Синхрон интерфейсийн нийцэл ба Model-ийн төрөлх асинхрон</ns0:title><ns0:desc id="desc">Ар талын даалгаврын бариул, анхны дуудлагын таних тэмдэг ба ээлжийн дунд чиглүүлэлт.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="897" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="410" height="244" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="700" fill="#292929">Синхрон интерфейсийн адаптаци</ns0:text><ns0:text x="217.67" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">Tool task_id ба pending буцаана</ns0:text><ns0:text x="212" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Дуудлагын үр дүн хүсэлттэй хосолно</ns0:text><ns0:text x="212" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929">Model бусад мессеж боловсруулна</ns0:text><ns0:text x="212" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Ар тал дуусав → шинэ үйл явдал</ns0:text><ns0:text x="212" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">task_id-аар Context сэргээнэ</ns0:text><ns0:rect x="470" y="20" width="410" height="244" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.8" font-weight="700" fill="#292929">Model-ийн төрөлх асинхрон Tool</ns0:text><ns0:text x="667.8" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">async: true зарлана</ns0:text><ns0:text x="662" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Tool ажиллах үед Model үргэлжилнэ</ns0:text><ns0:text x="666.94" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Үр дүн анхны call_id-тай холбогдоно</ns0:text><ns0:text x="662" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">Үр дүн сүүлийн хариуны төлөвт орно</ns0:text><ns0:text x="662" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Model шинэ үр дүнгээр шийдвэрлэнэ</ns0:text><ns0:rect x="20" y="309" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="309" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="342" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Өрөөний лавлагаа: гүйцэтгэлийн үеэр шинэчлэл</ns0:text><ns0:text x="437" y="389" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Анхны нөхцөл: төсөв 2000, 20 хүн</ns0:text><ns0:text x="437" y="421" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">A: 1800 / 30 хүн · B: 900 / 12 хүн · C: 600 / 8 хүн</ns0:text><ns0:path d="M450 459 L450 479 L225 479 L225 499" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M450 479 L675 479 L675 499" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="499" width="410" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="499" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="532" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Лавлагаа дуусаагүй</ns0:text><ns0:text x="212" y="579" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">Ар тал өрөөг лавласаар байна</ns0:text><ns0:text x="212" y="611" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Урд тал хөтөлбөр, жагсаалт бэлтгэнэ</ns0:text><ns0:rect x="470" y="499" width="410" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="499" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="532" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="700" fill="#292929">Хэрэглэгчийн дундын чиглүүлэлт</ns0:text><ns0:text x="662" y="579" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">Шинэчлэл: төсөв 1000, 10 хүн</ns0:text><ns0:text x="662" y="611" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Шинэчлэлийн эх сурвалж, төлөв</ns0:text><ns0:path d="M225 644 L225 679 L675 679 L675 644" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M450 679 L450 719" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="719" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="719" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="752" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Үр дүн ба шинэчлэл хамт шийдвэрт орно</ns0:text><ns0:text x="441.46" y="799" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Анхны нөхцлөөр A; шинэ нөхцлөөр B</ns0:text><ns0:text x="437" y="831" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Орчин Tool-ийн төлөвийг; Model шинэ нөхцлийг баримтална</ns0:text><ns0:defs /></ns0:svg>
