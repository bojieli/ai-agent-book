<ns0:title id="title">Нислэгийн тийзийн маягт юу илгээсэн бэ</ns0:title><ns0:desc id="desc">Бээжин хэрэглэгчийн даалгавраас, бусад дөрвөн талбар хөтчөөс ирсэн. Хоёр мэдээлэл Model хариулахад нийлнэ.</ns0:desc>
