<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="63.600mm" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">BM25 оноо өгөх механизм</title><desc id="desc">Бусад нөхцөлийг тогтоож, үгийн давтамж, баримт бичгийн урт, баримт бичгийн давтамж нэг асуулгын үгийн оноог хэрхэн өөрчилдгийг тус тусад нь ажиглана.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="540" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="135" y="104" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">TF-ийн ханалт</text><text x="565" y="58" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">k₁ = 1.5, баримт бичиг яг дундаж урттай</text><text x="565" y="103" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">1, 2, 3 удаа гарсан</text><text x="565" y="150" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">TF хүчин зүйл: 1.00 → 1.43 → 1.67</text><rect x="20" y="190" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="135" y="274" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Нормчлол</text><text x="565" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">k₁ = 1.5, b = 0.75, давтамж 1</text><text x="565" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Урт дунджаас хоёр дахин нэмэгдэв</text><text x="565" y="320" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">TF хүчин зүйл: 1.00 → 0.69</text><rect x="20" y="360" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="360" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="135" y="444" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Урвуу давтамж</text><text x="565" y="398" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Корпус нийт 10 баримт бичигтэй</text><text x="565" y="443" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">«загвар» 3-т, «нэрэлт» 2-т гарсан</text><text x="565" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">IDF: «загвар» 0.762, «нэрэлт» 1.224</text><defs /></svg>
