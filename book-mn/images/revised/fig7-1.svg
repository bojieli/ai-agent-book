<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Амжилтын тодорхойлолт</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Pass@1: нэг удаа амжилттай · Pass@k: k-аас дор хаяж нэг</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Best@k: хамгийн өндөр оноо · Pass^k: k удаа бүгд амжилттай</text><path d="M450 165 L450 208" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="208" width="860" height="195" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="208" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="241" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Даалгавар хаанаас ирэх вэ</text><text x="450" y="288" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">Нийтийн бенчмарк: чадварыг харьцуулах, орчин ба шалгуураас суралцах</text><text x="450" y="320" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.5" font-weight="400" fill="#292929">Өөрийн бизнесийн багц: зорилтот тархалтаар сонгож, гол хилийг хамрах</text><text x="450" y="352" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.4" font-weight="400" fill="#292929">Ашиглалтын замнал: засвар ба бүтэлгүйтлийг нууцалж, хүнээр батлан нэмэх</text><path d="M450 403 L450 448" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="448" width="860" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="448" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
