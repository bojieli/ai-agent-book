<ns0:title id="title">Локал LLM-ийн Tool дуудлагын архитектур</ns0:title><ns0:desc id="desc">Ванкуверийн цаг ба цаг агаарын даалгавар: клиент мессежийг хадгалж, локал Model-ийг дуудаж, хоёр Tool-ийг хуваарилаад ажиглалтыг Model руу буцаана.</ns0:desc>
