<text x="450" y="814" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Хотхон дахь нийгмийн харилцан үйлчлэл</text><text x="450" y="861" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">25 Agent, хоёр өдрийн амьдралын симуляци</text><text x="450" y="893" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">Ярианы тархалт: үдэшлэгийн урилга, Sam хотын даргад нэр дэвших</text><text x="450" y="925" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Санах ой ба харилцаа: танилаа таних, гэрэл зургийн төслийн сэдвийг үргэлжлүүлэх</text><text x="450" y="957" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">Үйлдэл: арга хэмжээ зохион байгуулах, урих, товлосон ёсоор очих</text><path d="M675 745 L675 781" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
