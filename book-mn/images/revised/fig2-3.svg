<text x="450" y="56" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Model-ийн эхний дуудлага</text><text x="450" y="93" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">messages: system + user · tools: цагийн Tool + цаг агаарын Tool</text><path d="M450 120 L450 157" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
