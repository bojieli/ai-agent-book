<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="91.867mm" viewBox="0 0 900 780" role="img" aria-labelledby="title desc">
<title id="title">Model API-г хоёр удаа дуудах харилцан үйлчлэлийн бүрэн дараалал</title><desc id="desc">Ванкуверийн цаг ба цаг агаар: Model хоёр бие даасан дуудлага үүсгэж, Harness гүйцэтгээд ID-тэй үр дүнг буцааж, Model эцсийн хариултаа үүсгэнэ.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
