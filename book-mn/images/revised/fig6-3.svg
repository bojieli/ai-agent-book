<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="86.449mm" viewBox="0 0 900 734" role="img" aria-labelledby="title desc">
<title id="title">Асинхрон үйл явдлыг боловсруулах гурван стратеги</title><desc id="desc">Шинэ үйл явдлаас боловсруулах мөч хүртэл, дараа нь анхны даалгавар ба шинэ үйл явдлын замыг харьцуулав.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="734" fill="#ffffff" y="0" />
<text x="450" y="48" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Шинэ үйл явдал ирэхэд анхны даалгаврыг яах вэ?</text><rect x="20" y="82" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="177" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Цуцлах</text><rect x="240" y="82" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="560" y="122" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Хэрэглэгч "зогсоо" гэж хэлэв</text><text x="560" y="175" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Шинэ үйлдэл хуваарилахаа зогсоож, цуцална</text><text x="560" y="231" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.7" font-weight="400" fill="#292929">Гүйцэтгэлийн хүрээг тодруулж, эцсийн төлөвийг тэмдэглэнэ</text><rect x="20" y="302" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="397" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Дараалал</text><rect x="240" y="302" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="560" y="342" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Хэрэглэгч "сүүлийн сарыг л үз" гэж нэмэв</text><text x="560" y="395" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хайлт дуустал шаардлагыг дараалалд хий</text><text x="560" y="451" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Үр дүн ирэхэд шинэ хугацаагаар шүүнэ</text><rect x="20" y="522" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="617" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Зэрэгцээ</text><rect x="240" y="522" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="560" y="562" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Шинжилгээ явахдаа цаг агаарыг асуув</text><text x="560" y="615" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Тусдаа контекстэд цаг агаарыг лавлана</text><text x="560" y="671" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хариу ба үр дүнг тусад нь хадгална</text><defs /></svg>
