<title id="title">GeneralPoints туршилтын архитектур (GP-L ба GP-VL гэсэн хоёр хувилбарын сургалт ба туршилтын зохион байгуулалт)</title><desc id="desc">Хөзрийн жишээ, тархалтын өөрчлөлт, нийтлэг эхлэлийн цэг ба сургалтын хоёр салбар.</desc>
