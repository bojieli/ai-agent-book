<ns0:title id="title">Agent ба Environment-ийн хаалттай давталтын харилцан үйлчлэл, Agent-ийн доторх Model–Harness бүтэц</ns0:title><ns0:desc id="desc">Agent зэрэгцээ орших Model ба Harness-ийг агуулна. Harness контекстийг зохион байгуулж, хэрэгслийг хуваарилж, ажиллагааг удирдана; орчин үйлдлийг хүлээн авч, төлвөө шинэчлээд ажиглалт буцаана.</ns0:desc>
