<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="115.776mm" viewBox="0 0 900 983" role="img" aria-labelledby="title desc">
<title id="title">Өгүүллээс тайлбар видео хүртэлх төгсгөлөөс төгсгөл хүртэлх шугам</title><desc id="desc">PPT үүсгэх-хянах, хуудас бүрийн тайлбар ба дуу дүрсний нийлэгжүүлэлт гэсэн хоёр үе шат.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="983" fill="#ffffff" y="0" />
<rect x="100" y="20" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="20" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Өгүүлэл задлах, агуулга төлөвлөх</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Бүлэг, хувь нэмэр, графикийн ишийг гаргах</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хуудсыг төлөвлөж, санаа бүрт график оноох</text><path d="M450 175 L450 215" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="215" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="215" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="248" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Slidev үүсгэх ба хянах</text><text x="450" y="295" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Код, текст, графикийг хольж байрлуулах</text><text x="450" y="327" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хуудас бүрийг дүрслэх → харааны хяналт → засвар</text><path d="M450 370 L450 410" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="410" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="410" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="443" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Хуудасны зураг ба тайлбарын текст</text><text x="450" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хуудасны дараалал, графикийн харгалзааг хадгалах</text><text x="450" y="522" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хуудас бүрт ярианы хэлээр тайлбар үүсгэх</text><path d="M450 565 L450 605" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="605" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="605" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="638" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ TTS ба дуу дүрсний синхрончлол</text><text x="450" y="685" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="400" fill="#292929">Хуудас бүрийн дууг нийлэгжүүлж, үргэлжлэх хугацааг унших</text><text x="450" y="717" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.6" font-weight="400" fill="#292929">Зургийн харуулах хугацааг тохируулж, шилжилтийг шалгах</text><path d="M450 760 L450 800" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="800" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="800" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="833" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑤ Видео нийлэгжүүлэх ба шалгах</text><text x="450" y="880" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">FFmpeg аудио зам ба дүрсийг нийлэгжүүлнэ</text><text x="450" y="912" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">Зураг-текст, тайлбар, дуу дүрсний синхроныг шалгах</text><defs /></svg>
