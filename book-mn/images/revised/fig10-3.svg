<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="96.931mm" viewBox="0 0 900 823" role="img" aria-labelledby="title desc">
<title id="title">Санал гаргагч—хянагчийн давталт</title><desc id="desc">Өгүүллийн агуулга, дүрслэл, хуудас бүрийн эргэх холбоо ба гурван ээлжийн засварын жишээ.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
