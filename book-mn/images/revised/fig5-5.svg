<ns0:title id="title">PPT үүсгэлтийн санал болгогч—хянагч механизм</ns0:title><ns0:desc id="desc">Slidev эх код, хуудас бүрийн дэлгэцийн зураг, бүтэцтэй хариу тусдаа Context-уудын хооронд дамжина.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="473" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="410" height="290" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
