<title id="title">Олон ээлжит харилцан үйлчлэл дэх итгэлийн хуваарилалт</title><desc id="desc">Нэг навигацийн таван алхмыг мөрөөр байрлуулж, зөвхөн төгсгөлд шагнал өгөх ба процессын санал хүсэлт нэмэх үеийн алхам бүрийн оноог харьцуулна.</desc>
