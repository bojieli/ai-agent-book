<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="126.847mm" viewBox="0 0 900 1077" role="img" aria-labelledby="title desc">
<title id="title">Бүтэцлэгдсэн мэдлэг гаргах дамжуулах хоолой</title><desc id="desc">Хэргийн материалаас модульчилсан талбар илрүүлж, бүтэцлэгдсэн бичлэг гаргаад, кодлол, стандартчилал, кластерчлалаар прототип бүрдүүлж, кластерын төвийн зөрүүгээр шинж чанарын жинг тайлбарлана.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
