<text x="450" y="938" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Хэрэглээ: харилцан ярианы хэлбэрийн хэргийн хайлт</text><text x="450" y="983" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Гол баримт нэмэх → прототиптэй тааруулах → эх сурвалжтай тайлбарлах</text><text x="450" y="1021" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">Жишээ: маргааны дараах гар зөрүүлэлт ба төлөвлөсөн зэвсэгт үйлдэл</text><defs /></svg>
