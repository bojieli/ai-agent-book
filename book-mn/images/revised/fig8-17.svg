<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="120.133mm" viewBox="0 0 900 1020" role="img" aria-labelledby="title desc">
<title id="title">ReTool-ийн текст-код сэтгэлгээ ба sandbox гүйцэтгэлийн санал хүсэлтийн давталт</title><desc id="desc">Тэгшитгэл бодох жишээ, гүйцэтгэлийн интерфэйс ба PPO сургалтын тохиргоо.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1020" fill="#ffffff" y="0" />
<rect x="20" y="20" width="530" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="530" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="285" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Текстэн дүгнэлт</text><text x="285" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">x² + 2x − 8 = 0-ийг бод</text><text x="285" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">sympy-оор язгуур тооцно</text><path d="M285 160 L285 195" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="195" width="530" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="195" width="530" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="285" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Код үүсгэх</text><text x="285" y="275" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">from sympy import symbols, solve</text><text x="285" y="307" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">x = symbols("x")</text><text x="285" y="339" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">solve(x**2 + 2*x - 8, x)</text><rect x="595" y="195" width="285" height="250" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="595" y="195" width="285" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="737.5" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">SandboxFusion</text><text x="737.5" y="275" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">128 зэрэгцээ worker</text><text x="737.5" y="307" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Python гүйцэтгэл</text><text x="737.5" y="339" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">sympy / numpy</text><text x="737.5" y="371" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">scipy</text><text x="737.5" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Хугацаа, санах ойн хязгаар</text><path d="M550 260 L595 260" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M595 345 L572 345 L572 450 L550 450" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
