<rect x="20" y="410" width="530" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="285" y="443" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Тайлбарлагчийн санал хүсэлт</text><text x="285" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">&lt;interpreter&gt;[-4, 2]&lt;/interpreter&gt;</text><path d="M285 515 L285 550" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="550" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="550" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="583" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Дараах дүгнэлт ба хариулт</text><text x="450" y="630" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Шалгалт: 2² + 2×2 − 8 = 0</text><text x="450" y="662" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Эцсийн хариулт: x = −4 эсвэл x = 2</text><rect x="20" y="735" width="410" height="250" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="735" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="768" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">PPO сургалтын тохиргоо</text><text x="225" y="815" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Qwen2.5-32B</text><text x="225" y="847" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">SFT ~1 цаг</text><text x="225" y="879" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">RL ~9 өдөр / 400 алхам</text><text x="225" y="911" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Алхам бүр 32 асуулт × 16</text><text x="225" y="943" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Дунджаар 7～9 ээлж</text><rect x="470" y="735" width="410" height="250" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="735" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
