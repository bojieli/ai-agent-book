<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="98.933mm" viewBox="0 0 900 840" role="img" aria-labelledby="title desc">
<title id="title">Номын бүтэц: Agent бүтээх ба Agent-ийн чадварыг сайжруулах</title><desc id="desc">1–6-р бүлэг бүтээх аргыг тогтоож, 7-р бүлэг үнэлгээний санал хүсэлт өгч, 8–10-р бүлэг параметр, системийн шинэчлэлт ба хамтын ажиллагаагаар чадварыг сайжруулна.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="840" fill="#ffffff" y="0" />
<rect x="20" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="220" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">I хэсэг: Agent бүтээх</text><rect x="480" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="680" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.8" font-weight="700" fill="#292929">II хэсэг: чадвар сайжруулах</text><text x="220" y="138" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="700" fill="#292929">Бүлэг 1 AI Agent-ийн танилцуулга</text><text x="220" y="180" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">Model Tool-ийг хэрхэн дууддаг вэ?</text><path d="M20 224 L420 224" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="262" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Бүлэг 2 Context инженерчлэл</text><text x="220" y="304" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.4" font-weight="400" fill="#292929">Энэ шийдвэрт ямар мэдээлэл хэрэгтэй вэ?</text><path d="M20 348 L420 348" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="386" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Бүлэг 3 Санах ой ба мэдлэг</text><text x="220" y="428" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="400" fill="#292929">Өмнө ярьсан зүйлийг хэрхэн олох вэ?</text><path d="M20 472 L420 472" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="510" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Бүлэг 4 Tool</text><text x="220" y="552" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Төлөв шалгах, ажил гүйцэтгэх</text><path d="M20 596 L420 596" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="634" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Бүлэг 5 Код бичих Agent</text><text x="220" y="666" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ба ерөнхий Agent</text><text x="220" y="706" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="400" fill="#292929">Программ бичиж шийдэж болох уу?</text><path d="M20 720 L420 720" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="758" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Бүлэг 6 Харилцан үйлчлэл</text><text x="220" y="800" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">Хэрэглэгч дундуур яривал яах вэ?</text><rect x="480" y="110" width="400" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="680" y="153" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Бүлэг 7 Agent-ийн үнэлгээ</text><text x="680" y="204" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">Хаана алдсан? Засвар үр дүнтэй юу?</text><path d="M680 225 L680 247 L500 247 L500 747" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M500 347 L522 347" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="282" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="328" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Бүлэг 8 Дараах сургалт</text><text x="701" y="376" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.7" font-weight="400" fill="#292929">Сургалтаар Model-ийг шинэчлэх</text><path d="M500 547 L522 547" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="482" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="528" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="700" fill="#292929">Бүлэг 9 Тасралтгүй хувьсал</text><text x="701" y="576" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Туршлагаар системийг сайжруулах</text><path d="M500 747 L522 747" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="682" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="728" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Бүлэг 10 Олон Agent</text><text x="701" y="776" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.6" font-weight="400" fill="#292929">Гишүүд хэрхэн хуваарилах вэ?</text><defs /></svg>
