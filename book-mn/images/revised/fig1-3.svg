<ns0:title id="title">Туршилт 1-1-ийн бүрэн суурь хувилбар ба дөрвөн хасалтын бүлгийн үр дүн</ns0:title><ns0:desc id="desc">Таван нөхцөл бүгд системийн Prompt болон одоогийн даалгаврыг хадгална. Хэрэгслийн тодорхойлолт, өмнөх дуудлага, өмнөх дүгнэлт, хэрэгслийн үр дүнг бүлэг бүрийн нөхцөлөөр хадгалах эсвэл хасна.</ns0:desc>
