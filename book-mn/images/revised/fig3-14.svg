<title id="title">Контекстийг харгалзсан хайлт</title><desc id="desc">Анхны баримт бичиг ба зорилтот хэсгийг хамт Model-д оруулж суурь угтвар үүсгээд, угтварыг эх бичвэртэй хамт индекслэнэ. Жишээнд ACME компанийн 2025 оны хоёрдугаар улиралд орлого 3%-иар өссөн тухай бүтэн хэсгийг хадгалсан.</desc>
