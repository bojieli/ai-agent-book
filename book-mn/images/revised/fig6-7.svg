<ns0:rect x="100" y="740" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="773" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">TTS ба тоглуулалт</ns0:text><ns0:text x="437" y="820" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fish Audio S1: текст → аудио блок</ns0:text><ns0:text x="437" y="852" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Сүлжээ → тоглуулалтын буфер → чанга яригч</ns0:text><ns0:defs /></ns0:svg>
