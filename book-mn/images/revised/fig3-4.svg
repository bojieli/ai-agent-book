<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="74.200mm" viewBox="0 0 900 630" role="img" aria-labelledby="title desc">
<title id="title">Олон төрлийн санах ойн хамтын ажиллагааны жишиг архитектур</title><desc id="desc">Ажлын санах ой одоогийн даалгаврын төлөвийг хадгалдаг; үйл явдлын, утгын, процедурын санах ой сонгомол бичилт ба хайлтаар идэвхжиж, одоогийн даалгаварт оролцоно.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="630" fill="#ffffff" y="0" />
<rect x="210" y="20" width="480" height="150" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ажлын санах ой</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">Зорилго · харилцан яриа · Tool-ийн үр дүн</text><text x="450" y="136" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">Даалгаврын төлөв ба дараагийн алхам</text><path d="M320 170 L320 280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="224" y="232" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Сонгомол бичилт</text><path d="M580 280 L580 170" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="683" y="232" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хайлт ба идэвхжүүлэлт</text><rect x="20" y="280" width="860" height="320" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="322" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Урт хугацааны санах ой: сесс хооронд</text><rect x="40" y="350" width="240" height="215" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="160" y="390" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Үйл явдлын</text><text x="160" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.1" font-weight="400" fill="#292929">Үйл явдал, дараалал</text><text x="160" y="467" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хүн, эх сурвалж</text><text x="160" y="498" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.1" font-weight="400" fill="#292929">«1-р сард Токиогийн</text><text x="160" y="529" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">нислэг захиалсан»</text><rect x="330" y="350" width="240" height="215" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="390" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Утгын</text><text x="450" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">Тогтвортой баримт</text><text x="450" y="467" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="400" fill="#292929">Яриа, туршлагаас</text><text x="450" y="498" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">«Цонхны суудал»</text><rect x="620" y="350" width="240" height="215" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="740" y="390" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Процедурын</text><text x="740" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">Урсгал ба туршлага</text><text x="740" y="467" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.2" font-weight="400" fill="#292929">Алхам, нөхцөл, салаа</text><text x="740" y="498" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.4" font-weight="400" fill="#292929">Нислэг, буудал авч,</text><text x="740" y="529" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.3" font-weight="400" fill="#292929">баримтаа шалгана</text><defs /></svg>
