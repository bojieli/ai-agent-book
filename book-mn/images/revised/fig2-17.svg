<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="100.111mm" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
<title id="title">Шахалтын зургаан стратегийн боловсруулалтын урсгал</title><desc id="desc">Зургаан стратеги тус бүр материалын зохион байгуулалт, даалгаврын контекст, эх сурвалжийн холбоос, цонхны босгын боловсруулалтаа хадгална.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="850" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="54" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Шахалтгүй</text><text x="605" y="54" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Шууд хадгална</text><rect x="40" y="72" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="105" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хайлтын түүхий үр дүн</text><path d="M405 97 L490 97" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="72" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="105" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Бүрэн үр дүн</text><rect x="20" y="157" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="191" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.2" font-weight="700" fill="#292929">② Тусгай хураангуй</text><text x="605" y="191" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Тус бүрд 2–3 догол мөр хураангуй</text><rect x="40" y="209" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="242" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хуудас бүрийн агуулга</text><path d="M405 234 L490 234" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="209" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="242" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">Хуудас тус бүрийн хураангуй</text><rect x="20" y="294" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="328" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="700" fill="#292929">③ Нэгдсэн хураангуй</text><text x="605" y="328" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.9" font-weight="400" fill="#292929">Нэгтгэх, давхардал арилгах, хураангуйлах</text><rect x="40" y="346" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="379" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Нэг багц хайлтын үр дүн</text><path d="M405 371 L490 371" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="346" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="379" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Цогц хураангуй</text><rect x="20" y="431" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="465" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="700" fill="#292929">④ Контекст мэдэрсэн</text><text x="605" y="465" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Даалгавраар нь гаргаж авна</text><rect x="40" y="483" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="516" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">Үр дүн + асуулга + мэдэх зүйл</text><path d="M405 508 L490 508" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="483" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="516" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хамаарах баримт ба дутуу</text><rect x="20" y="568" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="602" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.3" font-weight="700" fill="#292929">⑤ Мэдэрсэн + ишлэл</text><text x="605" y="602" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Хураангуйлж, URL-ийг хадгална</text><rect x="40" y="620" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="653" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">Үр дүн + асуулга + мэдэх зүйл</text><path d="M405 645 L490 645" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="620" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="653" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Баримт ба эх сурвалж</text><rect x="20" y="705" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="739" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.9" font-weight="700" fill="#292929">⑥ Дасан зохицох цонх</text><text x="605" y="739" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">≤80% хадгална; &gt;80% багцаар хураангуйлна</text><rect x="40" y="757" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="790" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Одоогийн оролтын ачаалал</text><path d="M405 782 L490 782" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="757" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="790" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Шахсан үр дүнг тэмдэглэнэ</text><defs /></svg>
