<text x="585" y="123" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">"Агуулахад улаан түлхүүр бий, хойд хаалга түгжээтэй"</text>
