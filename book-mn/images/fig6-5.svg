<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <title>Зураг 6-5: Синхрон интерфэйстэй нийцэл ба загварт төрөлх асинхрон ажиллагаа</title>
  <desc>Дээрх нийцлийн аргаар runtime нь ирсэн үйл явдлыг эрэмбэлж, синхрон интерфэйстэй загварыг асинхрон ажилд оролцуулна. Өөр нэг арга нь загварт энэ хэмнэлийг төрөлхөөр ойлгуулах явдал: хэрэгсэл ажиллаж байх үед өөр ажил хийж, хэрэглэгч шаардлага нэмбэл дараагийн ажлаа тохируулна. GPT-6 Astra нь Async tool calling болон Mid-turn steering-ийг дэмждэг.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#555" /></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .title{font-size:20px;font-weight:700}
      .label{font-size:17px;font-weight:600}
      .small{font-size:15px}
      .box{fill:#f4f4f4;stroke:#555;stroke-width:1.5}
      .arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="540" fill="#fff" />
  <rect x="20" y="20" width="840" height="145" rx="8" fill="#fff" stroke="#777" stroke-dasharray="7 4" />
  <text x="40" y="53" class="title">Тохирол: ажиллах орчин асинхрон ажлыг хуваарилна</text>
  <rect x="40" y="75" width="230" height="60" rx="5" class="box" />
  <text x="155" y="100" text-anchor="middle" class="label" style="font-size:15.45px">Ажил ард үргэлжилнэ</text>
  <text x="155" y="122" text-anchor="middle" class="small">Дуусаагүйг ил тод тэмдэглэнэ</text>
  <path d="M270 105 H313" class="arrow" />
  <rect x="320" y="75" width="240" height="60" rx="5" class="box" />
  <text x="440" y="100" text-anchor="middle" class="label" style="font-size:15.05px">Runtime шинэ үйл явдал авна</text>
  <text x="440" y="122" text-anchor="middle" class="small" style="font-size:14.04px">Дараалал, тасалдал, эсвэл зэрэгцээ</text>
  <path d="M560 105 H603" class="arrow" />
  <rect x="610" y="75" width="230" height="60" rx="5" class="box" />
  <text x="725" y="100" text-anchor="middle" class="label">Загвар ажлаа хийнэ</text>
  <text x="725" y="122" text-anchor="middle" class="small" style="font-size:13.35px">Оролт синхрон ээлжээр хэвээр</text>

  <rect x="20" y="185" width="840" height="250" rx="8" fill="#fff" stroke="#444" stroke-width="2" />
  <text x="40" y="218" class="title">Төрөлх асинхрон байдал: хүлээлт ба явцын өөрчлөлтийг ойлгох</text>
  <rect x="40" y="240" width="230" height="65" rx="5" class="box" />
  <text x="155" y="267" text-anchor="middle" class="label">Удаан хүсэлт эхлүүлэх</text>
  <text x="155" y="290" text-anchor="middle" class="small">Жишээ: уулзалтын газар хайх</text>
  <path d="M270 272 H313" class="arrow" />
  <rect x="320" y="240" width="240" height="65" rx="5" class="box" />
  <text x="440" y="267" text-anchor="middle" class="label" style="font-size:16.08px">Хүлээх зуур үргэлжлүүлэх</text>
  <text x="440" y="290" text-anchor="middle" class="small" style="font-size:14.09px">Хөтөлбөр ба шалгах хуудсыг бэлтгэх</text>
  <path d="M560 272 H603" class="arrow" />
  <rect x="610" y="240" width="230" height="65" rx="5" class="box" />
  <text x="725" y="267" text-anchor="middle" class="label" style="font-size:16.57px">Үр дүн ирэхэд шийдэх</text>
  <text x="725" y="290" text-anchor="middle" class="small" style="font-size:14.53px">Бодит өгөгдлөөр газар сонгох</text>

  <rect x="40" y="340" width="230" height="65" rx="5" class="box" />
  <text x="155" y="367" text-anchor="middle" class="label">Шаардлага нэмнэ</text>
  <text x="155" y="390" text-anchor="middle" class="small">Төсөв/хүний тоо өөрчлөгдөнө</text>
  <path d="M270 372 H313" class="arrow" />
  <rect x="320" y="340" width="240" height="65" rx="5" class="box" />
  <text x="440" y="367" text-anchor="middle" class="label">Дууссан ажлыг хадгалах</text>
  <text x="440" y="390" text-anchor="middle" class="small" style="font-size:14.09px">Шинэ шаардлагыг ажилд нэмэх</text>
  <path d="M560 372 H603" class="arrow" />
  <rect x="610" y="340" width="230" height="65" rx="5" class="box" />
  <text x="725" y="367" text-anchor="middle" class="label" style="font-size:16.43px">Дараагийн үйлдлийг засах</text>
  <text x="725" y="390" text-anchor="middle" class="small" style="font-size:14.25px">Өгөгдөл, шинэчлэл ашиглах</text>

  <rect x="20" y="455" width="840" height="65" rx="6" fill="#e9e9e9" />
  <text x="440" y="482" text-anchor="middle" class="label">Загвар: өөрчлөлтийг ойлгож төлөвлөгөөг засна. Runtime: хэрэгсэл, төлөв, үйл явдлын эх.</text>
  <text x="440" y="506" text-anchor="middle" class="small">Зурвас авахад ажлыг зөв сэргээж, үйлдлийг хянах шаардлагатай.</text>
</svg>
