<rect x="20" y="355" width="280" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<rect x="490" y="355" width="270" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="30" y="377" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">Шинэ дүрэм → бүрэн дахин сургалт</text>
<text x="500" y="377" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">Ажил хооронд zero/few-shot шилжүүлэлт</text>
<text x="395" y="377" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold">Ерөнхийлөх чадвар</text>
<rect x="20" y="403" width="280" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<rect x="490" y="403" width="270" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="30" y="425" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">~10000 эпизод / 10 секунд</text>
<text x="500" y="425" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">~1 эпизод / 2 минут</text>
