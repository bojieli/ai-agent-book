<rect x="490" y="115" width="270" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="30" y="137" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">Хаалттай төгсгөлөг багц (6 үйлдэл)</text>
