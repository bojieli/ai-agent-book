<text x="395" y="185" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="bold">Урьдал мэдлэг</text>
<rect x="20" y="211" width="280" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<rect x="490" y="211" width="270" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="30" y="233" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">Hash кодлол: state_id=0x3A7F</text>
<text x="500" y="233" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">Семантик: &quot;агуулахад улаан түлхүүр байна&quot;</text>
