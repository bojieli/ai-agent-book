<rect x="20" y="163" width="280" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<rect x="490" y="163" width="270" height="44" rx="3" fill="#f0f0f0" stroke="#333333" stroke-width="2"/>
<text x="30" y="185" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal">Урьдалгүй, санамсаргүй policy-оос</text>
