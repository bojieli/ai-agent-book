<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" style="background:#ffffff">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#33434d"/></marker>
    <style>
      .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#26343c}
      .h{font-size:14.7px;font-weight:700}
      .s{font-size:11.6px;fill:#52636d}
      .box{fill:#f5f7f8;stroke:#33434d;stroke-width:2}
      .accent{fill:#e8f1f5;stroke:#2f617a;stroke-width:2}
      .line{fill:none;stroke:#33434d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="500" y="30" text-anchor="middle" class="t h">Туршлагыг мэдлэг болгох: түүхий траектор нь нотолгоо, баримт нь дахин ашиглах нэгж</text>

  <rect x="22" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="106" y="111" text-anchor="middle" class="t h" style="font-size:11.6px">Түүхий траектор</text>
  <text x="106" y="139" text-anchor="middle" class="t s" style="font-size:8.1px">Үйлдэл, үр дүн, орчин</text>
  <text x="106" y="160" text-anchor="middle" class="t s" style="font-size:8.1px">Өөрчлөх боломжгүй нотолгоо</text>

  <rect x="215" y="78" width="168" height="96" rx="8" class="box"/>
  <text x="299" y="111" text-anchor="middle" class="t h" style="font-size:10.1px">Нэг удаагийн үнэлгээ</text>
  <text x="299" y="139" text-anchor="middle" class="t s" style="font-size:8.6px">Амжилт, бүтэлгүйтэл, шошго</text>
  <text x="299" y="160" text-anchor="middle" class="t s" style="font-size:9.3px">Нотолгооны байршлыг хадгална</text>

  <rect x="408" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="500" y="97" text-anchor="middle" class="t h" style="font-size:8.6px">Траектор хоорондын харьцуулалт</text>
  <text x="500" y="128" text-anchor="middle" class="t s">Төстэй ажлуудыг нэгтгэх</text>
  <text x="500" y="151" text-anchor="middle" class="t s" style="font-size:8.9px">Амжилтыг алдаатай харьцуулах</text>
  <text x="500" y="174" text-anchor="middle" class="t s" style="font-size:7.7px">Нийтлэг тал ба хязгаарыг ялгах</text>

  <rect x="617" y="63" width="184" height="126" rx="8" class="accent"/>
  <text x="709" y="97" text-anchor="middle" class="t h" style="font-size:13.5px">Markdown баримт</text>
  <text x="709" y="128" text-anchor="middle" class="t s" style="font-size:8.6px">Хэрэглэх нөхцөл ба стратеги</text>
  <text x="709" y="151" text-anchor="middle" class="t s" style="font-size:8.6px">Онцгой тохиолдол, хориотой бүс, эх сурвалж</text>
  <text x="709" y="174" text-anchor="middle" class="t s" style="font-size:10.4px">Хувилбар ба шалгасан хугацаа</text>

  <rect x="826" y="78" width="152" height="96" rx="8" class="box"/>
  <text x="902" y="111" text-anchor="middle" class="t h" style="font-size:12.8px">Хайж авч ашиглах</text>
  <text x="902" y="139" text-anchor="middle" class="t s" style="font-size:7.7px">Шинэ ажилд хэрэгтэй үед ачаалах</text>
  <text x="902" y="160" text-anchor="middle" class="t s" style="font-size:8.9px">Feedback тасралтгүй гаргана</text>

  <path d="M190 126 H213" class="line"/>
  <path d="M383 126 H406" class="line"/>
  <path d="M592 126 H615" class="line"/>
  <path d="M801 126 H824" class="line"/>

  <path d="M902 174 V244 H500 V191" class="line" stroke-dasharray="7 5"/>
  <text x="700" y="270" text-anchor="middle" class="t s">Шинэ нотолгоо хуучин мэдлэгийг засаж, нарийсгаж эсвэл хална</text>

  <rect x="215" y="302" width="586" height="48" rx="8" fill="#fafbfb" stroke="#9aa8af"/>
  <text x="508" y="332" text-anchor="middle" class="t s" style="font-size:7.4px">3-р бүлгийн задлан авах, хайх stack-ийг ашиглана; энэ бүлэг траекторын үнэлгээ ба зан төлөв сайжруулах давталтыг нэмнэ</text>
</svg>
