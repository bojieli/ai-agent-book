<ns0:title id="title">チャットテンプレートがメッセージを token 列に変換</ns0:title><ns0:desc id="desc">リクエストはシステム指示とユーザーの質問を含む。テンプレートが 2 つのメッセージの境界を示し、モデルが続きを書くための assistant 開始マーカーを追加する。</ns0:desc>
