<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="106.000mm" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">オンライン実行とオフライン進化の二重ループ</title><desc id="desc">左側は現行バージョンで照会し受領通知を待ち、右側はログから学ぶ。検証を通過した新バージョンを後続のタスクで使う。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
