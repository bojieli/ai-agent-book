<ns0:rect width="900" height="680" fill="#ffffff" y="0" />
<ns0:rect x="24" y="20" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="214" y="20" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="100" y="76" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="22.0" font-weight="700" fill="#292929">コンテキスト</ns0:text><ns0:text x="531" y="76" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ユーザーの依頼：今月の過剰請求を調べる</ns0:text><ns0:path d="M544 110 L544 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="24" y="154" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="214" y="154" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="102.06" y="210" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM</ns0:text><ns0:text x="531" y="210" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">まず今月の請求書を照会すると決める</ns0:text><ns0:path d="M544 244 L544 284" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="24" y="288" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="214" y="288" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="100" y="344" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ツール</ns0:text><ns0:text x="531" y="344" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">請求 API がローミング料金 1 件を返す</ns0:text><ns0:path d="M544 378 L544 418" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="24" y="422" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="214" y="422" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="100" y="478" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="22.0" font-weight="700" fill="#292929">コンテキスト</ns0:text><ns0:text x="531" y="478" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ユーザーの依頼と照会した明細がここに入る</ns0:text><ns0:path d="M544 512 L544 552" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
