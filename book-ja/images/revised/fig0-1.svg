<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="80.089mm" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
<ns0:title id="title">Agent = LLM + コンテキスト + ツール</ns0:title><ns0:desc id="desc">料金照会の依頼から始め、上から下へ読む。モデルはまず請求書の照会を決め、ツールが明細を返す。明細はコンテキストに入り、モデルはそれをもとに次の一手を決める。</ns0:desc>
