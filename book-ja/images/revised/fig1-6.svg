<ns0:rect width="900" height="882" fill="#ffffff" y="0" />
<ns0:rect x="190" y="30" width="360" height="137" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="356" y="65" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">予算とエラー状態を確認</ns0:text><ns0:text x="357" y="100" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">最大ターン数 · エラー回数</ns0:text><ns0:text x="357" y="130" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">回復不能なエラー</ns0:text><ns0:rect x="630" y="30" width="240" height="137" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="736" y="65" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">実行を停止</ns0:text><ns0:text x="737" y="100" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">進捗を保存</ns0:text><ns0:text x="737" y="130" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">未完了を報告／</ns0:text><ns0:text x="737" y="162" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">人に引き継ぐ</ns0:text><ns0:path d="M550 80 L630 80" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="577" y="54" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">停止</ns0:text><ns0:path d="M370 167 L370 237" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="427" y="208" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">継続可</ns0:text><ns0:rect x="190" y="237" width="360" height="142" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
