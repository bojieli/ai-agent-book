<ns0:title id="title">自律 Agent の実行ループ</ns0:title><ns0:desc id="desc">推論・行動・観測とすべての終了条件を示す。タスク完了は検証を経て提出し、エラーや予算超過では進捗を保存して報告する。</ns0:desc>
