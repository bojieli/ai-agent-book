<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="85.153mm" viewBox="0 0 900 723" role="img" aria-labelledby="title desc">
<ns0:title id="title">実験 6-2 非同期 Agent の割り込みと再開</ns0:title><ns0:desc id="desc">3つの実サブプロセスタスクの進捗、キャンセル、結果の集約。</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="723" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="53" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ランタイムが3つのバックグラウンドタスクを起動</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">task_id を返し、pending 状態を保存</ns0:text><ns0:path d="M150 120 L150 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="160" width="260" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="160" width="260" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="141.74" y="193" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">タスク T1</ns0:text><ns0:text x="138.03" y="240" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tick ごとに 3% 増</ns0:text><ns0:text x="137" y="272" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">最初に完了</ns0:text><ns0:path d="M450 120 L450 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="320" y="160" width="260" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="320" y="160" width="260" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="441.74" y="193" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">タスク T2</ns0:text><ns0:text x="438.03" y="240" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tick ごとに 2% 増</ns0:text><ns0:text x="438.03" y="272" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">実測進捗 68%</ns0:text><ns0:path d="M750 120 L750 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="620" y="160" width="260" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="620" y="160" width="260" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="741.74" y="193" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">タスク T3</ns0:text><ns0:text x="738.03" y="240" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tick ごとに 1% 増</ns0:text><ns0:text x="738.03" y="272" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">実測進捗 34%</ns0:text><ns0:path d="M150 315 L150 355" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="355" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="355" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="388" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">T1 完了イベントを受信 → T2、T3 の進捗を照会</ns0:text><ns0:text x="437" y="435" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">T2 &gt; 50%：実行を継続</ns0:text><ns0:text x="437" y="467" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">T3 ≤ 50%：cancel_tool(task_id) → プロセス終了を確認</ns0:text><ns0:path d="M450 500 L450 540" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="540" width="860" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="540" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="573" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">最終状態を収集しレポートを生成</ns0:text><ns0:text x="437" y="620" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">T1、T2 は完了結果、T3 はキャンセル記録を返す</ns0:text><ns0:text x="437" y="652" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">完了イベントを元のタスク ID と関連付け、各終了状態を記録</ns0:text><ns0:defs /></ns0:svg>
