<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="92.102mm" viewBox="0 0 900 782" role="img" aria-labelledby="title desc">
<ns0:title id="title">単発検索と継続検索できる RAG</ns0:title><ns0:desc id="desc">同じ交換の質問で、最初の検索では製品シリーズが見つかる。単発検索は手元の根拠だけで答え、複数回検索なら型番と日付で規約を追加検索できる。</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="782" fill="#ffffff" y="0" />
<ns0:rect x="32" y="20" width="836" height="82" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="70" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">この製品は先月の保証規約で交換できる？</ns0:text><ns0:path d="M450 102 L450 136" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="150" y="136" width="600" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="180" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">最初に製品資料を検索</ns0:text><ns0:text x="437" y="222" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">製品シリーズは判明、先月の保証規約が不足</ns0:text><ns0:path d="M450 246 L450 276 L223 276 L223 314" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M450 276 L666 276 L666 314" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="36" y="314" width="374" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="209" y="357" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">単発検索</ns0:text><ns0:path d="M223 379 L223 419" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="479" y="314" width="374" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="652" y="357" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">追加検索は Agent が判断</ns0:text><ns0:path d="M666 379 L666 419" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="36" y="419" width="374" height="134" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="209" y="464" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">手元の根拠で回答</ns0:text><ns0:text x="210" y="512" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">製品シリーズしか確認できない</ns0:text><ns0:rect x="479" y="419" width="374" height="134" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="652" y="464" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">根拠を確認</ns0:text><ns0:text x="653" y="512" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">規約で判断できるか？</ns0:text><ns0:path d="M666 553 L666 608" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="479" y="608" width="374" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="652" y="654" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">規約不足、検索を続行</ns0:text><ns0:text x="653" y="698" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">型番と発効日で検索</ns0:text><ns0:path d="M853 669 L882 669 L882 472 L853 472" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M479 486 L442 486 L442 680 L410 680" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="36" y="608" width="374" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="209" y="653" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">検索を終了</ns0:text><ns0:text x="210" y="700" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">根拠が十分なら回答</ns0:text><ns0:text x="210" y="738" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">予算切れなら不足点を説明</ns0:text><ns0:defs /></ns0:svg>
