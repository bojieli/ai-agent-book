<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="108.356mm" viewBox="0 0 900 920" role="img" aria-labelledby="title desc">
<title id="title">音声 Agent の直列パイプライン</title><desc id="desc">収録、エンドポイント、認識、応答、合成、再生のインターフェース。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="920" fill="#ffffff" y="0" />
<rect x="100" y="20" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="20" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">音声の収録と伝送</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ブラウザ AudioWorklet → WebSocket</text><text x="450" y="132" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">音声チャンク → リサンプリング / 形式変換</text><path d="M450 165 L450 200" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="200" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="200" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="233" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">VAD とエンドポイント判定</text><text x="450" y="280" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Silero VAD：発話区間を検出</text><text x="450" y="312" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">無音しきい値と文脈 → 音声区間を確定</text><path d="M450 345 L450 380" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="380" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="380" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="413" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ASR → テキスト</text><text x="450" y="460" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Whisper / SenseVoice</text><text x="450" y="492" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">音声 → 文字起こし（終端・時刻を保持）</text><path d="M450 525 L450 560" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="560" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="560" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="593" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM → 応答テキスト</text><text x="450" y="640" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">文字起こしとタスク文脈を読み込む</text><text x="450" y="672" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">TTS で合成できるテキストを生成</text><path d="M450 705 L450 740" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="740" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="740" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="773" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">TTS と再生</text><text x="450" y="820" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fish Audio S1：テキスト → 音声チャンク</text><text x="450" y="852" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ネットワーク伝送 → 再生バッファ → スピーカー</text><defs /></svg>
