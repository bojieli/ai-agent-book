<ns0:title id="title">動的発見後のコンテキスト構造：ツール schema が軌跡の各所に散在</ns0:title><ns0:desc id="desc">株価照会と GitHub 貢献者分析で二回のツール発見を示す。新しい定義は tool_search_output とともに履歴に入り、後続リクエストでも位置を保つ。</ns0:desc>
