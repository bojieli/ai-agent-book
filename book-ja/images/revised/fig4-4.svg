<ns0:text x="444.11" y="779" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">tool_search_output</ns0:text><ns0:text x="442.68" y="809" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">list_contributors などのツールの完全な schema</ns0:text><ns0:path d="M450 824 L450 840" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="840" width="760" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="869" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Assistant → Tool Result → 返信</ns0:text><ns0:text x="437" y="899" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ツール呼び出し → 貢献者を取得 → 結果を分析</ns0:text><ns0:path d="M450 914 L450 945" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="945" width="760" height="60" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="984" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">次のターン：既存の履歴の末尾にメッセージを追記</ns0:text><ns0:defs /></ns0:svg>
