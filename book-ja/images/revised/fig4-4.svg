<ns0:text x="444.11" y="509" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Assistant → Tool Result</ns0:text><ns0:text x="437" y="539" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">get_stock_quote を呼び出す → 株価を返す</ns0:text><ns0:path d="M450 554 L450 570" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="570" width="760" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="443.9" y="599" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">User</ns0:text><ns0:text x="437" y="629" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">GitHub リポジトリの貢献者を分析</ns0:text><ns0:path d="M450 644 L450 660" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="660" width="760" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="444.11" y="689" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Assistant</ns0:text><ns0:text x="437" y="719" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tool_search_call（GitHub）</ns0:text><ns0:path d="M450 734 L450 750" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
