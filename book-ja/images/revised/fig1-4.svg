<ns0:title id="title">Agent の軌跡——多通貨集計タスクの ReAct ループ</ns0:title><ns0:desc id="desc">システムプロンプトとツール定義を安定したプレフィックスとし、各ターンで蓄積したメッセージ履歴を接続する。3 ターンでそれぞれ両替、計算、結果の提出を行う。</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="1210" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="57" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">比較的安定したプレフィックス</ns0:text><ns0:text x="444.96" y="91" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">システムプロンプト＋ツール定義：convert_currency、code_interpreter</ns0:text><ns0:rect x="110" y="135" width="770" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="488.9" y="168" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">user</ns0:text><ns0:text x="486.75" y="203" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Q1：250 万 USD；Q2：210 万 EUR；Q3：180 万 GBP</ns0:text><ns0:text x="482" y="236" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Q4：3.8 億 JPY；年間合計と四半期平均を求めよ</ns0:text><ns0:text x="46" y="320" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="25.1" font-weight="700" fill="#292929">1 回目</ns0:text><ns0:rect x="110" y="285" width="770" height="235" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="486.64" y="320" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.reasoning</ns0:text><ns0:text x="486.06" y="355" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">EUR、GBP、JPY の収入を USD に換算する</ns0:text><ns0:text x="481" y="394" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="27.0" font-weight="700" fill="#292929">assistant.tool_calls（最初の ID：convert_currency_0）</ns0:text><ns0:text x="490.61" y="430" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">convert_currency(2100000, "EUR", "USD")</ns0:text><ns0:text x="490.61" y="463" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">convert_currency(1800000, "GBP", "USD")</ns0:text><ns0:text x="490.61" y="496" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">convert_currency(380000000, "JPY", "USD")</ns0:text><ns0:rect x="110" y="535" width="770" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="486.74" y="570" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">tool · 最初の tool_call_id：convert_currency_0</ns0:text><ns0:text x="486.06" y="605" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">EUR → 2,282,608.70 USD；GBP → 2,278,481.01 USD</ns0:text><ns0:text x="486.06" y="636" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">JPY → 2,541,806.02 USD</ns0:text><ns0:text x="46" y="700" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="25.1" font-weight="700" fill="#292929">2 回目</ns0:text><ns0:rect x="110" y="670" width="770" height="235" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="486.64" y="706" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.reasoning</ns0:text><ns0:text x="487.78" y="741" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">換算結果を読み、合計して 4 で割る</ns0:text><ns0:text x="488.9" y="780" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.tool_calls → code_interpreter</ns0:text><ns0:text x="487.78" y="818" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">total = 2500000 + 2282608.70 + 2278481.01 + 2541806.02</ns0:text><ns0:text x="487.78" y="851" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">average = total / 4</ns0:text><ns0:text x="490.61" y="884" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">print(round(total, 2), round(average, 2))</ns0:text><ns0:rect x="110" y="920" width="770" height="85" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="481" y="953" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">tool：計算結果</ns0:text><ns0:text x="487.79" y="988" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">9602895.73    2400723.93</ns0:text><ns0:text x="46" y="1060" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="25.1" font-weight="700" fill="#292929">3 回目</ns0:text><ns0:rect x="110" y="1030" width="770" height="150" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="489.11" y="1065" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.content</ns0:text><ns0:text x="486.06" y="1106" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">年間総収入：9,602,895.73 USD</ns0:text><ns0:text x="486.06" y="1146" text-anchor="middle" font-family="&quot;Noto Sans CJK JP&quot;, &quot;Source Han Sans JP&quot;, &quot;Hiragino Sans&quot;, &quot;Yu Gothic&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">四半期平均収入：2,400,723.93 USD</ns0:text><ns0:path d="M495 110 L495 135" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
