<ns0:title id="title">Vòng lặp thực thi của Agent tự chủ</ns0:title><ns0:desc id="desc">Giữ suy luận, hành động, quan sát và mọi điều kiện thoát; nhiệm vụ xong thì xác minh rồi bàn giao, lỗi hoặc vượt ngân sách thì lưu tiến độ và báo cáo.</ns0:desc>
