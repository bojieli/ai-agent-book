<ns0:text x="666" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.5" font-weight="700" fill="#292929">Xác minh hoàn thành</ns0:text><ns0:text x="667" y="532" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.4" font-weight="400" fill="#292929">Kết quả · sản phẩm bắt buộc</ns0:text><ns0:path d="M680 569 L680 644" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="714" y="614" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Đạt</ns0:text><ns0:rect x="520" y="644" width="320" height="85" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
