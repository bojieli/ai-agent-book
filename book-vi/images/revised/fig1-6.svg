<text x="680" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.5" font-weight="700" fill="#292929">Xác minh hoàn thành</text><text x="680" y="532" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.4" font-weight="400" fill="#292929">Kết quả · sản phẩm bắt buộc</text><path d="M680 569 L680 644" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="727" y="614" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Đạt</text><rect x="520" y="644" width="320" height="85" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="680" y="695" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Bàn giao kết quả</text><path d="M840 509 L875 509 L875 854 L35 854 L35 706" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="450" y="819" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chưa đạt: thêm phản hồi nghiệm thu, rồi kiểm tra lại ngân sách</text><defs /></svg>
