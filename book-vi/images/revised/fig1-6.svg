<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="103.880mm" viewBox="0 0 900 882" role="img" aria-labelledby="title desc">
<title id="title">Vòng lặp thực thi của Agent tự chủ</title><desc id="desc">Giữ suy luận, hành động, quan sát và mọi điều kiện thoát; nhiệm vụ xong thì xác minh rồi bàn giao, lỗi hoặc vượt ngân sách thì lưu tiến độ và báo cáo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="882" fill="#ffffff" y="0" />
<rect x="190" y="30" width="360" height="137" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="370" y="65" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="700" fill="#292929">Kiểm tra ngân sách và lỗi</text><text x="370" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Số vòng tối đa · số lỗi</text><text x="370" y="130" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Lỗi không khôi phục</text><rect x="630" y="30" width="240" height="137" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="750" y="65" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Dừng chạy</text><text x="750" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Lưu tiến độ</text><text x="750" y="130" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Báo việc dở/</text><text x="750" y="162" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">chuyển người</text><path d="M550 80 L630 80" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="590" y="54" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Dừng</text><path d="M370 167 L370 237" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="440" y="208" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tiếp tục</text><rect x="190" y="237" width="360" height="142" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="370" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.6" font-weight="700" fill="#292929">Suy luận và quyết định</text><text x="370" y="305" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">(Reasoning)</text><text x="370" y="345" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">"Cần thêm tin"/sắp trả lời</text><path d="M275 379 L275 449" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="360" y="423" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Yêu cầu công cụ</text><rect x="90" y="449" width="370" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
