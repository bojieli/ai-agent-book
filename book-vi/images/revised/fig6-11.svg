<ns0:text x="666.03" y="968" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Articulation Brain</ns0:text><ns0:text x="662" y="1015" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Diễn đạt dựa trên đầu ra trước</ns0:text><ns0:text x="662" y="1047" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.2" font-weight="400" fill="#292929">Liên tục sinh đoạn giọng nói</ns0:text><ns0:path d="M430 1005 L470 1005" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
