<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="111.300mm" viewBox="0 0 900 945" role="img" aria-labelledby="title desc">
<title id="title">Vòng khép kín từ benchmark đến cải tiến</title><desc id="desc">Cải tiến liên tiếp trên bốn nhiệm vụ Wi-Fi của AndroidWorld.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="945" fill="#ffffff" y="0" />
<rect x="50" y="20" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="20" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Tìm manh mối trong trajectory thất bại</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bốn nhiệm vụ Wi-Fi, ba nhiệm vụ thất bại</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mô hình điều hướng lặp lại ở trang cài đặt</text><path d="M450 165 L450 205" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="205" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="205" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="238" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② H1: mô hình có biết phải đi đâu?</text><text x="450" y="285" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Đã thêm gợi ý điều hướng, vẫn không tìm thấy control</text><text x="450" y="317" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mở bảng Internet, đối chiếu với thứ mô hình thực sự thấy</text><path d="M450 350 L450 390" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="390" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="390" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="423" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ H5: mô hình có thấy control không?</text><text x="450" y="470" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.2" font-weight="400" fill="#292929">Chỉ thấy thanh trạng thái; đổi sang cây UIAutomator đầy đủ</text><text x="450" y="502" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Cả bốn nhiệm vụ đều qua, nhưng đầu vào dài hơn</text><path d="M450 535 L450 575" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="575" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="575" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="608" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ H5C: bỏ được thông tin giao diện nào?</text><text x="450" y="655" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bỏ container rỗng bị ẩn; giữ trạng thái control</text><text x="450" y="687" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Cùng lô nhiệm vụ: so tỷ lệ thành công và đầu vào</text><path d="M450 720 L450 760" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="760" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="760" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="793" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑤ Sang ứng dụng khác còn hiệu quả?</text><text x="450" y="840" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mở rộng đối chứng trong môi trường chuẩn, chạy lặp lại</text><text x="450" y="872" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">So thành công, lượng dùng, thời gian; truy lỗi mới</text><path d="M850 833 L883 833 L883 90 L850 90" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<defs /></svg>
