<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="104.822mm" viewBox="0 0 900 890" role="img" aria-labelledby="title desc">
<title id="title">Quy trình làm việc của Coding Agent</title><desc id="desc">Quy trình năm giai đoạn cùng phản hồi từ kiểm thử và review.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="890" fill="#ffffff" y="0" />
<rect x="20" y="20" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Lập tài liệu dự án</text><text x="345" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Đọc README và tài liệu kiến trúc</text><text x="345" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Glob tìm tệp nguồn, soạn chỉ dẫn dự án</text><path d="M345 165 L345 195" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="195" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="195" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Hiểu yêu cầu</text><text x="345" y="275" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tái hiện: 100 tệ đứng trước 20 tệ</text><text x="345" y="307" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Grep tìm chỗ sắp xếp, lần theo kiểu số tiền</text><path d="M345 340 L345 370" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="370" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="370" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Tài liệu thiết kế</text><text x="345" y="450" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Quyết định chuyển số tiền thành số ở đâu</text><text x="345" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Gửi review thiết kế theo quy trình dự án</text><path d="M345 515 L345 545" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="545" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="545" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="578" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ Viết mã và kiểm thử</text><text x="345" y="625" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Edit sửa logic so sánh, chạy lại ca cũ</text><text x="345" y="657" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Thử thêm số lẻ và số tiền bằng nhau</text><path d="M345 690 L345 720" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="720" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="720" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="753" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑤ Review và bàn giao</text><text x="345" y="800" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Lint; review khả năng đọc, an toàn, hiệu năng</text><text x="345" y="832" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">Cập nhật kiến trúc, kiểm tra thay đổi và bàn giao</text><path d="M670 790 L690 790 L690 617 L670 617" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="780" y="710" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Phản hồi</text><defs /></svg>
