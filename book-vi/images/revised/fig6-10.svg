<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="52.058mm" viewBox="0 0 900 442" role="img" aria-labelledby="title desc">
<title id="title">Vi lượt 200 mili giây trong tương tác song công</title><desc id="desc">Nửa trên căn theo thời gian đầu vào của người dùng và đầu ra của trợ lý. Ở ô thứ hai, người dùng chen lời khi trợ lý vẫn đang nói; đến ô thứ ba, trợ lý dừng lại. Nửa dưới trải cùng các đầu vào và đầu ra đó theo thứ tự mô hình xử lý.</desc>
