<ns0:title id="title">Vi lượt 200 mili giây trong tương tác song công</ns0:title><ns0:desc id="desc">Nửa trên căn theo thời gian đầu vào của người dùng và đầu ra của trợ lý. Ở ô thứ hai, người dùng chen lời khi trợ lý vẫn đang nói; đến ô thứ ba, trợ lý dừng lại. Nửa dưới trải cùng các đầu vào và đầu ra đó theo thứ tự mô hình xử lý.</ns0:desc>
