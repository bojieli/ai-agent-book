<ns0:title id="title">Kiến trúc tool calling với LLM cục bộ</ns0:title><ns0:desc id="desc">Tác vụ giờ và thời tiết Vancouver: client giữ tin nhắn, gọi mô hình cục bộ, điều phối hai công cụ rồi trả observation về mô hình.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="640" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="80" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="52" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Yêu cầu người dùng</ns0:text><ns0:text x="437" y="83" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tra giờ và thời tiết hiện tại ở Vancouver</ns0:text><ns0:path d="M195 100 L195 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="150" width="350" height="470" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="188.07" y="188" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Client Harness</ns0:text><ns0:text x="188.92" y="240" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">Tổ chức messages và tools</ns0:text><ns0:text x="186.06" y="289" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Lưu phản hồi, ID gọi</ns0:text><ns0:text x="182" y="395" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">Phân tích, kiểm tra tham số</ns0:text><ns0:text x="182" y="441" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Điều phối lời gọi độc lập</ns0:text><ns0:text x="182" y="537" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Nối kết quả công cụ</ns0:text><ns0:text x="182" y="583" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Gọi lại → trả lời cuối</ns0:text><ns0:rect x="520" y="150" width="360" height="190" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
