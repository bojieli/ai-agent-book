<title id="title">Kiến trúc tool calling với LLM cục bộ</title><desc id="desc">Tác vụ giờ và thời tiết Vancouver: client giữ tin nhắn, gọi mô hình cục bộ, điều phối hai công cụ rồi trả observation về mô hình.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
