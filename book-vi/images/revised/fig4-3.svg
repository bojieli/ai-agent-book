<ns0:title id="title">Tối ưu KV Cache khi nạp công cụ động</ns0:title><ns0:desc id="desc">Bên trái: sửa danh sách công cụ ở đầu khiến phải tính lại từ điểm thay đổi; bên phải: giữ nguyên tiền tố và nối kết quả khám phá vào cuối lịch sử. Việc trúng cache còn phụ thuộc chính sách của dịch vụ.</ns0:desc>
