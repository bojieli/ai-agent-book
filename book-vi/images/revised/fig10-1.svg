<ns0:title id="title">So sánh ngữ cảnh dùng chung và ngữ cảnh không dùng chung</ns0:title><ns0:desc id="desc">Chuyển vai trò khi viết script CSV và bàn giao giữa các ngữ cảnh độc lập khi dịch sách.</ns0:desc>
