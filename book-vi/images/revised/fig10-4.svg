<text x="575" y="676" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent C · tạo báo cáo</text><text x="575" y="723" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Dựng cấu trúc báo cáo</text><text x="575" y="755" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Trình bày và ghi theo yêu cầu</text><path d="M125 673 L300 673" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="658" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">3. Gọi</text><path d="M300 763 L125 763" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="798" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Báo cáo</text><defs /></svg>
