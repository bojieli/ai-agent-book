<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="101.524mm" viewBox="0 0 900 862" role="img" aria-labelledby="title desc">
<title id="title">Manager điều phối tuần tự</title><desc id="desc">Manager lần lượt gọi các thành viên thu thập, phân tích và viết, rồi nhận kết quả của từng thành viên.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="862" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Manager · lập kế hoạch và điều phối</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Công cụ: call_agent_A / call_agent_B / call_agent_C</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Công cụ phụ: search / write_file</text><text x="450" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Dựa vào kết quả trả về để chọn bước tiếp</text><path d="M125 200 L125 834" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="255" width="550" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="255" width="550" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="575" y="288" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent A · thu thập tài liệu</text><text x="575" y="335" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tìm tài liệu kỹ thuật</text><text x="575" y="367" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Trích sự kiện chính và nguồn</text><path d="M125 285 L300 285" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">1. Gọi</text><path d="M300 375 L125 375" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="410" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tài liệu</text><rect x="300" y="449" width="550" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="449" width="550" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="575" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent B · phân tích dữ liệu</text><text x="575" y="529" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">So sánh phương án và số liệu</text><text x="575" y="561" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Rút kết luận kèm căn cứ</text><path d="M125 479 L300 479" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="464" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">2. Gọi</text><path d="M300 569 L125 569" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="604" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Phân tích</text><rect x="300" y="643" width="550" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
