<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="106.000mm" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<ns0:title id="title">Hai vòng lặp: thực thi trực tuyến và tiến hóa ngoại tuyến</ns0:title><ns0:desc id="desc">Bên trái truy vấn theo phiên bản hiện hành và chờ biên nhận, bên phải học từ nhật ký. Phiên bản mới qua kiểm chứng được dùng cho các nhiệm vụ sau.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="900" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="360" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="186" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Thực thi trực tuyến</ns0:text><ns0:text x="187" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.8" font-weight="400" fill="#292929">Xử lý theo bản hiện hành</ns0:text><ns0:text x="187" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">Ghi hành động, biên nhận</ns0:text><ns0:text x="187" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Xong thì báo người dùng</ns0:text><ns0:rect x="520" y="20" width="360" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="520" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="686" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Tiến hóa ngoại tuyến</ns0:text><ns0:text x="687" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.8" font-weight="400" fill="#292929">Gom quỹ đạo và chẩn đoán</ns0:text><ns0:text x="687" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">Tìm nguyên nhân gốc chung</ns0:text><ns0:rect x="20" y="350" width="360" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="350" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="186" y="383" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Chờ tiến triển hồ sơ</ns0:text><ns0:text x="187" y="430" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.4" font-weight="400" fill="#292929">Nhận thông báo đổi trạng thái,</ns0:text><ns0:text x="187" y="462" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.6" font-weight="400" fill="#292929">hoặc đến giờ hẹn thì tra lại.</ns0:text><ns0:path d="M120 220 L120 350" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="52" y="292" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Đang</ns0:text><ns0:text x="52" y="323.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">xử lý</ns0:text><ns0:path d="M278 350 L278 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="321" y="312" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Đánh thức</ns0:text><ns0:path d="M380 120 L520 120" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="437" y="95" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Nhật ký</ns0:text><ns0:rect x="520" y="270" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="520" y="270" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="686" y="303" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Sửa đổi ứng viên</ns0:text><ns0:text x="687" y="350" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tri thức · chỉ dẫn</ns0:text><ns0:text x="687" y="382" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chương trình · tham số</ns0:text><ns0:path d="M700 220 L700 270" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M700 435 L700 490" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="520" y="490" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="520" y="490" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="686" y="523" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Kiểm chứng độc lập</ns0:text><ns0:text x="687" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.1" font-weight="400" fill="#292929">Nhiệm vụ mới và năng lực cũ</ns0:text><ns0:text x="687" y="602" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.1" font-weight="400" fill="#292929">Hồi quy và kiểm tra an toàn</ns0:text><ns0:path d="M520 575 L485 575 L485 352 L520 352" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="421" y="460" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sửa lại</ns0:text><ns0:path d="M700 655 L700 710" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="520" y="710" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="520" y="710" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="686" y="743" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Phát hành và giám sát</ns0:text><ns0:text x="687" y="790" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Phát hành dần · giám sát</ns0:text><ns0:text x="687" y="822" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Lên bản ổn định / rollback</ns0:text><ns0:path d="M520 792 L8 792 L8 120 L20 120" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="247" y="775" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Nhiệm vụ sau dùng phiên bản mới</ns0:text><ns0:defs /></ns0:svg>
