<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="98.933mm" viewBox="0 0 900 840" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc cuốn sách: xây dựng Agent và nâng cao năng lực Agent</title><desc id="desc">Chương 1 đến 6 dựng phương pháp xây dựng, Chương 7 cung cấp phản hồi đánh giá, Chương 8 đến 10 nâng cao năng lực qua tham số, cập nhật hệ thống và cộng tác.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="840" fill="#ffffff" y="0" />
<rect x="20" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="220" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Phần 1: Xây dựng Agent</text><rect x="480" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="680" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Phần 2: Cải thiện Agent</text><text x="220" y="138" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Chương 1 Nhập môn AI Agent</text><text x="220" y="180" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mô hình gọi công cụ thế nào?</text><path d="M20 224 L420 224" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="262" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.3" font-weight="700" fill="#292929">Chương 2 Context Engineering</text><text x="220" y="304" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mỗi quyết định cần thông tin gì?</text><path d="M20 348 L420 348" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="386" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Chương 3 Bộ nhớ và tri thức</text><text x="220" y="428" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tìm lại chuyện đã bàn thế nào?</text><path d="M20 472 L420 472" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="510" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Chương 4 Công cụ</text><text x="220" y="552" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tra trạng thái, làm thủ tục ra sao?</text><path d="M20 596 L420 596" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="634" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Chương 5 Coding Agent</text><text x="220" y="666" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">và Agent đa dụng</text><text x="220" y="706" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Lập trình để tự làm được không?</text><path d="M20 720 L420 720" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="758" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Chương 6 Tương tác</text><text x="220" y="800" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Người dùng chen ngang thì sao?</text><rect x="480" y="110" width="400" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="680" y="153" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Chương 7 Đánh giá Agent</text><text x="680" y="204" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sai ở đâu? Sửa có hiệu quả?</text><path d="M680 225 L680 247 L500 247 L500 747" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M500 347 L522 347" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="282" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="328" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.6" font-weight="700" fill="#292929">Chương 8 Hậu huấn luyện</text><text x="701" y="376" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21" font-weight="400" fill="#292929">Huấn luyện để cập nhật mô hình?</text><path d="M500 547 L522 547" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="482" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="514" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Chương 9</text><text x="701" y="548" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Tiến hóa liên tục</text><text x="701" y="590" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21" font-weight="400" fill="#292929">Học từ kinh nghiệm chạy thế nào?</text><path d="M500 747 L522 747" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="682" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="714" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Chương 10</text><text x="701" y="748" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Cộng tác đa Agent</text><text x="701" y="790" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21" font-weight="400" fill="#292929">Chia việc, bàn giao thế nào?</text><defs /></svg>
