<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="108.356mm" viewBox="0 0 900 920" role="img" aria-labelledby="title desc">
<title id="title">Pipeline tuần tự của Agent giọng nói</title><desc id="desc">Các giao diện thu âm, điểm kết thúc, nhận dạng, trả lời, tổng hợp và phát.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="920" fill="#ffffff" y="0" />
<rect x="100" y="20" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="20" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Thu và truyền âm thanh</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">AudioWorklet trình duyệt → WebSocket</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Khối âm thanh → lấy mẫu lại / đổi định dạng</text><path d="M450 165 L450 200" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="200" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="200" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="233" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">VAD và logic điểm kết thúc</text><text x="450" y="280" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Silero VAD: phát hiện đoạn có tiếng nói</text><text x="450" y="312" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">Ngưỡng im lặng và ngữ cảnh → gửi một đoạn âm thanh</text><path d="M450 345 L450 380" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="380" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="380" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="413" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ASR → văn bản</text><text x="450" y="460" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Whisper / SenseVoice</text><text x="450" y="492" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.0" font-weight="400" fill="#292929">Âm thanh → bản ghi; giữ điểm kết thúc, mốc thời gian</text><path d="M450 525 L450 560" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="560" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="560" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="593" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM → văn bản trả lời</text><text x="450" y="640" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Đọc bản ghi và ngữ cảnh tác vụ</text><text x="450" y="672" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sinh văn bản để TTS tổng hợp</text><path d="M450 705 L450 740" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="740" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="740" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="773" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">TTS và phát</text><text x="450" y="820" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fish Audio S1: văn bản → khối âm thanh</text><text x="450" y="852" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Truyền mạng → bộ đệm phát → loa</text><defs /></svg>
