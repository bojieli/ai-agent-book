<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="121.311mm" viewBox="0 0 900 1030" role="img" aria-labelledby="title desc">
<title id="title">Cấu trúc ngữ cảnh sau khám phá động: schema công cụ rải rác khắp trajectory</title><desc id="desc">Hai lượt khám phá công cụ, với ví dụ tra giá cổ phiếu và phân tích người đóng góp GitHub. Định nghĩa mới đi vào lịch sử cùng tool_search_output và giữ nguyên vị trí trong các yêu cầu sau.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
