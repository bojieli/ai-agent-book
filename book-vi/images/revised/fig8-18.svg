<ns0:title id="title">Vòng lặp gọi công cụ và huấn luyện của AWorld-train</ns0:title><ns0:desc id="desc">Nửa trên là tương tác công cụ trong một trajectory, nửa dưới là cập nhật chiến lược sau khi thu thập một lô trajectory.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="805" fill="#ffffff" y="0" />
<ns0:text x="435" y="40" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.2" font-weight="700" fill="#292929">Một nhiệm vụ: cùng một chiến lược có thể gọi công cụ liên tiếp</ns0:text><ns0:rect x="30" y="82" width="245" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="30" y="82" width="245" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="143.48" y="115" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">AgentLoop</ns0:text><ns0:text x="139.5" y="162" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chiến lược</ns0:text><ns0:text x="139.5" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chọn hành động</ns0:text><ns0:rect x="625" y="82" width="245" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="625" y="82" width="245" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="733.5" y="115" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Sandbox MCP</ns0:text><ns0:text x="734.5" y="162" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">Thực thi công cụ</ns0:text><ns0:text x="734.5" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.3" font-weight="400" fill="#292929">Duy trì trạng thái</ns0:text><ns0:text x="437" y="95" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Lời gọi và tham số</ns0:text><ns0:path d="M275 115 L625 115" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="437" y="161" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kết quả hoặc lỗi</ns0:text><ns0:path d="M625 184 L275 184" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M150 227 L150 370" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="293" y="293" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Nhiệm vụ kết thúc, nộp trajectory</ns0:text><ns0:text x="548" y="341" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">Một lô: thu thập, chấm điểm, huấn luyện</ns0:text><ns0:rect x="30" y="370" width="385" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="30" y="370" width="385" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="208.5" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Lớp thích ứng VeRL</ns0:text><ns0:text x="209.5" y="450" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Gom trajectory lấy mẫu song song</ns0:text><ns0:text x="209.5" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tính thưởng, tạo mẫu</ns0:text><ns0:rect x="495" y="370" width="375" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="495" y="370" width="375" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="668.5" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Backend huấn luyện</ns0:text><ns0:text x="672.85" y="450" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Dùng GRPO hoặc PPO</ns0:text><ns0:text x="669.5" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">Cập nhật tham số chiến lược</ns0:text><ns0:path d="M415 440 L495 440" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M680 520 L680 570 L15 570 L15 150 L30 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="427" y="555" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Lô nhiệm vụ sau dùng chiến lược đã cập nhật</ns0:text><ns0:rect x="30" y="618" width="840" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="30" y="618" width="840" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="651" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.8" font-weight="700" fill="#292929">Thời gian trong bài báo: chạy tuần tự một nút → chạy phân tán</ns0:text><ns0:text x="437" y="698" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Thu thập trajectory: 7,695 giây → 525 giây (khoảng 14.6 lần)</ns0:text><ns0:text x="437" y="730" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Cập nhật tham số: cả hai nhóm đều 144 giây</ns0:text><ns0:defs /></ns0:svg>
