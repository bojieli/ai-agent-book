<ns0:title id="title">Tương tác vòng kín giữa Agent và Environment, cùng cấu trúc Model–Harness bên trong Agent</ns0:title><ns0:desc id="desc">Agent gồm Model và Harness đặt song song. Harness tổ chức ngữ cảnh, điều phối công cụ và quản lý vận hành; môi trường nhận hành động, cập nhật trạng thái và trả về quan sát.</ns0:desc>
