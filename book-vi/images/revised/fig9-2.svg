<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="102.113mm" viewBox="0 0 900 867" role="img" aria-labelledby="title desc">
<title id="title">Xác minh quỹ đạo ba tầng từ kết quả môi trường đến LLM Rubric</title><desc id="desc">Ví dụ: đối chiếu từng mục lời cam kết hoàn toàn bộ tiền của nhân viên với trạng thái nghiệp vụ, quyền hạn, thời hạn và câu trả lời.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="867" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Xem xét cùng một lần hoàn tiền</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Khách đòi hoàn đủ; nhân viên đáp “đã hoàn đủ, bảy ngày về”.</text><rect x="20" y="190" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Xác minh kết quả</text><text x="235" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hồ sơ đơn: chỉ hoàn một phần</text><path d="M450 248 L502 248" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="190" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="248" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="400" fill="#292929">Chưa hoàn xong toàn bộ tiền</text><rect x="20" y="340" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="340" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="373" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Xác minh quá trình</text><text x="235" y="420" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.2" font-weight="400" fill="#292929">Nhật ký: đã gửi yêu cầu hoàn tiền</text><path d="M450 398 L502 398" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="340" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="398" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Còn phải đối chiếu quyền</text><text x="691" y="429.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">và thời hạn tiền về</text><rect x="20" y="490" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="490" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="523" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Chất lượng · LLM Rubric</text><text x="235" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Nguyên văn: hứa “hoàn đủ”, “bảy ngày”</text><path d="M450 548 L502 548" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="490" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="548" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Điểm diễn đạt không thay</text><text x="691" y="579.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">được việc đối chiếu đơn</text><rect x="20" y="641" width="860" height="198" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="641" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="674" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ghi vào đánh giá quỹ đạo, chuyển cho chẩn đoán sau</text><text x="450" y="721" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Kết quả: hoàn thành một phần; nhãn lỗi: cam kết không khớp số tiền thực</text><text x="450" y="753" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.1" font-weight="400" fill="#292929">Vị trí bằng chứng: đơn hàng, bản ghi thao tác và nguyên văn lời nhân viên</text><text x="450" y="785" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Chờ xác minh: căn cứ cho “bảy ngày”; giữ bản ghi để kiểm tra độc lập</text><defs /></svg>
