<ns0:title id="title">Cơ chế tính điểm BM25</ns0:title><ns0:desc id="desc">Cố định các điều kiện khác, lần lượt quan sát tần suất từ, độ dài tài liệu và tần suất tài liệu làm thay đổi điểm của một từ truy vấn ra sao.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="540" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="121" y="104" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Bão hòa TF</ns0:text><ns0:text x="552" y="58" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">k₁ = 1.5, tài liệu dài đúng mức trung bình</ns0:text><ns0:text x="552" y="103" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Xuất hiện 1, 2, 3 lần</ns0:text><ns0:text x="556.74" y="150" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Hệ số TF: 1.00 → 1.43 → 1.67</ns0:text><ns0:rect x="20" y="190" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="190" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="121" y="274" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Chuẩn hóa</ns0:text><ns0:text x="121" y="308.16" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">độ dài</ns0:text><ns0:text x="557.78" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">k₁ = 1.5, b = 0.75, tần suất từ là 1</ns0:text><ns0:text x="552" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Độ dài tăng từ trung bình lên gấp đôi</ns0:text><ns0:text x="556.74" y="320" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Hệ số TF: 1.00 → 0.69</ns0:text><ns0:rect x="20" y="360" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="360" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="121" y="444" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">IDF</ns0:text><ns0:text x="552" y="398" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kho ngữ liệu có 10 tài liệu</ns0:text><ns0:text x="552" y="443" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">"mô hình" ở 3 bài, "chưng cất" ở 2 bài</ns0:text><ns0:text x="556.74" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">IDF: "mô hình" 0.762, "chưng cất" 1.224</ns0:text><ns0:defs /></ns0:svg>
