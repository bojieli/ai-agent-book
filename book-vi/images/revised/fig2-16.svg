<title id="title">So sánh các chiến lược nén ngữ cảnh</title><desc id="desc">Tổng hợp sáu lần chạy đã có; mức dùng token, tỷ lệ ký tự, số vòng và trạng thái trả lời cuối được trình bày theo cột.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
