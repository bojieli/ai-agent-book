<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="93.044mm" viewBox="0 0 900 790" role="img" aria-labelledby="title desc">
<title id="title">So sánh kiến trúc Q-learning và LLM Agent trong trò chơi truy tìm kho báu</title><desc id="desc">Hai nhánh quyết định trong cùng một môi trường, cùng hai điều kiện đo: đánh giá sau huấn luyện và lần chạy đầu tiên.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="790" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Q-learning Agent</text><text x="225" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Mã hóa phòng, vật phẩm, cửa, lính gác</text><text x="225" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.8" font-weight="400" fill="#292929">Bảng Q lần này ghi 142 trạng thái</text><text x="225" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Khám phá hoặc tra bảng Q</text><rect x="470" y="20" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM Agent · Kimi K3</text><text x="675" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Đọc mô tả phòng, hành động</text><text x="675" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">Lưu tối đa 50 mục kinh nghiệm</text><text x="675" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Trả hành động bằng văn bản</text><path d="M225 200 L225 240" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 200 L675 240" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="240" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="240" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="700" fill="#292929">Chọn hành động theo giá trị Q</text><text x="225" y="320" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ví dụ: go north</text><text x="225" y="352" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Thực thi “đi về phía bắc”</text><rect x="470" y="240" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="240" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.6" font-weight="700" fill="#292929">Lấy hành động từ câu trả lời</text><text x="675" y="320" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ACTION: take red key</text><text x="675" y="352" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Thực thi “nhặt chìa khóa”</text><path d="M225 380 L225 405 L675 405 L675 380" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 405 L450 440" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="440" width="860" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="440" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="473" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Cùng một môi trường truy tìm kho báu</text><text x="450" y="520" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="400" fill="#292929">Vị trí · vật phẩm · cửa · lính gác → hành động → quan sát, thưởng</text><path d="M20 490 L7 490 L7 110 L20 110" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M880 490 L893 490 L893 110 L880 110" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="590" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="590" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="623" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.1" font-weight="700" fill="#292929">Đánh giá tham lam sau huấn luyện</text><text x="225" y="670" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.0" font-weight="400" fill="#292929">Cố định bảng Q sau 10,000 ván</text><text x="225" y="702" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">Đo riêng 100 ván, qua màn toàn bộ</text><text x="225" y="734" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Trung bình 12 bước mỗi ván</text><rect x="470" y="590" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="590" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="623" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="700" fill="#292929">Trajectory thực đo của ván đầu</text><text x="675" y="670" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bước 9: ghép kiếm bạc</text><text x="675" y="702" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bước 14: hạ lính gác mạnh</text><text x="675" y="734" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bước 17: lấy được kho báu</text><defs /></svg>
