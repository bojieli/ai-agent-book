<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="86.449mm" viewBox="0 0 900 734" role="img" aria-labelledby="title desc">
<ns0:title id="title">Ba chiến lược xử lý sự kiện bất đồng bộ</ns0:title><ns0:desc id="desc">Từ sự kiện mới đến thời điểm xử lý, rồi so sánh tác vụ cũ và sự kiện mới đi đâu.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="734" fill="#ffffff" y="0" />
<ns0:text x="436" y="48" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Sự kiện mới đến, tác vụ đang chạy xử lý ra sao?</ns0:text><ns0:rect x="20" y="82" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="111" y="177" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Hủy</ns0:text><ns0:rect x="240" y="82" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="546" y="122" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Người dùng nói “dừng lại”</ns0:text><ns0:text x="547" y="175" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ngừng phát lệnh mới, yêu cầu hủy</ns0:text><ns0:text x="547" y="231" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.5" font-weight="400" fill="#292929">Xác nhận đã chạy tới bước nào, ghi trạng thái cuối</ns0:text><ns0:rect x="20" y="302" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="111" y="397" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Xếp hàng</ns0:text><ns0:rect x="240" y="302" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="546" y="342" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Người dùng thêm “chỉ xem tháng qua”</ns0:text><ns0:text x="547" y="395" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Tìm kiếm chưa xong, đưa yêu cầu bổ sung vào hàng đợi</ns0:text><ns0:text x="547" y="451" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.8" font-weight="400" fill="#292929">Có kết quả tìm kiếm, sắp xếp theo khoảng thời gian mới</ns0:text><ns0:rect x="20" y="522" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="111" y="617" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Song song</ns0:text><ns0:rect x="240" y="522" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="546" y="562" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.4" font-weight="700" fill="#292929">Đang phân tích nền, người dùng hỏi thời tiết</ns0:text><ns0:text x="547" y="615" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.3" font-weight="400" fill="#292929">Mở ngữ cảnh riêng xem thời tiết, tác vụ chính chạy tiếp</ns0:text><ns0:text x="547" y="671" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Lưu riêng câu trả lời thời tiết và kết quả phân tích</ns0:text><ns0:defs /></ns0:svg>
