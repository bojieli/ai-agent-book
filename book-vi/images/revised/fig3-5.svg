<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="111.889mm" viewBox="0 0 900 950" role="img" aria-labelledby="title desc">
<title id="title">Quy trình truy vấn RAG: truy xuất, tăng cường và sinh</title><desc id="desc">Câu hỏi hoàn tiền qua truy xuất lấy được đoạn chính sách và đoạn thao tác; các đoạn cùng câu hỏi tạo thành đầu vào của mô hình để sinh câu trả lời cụ thể.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="950" fill="#ffffff" y="0" />
<rect x="20" y="20" width="290" height="110" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="165" y="58" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Câu hỏi</text><text x="165" y="99" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hoàn tiền thế nào?</text><rect x="440" y="20" width="440" height="110" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="660" y="58" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Cơ sở tri thức</text><text x="660" y="99" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.2" font-weight="400" fill="#292929">Chính sách · hướng dẫn · thời gian</text><path d="M165 130 L165 175 L290 175" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M660 130 L660 175 L610 175" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="290" y="145" width="320" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="183" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Truy xuất Top-k</text><text x="450" y="222" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Vector dày / BM25</text><path d="M450 245 L450 280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="280" width="860" height="195" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="317" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Kết quả truy xuất</text><text x="450" y="361" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">① Trong 7 ngày sau khi nhận hàng được hoàn toàn bộ, cần mã đơn.</text><text x="450" y="404" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tiền về trong 3–5 ngày làm việc.</text><text x="450" y="447" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">② Đơn hàng của tôi → chọn đơn → yêu cầu hoàn tiền.</text><path d="M450 475 L450 515" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="515" width="860" height="125" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="554" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Đầu vào mô hình đã tăng cường</text><text x="450" y="601" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chỉ dẫn + câu hỏi + các đoạn truy xuất kèm nguồn</text><path d="M450 640 L450 675" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="290" y="675" width="320" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="717" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.7" font-weight="700" fill="#292929">LLM sinh câu trả lời</text><path d="M450 740 L450 780" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="780" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="818" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Câu trả lời</text><text x="450" y="861" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.8" font-weight="400" fill="#292929">Trong 7 ngày sau khi nhận, vào "Đơn hàng của tôi" để yêu cầu hoàn tiền.</text><text x="450" y="900" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Khi yêu cầu, cung cấp mã đơn; tiền dự kiến về trong 3–5 ngày làm việc.</text><defs /></svg>
