<rect x="20" y="195" width="630" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="335" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Kiến trúc sư</text><text x="335" y="275" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kiến trúc: FastAPI + React</text><text x="335" y="307" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Giao diện: OpenAPI · Schema cơ sở dữ liệu</text><path d="M335 340 L335 370" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
