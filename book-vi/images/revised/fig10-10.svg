<text x="450" y="208" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Luồng ký ức · ví dụ các mục</text><text x="450" y="255" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">08:30 mở quán: quan trọng 4, gần đây 0,60</text><text x="450" y="287" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">09:15 trò chuyện với Klaus: quan trọng 5, gần đây 0,70</text><text x="450" y="319" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">10:00 lên kế hoạch tiệc: quan trọng 9, gần đây 0,80</text><text x="450" y="351" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">11:30 mời Maria: quan trọng 8, gần đây 0,85</text><text x="450" y="383" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">14:00 nhờ Maria giúp: quan trọng 7, gần đây 0,90</text><text x="450" y="415" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Truy xuất: kết hợp độ gần đây, độ quan trọng và độ liên quan</text><path d="M450 455 L450 475 L225 475 L225 500" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 475 L675 475 L675 500" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
