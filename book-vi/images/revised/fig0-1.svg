<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="80.089mm" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
<title id="title">Agent = LLM + ngữ cảnh + công cụ</title><desc id="desc">Bắt đầu từ một yêu cầu về hóa đơn, đọc từ trên xuống. Mô hình quyết định tra hóa đơn trước, công cụ trả về chi tiết; chi tiết đi vào ngữ cảnh, mô hình dựa vào đó quyết định bước tiếp theo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="680" fill="#ffffff" y="0" />
<rect x="24" y="20" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="20" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="76" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ngữ cảnh</text><text x="544" y="76" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">Người dùng yêu cầu: tìm khoản bị tính thừa tháng này</text><path d="M544 110 L544 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="154" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="154" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="210" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM</text><text x="544" y="210" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Quyết định tra hóa đơn tháng này trước</text><path d="M544 244 L544 284" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
