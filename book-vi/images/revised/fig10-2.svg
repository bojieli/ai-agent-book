<ns0:title id="title">Cấu trúc gắn kết bốn vùng của hệ thống tệp ảo cho Agent</ns0:title><ns0:desc id="desc">Giao diện tệp thống nhất, bốn vùng với quyền và vòng đời khác nhau, cùng lối vào cho người dùng và tài nguyên bên ngoài.</ns0:desc>
