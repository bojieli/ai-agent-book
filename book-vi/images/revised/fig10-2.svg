<ns0:text x="215.98" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="700" fill="#292929">Vùng làm việc riêng · Scratchpad</ns0:text><ns0:text x="212" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tệp tạm · bản nháp · nhật ký</ns0:text><ns0:text x="212" y="514" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.8" font-weight="400" fill="#292929">Mặc định chỉ Agent sở hữu đọc ghi</ns0:text><ns0:text x="212" y="546" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">Dọn theo phiên chạy hoặc lưu trữ</ns0:text><ns0:text x="212" y="578" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mỗi phiên bản một thư mục</ns0:text><ns0:rect x="470" y="370" width="410" height="237" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="370" width="410" height="80" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="671.82" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Không gian chung · Shared</ns0:text><ns0:text x="666.87" y="435" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Workspace</ns0:text><ns0:text x="662" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">Thuật ngữ · mã · sản phẩm giao</ns0:text><ns0:text x="662" y="514" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.8" font-weight="400" fill="#292929">Thành viên, người dùng có quyền</ns0:text><ns0:text x="662" y="546" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Lưu bền theo tác vụ</ns0:text><ns0:text x="667.8" y="578" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Kiểm tra phiên bản / khóa / worktree</ns0:text><ns0:rect x="20" y="652" width="410" height="205" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="652" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="685" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Tài nguyên ngoài gắn vào</ns0:text><ns0:text x="217.07" y="732" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Google Drive / Notion</ns0:text><ns0:text x="221.19" y="764" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.1" font-weight="400" fill="#292929">Bộ chuyển đổi gọi API hệ thống gốc</ns0:text><ns0:text x="212" y="796" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Đọc hoặc ghi lại theo quyền</ns0:text><ns0:text x="212" y="828" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Hết giờ · bộ đệm · kiểm phiên bản</ns0:text><ns0:rect x="470" y="652" width="410" height="205" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="652" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="685" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="700" fill="#292929">Tài nguyên có sẵn của hệ thống</ns0:text><ns0:text x="662" y="732" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">Skills · mẫu · tài liệu hướng dẫn</ns0:text><ns0:text x="662" y="764" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.9" font-weight="400" fill="#292929">Phiên bản cố định · chia sẻ chỉ đọc</ns0:text><ns0:text x="662" y="796" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.6" font-weight="400" fill="#292929">Mục lục trước, đọc chi tiết khi cần</ns0:text><ns0:text x="662" y="828" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.1" font-weight="400" fill="#292929">Đổi phiên bản, tác vụ vẫn khớp</ns0:text><ns0:path d="M450 325 L450 622 L225 622 L225 652" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
