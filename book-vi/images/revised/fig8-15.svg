<ns0:title id="title">Phân bổ tín dụng trong tương tác nhiều lượt</ns0:title><ns0:desc id="desc">Năm bước của cùng một chuyến điều hướng xếp theo hàng, so sánh điểm từng bước khi chỉ thưởng ở điểm cuối và khi thêm phản hồi quá trình.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="545" fill="#ffffff" y="0" />
<ns0:text x="435" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">Cùng một chuyến điều hướng, hai phương án thưởng</ns0:text><ns0:text x="88" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Bước</ns0:text><ns0:text x="300" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Quan sát, hành động</ns0:text><ns0:text x="576" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Thưởng cuối</ns0:text><ns0:text x="770" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Có quá trình</ns0:text><ns0:path d="M32 146 L868 146" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="94.51" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">1</ns0:text><ns0:text x="300.5" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">Nhìn phía trước, rẽ trái</ns0:text><ns0:text x="582.51" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">0</ns0:text><ns0:text x="776.51" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">+1</ns0:text><ns0:path d="M32 218 L868 218" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="94.51" y="266" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">2</ns0:text><ns0:text x="300.5" y="266" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">Đọc biển, xác nhận hướng</ns0:text><ns0:text x="582.51" y="266" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">0</ns0:text><ns0:text x="776.51" y="266" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">+1</ns0:text><ns0:path d="M32 290 L868 290" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="93.74" y="338" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">3</ns0:text><ns0:text x="300" y="338" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Lỡ ngã tư, đi thẳng tiếp</ns0:text><ns0:text x="581.74" y="338" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">0</ns0:text><ns0:text x="775.74" y="338" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">−1</ns0:text><ns0:path d="M32 362 L868 362" fill="none" stroke="#333333" stroke-width="1.8" />
