<ns0:text x="94.51" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">5</ns0:text><ns0:text x="300.5" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">Tới đích, kết thúc</ns0:text><ns0:text x="582.51" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">+10</ns0:text><ns0:text x="776.51" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">+10</ns0:text><ns0:path d="M32 505 L868 505" fill="none" stroke="#333333" stroke-width="1.8" />
