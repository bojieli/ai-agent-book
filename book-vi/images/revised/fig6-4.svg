<ns0:title id="title">Thí nghiệm 6-1 Kiến trúc Agent hướng sự kiện</ns0:title><ns0:desc id="desc">Ví dụ xử lý email cùng các giao diện sự kiện, công cụ và lưu trữ có thể mở rộng.</ns0:desc>
