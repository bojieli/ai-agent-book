<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="81.620mm" viewBox="0 0 900 693" role="img" aria-labelledby="title desc">
<title id="title">Chu trình nhận thức-suy nghĩ-hành động của Computer Use Agent</title><desc id="desc">Chụp màn hình, quyết định hành động, thực thi và observation mới quay về.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="693" fill="#ffffff" y="0" />
<rect x="65" y="20" width="770" height="135" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="65" y="20" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Thu nhận quan sát</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ảnh chụp màn hình desktop / trình duyệt / ứng dụng</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ghi kích thước màn hình và trạng thái giao diện</text><path d="M450 155 L450 190" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="65" y="190" width="770" height="135" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="65" y="190" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Mô hình quyết định</text><text x="450" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Vào: ảnh chụp + tác vụ + lịch sử, trạng thái hiện tại</text><text x="450" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ví dụ ra: bấm ô địa chỉ nhận click(512, 250)</text><path d="M450 325 L450 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="65" y="360" width="770" height="170" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="65" y="360" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="393" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Thực thi hành động</text><text x="450" y="440" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tầng công cụ kiểm tra, điều phối → xdotool / Playwright</text><text x="450" y="472" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chuột: di, bấm, kéo · Bàn phím: gõ, tổ hợp phím</text><text x="450" y="504" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Cuộn: đổi khung nhìn · Chờ: nhận phản hồi giao diện</text><path d="M450 530 L450 565" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="65" y="565" width="770" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="65" y="565" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="598" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ Đọc trạng thái sau hành động</text><text x="450" y="645" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23" font-weight="400" fill="#292929">Chụp lại: ô địa chỉ đã nhận tiêu điểm, hay bật ra hộp đăng nhập?</text><path d="M65 615 L25 615 L25 85 L65 85" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<defs /></svg>
