<ns0:text x="363" y="650" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.9" font-weight="400" fill="#292929">Tra bảng để chọn hành động</ns0:text><ns0:text x="363" y="705" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">Cập nhật Q theo thưởng</ns0:text><ns0:rect x="554" y="605" width="325" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="703" y="650" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.7" font-weight="400" fill="#292929">Phân tích, chọn hành động</ns0:text><ns0:text x="703" y="705" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chỉnh theo phản hồi</ns0:text><ns0:rect x="20" y="770" width="178" height="182" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="95" y="882" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.8" font-weight="700" fill="#292929">Chuyển giao,</ns0:text><ns0:text x="95" y="908.645" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.8" font-weight="700" fill="#292929">chi phí</ns0:text><ns0:rect x="214" y="770" width="325" height="182" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
