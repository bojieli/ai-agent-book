<ns0:text x="95" y="190" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.2" font-weight="700" fill="#292929">Hành động</ns0:text><ns0:rect x="214" y="110" width="325" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="363" y="155" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chọn từ bảng Q</ns0:text><ns0:text x="363" y="210" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">Đi / nhặt / đánh / ghép</ns0:text><ns0:rect x="554" y="110" width="325" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="703" y="155" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">Suy luận bằng lời trước</ns0:text><ns0:text x="703" y="210" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">Cuối cùng ghi hành động</ns0:text><ns0:rect x="20" y="275" width="178" height="150" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="95" y="355" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="700" fill="#292929">Chiến lược</ns0:text><ns0:text x="95" y="384.656" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="700" fill="#292929">ban đầu</ns0:text><ns0:rect x="214" y="275" width="325" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
