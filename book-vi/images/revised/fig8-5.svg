<ns0:title id="title">So sánh RL cổ điển và LLM Agent hiện đại</ns0:title><ns0:desc id="desc">Lấy trò truy tìm kho báu làm ví dụ, đối chiếu năm khía cạnh thiết kế và chi phí vận hành của hai loại Agent.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="980" fill="#ffffff" y="0" />
<ns0:rect x="214" y="20" width="325" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
