<ns0:text x="703" y="815" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">Thích nghi qua chỉ dẫn</ns0:text><ns0:text x="703" y="902" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ván đầu ≈ 7 phút</ns0:text><ns0:defs /></ns0:svg>
