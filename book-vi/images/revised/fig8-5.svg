<ns0:text x="369.92" y="485" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">room / items / doors</ns0:text><ns0:text x="363" y="540" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.3" font-weight="400" fill="#292929">Mã hóa làm chỉ mục bảng Q</ns0:text><ns0:rect x="554" y="440" width="325" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
