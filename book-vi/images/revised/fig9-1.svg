<ns0:rect x="70" y="518" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="551" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Kiểm chứng và phát hành</ns0:text><ns0:text x="437" y="598" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Nhiệm vụ độc lập · hồi quy · phát hành dần · giám sát · rollback</ns0:text><ns0:path d="M830 583 L865 583 L865 718 L35 718 L35 85 L70 85" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
