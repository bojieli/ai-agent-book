<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="126.847mm" viewBox="0 0 900 1077" role="img" aria-labelledby="title desc">
<ns0:title id="title">Đường ống trích xuất kiến thức có cấu trúc</ns0:title><ns0:desc id="desc">Từ tư liệu vụ án phát hiện các trường dạng mô-đun, trích xuất bản ghi có cấu trúc, qua mã hóa, chuẩn hóa và phân cụm tạo nguyên mẫu, rồi giải thích trọng số đặc trưng theo chênh lệch tâm cụm.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="1077" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="397" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Giai đoạn 1: trích xuất và cấu trúc hóa</ns0:text><ns0:rect x="40" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="141" y="131" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Bản án gốc</ns0:text><ns0:text x="147.78" y="173" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">CAIL2018</ns0:text><ns0:text x="142" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mẫu theo tội</ns0:text><ns0:path d="M270 165 L335 165" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="335" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="131" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="700" fill="#292929">LLM tìm yếu tố</ns0:text><ns0:text x="437" y="173" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Gom trường</ns0:text><ns0:text x="437" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.4" font-weight="400" fill="#292929">Quy định giá trị</ns0:text><ns0:text x="437" y="235" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">và khi thiếu</ns0:text><ns0:path d="M565 165 L630 165" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="630" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="731" y="131" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Bản ghi</ns0:text><ns0:text x="737.8" y="173" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tự thú: true</ns0:text><ns0:text x="732" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">Bồi thường: 500k</ns0:text><ns0:text x="732" y="265" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Thương tích: nặng</ns0:text><ns0:rect x="40" y="317" width="820" height="75" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="349" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Schema mô-đun: trường chung + mở rộng theo tội danh</ns0:text><ns0:text x="437" y="379" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">Tự thú / bồi thường / tiền án; trộm → số tiền, thương tích → mức độ</ns0:text><ns0:path d="M450 417 L450 457" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="457" width="860" height="405" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="497" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Giai đoạn 2: phân tích đặc trưng và mô hình nguyên mẫu</ns0:text><ns0:rect x="40" y="527" width="820" height="90" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="563" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Mã hóa và chuẩn hóa đặc trưng</ns0:text><ns0:text x="437" y="599" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">One-hot cho loại · cờ boolean · log cho số · chuẩn hóa</ns0:text><ns0:path d="M450 617 L450 634 L230 634 L230 652" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="40" y="652" width="380" height="175" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="216" y="691" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Phân cụm KMeans</ns0:text><ns0:text x="217" y="735" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="400" fill="#292929">So sánh 2–5 cụm theo tội danh</ns0:text><ns0:text x="217" y="766" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.3" font-weight="400" fill="#292929">Hệ số silhouette → nguyên mẫu</ns0:text><ns0:text x="217" y="797" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">Đặc trưng + phân bố mức án</ns0:text><ns0:path d="M420 737 L470 737" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="470" y="652" width="390" height="175" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="651" y="691" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Trọng số đặc trưng</ns0:text><ns0:text x="652" y="735" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">So chênh lệch tâm cụm</ns0:text><ns0:text x="652" y="766" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">Đo sức phân biệt nguyên mẫu</ns0:text><ns0:text x="652" y="797" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Hỗ trợ giải thích kết quả khớp</ns0:text><ns0:path d="M450 862 L450 897" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="897" width="860" height="155" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="938" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Mở rộng: tra cứu vụ án qua hội thoại</ns0:text><ns0:text x="437" y="983" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">Bổ sung dữ kiện then chốt → khớp nguyên mẫu → giải thích thống kê kèm nguồn</ns0:text><ns0:text x="437" y="1021" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Ví dụ: xô xát tay không sau cãi vã, so với có chuẩn bị, mang hung khí</ns0:text><ns0:defs /></ns0:svg>
