<ns0:rect x="20" y="615" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="648" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.4" font-weight="700" fill="#292929">Mô hình kết hợp yêu cầu gốc với biểu mẫu, xác nhận lịch trình</ns0:text><ns0:text x="437" y="695" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Thượng Hải - Bắc Kinh, đi 11 tháng 8, về 18 tháng 8</ns0:text><ns0:defs /></ns0:svg>
