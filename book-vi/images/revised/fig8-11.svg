<ns0:text x="736.91" y="213" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">RL</ns0:text><ns0:text x="732" y="260" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.9" font-weight="400" fill="#292929">Trajectory chấm được</ns0:text><ns0:text x="732" y="292" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.4" font-weight="400" fill="#292929">Chênh lệch trong nhóm</ns0:text><ns0:text x="732" y="324" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">Môi trường và thưởng</ns0:text><ns0:text x="732" y="356" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Lấy mẫu → chấm → học</ns0:text><ns0:path d="M160 395 L160 430 L740 430 L740 395" fill="none" stroke="#333333" stroke-width="1.8" />
