<ns0:text x="436" y="503" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Đánh giá độc lập và chọn bước tiếp theo</ns0:text><ns0:text x="437" y="550" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Năng lực đích · chuyển giao · năng lực giữ lại · chi phí</ns0:text><ns0:text x="437" y="582" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">Bù nền → cải thiện trình diễn → tối ưu chiến lược; nối theo vấn đề</ns0:text><ns0:defs /></ns0:svg>
