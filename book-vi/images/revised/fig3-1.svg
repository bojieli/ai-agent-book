<ns0:title id="title">Mạch kiến thức của chương</ns0:title><ns0:desc id="desc">Bộ nhớ người dùng và cơ sở kiến thức chung nối với nhau qua kỹ thuật truy xuất, kết hợp dữ kiện then chốt với chi tiết lấy khi cần.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
