<rect x="20" y="460" width="860" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="500" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Bộ nhớ hai tầng</text><rect x="45" y="525" width="385" height="80" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="237" y="557" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Thẻ có cấu trúc</text><text x="237" y="590" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Dữ kiện then chốt và quan hệ</text><rect x="470" y="525" width="385" height="80" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="662" y="557" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Truy xuất theo ngữ cảnh</text><text x="662" y="590" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Lấy chi tiết gốc khi cần</text><defs /></svg>
