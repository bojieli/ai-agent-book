<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="77.733mm" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">Mạch tri thức của chương</title><desc id="desc">Bộ nhớ người dùng và cơ sở tri thức chung nối với nhau qua kỹ thuật truy xuất, kết hợp dữ kiện then chốt với chi tiết lấy khi cần.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="660" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="260" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="59" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Bộ nhớ người dùng</text><text x="225" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">Tầng bản ghi · đánh giá 3 cấp</text><text x="225" y="151" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">4 định dạng · trạng thái thực thi</text><text x="225" y="182" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Tình tiết · ngữ nghĩa · thủ tục</text><text x="225" y="213" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mem0 · Memobase</text><text x="225" y="244" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22" font-weight="400" fill="#292929">Nén, sắp xếp · che dữ liệu nhạy cảm</text><path d="M225 280 L225 320" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="20" width="410" height="260" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="59" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Cơ sở tri thức chung</text><text x="675" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.3" font-weight="400" fill="#292929">Chia khối · tư liệu đa phương thức</text><text x="675" y="151" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Dày / thưa · truy xuất lai</text><text x="675" y="182" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">RAPTOR · GraphRAG</text><text x="675" y="213" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="400" fill="#292929">Điều hướng thư mục · Agentic RAG</text><text x="675" y="244" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.8" font-weight="400" fill="#292929">Tiền tố ngữ cảnh · trích xuất ca</text><path d="M675 280 L675 320" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="320" width="860" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
