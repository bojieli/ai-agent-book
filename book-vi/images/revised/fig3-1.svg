<ns0:rect x="20" y="20" width="410" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="59" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Bộ nhớ người dùng</ns0:text><ns0:text x="212" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">Tầng bản ghi · đánh giá 3 cấp</ns0:text><ns0:text x="212" y="151" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">4 định dạng · trạng thái thực thi</ns0:text><ns0:text x="212" y="182" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Tình tiết · ngữ nghĩa · thủ tục</ns0:text><ns0:text x="217.8" y="213" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mem0 · Memobase</ns0:text><ns0:text x="212" y="244" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Nén, sắp xếp · giải mẫn cảm</ns0:text><ns0:path d="M225 280 L225 320" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="470" y="20" width="410" height="260" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
