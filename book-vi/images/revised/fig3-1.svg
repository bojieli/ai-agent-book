<ns0:text x="661" y="59" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Cơ sở kiến thức chung</ns0:text><ns0:text x="662" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.3" font-weight="400" fill="#292929">Chia khối · tư liệu đa phương thức</ns0:text><ns0:text x="662" y="151" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Dày / thưa · truy xuất lai</ns0:text><ns0:text x="666.04" y="182" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">RAPTOR · GraphRAG</ns0:text><ns0:text x="666.04" y="213" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="400" fill="#292929">Điều hướng thư mục · Agentic RAG</ns0:text><ns0:text x="662" y="244" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.8" font-weight="400" fill="#292929">Tiền tố ngữ cảnh · trích xuất ca</ns0:text><ns0:path d="M675 280 L675 320" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
