<ns0:title id="title">Dự đoán token tiếp theo trong tiền huấn luyện</ns0:title><ns0:desc id="desc">Ba tiền tố của cùng một câu huấn luyện và mục tiêu tương ứng. Vị trí đầu tiên được mở rộng thành phân phối xác suất minh họa và mất mát tương ứng.</ns0:desc>
