<ns0:text x="436" y="721" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Gộp mất mát của các vị trí rồi cập nhật mô hình</ns0:text><ns0:text x="437" y="768" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">L = −Σₜ log P(xₜ | x₁,…,xₜ₋₁) → gradient → bộ tối ưu</ns0:text><ns0:defs /></ns0:svg>
