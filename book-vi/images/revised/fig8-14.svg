<ns0:title id="title">So sánh RL một lượt và RL nhiều lượt</ns0:title><ns0:desc id="desc">Phạm vi tương tác, phản hồi và cách tổ chức trạng thái của bài tính bằng lá bài và điều hướng liên tục.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="678" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="410" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="218.07" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Một lượt · GeneralPoints</ns0:text><ns0:text x="217.79" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Đầu vào: [7, J, 3, 5] → 24</ns0:text><ns0:text x="212" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Mô hình sinh suy luận và đáp án</ns0:text><ns0:text x="212" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kiểm chứng → thưởng kết quả</ns0:text><ns0:text x="212" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">Lấy mẫu vài câu trả lời → cập nhật</ns0:text><ns0:rect x="470" y="20" width="410" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.3" font-weight="700" fill="#292929">Nhiều lượt · điều hướng cảnh phố</ns0:text><ns0:text x="662" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Đọc cảnh phố → chọn rẽ trái</ns0:text><ns0:text x="662" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.5" font-weight="400" fill="#292929">Nhìn biển chỉ đường → chỉnh hướng</ns0:text><ns0:text x="662" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">Lỡ ngã tư → tìm đường quay lại</ns0:text><ns0:text x="662" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tới đích → thưởng kết quả</ns0:text><ns0:rect x="20" y="280" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="280" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="313" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Trạng thái và phản hồi</ns0:text><ns0:text x="212" y="360" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Một lần nhập đến một câu trả lời</ns0:text><ns0:text x="212" y="392" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Có thể suy luận nhiều bước</ns0:text><ns0:text x="212" y="424" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Phản hồi kết quả/quá trình</ns0:text><ns0:rect x="470" y="280" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="280" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="313" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Trạng thái và phản hồi</ns0:text><ns0:text x="662" y="360" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hành động đổi trạng thái</ns0:text><ns0:text x="662" y="392" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Quan sát và lịch sử vào lượt sau</ns0:text><ns0:text x="662" y="424" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Thưởng giữa chừng hoặc ở điểm cuối</ns0:text><ns0:rect x="20" y="505" width="410" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="505" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="538" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.6" font-weight="700" fill="#292929">Phân bổ tín dụng và chi phí</ns0:text><ns0:text x="212" y="585" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.4" font-weight="400" fill="#292929">Định vị lựa chọn then chốt khi sinh</ns0:text><ns0:text x="212" y="617" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chi phí: sinh và kiểm chứng</ns0:text><ns0:rect x="470" y="505" width="410" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="505" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="538" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.6" font-weight="700" fill="#292929">Phân bổ tín dụng và chi phí</ns0:text><ns0:text x="662" y="585" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Nối quyết định với kết quả</ns0:text><ns0:text x="662" y="617" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chi phí: sinh và tương tác</ns0:text><ns0:defs /></ns0:svg>
