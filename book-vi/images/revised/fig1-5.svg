<title id="title">Gọi công cụ do mô hình chủ đạo: vòng lặp phía client và vòng lặp được lưu trữ phía server</title><desc id="desc">Với Kimi, client tổ chức vòng lặp tìm kiếm; với tìm kiếm và chạy mã được lưu trữ, server tổ chức vòng lặp. Giữ nguyên nhiệm vụ, truy vấn, kết quả trả về và các bước phân tích.</desc>
