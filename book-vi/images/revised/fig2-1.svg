<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="99.051mm" viewBox="0 0 900 841" role="img" aria-labelledby="title desc">
<title id="title">Tổng quan cấu trúc cửa sổ ngữ cảnh</title><desc id="desc">Ví dụ thời tiết Bắc Kinh: chỉ dẫn hệ thống, định nghĩa công cụ thời tiết, lịch sử kèm ID lời gọi, suy luận hiện tại và vị trí sinh câu trả lời.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="841" fill="#ffffff" y="0" />
<rect x="20" y="20" width="795" height="781" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="35" y="35" width="765" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="68" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">System prompt (từ nhắc hệ thống)</text><text x="417" y="107" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">You are a helpful assistant. Answer concisely.</text><text x="417" y="141" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Use tools for real-time information.</text><rect x="35" y="170" width="765" height="205" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Định nghĩa công cụ (Tool Definitions)</text><text x="417" y="242" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.7" font-weight="400" fill="#292929">{"name": "get_weather", "description": "Tra thời tiết thành phố",</text><text x="417" y="276" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">"parameters": {"type": "object", "properties": {</text><text x="417" y="310" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">"city": {"type": "string"}}, "required": ["city"]}}</text><rect x="35" y="390" width="765" height="176" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="423" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Lịch sử hội thoại (Conversation History)</text><text x="417" y="462" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">user: Hôm nay thời tiết Bắc Kinh thế nào?</text><text x="417" y="496" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">assistant: call_1 → get_weather(city="Bắc Kinh")</text><text x="417" y="530" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tool (call_1): {"temp": "23°C", "conditions": "nắng"}</text><rect x="35" y="581" width="765" height="125" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="614" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Suy luận lượt này (Reasoning)</text><text x="417" y="653" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.6" font-weight="400" fill="#292929">&lt;think&gt;Đã có thời tiết Bắc Kinh, giờ tổng hợp câu trả lời.&lt;/think&gt;</text><rect x="35" y="721" width="765" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="417" y="761" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant: Hôm nay Bắc Kinh trời nắng, 23°C…</text><path d="M835 35 L855 35 L855 706 L835 706" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="879" y="335" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">N</text><text x="879" y="370" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">G</text><text x="879" y="405" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ữ</text><text x="879" y="440" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">C</text><text x="879" y="475" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ả</text><text x="879" y="506.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">N</text><text x="879" y="538.44" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">H</text><text x="450" y="828" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Vị trí đang sinh</text><path d="M450 806 L450 787" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<defs /></svg>
