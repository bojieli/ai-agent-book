<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="106.824mm" viewBox="0 0 900 907" role="img" aria-labelledby="title desc">
<title id="title">Urutan pesan dalam pencarian paralel</title><desc id="desc">Sepuluh anggota mencari secara paralel. Setelah memverifikasi kandidat valid pertama, Manager mengirim pembatalan ke anggota yang masih mencari dan menunggu konfirmasinya.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="907" fill="#ffffff" y="0" />
<text x="450" y="42" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">Contoh: sepuluh anggota mencari satu dosen</text><rect x="47" y="72" width="182" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="138" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Manager</text><rect x="269" y="72" width="182" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
