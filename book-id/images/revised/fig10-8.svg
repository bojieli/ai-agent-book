<ns0:title id="title">Urutan pesan dalam pencarian paralel</ns0:title><ns0:desc id="desc">Sepuluh anggota mencari secara paralel. Setelah memverifikasi kandidat valid pertama, Manager mengirim pembatalan ke anggota yang masih mencari dan menunggu konfirmasinya.</ns0:desc>
