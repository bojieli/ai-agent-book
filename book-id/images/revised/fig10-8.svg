<ns0:text x="436" y="757" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Alasan selesai dicatat terpisah saat rekap</ns0:text><ns0:text x="437" y="804" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tak ditemukan, cocok, dan batal tercatat terpisah.</ns0:text><ns0:text x="437" y="836" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929">Anggota yang belum selesai setelah dua menit dicatat sebagai timeout.</ns0:text><ns0:defs /></ns0:svg>
