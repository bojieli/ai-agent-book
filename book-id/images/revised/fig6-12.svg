<ns0:title id="title">Loop persepsi-pikir-aksi pada Computer Use Agent</ns0:title><ns0:desc id="desc">Tangkapan layar, keputusan aksi, eksekusi, dan observasi baru yang kembali ke model.</ns0:desc>
