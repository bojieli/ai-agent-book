<rect x="20" y="170" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent Membuat Artifact SQL</text><text x="450" y="250" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">SELECT department, COUNT(emp_id) AS active_count</text><text x="450" y="282" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">FROM employees WHERE leave_date IS NULL</text><text x="450" y="314" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">GROUP BY department;</text><path d="M450 350 L450 395" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="395" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="395" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="428" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Layanan Eksekusi Terkendali</text><text x="450" y="475" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Identitas tepercaya · Izin tabel / kolom / baris · Cek struktur kueri</text><text x="450" y="507" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.7" font-weight="400" fill="#292929">Binding parameter · Anggaran waktu dan baris · Koneksi database terbatas</text><path d="M450 545 L450 565 L225 565 L225 585" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
