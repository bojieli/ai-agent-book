<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="92.102mm" viewBox="0 0 900 782" role="img" aria-labelledby="title desc">
<title id="title">RAG sekali retrieval vs. RAG yang dapat terus mencari</title><desc id="desc">Untuk pertanyaan penukaran barang yang sama, retrieval pertama menemukan seri produk. Retrieval tunggal hanya bisa menjawab dari bukti yang ada; retrieval multi-putaran dapat mencari ketentuan tambahan berdasarkan model dan tanggal.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="782" fill="#ffffff" y="0" />
<rect x="32" y="20" width="836" height="82" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="70" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="700" fill="#292929">Bisakah produk ini ditukar dengan ketentuan garansi bulan lalu?</text><path d="M450 102 L450 136" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="150" y="136" width="600" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="180" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Retrieval pertama: data produk</text><text x="450" y="222" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.6" font-weight="400" fill="#292929">Seri produk ditemukan; ketentuan garansi belum</text><path d="M450 246 L450 276 L223 276 L223 314" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 276 L666 276 L666 314" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="36" y="314" width="374" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="357" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Retrieval tunggal</text><path d="M223 379 L223 419" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="479" y="314" width="374" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="666" y="357" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent menentukan</text><path d="M666 379 L666 419" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="36" y="419" width="374" height="134" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="223" y="464" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="700" fill="#292929">Jawab dari bukti yang ada</text><text x="223" y="512" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.4" font-weight="400" fill="#292929">Hanya seri produk yang pasti</text><rect x="479" y="419" width="374" height="134" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="666" y="464" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Periksa bukti</text><text x="666" y="512" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Cukup untuk menilai?</text><path d="M666 553 L666 608" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="479" y="608" width="374" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="666" y="654" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="700" fill="#292929">Ketentuan kurang, cari lagi</text><text x="666" y="698" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Cari per model &amp; tanggal</text><path d="M853 669 L882 669 L882 472 L853 472" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M479 486 L442 486 L442 680 L410 680" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="36" y="608" width="374" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="653" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Akhiri retrieval</text><text x="223" y="700" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Jawab bila bukti cukup</text><text x="223" y="738" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Anggaran habis: sebut kekurangan</text><defs /></svg>
