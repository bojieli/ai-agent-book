<ns0:text x="436" y="131" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="700" fill="#292929">Faktor via LLM</ns0:text><ns0:text x="437" y="173" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">Field bottom-up</ns0:text><ns0:text x="437" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">Definisi nilai</ns0:text><ns0:text x="437" y="235" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">&amp; status kosong</ns0:text><ns0:path d="M565 165 L630 165" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
