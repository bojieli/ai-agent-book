<rect x="20" y="897" width="860" height="155" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="938" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Perluasan: kueri kasus lewat percakapan</text><text x="450" y="983" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.1" font-weight="400" fill="#292929">Lengkapi fakta → cocokkan prototipe → jelaskan statistik dan sumber</text><text x="450" y="1021" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.7" font-weight="400" fill="#292929">Contoh: cekcok lalu bentrok tangan kosong vs. serangan bersenjata terencana</text><defs /></svg>
