<ns0:title id="title">Pipeline ekstraksi pengetahuan terstruktur</ns0:title><ns0:desc id="desc">Field modular ditemukan dari materi kasus, catatan terstruktur diekstrak, lalu melalui encoding, standardisasi, dan clustering terbentuk prototipe; bobot fitur dijelaskan dari selisih pusat klaster.</ns0:desc>
