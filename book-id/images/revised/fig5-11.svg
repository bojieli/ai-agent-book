<ns0:title id="title">Pipeline Agent yang Menciptakan Agent</ns0:title><ns0:desc id="desc">Dua jalur pembuatan memakai syarat penerimaan yang sama, dengan kualitas dan biaya pembuatan dicatat terpisah.</ns0:desc>
