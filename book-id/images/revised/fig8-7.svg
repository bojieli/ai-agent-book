<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="93.044mm" viewBox="0 0 900 790" role="img" aria-labelledby="title desc">
<ns0:title id="title">Perbandingan arsitektur Q-learning dan Agent LLM dalam permainan mencari harta karun</ns0:title><ns0:desc id="desc">Dua jalur keputusan dalam lingkungan yang sama, serta dua kondisi pengukuran: evaluasi setelah pelatihan dan percobaan pertama.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="790" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="219.11" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent Q-learning</ns0:text><ns0:text x="212" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Kodekan ruang, barang, pintu, penjaga</ns0:text><ns0:text x="212" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Tabel Q kali ini mencatat 142 state</ns0:text><ns0:text x="212" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Eksplorasi atau cari di tabel</ns0:text><ns0:rect x="470" y="20" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="666.74" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent LLM · Kimi K3</ns0:text><ns0:text x="662" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Baca deskripsi ruang dan aksi</ns0:text><ns0:text x="662" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.3" font-weight="400" fill="#292929">Simpan hingga 50 pengalaman</ns0:text><ns0:text x="662" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">Kembalikan aksi sebagai teks</ns0:text><ns0:path d="M225 200 L225 240" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M675 200 L675 240" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="240" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="240" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.7" font-weight="700" fill="#292929">Pilih aksi menurut nilai Q</ns0:text><ns0:text x="217.11" y="320" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Misalnya: go north</ns0:text><ns0:text x="212" y="352" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.1" font-weight="400" fill="#292929">Lingkungan: "bergerak ke utara"</ns0:text><ns0:rect x="470" y="240" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="240" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ambil aksi dari jawaban</ns0:text><ns0:text x="668.23" y="320" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ACTION: take red key</ns0:text><ns0:text x="662" y="352" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.1" font-weight="400" fill="#292929">Lingkungan: "ambil kunci merah"</ns0:text><ns0:path d="M225 380 L225 405 L675 405 L675 380" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M450 405 L450 440" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="440" width="860" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="440" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="473" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Lingkungan harta karun yang sama</ns0:text><ns0:text x="437" y="520" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929">posisi · barang · pintu · penjaga → jalankan aksi → observasi dan imbalan</ns0:text><ns0:path d="M20 490 L7 490 L7 110 L20 110" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M880 490 L893 490 L893 110 L880 110" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="590" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="590" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="211" y="623" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="700" fill="#292929">Evaluasi greedy usai latihan</ns0:text><ns0:text x="212" y="670" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Tabel Q dibekukan usai 10.000 episode</ns0:text><ns0:text x="212" y="702" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.3" font-weight="400" fill="#292929">Uji 100 episode lagi, semua tamat</ns0:text><ns0:text x="212" y="734" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.7" font-weight="400" fill="#292929">Rata-rata 12 langkah per episode</ns0:text><ns0:rect x="470" y="590" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="590" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="623" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.8" font-weight="700" fill="#292929">Trajektori episode pertama</ns0:text><ns0:text x="662" y="670" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">Langkah 9: racik pedang perak</ns0:text><ns0:text x="662" y="702" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.0" font-weight="400" fill="#292929">Langkah 14: kalahkan penjaga kuat</ns0:text><ns0:text x="662" y="734" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Langkah 17: dapatkan harta</ns0:text><ns0:defs /></ns0:svg>
