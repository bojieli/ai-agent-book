<ns0:title id="title">Set-of-Mark dan indeks elemen terstruktur (implementasi browser-use)</ns0:title><ns0:desc id="desc">Kandidat visual dan kandidat DOM berbagi penanda yang dapat dirujuk, disertai contoh elemen.</ns0:desc>
