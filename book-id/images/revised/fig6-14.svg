<ns0:rect x="20" y="511" width="860" height="151" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="511" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="444.71" y="544" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Model memilih nomor [2]</ns0:text><ns0:text x="442.07" y="591" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Pemetaan DOM saat ini: [2] → tombol submit-btn</ns0:text><ns0:text x="437.96" y="623" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Nama aksesibilitas: Submit form</ns0:text><ns0:path d="M450 662 L450 703" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
