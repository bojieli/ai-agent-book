<rect x="20" y="859" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="892" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="700" fill="#292929">Halaman dimuat ulang; kandidat dikumpulkan dan dinomori ulang</text><text x="450" y="939" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Gulir atau elemen baru juga bisa mengubah pemetaan</text><text x="450" y="971" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Tanpa info terstruktur: pakai anotasi visual atau prediksi koordinat</text><defs /></svg>
