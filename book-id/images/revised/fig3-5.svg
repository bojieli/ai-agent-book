<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="111.889mm" viewBox="0 0 900 950" role="img" aria-labelledby="title desc">
<ns0:title id="title">Alur kueri RAG: retrieval, augmentasi, dan generasi</ns0:title><ns0:desc id="desc">Pertanyaan pengembalian dana menghasilkan potongan kebijakan dan panduan; potongan itu bersama pertanyaan membentuk input model yang menghasilkan jawaban spesifik.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="950" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="290" height="110" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="151" y="58" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="700" fill="#292929">Pertanyaan pengguna</ns0:text><ns0:text x="152" y="99" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.6" font-weight="400" fill="#292929">Bagaimana cara refund?</ns0:text><ns0:rect x="440" y="20" width="440" height="110" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="646" y="58" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Basis pengetahuan</ns0:text><ns0:text x="647" y="99" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.1" font-weight="400" fill="#292929">Kebijakan · panduan · waktu cair</ns0:text><ns0:path d="M165 130 L165 175 L290 175" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M660 130 L660 175 L610 175" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="290" y="145" width="320" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="183" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.8" font-weight="700" fill="#292929">Ambil potongan Top-k</ns0:text><ns0:text x="442.79" y="222" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Vektor dense / BM25</ns0:text><ns0:path d="M450 245 L450 280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="280" width="860" height="195" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="317" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Hasil retrieval</ns0:text><ns0:text x="437" y="361" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.6" font-weight="400" fill="#292929">① Refund penuh dalam 7 hari setelah diterima; sertakan nomor pesanan.</ns0:text><ns0:text x="437" y="404" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Dana refund masuk dalam 3–5 hari kerja.</ns0:text><ns0:text x="437" y="447" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">② Pesanan Saya → pilih pesanan → ajukan refund.</ns0:text><ns0:path d="M450 475 L450 515" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="515" width="860" height="125" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="554" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Input model setelah augmentasi</ns0:text><ns0:text x="437" y="601" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Instruksi tugas + pertanyaan + potongan beserta sumbernya</ns0:text><ns0:path d="M450 640 L450 675" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="290" y="675" width="320" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="717" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="700" fill="#292929">LLM menyusun jawaban</ns0:text><ns0:path d="M450 740 L450 780" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="780" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="818" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Jawaban</ns0:text><ns0:text x="437" y="861" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Dalam 7 hari setelah diterima, buka "Pesanan Saya" dan ajukan refund.</ns0:text><ns0:text x="437" y="900" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sertakan nomor pesanan; dana masuk dalam 3–5 hari kerja.</ns0:text><ns0:defs /></ns0:svg>
