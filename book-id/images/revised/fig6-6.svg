<rect x="20" y="719" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="719" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="752" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Hasil dan pembaruan sama-sama masuk keputusan</text><text x="450" y="799" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kondisi awal: pilih A; kondisi baru: pilih B</text><text x="450" y="831" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Runtime mengelola status alat; model memakai kondisi tugas terbaru</text><defs /></svg>
