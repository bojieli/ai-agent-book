<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="86.449mm" viewBox="0 0 900 734" role="img" aria-labelledby="title desc">
<ns0:title id="title">Tiga strategi penanganan event asinkron</ns0:title><ns0:desc id="desc">Dari event baru ke waktu penanganan, lalu nasib tugas lama dan event baru.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="734" fill="#ffffff" y="0" />
<ns0:text x="436" y="48" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="700" fill="#292929">Saat event baru tiba, bagaimana nasib tugas yang sedang berjalan?</ns0:text><ns0:rect x="20" y="82" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="111" y="177" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Batalkan</ns0:text><ns0:rect x="240" y="82" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="546" y="122" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Pengguna berkata "berhenti"</ns0:text><ns0:text x="547" y="175" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">Berhenti memulai aksi baru, minta pembatalan</ns0:text><ns0:text x="547" y="231" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.6" font-weight="400" fill="#292929">Pastikan sampai langkah mana, catat status akhir</ns0:text><ns0:rect x="20" y="302" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="111" y="397" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Antrekan</ns0:text><ns0:rect x="240" y="302" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="546" y="342" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="700" fill="#292929">Pengguna menambahkan "sebulan terakhir saja"</ns0:text><ns0:text x="547" y="395" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">Pencarian belum selesai; tambahan masuk antrean</ns0:text><ns0:text x="547" y="451" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.2" font-weight="400" fill="#292929">Setelah hasil tiba, susun sesuai rentang baru</ns0:text><ns0:rect x="20" y="522" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="111" y="617" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Paralel</ns0:text><ns0:rect x="240" y="522" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="546" y="562" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="700" fill="#292929">Saat analisis latar berjalan, pengguna tanya cuaca</ns0:text><ns0:text x="547" y="615" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Cek cuaca di konteks terpisah, tugas utama lanjut</ns0:text><ns0:text x="547" y="671" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">Simpan jawaban cuaca dan hasil analisis terpisah</ns0:text><ns0:defs /></ns0:svg>
