<ns0:rect width="900" height="805" fill="#ffffff" y="0" />
<ns0:text x="435" y="40" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="29.4" font-weight="700" fill="#292929">Satu tugas: kebijakan bisa memanggil alat berulang kali</ns0:text><ns0:rect x="30" y="82" width="245" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
