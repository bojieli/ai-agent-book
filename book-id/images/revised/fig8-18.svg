<ns0:title id="title">Lingkar tool calling dan pelatihan AWorld-train</ns0:title><ns0:desc id="desc">Bagian atas: interaksi alat dalam satu trajektori; bagian bawah: pembaruan kebijakan setelah satu batch trajektori terkumpul.</ns0:desc>
