<ns0:text x="436" y="651" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Waktu di makalah: satu node berurutan → terdistribusi</ns0:text><ns0:text x="437" y="698" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kumpulkan trajektori: 7.695 s → 525 s (~14,6×)</ns0:text><ns0:text x="437" y="730" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Perbarui parameter: keduanya 144 s</ns0:text><ns0:defs /></ns0:svg>
