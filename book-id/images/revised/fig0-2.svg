<title id="title">Struktur buku: membangun Agent dan meningkatkan kemampuannya</title><desc id="desc">Bab 1–6 membangun metode konstruksi, Bab 7 memberikan umpan balik evaluasi, dan Bab 8–10 meningkatkan kemampuan melalui parameter, pembaruan sistem, dan kolaborasi.</desc>
