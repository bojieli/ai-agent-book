<ns0:title id="title">Contextual Retrieval</ns0:title><ns0:desc id="desc">Dokumen asli dan chunk sasaran dimasukkan bersama ke model untuk menghasilkan prefiks latar belakang, lalu prefiks dan teks asli diindeks bersama. Contoh mempertahankan potongan lengkap tentang pendapatan ACME yang naik 3% pada kuartal kedua 2025.</ns0:desc>
