<title id="title">Urutan Interaksi Protokol MCP</title><desc id="desc">MCP 2026-07-28: klien dapat lebih dulu menemukan kemampuan server, lalu mencantumkan dan memanggil alat cuaca. Setiap permintaan membawa metadata protokol yang diperlukan; gambar menampilkan metode bisnis dan parameternya.</desc>
