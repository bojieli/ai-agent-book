<ns0:title id="title">Dual loop eksekusi online dan evolusi offline</ns0:title><ns0:desc id="desc">Sisi kiri melakukan query dengan versi saat ini dan menunggu tanda terima; sisi kanan belajar dari log. Versi baru yang lolos verifikasi dipakai oleh tugas berikutnya.</ns0:desc>
