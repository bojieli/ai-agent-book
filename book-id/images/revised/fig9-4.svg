<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="109.769mm" viewBox="0 0 900 932" role="img" aria-labelledby="title desc">
<title id="title">Dari trajektori yang dievaluasi ke dokumen pengetahuan pengalaman</title><desc id="desc">Contoh kasus query timeout: membandingkan keberhasilan dan kegagalan pada catatan asli, lalu memverifikasi pengalaman kandidat pada tugas baru.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="932" fill="#ffffff" y="0" />
<rect x="70" y="20" width="760" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="20" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Trajektori mentah</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Alat A timeout; beralih ke alat B, kueri berhasil.</text><path d="M450 136 L450 171" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="171" width="760" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="171" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="204" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Evaluasi satu run: ajukan dugaan</text><text x="450" y="251" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Jika timeout lagi, apakah langsung ganti alat?</text><path d="M450 287 L450 322" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="322" width="760" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="322" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="355" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Bandingkan trajektori: cari contoh tandingan</text><text x="450" y="402" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kueri sejenis juga timeout, tetapi ulang A berhasil.</text><text x="450" y="434" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Keduanya mencatat versi alat, galat, dan balikan.</text><path d="M450 472 L450 507" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="507" width="760" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="507" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="540" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Pengalaman kandidat: tulis syarat berlakunya</text><text x="450" y="587" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.2" font-weight="400" fill="#292929">Jika timeout, coba ulang; bila terus gagal, ganti alat.</text><text x="450" y="619" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Lampirkan catatan yang mendukung dan membantahnya.</text><path d="M450 657 L450 692" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="692" width="760" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="692" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="725" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.5" font-weight="700" fill="#292929">Verifikasi terpisah, lalu sediakan untuk tugas baru</text><text x="450" y="772" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bandingkan sukses dan durasi pada kueri sisihan.</text><text x="450" y="804" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Setelah dipakai, terus catat hasil setiap kueri.</text><path d="M830 767 L865 767 L865 902 L30 902 L30 397 L70 397" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="880" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bukti baru: revisi syarat berlaku / perbarui / hapus</text><defs /></svg>
