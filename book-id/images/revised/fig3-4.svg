<ns0:title id="title">Arsitektur referensi kolaborasi memori multitipe</ns0:title><ns0:desc id="desc">Memori kerja menyimpan status tugas saat ini; memori episodik, semantik, dan prosedural ikut berperan melalui penulisan selektif serta retrieval dan aktivasi.</ns0:desc>
