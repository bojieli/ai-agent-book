<ns0:text x="436" y="390" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.6" font-weight="700" fill="#292929">Memori Semantik</ns0:text><ns0:text x="437" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.3" font-weight="400" fill="#292929">Fakta, preferensi</ns0:text><ns0:text x="437" y="467" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Dari ucapan</ns0:text><ns0:text x="437" y="498" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.5" font-weight="400" fill="#292929">"Suka di jendela"</ns0:text><ns0:rect x="620" y="350" width="240" height="215" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
