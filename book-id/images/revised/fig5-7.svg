<ns0:text x="436" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Trajectory dan Kebutuhan</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">Trajectory refund: refund dipanggil tanpa cek kelayakan</ns0:text><ns0:text x="437" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Trajectory stok: kueri timeout, tanpa fallback cache</ns0:text><ns0:text x="441.06" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Input: tool call, hasil, dokumen arsitektur, dan PRD</ns0:text><ns0:path d="M450 200 L450 255" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="255" width="760" height="148" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="255" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="288" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Penentuan Lokasi dan Laporan Terstruktur</ns0:text><ns0:text x="437" y="335" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kaitkan trajectory, putaran, dan butir kebutuhan</ns0:text><ns0:text x="437" y="367" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Laporan: prioritas, modul, gejala, bukti, dan saran</ns0:text><ns0:path d="M450 403 L450 458" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="458" width="760" height="148" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="458" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="491" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Uji Regresi</ns0:text><ns0:text x="437" y="538" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">Tiga tes: gagal pada versi cacat, lulus pada versi perbaikan</ns0:text><ns0:text x="437" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.8" font-weight="400" fill="#292929">Cek langkah ada → perluas ke urutan, hasil, dan status</ns0:text><ns0:path d="M450 606 L450 661" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
