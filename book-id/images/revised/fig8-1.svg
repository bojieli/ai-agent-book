<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="101.289mm" viewBox="0 0 900 860" role="img" aria-labelledby="title desc">
<title id="title">Loop interaksi Agent–lingkungan dalam reinforcement learning</title><desc id="desc">Policy, aksi, observasi, reward, dan potongan trajektori pada tugas mencari harta karun.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="860" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent · Penjelajah</text><text x="225" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.7" font-weight="400" fill="#292929">Policy π: aksi dari observasi</text><text x="225" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">gerak / ambil / racik / serang</text><text x="225" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ε-greedy: ε = 0,1</text><text x="225" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">90% greedy, 10% eksplorasi acak</text><rect x="470" y="20" width="410" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.4" font-weight="700" fill="#292929">Contoh · Lingkungan harta karun</text><text x="675" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="400" fill="#292929">ruang / barang / pintu / penjaga</text><text x="675" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Transisi menurut aksi dan state kini</text><text x="675" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Contoh: bergerak r = 0</text><text x="675" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="400" fill="#292929">Kunci +5, kalahkan penjaga +50</text><path d="M225 235 L225 280 L675 280 L675 235" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Aksi aₜ: bergerak ke timur</text><rect x="20" y="320" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="320" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="353" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Umpan balik lingkungan</text><text x="450" y="400" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.6" font-weight="400" fill="#292929">Observasi oₜ₊₁: ruangan, barang terlihat, status pintu dan penjaga</text><text x="450" y="432" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Reward rₜ₊₁: umpan balik atas aksi ini</text><path d="M880 120 L893 120 L893 390 L880 390" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M20 390 L7 390 L7 120 L20 120" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="500" width="860" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="500" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="533" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Potongan trajektori</text><text x="450" y="580" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Aula masuk → ke timur → gudang, r = 0</text><text x="450" y="612" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Gudang → ambil kunci merah → memegang kunci, r = +5</text><text x="450" y="644" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.1" font-weight="400" fill="#292929">Jelajah lagi → racik pedang perak, r = +10 → serang penjaga, r = +50</text><rect x="20" y="720" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="720" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="753" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Return terdiskon</text><text x="450" y="800" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Gₜ = rₜ₊₁ + γrₜ₊₂ + γ²rₜ₊₃ + …, γ = 0,99</text><defs /></svg>
