<ns0:text x="436" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Tugas dan kondisi yang diketahui</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">Refund $150 telah diajukan, kembali ke metode asal dalam 3–5 hari kerja</ns0:text><ns0:rect x="20" y="160" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
