<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="124.609mm" viewBox="0 0 900 1058" role="img" aria-labelledby="title desc">
<title id="title">Lingkungan kecerdasan berwujud OpenVLA dan RoboTwin2</title><desc id="desc">Adaptasi kebijakan, kendali sendi, dan umpan balik lingkungan.</desc>
