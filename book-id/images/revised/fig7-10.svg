<text x="450" y="413" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Adaptasi aksi dan kendali</text><text x="450" y="460" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tiap lengan 6 sendi dan 1 kolom capit, total 14 dimensi</text><text x="450" y="492" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Cek urutan, normalisasi, frekuensi kendali, dan batas sendi</text><text x="450" y="524" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">Action chunking: keluarkan H langkah → jalankan h → amati lagi</text><path d="M450 565 L450 605" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="605" width="860" height="185" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
