<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Tugas: masukkan kaleng ke dalam panci</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Instruksi + observasi → adaptasi input kebijakan</text><path d="M225 120 L225 155" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
