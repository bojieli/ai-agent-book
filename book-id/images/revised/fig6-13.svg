<ns0:text x="436" y="747" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Contoh mengisi formulir</ns0:text><ns0:text x="437" y="794" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">① screenshot: ambil halaman</ns0:text><ns0:text x="445.61" y="826" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">② Model temukan kolom nama → mouse_move(324, 156)</ns0:text><ns0:text x="437" y="858" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">③ left_click: dapatkan fokus input</ns0:text><ns0:text x="437" y="890" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">④ type("John Smith"): ketik nama</ns0:text><ns0:text x="437" y="922" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">⑤ Tangkapan baru: periksa isi kolom</ns0:text><ns0:defs /></ns0:svg>
