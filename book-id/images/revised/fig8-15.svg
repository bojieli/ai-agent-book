<ns0:title id="title">Credit assignment dalam interaksi multi-turn</ns0:title><ns0:desc id="desc">Lima langkah dari satu navigasi yang sama disusun per baris, membandingkan skor tiap langkah saat imbalan hanya di akhir dan saat ditambah umpan balik proses.</ns0:desc>
