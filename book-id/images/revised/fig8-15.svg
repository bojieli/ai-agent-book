<title id="title">Credit assignment dalam interaksi multi-turn</title><desc id="desc">Lima langkah dari satu navigasi yang sama disusun per baris, membandingkan skor tiap langkah saat reward hanya di akhir dan saat ditambah umpan balik proses.</desc>
