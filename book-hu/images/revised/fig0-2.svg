<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="98.933mm" viewBox="0 0 900 840" role="img" aria-labelledby="title desc">
<title id="title">A könyv szerkezete: Agent építése és képességeinek fejlesztése</title><desc id="desc">Az 1–6. fejezet az építés módszereit adja, a 7. fejezet az értékelési visszajelzést, a 8–10. fejezet pedig a paramétereken, a rendszerfrissítésen és az együttműködésen keresztül fejleszti a képességeket.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="840" fill="#ffffff" y="0" />
<rect x="20" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="220" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="700" fill="#292929">I. rész: Ügynökök építése</text><rect x="480" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="680" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="700" fill="#292929">II. rész: Képességfejlesztés</text><text x="220" y="138" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="700" fill="#292929">1. fej. Ismerkedés az AI-ügynökökkel</text><text x="220" y="180" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hogyan hív eszközt a modell?</text><path d="M20 224 L420 224" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="262" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">2. fej. Kontextustervezés</text><text x="220" y="304" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mi kell ehhez a döntéshez?</text><path d="M20 348 L420 348" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="376" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">3. fej. Felhasználói memória</text><text x="220" y="404" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">és tudásbázis</text><text x="220" y="442" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.6" font-weight="400" fill="#292929">Hogyan idézzük fel a korábbiakat?</text><path d="M20 472 L420 472" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="510" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">4. fej. Eszközök</text><text x="220" y="552" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929">Lekérdezés, ügyintézés – hogyan?</text><path d="M20 596 L420 596" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="634" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">5. fej. Kódoló ügynök</text><text x="220" y="666" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">és általános ügynök</text><text x="220" y="706" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Megoldható egy programmal?</text><path d="M20 720 L420 720" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="758" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">6. fej. Interakció</text><text x="220" y="800" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ha a felhasználó közbeszól?</text><rect x="480" y="110" width="400" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="680" y="153" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="700" fill="#292929">7. fej. Az ügynökök kiértékelése</text><text x="680" y="204" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.8" font-weight="400" fill="#292929">Hol a hiba? Működik a javítás?</text><path d="M680 225 L680 247 L500 247 L500 747" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M500 347 L522 347" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="282" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="328" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.6" font-weight="700" fill="#292929">8. fej. A modell utótanítása</text><text x="701" y="376" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">Hogyan frissül a modell?</text><path d="M500 547 L522 547" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="482" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="514" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">9. fej. Az ügynökök</text><text x="701" y="542" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">folyamatos evolúciója</text><text x="701" y="584" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Javítás üzemi tapasztalatból?</text><path d="M500 747 L522 747" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="682" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="714" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">10. fej. Többügynökös</text><text x="701" y="742" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">együttműködés</text><text x="701" y="782" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.1" font-weight="400" fill="#292929">Munkamegosztás és átadás?</text><defs /></svg>
