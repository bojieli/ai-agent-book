<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="75.378mm" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<title id="title">Helyi LLM eszközhívási architektúrája</title><desc id="desc">Vancouveri idő és időjárás: a kliens kezeli az üzeneteket, hívja a helyi modellt, ütemezi a két eszközt, majd visszaadja a megfigyeléseket a modellnek.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="640" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="80" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="52" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Felhasználói kérés</text><text x="450" y="83" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Vancouver aktuális ideje és időjárása</text><path d="M195 100 L195 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="150" width="350" height="470" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="195" y="188" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Kliensoldali Harness</text><text x="195" y="240" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">messages + tools összeállítása</text><text x="195" y="289" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="400" fill="#292929">Válasz és hívás-ID mentése</text><text x="195" y="395" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.1" font-weight="400" fill="#292929">Paraméterek ellenőrzése</text><text x="195" y="441" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hívások ütemezése</text><text x="195" y="537" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.2" font-weight="400" fill="#292929">Eredmények hozzáfűzése</text><text x="195" y="583" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">Új modellhívás → válasz</text><rect x="520" y="150" width="360" height="190" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="188" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.2" font-weight="700" fill="#292929">Helyi LLM-szolgáltatás</text><text x="700" y="229" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">vLLM / Ollama</text><text x="700" y="269" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Qwen3-0.6B</text><text x="700" y="311" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">Eszközhívás vagy válasz</text><path d="M370 220 L520 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="445" y="207" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">LLM-kérés</text><path d="M520 300 L370 300" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
