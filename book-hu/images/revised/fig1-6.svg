<title id="title">Az autonóm Agent végrehajtási ciklusa</title><desc id="desc">Megtartja az érvelést, a cselekvést, a megfigyelést és minden kilépési feltételt; a kész feladat ellenőrzés után kerül átadásra, hiba vagy költségkeret-túllépés esetén a rendszer menti az előrehaladást és jelentést tesz.</desc>
