<ns0:title id="title">Következő token előrejelzése az előtanításban</ns0:title><ns0:desc id="desc">Ugyanazon tanítómondat három előtagja és célja. Az első pozíció példa-valószínűségeloszlást és a hozzá tartozó veszteséget mutatja.</ns0:desc>
