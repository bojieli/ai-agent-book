<ns0:text x="743" y="358" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">kell</ns0:text><ns0:rect x="20" y="392" width="558" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
