<ns0:title id="title">Kontextusérzékeny visszakeresés</ns0:title><ns0:desc id="desc">Az eredeti dokumentumot és a céldarabot együtt kapja a modell, amely háttér-előtagot generál; ezután az előtag és az eredeti szöveg együtt kerül az indexbe. A példa megőrzi a teljes szövegrészt arról, hogy az ACME bevétele 2025 második negyedévében 3%-kal nőtt.</ns0:desc>
