<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="74.200mm" viewBox="0 0 900 630" role="img" aria-labelledby="title desc">
<ns0:title id="title">Többféle memória együttműködésének referenciaarchitektúrája</ns0:title><ns0:desc id="desc">A munkamemória az aktuális feladat állapotát tárolja; az epizodikus, a szemantikus és a procedurális memória szelektív írással, illetve visszakereséssel és aktiválással kapcsolódik be az aktuális feladatba.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="630" fill="#ffffff" y="0" />
<ns0:rect x="210" y="20" width="480" height="150" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Munkamemória</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">Cél · párbeszéd · eszközeredmények</ns0:text><ns0:text x="437" y="136" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">Feladatállapot, hátralévő lépések</ns0:text><ns0:path d="M320 170 L320 280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="211" y="232" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Szelektív írás</ns0:text><ns0:path d="M580 280 L580 170" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="670" y="232" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Visszakeresés és aktiválás</ns0:text><ns0:rect x="20" y="280" width="860" height="320" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="322" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Hosszú távú memória: munkameneteken át</ns0:text><ns0:rect x="40" y="350" width="240" height="215" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="146" y="390" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Epizodikus</ns0:text><ns0:text x="147" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Esemény, időrend</ns0:text><ns0:text x="147" y="467" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Szereplő, forrás</ns0:text><ns0:text x="147" y="498" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">„Januárban</ns0:text><ns0:text x="147" y="529" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.3" font-weight="400" fill="#292929">foglalt Tokióba”</ns0:text><ns0:rect x="330" y="350" width="240" height="215" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="390" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Szemantikus</ns0:text><ns0:text x="437" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">Tények, ízlések</ns0:text><ns0:text x="437" y="467" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kinyert tudás</ns0:text><ns0:text x="437" y="498" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">„Ablak mellé”</ns0:text><ns0:rect x="620" y="350" width="240" height="215" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="726" y="390" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Procedurális</ns0:text><ns0:text x="727" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">Folyamat, rutin</ns0:text><ns0:text x="727" y="467" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">Lépés, feltétel</ns0:text><ns0:text x="727" y="498" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Járat, hotel,</ns0:text><ns0:text x="727" y="529" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">majd iratok</ns0:text><ns0:defs /></ns0:svg>
