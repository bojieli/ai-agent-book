<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="111.300mm" viewBox="0 0 900 945" role="img" aria-labelledby="title desc">
<title id="title">A benchmarktól a javítási körig</title><desc id="desc">Négy AndroidWorld Wi-Fi-feladat folyamatos javítása.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="945" fill="#ffffff" y="0" />
<rect x="50" y="20" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="20" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Nyomok keresése a hibás trajektóriákban</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">A négy Wi-Fi-feladatból három sikertelen</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">A modell körbe-körbe navigál a beállításokban</text><path d="M450 165 L450 205" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="205" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="205" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="238" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② H1: tudja a modell, hová kell mennie?</text><text x="450" y="285" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Navigációs tipp után sem találja a vezérlőt</text><text x="450" y="317" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">Internet panel megnyitása, összevetés a modell bemenetével</text><path d="M450 350 L450 390" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="390" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="390" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="423" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ H5: látja a modell a vezérlőt?</text><text x="450" y="470" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">Régen csak az állapotsor látszott → teljes UIAutomator-fa</text><text x="450" y="502" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mind a négy feladat sikeres, de hosszabb a bemenet</text><path d="M450 535 L450 575" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="575" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="575" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="608" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ H5C: mely felületi információ hagyható el?</text><text x="450" y="655" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">Üres, nem kezelhető rejtett tárolók törlése, állapot marad</text><text x="450" y="687" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Siker és bemeneti költség ellenőrzése ugyanazon feladatokon</text><path d="M450 720 L450 760" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="760" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="760" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="793" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑤ Más alkalmazásokon is működik?</text><text x="450" y="840" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">Szélesebb összevetés szabványos környezetben, ismétlésekkel</text><text x="450" y="872" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.3" font-weight="400" fill="#292929">Siker, használat és idő ellenőrzése, új hibák felderítése</text><path d="M850 833 L883 833 L883 90 L850 90" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<defs /></svg>
