<ns0:title id="title">Az Agent folyamatos fejlődésének teljes köre</ns0:title><ns0:desc id="desc">Futtatás, értékelés, jelölt frissítés, ellenőrzés és kiadás; a frissítés visszakerül a következő futási körbe.</ns0:desc>
