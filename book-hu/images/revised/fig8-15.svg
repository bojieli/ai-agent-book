<ns0:title id="title">Hitelkiosztás többlépéses interakcióban</ns0:title><ns0:desc id="desc">Ugyanannak a navigációnak öt lépése soronként: lépésenkénti pontszám csak végső jutalommal, illetve folyamatjutalommal.</ns0:desc>
