<ns0:title id="title">A HNSW index szerkezete</ns0:title><ns0:desc id="desc">Ugyanaz a csúcs minden rétegben ugyanazt a betűt viseli. A keresés a felső réteg belépési pontjáról indul, rétegről rétegre halad lefelé, és a legalsó rétegen bővíti a jelöltek körét. A sötét nyilak egy példakeresés útvonalát jelölik.</ns0:desc>
