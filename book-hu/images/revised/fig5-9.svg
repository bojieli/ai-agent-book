<ns0:title id="title">Az SQL-lekérdező Agent folyamata</ns0:title><ns0:desc id="desc">Egy ellenőrzött végrehajtó szolgáltatás köti össze az adatbázist és a felületet; a modell szükség szerint magyarázza az aggregált eredményt.</ns0:desc>
