<ns0:text x="444.11" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Az Agent SQL Artifactot generál</ns0:text><ns0:text x="445.1" y="250" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">SELECT department, COUNT(emp_id) AS active_count</ns0:text><ns0:text x="442.94" y="282" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">FROM employees WHERE leave_date IS NULL</ns0:text><ns0:text x="446.39" y="314" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">GROUP BY department;</ns0:text><ns0:path d="M450 350 L450 395" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
