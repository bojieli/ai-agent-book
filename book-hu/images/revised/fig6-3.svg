<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="86.449mm" viewBox="0 0 900 734" role="img" aria-labelledby="title desc">
<title id="title">Az aszinkron eseménykezelés három stratégiája</title><desc id="desc">Az új esemény érkezésétől a feldolgozásig: mi lesz az eredeti feladattal és az új eseménnyel.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="734" fill="#ffffff" y="0" />
<text x="450" y="48" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Új esemény érkezik – mi legyen az eredeti feladattal?</text><rect x="20" y="82" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="177" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.3" font-weight="700" fill="#292929">Megszakítás</text><rect x="240" y="82" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="560" y="122" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">A felhasználó: „Állj!”</text><text x="560" y="175" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Nincs új művelet, megszakítási kérés</text><text x="560" y="231" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hol tartott? A végállapot rögzítése</text><rect x="20" y="302" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="397" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Sorba</text><text x="125" y="431.16" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">állítás</text><rect x="240" y="302" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="560" y="342" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Kiegészítés: „csak az utolsó hónap”</text><text x="560" y="395" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">A keresés fut, a kiegészítés sorba kerül</text><text x="560" y="451" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Az eredményt az új időszak szerint rendezi</text><rect x="20" y="522" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="617" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Párhuzamos</text><rect x="240" y="522" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="560" y="562" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Háttérelemzés közben időjárás-kérdés</text><text x="560" y="615" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Külön kontextus az időjárásnak, a fő feladat fut</text><text x="560" y="671" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.2" font-weight="400" fill="#292929">Az időjárás-válasz és az elemzés külön mentve</text><defs /></svg>
