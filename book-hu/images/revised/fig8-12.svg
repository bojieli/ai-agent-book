<text x="450" y="673" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.1" font-weight="700" fill="#292929">OOD sikerarány változása az inicializáláshoz képest (százalékpont)</text><text x="450" y="720" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Szabály, GP-L: SFT −8,1; RL +3,5</text><text x="450" y="752" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Szabály, GP-VL: SFT −5,6; RL +3,0</text><text x="450" y="784" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Vizuális, GP-VL: SFT −9,9; RL +17,6</text><rect x="20" y="865" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
