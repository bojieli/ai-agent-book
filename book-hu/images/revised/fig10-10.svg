<ns0:text x="436" y="814" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Társas interakció a kisvárosban</ns0:text><ns0:text x="437" y="861" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">25 Agent, két nap szimulált élete</ns0:text><ns0:text x="437" y="893" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Terjedő hírek: bulimeghívás, Sam polgármesteri kampánya</ns0:text><ns0:text x="437" y="925" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kapcsolatok: felismeri ismerőseit, folytatja a fotós témát</ns0:text><ns0:text x="437" y="957" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Cselekvés: programszervezés, meghívások, megjelenés a találkozón</ns0:text><ns0:path d="M675 745 L675 781" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
