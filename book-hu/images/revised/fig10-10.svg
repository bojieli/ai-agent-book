<text x="450" y="814" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Társas interakció a kisvárosban</text><text x="450" y="861" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">25 ügynök, két nap szimulált élete</text><text x="450" y="893" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Terjedő hírek: bulimeghívás, Sam polgármesteri kampánya</text><text x="450" y="925" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kapcsolatok: felismeri ismerőseit, folytatja a fotós témát</text><text x="450" y="957" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Cselekvés: programszervezés, meghívások, megjelenés a találkozón</text><path d="M675 745 L675 781" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
