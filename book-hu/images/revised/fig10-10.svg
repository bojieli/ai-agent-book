<ns0:text x="436" y="208" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Memóriafolyam · példabejegyzések</ns0:text><ns0:text x="442.79" y="255" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">08:30 nyitás: fontosság 4, frissesség 0.60</ns0:text><ns0:text x="442.78" y="287" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">09:15 beszélgetés Klausszal: fontosság 5, frissesség 0.70</ns0:text><ns0:text x="442.79" y="319" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">10:00 a buli tervezése: fontosság 9, frissesség 0.80</ns0:text><ns0:text x="442.79" y="351" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">11:30 Maria meghívása: fontosság 8, frissesség 0.85</ns0:text><ns0:text x="442.78" y="383" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">14:00 segítségkérés Mariától: fontosság 7, frissesség 0.90</ns0:text><ns0:text x="437" y="415" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Visszakeresés: frissesség, fontosság és relevancia együtt</ns0:text><ns0:path d="M450 455 L450 475 L225 475 L225 500" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
