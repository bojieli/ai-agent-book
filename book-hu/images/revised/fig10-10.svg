<text x="450" y="208" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Emlékfolyam · példabejegyzések</text><text x="450" y="255" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">08:30 nyitás: fontosság 4, frissesség 0,60</text><text x="450" y="287" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">09:15 beszélgetés Klausszal: fontosság 5, frissesség 0,70</text><text x="450" y="319" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">10:00 a buli tervezése: fontosság 9, frissesség 0,80</text><text x="450" y="351" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">11:30 Maria meghívása: fontosság 8, frissesség 0,85</text><text x="450" y="383" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">14:00 segítségkérés Mariától: fontosság 7, frissesség 0,90</text><text x="450" y="415" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Visszakeresés: frissesség, fontosság és relevancia együtt</text><path d="M450 455 L450 475 L225 475 L225 500" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
