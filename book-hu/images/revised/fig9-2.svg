<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="102.113mm" viewBox="0 0 900 867" role="img" aria-labelledby="title desc">
<title id="title">Háromszintű trajektória-ellenőrzés a környezeti eredménytől az LLM Rubricig</title><desc id="desc">Példa: az ügyfélszolgálat teljes visszatérítési ígéretének tételes összevetése az üzleti állapottal, a jogosultsággal, a határidővel és a válasszal.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="867" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ugyanannak a visszatérítésnek az átnézése</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.9" font-weight="400" fill="#292929">Kérés: teljes visszatérítés. Válasz: „Teljes összeg vissza, 7 napon belül.”</text><rect x="20" y="190" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Eredmény-ellenőrző</text><text x="235" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">rendelés: csak részösszeg</text><path d="M450 248 L502 248" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="190" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="248" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">a teljes visszatérítés</text><text x="691" y="279.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">nem történt meg</text><rect x="20" y="340" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="340" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="373" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Folyamat-ellenőrző</text><text x="235" y="420" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">napló: visszatérítés beküldve</text><path d="M450 398 L502 398" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="340" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="398" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.5" font-weight="400" fill="#292929">a jogosultság és a határidő</text><text x="691" y="426.702" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.5" font-weight="400" fill="#292929">még ellenőrizendő</text><rect x="20" y="490" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="490" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="523" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Minőség · LLM Rubric</text><text x="235" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">a válasz: „teljes”, „7 nap”</text><path d="M450 548 L502 548" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="490" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="548" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">a stíluspontszám nem pótolja</text><text x="691" y="575.14" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">a rendelés ellenőrzését</text><rect x="20" y="641" width="860" height="198" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="641" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="674" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.6" font-weight="700" fill="#292929">Bekerül a trajektória-értékelésbe, további diagnózishoz</text><text x="450" y="721" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Eredmény: részben kész; címke: ígéret ≠ tényleges összeg</text><text x="450" y="753" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bizonyíték: rendelés, műveletnapló, ügyintézői válasz</text><text x="450" y="785" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ellenőrizendő: a 7 napos határidő alapja;</text><text x="450" y="816.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">a napló megőrzése független ellenőrzéshez</text><defs /></svg>
