<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="102.113mm" viewBox="0 0 900 867" role="img" aria-labelledby="title desc">
<ns0:title id="title">Háromszintű trajektória-ellenőrzés a környezeti eredménytől az LLM Rubricig</ns0:title><ns0:desc id="desc">Példa: az ügyfélszolgálat teljes visszatérítési ígéretének tételes összevetése az üzleti állapottal, a jogosultsággal, a határidővel és a válasszal.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="867" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ugyanannak a visszatérítésnek az átnézése</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.9" font-weight="400" fill="#292929">Kérés: teljes visszatérítés. Válasz: „Teljes összeg vissza, 7 napon belül.”</ns0:text><ns0:rect x="20" y="190" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="190" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="221" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Eredmény-ellenőrző</ns0:text><ns0:text x="222" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">rendelés: csak részösszeg</ns0:text><ns0:path d="M450 248 L502 248" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="502" y="190" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="678" y="248" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">a teljes visszatérítés</ns0:text><ns0:text x="678" y="279.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">nem történt meg</ns0:text><ns0:rect x="20" y="340" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="340" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="221" y="373" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Folyamat-ellenőrző</ns0:text><ns0:text x="222" y="420" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">napló: visszatérítés beküldve</ns0:text><ns0:path d="M450 398 L502 398" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="502" y="340" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="678" y="398" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.5" font-weight="400" fill="#292929">a jogosultság és a határidő</ns0:text><ns0:text x="678" y="426.702" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.5" font-weight="400" fill="#292929">még ellenőrizendő</ns0:text><ns0:rect x="20" y="490" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="490" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="227.62" y="523" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Minőség · LLM Rubric</ns0:text><ns0:text x="222" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">a válasz: „teljes”, „7 nap”</ns0:text><ns0:path d="M450 548 L502 548" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="502" y="490" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="678" y="548" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">a stíluspontszám nem pótolja</ns0:text><ns0:text x="678" y="575.14" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">a rendelés ellenőrzését</ns0:text><ns0:rect x="20" y="641" width="860" height="198" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="641" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="674" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.6" font-weight="700" fill="#292929">Bekerül a trajektória-értékelésbe, további diagnózishoz</ns0:text><ns0:text x="437" y="721" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Eredmény: részben kész; címke: ígéret ≠ tényleges összeg</ns0:text><ns0:text x="437" y="753" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bizonyíték: rendelés, műveletnapló, ügyintézői válasz</ns0:text><ns0:text x="437" y="785" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ellenőrizendő: a 7 napos határidő alapja;</ns0:text><ns0:text x="437" y="816.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">a napló megőrzése független ellenőrzéshez</ns0:text><ns0:defs /></ns0:svg>
