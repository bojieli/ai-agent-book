<title id="title">200 ezredmásodperces mikrokörök full-duplex interakcióban</title><desc id="desc">A felső rész időben igazítja a felhasználó bemenetét és az asszisztens kimenetét. A második szakaszban a felhasználó közbeszól, miközben az asszisztens még beszél; a harmadikban az asszisztens elhallgat. Az alsó rész ugyanezt a bemenetet és kimenetet a modell feldolgozási sorrendjében mutatja.</desc>
