<rect x="70" y="390" width="760" height="74" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="419" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">tool_search_output</text><text x="450" y="449" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">get_stock_quote teljes sémája</text><path d="M450 464 L450 480" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
