<rect x="20" y="20" width="860" height="160" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="55" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Stabil előtag</text><text x="450" y="93" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">System Prompt</text><text x="450" y="129" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Alapeszközök: web_search, code_interpreter</text><text x="450" y="162" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Eszközkeresés: tool_search</text><path d="M450 180 L450 210" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="210" width="760" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
