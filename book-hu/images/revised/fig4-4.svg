<text x="450" y="984" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Következő kör: új üzenetek az előzmények végére</text><defs /></svg>
