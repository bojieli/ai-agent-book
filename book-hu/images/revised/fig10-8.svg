<title id="title">Párhuzamos keresés üzenetsorrendje</title><desc id="desc">Tíz tag keres párhuzamosan. Az első érvényes jelölt ellenőrzése után a Manager lemondást küld a még kereső tagoknak, és megvárja a visszaigazolást.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
