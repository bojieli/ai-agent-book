<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="55.709mm" viewBox="0 0 900 473" role="img" aria-labelledby="title desc">
<title id="title">A javaslattevő–felülvizsgáló mechanizmus PPT-generáláshoz</title><desc id="desc">A Slidev-forráskód, a diánkénti képernyőképek és a strukturált visszajelzés független kontextusok között halad.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="473" fill="#ffffff" y="0" />
