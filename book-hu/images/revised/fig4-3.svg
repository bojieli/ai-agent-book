<ns0:title id="title">KV-gyorsítótár-optimalizálás dinamikus eszközbetöltésnél</ns0:title><ns0:desc id="desc">Bal oldalt az elöl álló eszközlista módosítása miatt a változási ponttól mindent újra kell számolni; jobb oldalt az előtag megmarad, a felderítés eredménye a történet végére kerül. A gyorsítótár-találatot a szolgáltatás szabályai is befolyásolják.</ns0:desc>
