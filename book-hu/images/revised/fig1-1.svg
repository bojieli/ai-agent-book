<ns0:title id="title">Az Agent és az Environment zárt interakciós ciklusa, valamint az Agenten belüli Model–Harness szerkezet</ns0:title><ns0:desc id="desc">Az Agent egymás mellett tartalmazza a Modelt és a Harnesst. A Harness felépíti a kontextust, ütemezi az eszközöket és kezeli a futást; a környezet fogadja a műveletet, frissíti az állapotát és megfigyelést ad vissza.</ns0:desc>
