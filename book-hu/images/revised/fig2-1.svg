<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="99.051mm" viewBox="0 0 900 841" role="img" aria-labelledby="title desc">
<title id="title">A kontextusablak felépítése</title><desc id="desc">Pekingi időjárás példa: rendszerutasítás, időjárás-eszköz definíciója, hívásazonosítós előzmények, aktuális érvelés és a válaszgenerálás helye.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="841" fill="#ffffff" y="0" />
<rect x="20" y="20" width="795" height="781" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="35" y="35" width="765" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="68" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Rendszerprompt (System Prompt)</text><text x="417" y="107" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">You are a helpful assistant. Answer concisely.</text><text x="417" y="141" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Use tools for real-time information.</text><rect x="35" y="170" width="765" height="205" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Eszközdefiníciók (Tool Definitions)</text><text x="417" y="242" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">{"name": "get_weather", "description": "Városi időjárás",</text><text x="417" y="276" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">"parameters": {"type": "object", "properties": {</text><text x="417" y="310" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">"city": {"type": "string"}}, "required": ["city"]}}</text><rect x="35" y="390" width="765" height="176" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="423" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Beszélgetési előzmények (Conversation History)</text><text x="417" y="462" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">user: Milyen ma az idő Pekingben?</text><text x="417" y="496" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">assistant: call_1 → get_weather(city="Peking")</text><text x="417" y="530" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="400" fill="#292929">tool (call_1): {"temp": "23°C", "conditions": "derült"}</text><rect x="35" y="581" width="765" height="125" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="614" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Aktuális érvelés (Reasoning)</text><text x="417" y="653" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">&lt;think&gt;Megvan a pekingi idő, összefoglalom.&lt;/think&gt;</text><rect x="35" y="721" width="765" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="417" y="761" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant: Pekingben ma derült, 23°C…</text><path d="M835 35 L855 35 L855 706 L835 706" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="879" y="405" writing-mode="vertical-rl" style="writing-mode: vertical-rl" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">kontextusablak</text><text x="450" y="828" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Generálási pozíció</text><path d="M450 806 L450 787" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<defs /></svg>
