<ns0:text x="211" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Akció Q-érték alapján</ns0:text><ns0:text x="217.11" y="320" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">például: go north</ns0:text><ns0:text x="212" y="352" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">végrehajtás: északra lép</ns0:text><ns0:rect x="470" y="240" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
