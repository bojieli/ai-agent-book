<ns0:title id="title">A Q-learning és az LLM-ágens architektúrája a kincskereső játékban</ns0:title><ns0:desc id="desc">Két döntési út ugyanabban a környezetben, valamint két mérési feltétel: kiértékelés tanítás után és első futás.</ns0:desc>
