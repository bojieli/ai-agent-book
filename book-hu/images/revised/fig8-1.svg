<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="101.289mm" viewBox="0 0 900 860" role="img" aria-labelledby="title desc">
<title id="title">Megerősítéses tanulás: ágens–környezet interakciós ciklus</title><desc id="desc">Kincskereső feladat: stratégia, akciók, megfigyelések, jutalmak és egy trajektória-részlet.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="860" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent · felfedező</text><text x="225" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">π: megfigyelés → akció</text><text x="225" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">mozgás / felvétel / készítés / támadás</text><text x="225" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ε-mohó: ε = 0,1</text><text x="225" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.0" font-weight="400" fill="#292929">90% mohó, 10% véletlen felfedezés</text><rect x="470" y="20" width="410" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.1" font-weight="700" fill="#292929">Példa: kincskereső környezet</text><text x="675" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">szobák / tárgyak / ajtók / őrök</text><text x="675" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">akció + állapot → átmenet</text><text x="675" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">pl. mozgás: r = 0</text><text x="675" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">kulcs +5, legyőzött őr +50</text><path d="M225 235 L225 280 L675 280 L675 235" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">aₜ akció: mozgás keletre</text><rect x="20" y="320" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="320" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="353" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Környezeti visszajelzés</text><text x="450" y="400" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.3" font-weight="400" fill="#292929">oₜ₊₁ megfigyelés: aktuális szoba, látható tárgyak, ajtók és őrök állapota</text><text x="450" y="432" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">rₜ₊₁ jutalom: visszajelzés az adott akcióra</text><path d="M880 120 L893 120 L893 390 L880 390" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M20 390 L7 390 L7 120 L20 120" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="500" width="860" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="500" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="533" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Trajektória-részlet</text><text x="450" y="580" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bejárati csarnok → keletre → raktár, r = 0</text><text x="450" y="612" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Raktár → piros kulcs felvétele → kulcs nálunk, r = +5</text><text x="450" y="644" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">tovább → ezüstkard készítése, r = +10 → őr megtámadása, r = +50</text><rect x="20" y="720" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="720" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="753" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Diszkontált hozam</text><text x="450" y="800" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Gₜ = rₜ₊₁ + γrₜ₊₂ + γ²rₜ₊₃ + …, γ = 0,99</text><defs /></svg>
