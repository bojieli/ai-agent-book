<text x="450" y="388" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">T1 kész esemény → T2, T3 állapotlekérdezés</text><text x="450" y="435" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">T2 &gt; 50%: fut tovább</text><text x="450" y="467" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">T3 ≤ 50%: cancel_tool(task_id) → leállás ellenőrzése</text><path d="M450 500 L450 540" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
