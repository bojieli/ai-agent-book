<rect x="20" y="540" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="573" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Végállapotok gyűjtése, jelentés</text><text x="450" y="620" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">T1, T2: kész eredmény; T3: megszakítási rekord</text><text x="450" y="652" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.3" font-weight="400" fill="#292929">Kész esemény ↔ eredeti feladat-ID; minden végállapot rögzítve</text><defs /></svg>
