<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="108.356mm" viewBox="0 0 900 920" role="img" aria-labelledby="title desc">
<title id="title">Sesli Agent'ın ardışık hattı</title><desc id="desc">Yakalama, uç nokta, tanıma, yanıt, sentez ve çalma arayüzleri.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="920" fill="#ffffff" y="0" />
<rect x="100" y="20" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="20" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ses yakalama ve iletim</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tarayıcı AudioWorklet → WebSocket</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ses parçası → yeniden örnekleme / biçim dönüşümü</text><path d="M450 165 L450 200" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="200" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="200" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="233" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">VAD ve uç nokta mantığı</text><text x="450" y="280" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Silero VAD: konuşma aralıklarını bul</text><text x="450" y="312" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.6" font-weight="400" fill="#292929">Sessizlik eşiği ve context → bir ses parçası gönderilir</text><path d="M450 345 L450 380" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="380" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="380" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="413" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ASR → metin</text><text x="450" y="460" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Whisper / SenseVoice</text><text x="450" y="492" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.2" font-weight="400" fill="#292929">Ses → transkript; uç noktalar ve zaman damgaları korunur</text><path d="M450 525 L450 560" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="560" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="560" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="593" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM → yanıt metni</text><text x="450" y="640" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Transkripti ve görev context'ini oku</text><text x="450" y="672" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">TTS'in sentezleyebileceği metin üret</text><path d="M450 705 L450 740" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="740" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="740" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="773" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">TTS ve çalma</text><text x="450" y="820" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fish Audio S1: metin → ses parçaları</text><text x="450" y="852" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ağ iletimi → çalma tamponu → hoparlör</text><defs /></svg>
