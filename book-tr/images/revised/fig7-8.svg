<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="111.300mm" viewBox="0 0 900 945" role="img" aria-labelledby="title desc">
<title id="title">Benchmark'tan iyileştirme döngüsüne</title><desc id="desc">AndroidWorld'ün dört Wi-Fi görevinde art arda iyileştirme.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="945" fill="#ffffff" y="0" />
<rect x="50" y="20" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="20" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Başarısız izlerden ipucu bul</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Dört Wi-Fi görevinin üçü başarısız</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Model ayarlar sayfasında tekrar tekrar geziniyor</text><path d="M450 165 L450 205" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="205" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="205" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="238" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② H1: model nereye gideceğini biliyor mu?</text><text x="450" y="285" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Gezinme ipucu eklendi, denetim yine bulunamadı</text><text x="450" y="317" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="400" fill="#292929">Internet panelini aç, modelin gerçekte gördüğüyle karşılaştır</text><path d="M450 350 L450 390" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="390" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="390" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="423" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ H5: model denetimi görebiliyor mu?</text><text x="450" y="470" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">Eski arayüz yalnızca durum çubuğunu veriyordu; UIAutomator tam öğe ağacı</text><text x="450" y="502" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Dört görevin hepsi geçti, ama girdi uzadı</text><path d="M450 535 L450 575" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="575" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="575" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="608" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ H5C: hangi arayüz bilgisi atılabilir?</text><text x="450" y="655" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">Metinsiz, işlemsiz gizli kapsayıcılar silindi, durum korundu</text><text x="450" y="687" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">Aynı görevlerle başarı oranı ve girdi maliyeti kontrol edildi</text><path d="M450 720 L450 760" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="50" y="760" width="800" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="50" y="760" width="800" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="793" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑤ Başka uygulamalarda da işe yarıyor mu?</text><text x="450" y="840" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.1" font-weight="400" fill="#292929">Standart ortamda karşılaştırma kapsamını genişlet, tekrar çalıştır</text><text x="450" y="872" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="400" fill="#292929">Başarı, kullanım ve süreyi kontrol et, yeni başarısızlıkları izle</text><path d="M850 833 L883 833 L883 90 L850 90" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<defs /></svg>
