<text x="450" y="868" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Değerlendirme ve sıfırlama</text><text x="450" y="915" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Başarı koşulu: hedef nesne ile kabın görev durumu</text><text x="450" y="947" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tamamlanma süresi / denetim adımı · başarısızlık türü</text><text x="450" y="979" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">Sabit tohum ve rastgeleleştirme aralığı → reset → sonraki episode</text><defs /></svg>
