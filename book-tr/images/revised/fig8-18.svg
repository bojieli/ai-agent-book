<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="94.811mm" viewBox="0 0 900 805" role="img" aria-labelledby="title desc">
<title id="title">AWorld-train'de araç çağrısı ve eğitim döngüsü</title><desc id="desc">Üst yarı tek bir izdeki araç etkileşimini, alt yarı bir parti iz toplandıktan sonraki strateji güncellemesini gösterir.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="805" fill="#ffffff" y="0" />
<text x="450" y="40" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">Bir görev: aynı strateji art arda araç çağırabilir</text><rect x="30" y="82" width="245" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="82" width="245" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="152.5" y="115" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">AgentLoop</text><text x="152.5" y="162" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.8" font-weight="400" fill="#292929">Geçerli strateji</text><text x="152.5" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Eylem seçer</text><rect x="625" y="82" width="245" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="625" y="82" width="245" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="747.5" y="115" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">MCP sandbox</text><text x="747.5" y="162" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Aracı yürütür</text><text x="747.5" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.0" font-weight="400" fill="#292929">Görev durumunu tutar</text><text x="450" y="95" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Çağrı ve parametreler</text><path d="M275 115 L625 115" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="161" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sonuç ya da hata</text><path d="M625 184 L275 184" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M150 227 L150 370" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="306" y="293" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Görev biter, iz teslim edilir</text><text x="563" y="341" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.7" font-weight="700" fill="#292929">Bir parti görev: toplama, puanlama ve eğitim</text><rect x="30" y="370" width="385" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="370" width="385" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="222.5" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">VeRL bağdaştırıcı</text><text x="222.5" y="450" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Paralel izleri topla</text><text x="222.5" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">Ödül hesapla, örnekleri düzenle</text><rect x="495" y="370" width="375" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="495" y="370" width="375" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="682.5" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Eğitim arka ucu</text><text x="682.5" y="450" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">GRPO ya da PPO ile</text><text x="682.5" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">strateji parametrelerini güncelle</text><path d="M415 440 L495 440" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M680 520 L680 570 L15 570 L15 150 L30 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="440" y="555" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sonraki parti güncellenmiş stratejiyi kullanır</text><rect x="30" y="618" width="840" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="618" width="840" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="651" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Makale süreleri: tek düğüm ardışık → dağıtık yürütme</text><text x="450" y="698" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">İz toplama: 7.695 s → 525 s (~14.6 kat)</text><text x="450" y="730" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Parametre güncelleme: iki grupta da 144 s</text><defs /></svg>
