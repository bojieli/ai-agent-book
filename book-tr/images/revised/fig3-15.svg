<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="126.847mm" viewBox="0 0 900 1077" role="img" aria-labelledby="title desc">
<title id="title">Yapılandırılmış bilgi çıkarma hattı</title><desc id="desc">Vaka malzemesinden modüler alanlar bulunur, yapılandırılmış kayıtlar çıkarılır, kodlama, standartlaştırma ve kümelemeyle prototipler oluşur; özellik ağırlıkları küme merkezi farklarıyla açıklanır.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1077" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="397" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Aşama 1: bilgi çıkarma ve yapılandırma</text><rect x="40" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="155" y="131" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.7" font-weight="700" fill="#292929">Özgün kararlar</text><text x="155" y="173" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">CAIL2018</text><text x="155" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Suça göre örnekle</text><path d="M270 165 L335 165" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="335" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="131" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.6" font-weight="700" fill="#292929">LLM etken keşfi</text><text x="450" y="173" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.1" font-weight="400" fill="#292929">Alanları düzenle</text><text x="450" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929">Değerleri ve eksik</text><text x="450" y="235" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">durumu tanımla</text><path d="M565 165 L630 165" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="630" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="745" y="131" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Yapılı kayıt</text><text x="745" y="173" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">Teslim olma: true</text><text x="745" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22" font-weight="400" fill="#292929">Tazminat: 500 bin yuan</text><text x="745" y="265" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="19.5" font-weight="400" fill="#292929">Yaralanma: ağır (2. derece)</text><rect x="40" y="317" width="820" height="75" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="349" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Modüler Schema: ortak alanlar + suç uzantıları</text><text x="450" y="379" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">Teslim / tazminat / sabıka; hırsızlık → tutar, yaralama → derece</text><path d="M450 417 L450 457" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
