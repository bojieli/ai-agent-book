<text x="568" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Üye 3</text><rect x="689" y="72" width="182" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="780" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Diğerleri</text><text x="138" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Koordinasyon</text><path d="M138 185 L138 670" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="360" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Matematik fakültesi</text><path d="M360 185 L360 337" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="568" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fizik fakültesi</text><path d="M568 185 L568 435" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="780" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.3" font-weight="400" fill="#292929">Diğer fakülteler</text><path d="M780 185 L780 670" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="249" y="217" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Görev dağıt</text><path d="M138 240 L360 240" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M138 240 L568 240" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M138 240 L780 240" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="62" y="248" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">0 s</text><text x="62" y="345" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">12 s</text><text x="249" y="319" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bulunamadı</text><path d="M360 337 L138 337" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="62" y="443" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">18 s</text><text x="353" y="417" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Adayı ve kaynağı bildir</text><path d="M568 435 L138 435" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="62" y="598" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">18.1 s</text><text x="459" y="572" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">İptal isteği gönder (terminate)</text><path d="M138 590 L780 590" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="62" y="678" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">19 s</text><text x="459" y="652" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tarayıcıyı kapatıp onay döndür</text><path d="M780 670 L138 670" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="170" y="462" width="525" height="66" rx="6" fill="#eee" stroke="#333333" stroke-width="1.8" />
<text x="432" y="506" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Kaynağı kontrol et, ilk geçerli sonucu atomik kaydet</text><path d="M138 495 L170 495" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="724" width="840" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="724" width="840" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="757" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Toplamada bitiş nedenleri ayrı kaydedilir</text><text x="450" y="804" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.7" font-weight="400" fill="#292929">Aranıp bulunamadı, eşleşme başarılı, iptal onaylandı: her birinin kaydı var.</text><text x="450" y="836" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.0" font-weight="400" fill="#292929">İki dakikayı aşıp bitiremeyen üyeler ayrıca zaman aşımı olarak kaydedilir.</text><defs /></svg>
