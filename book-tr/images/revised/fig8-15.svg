<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="64.189mm" viewBox="0 0 900 545" role="img" aria-labelledby="title desc">
<title id="title">Çok turlu etkileşimde kredi atama</title><desc id="desc">Aynı navigasyonun beş adımı satır satır; yalnızca sonda ödül ile süreç geri bildirimi eklenmiş durumda adım puanları karşılaştırılır.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="545" fill="#ffffff" y="0" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">Aynı navigasyon, iki ödül düzeni</text><text x="102" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Adım</text><text x="314" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Gözlem ve eylem</text><text x="590" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Yalnız sonda</text><text x="784" y="120" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Süreç ödüllü</text><path d="M32 146 L868 146" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="102" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">1</text><text x="314" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">Önü gör, sola dön</text><text x="590" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">0</text><text x="784" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">+1</text><path d="M32 218 L868 218" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="102" y="266" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">2</text><text x="314" y="266" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">Tabelayı tanı, yönü doğrula</text><text x="590" y="266" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">0</text><text x="784" y="266" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">+1</text><path d="M32 290 L868 290" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="102" y="338" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">3</text><text x="314" y="338" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Kavşağı kaçır, düz devam et</text><text x="590" y="338" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">0</text><text x="784" y="338" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">−1</text><path d="M32 362 L868 362" fill="none" stroke="#333333" stroke-width="1.8" />
