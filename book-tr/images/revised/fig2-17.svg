<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="100.111mm" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
<title id="title">Altı sıkıştırma stratejisinin işleme akışı</title><desc id="desc">Altı strateji kendi malzeme düzenini, görev context'ini, kaynak bağlantılarını ve pencere eşiği işlemesini korur.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="850" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="54" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Sıkıştırmasız</text><text x="605" y="54" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Doğrudan sakla</text><rect x="40" y="72" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="105" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ham arama sonuçları</text><path d="M405 97 L490 97" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="72" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="105" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tam sonuçlar</text><rect x="20" y="157" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="191" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Tek tek özet</text><text x="605" y="191" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Her biri 2–3 paragraf özet</text><rect x="40" y="209" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="242" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Her sayfanın içeriği</text><path d="M405 234 L490 234" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="209" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="242" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sayfa sayfa özet</text><rect x="20" y="294" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="328" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Toplu özet</text><text x="605" y="328" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Birleştir, ayıkla, özetle</text><rect x="40" y="346" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="379" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bir parti arama sonucu</text><path d="M405 371 L490 371" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="346" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="379" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Bütünleşik özet</text><rect x="20" y="431" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="465" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ Context duyarlı</text><text x="605" y="465" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Göreve göre çıkar</text><rect x="40" y="483" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="516" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.6" font-weight="400" fill="#292929">Sonuçlar + sorgu + bilinenler</text><path d="M405 508 L490 508" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="483" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="516" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">İlgili olgular ve boşluklar</text><rect x="20" y="568" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="602" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑤ Duyarlı + atıf</text><text x="605" y="602" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Özetle, URL'yi koru</text><rect x="40" y="620" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="653" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.6" font-weight="400" fill="#292929">Sonuçlar + sorgu + bilinenler</text><path d="M405 645 L490 645" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="620" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="653" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Olgular ve kaynaklar</text><rect x="20" y="705" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="739" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="700" fill="#292929">⑥ Uyarlanır pencere</text><text x="605" y="739" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">≤%80 sakla; &gt;%80 toplu özet</text><rect x="40" y="757" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="790" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Geçerli girdi doluluğu</text><path d="M405 782 L490 782" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="757" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="790" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sıkıştırılmışı işaretle</text><defs /></svg>
