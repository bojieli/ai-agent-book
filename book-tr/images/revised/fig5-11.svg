<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="105.764mm" viewBox="0 0 900 898" role="img" aria-labelledby="title desc">
<title id="title">Agent oluşturabilen Agent hattı</title><desc id="desc">İki üretim yolu ortak kabul koşullarını kullanır, kalite ve oluşturma maliyeti ayrı ayrı kaydedilir.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="898" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Kullanıcı ihtiyacı</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Yayın denetim Agent'ı oluştur: dağıtım kontrol kayıtlarını okuyup yayına karar versin</text><path d="M450 140 L450 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 190 L225 160 L675 160 L675 190" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">A yolu: sıfırdan üretim</text><text x="225" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Çalışma döngüsü ve mesaj işleme</text><text x="225" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Araç protokolü ve alan araçları</text><text x="225" y="334" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">Komut satırı girişi ve testler</text><rect x="470" y="190" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="190" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">B yolu: referans uyarlama</text><text x="675" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">Kayıt okuyan çerçeveyi kopyala</text><text x="675" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.1" font-weight="400" fill="#292929">Kontrol alanları ve geçme koşulu</text><text x="675" y="334" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">Alan prompt'u, araç tanımı, açıklama</text><path d="M225 370 L225 415 L675 415 L675 370" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 415 L450 460" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="460" width="860" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="460" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="493" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ortak kabul</text><text x="450" y="540" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.4" font-weight="400" fill="#292929">Dosya yapısı ve derleme → test üretimi → standart araç çağrısı eşleşmesi</text><text x="450" y="572" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.2" font-weight="400" fill="#292929">Gerçek model görevi → çok turlu durum → context kırpma ve çağrı sınırı</text><path d="M450 625 L450 645" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 670 L225 645 L675 645 L675 670" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="670" width="410" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="670" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="703" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Görev kalitesi</text><text x="225" y="750" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Alan görevi tamamlandı mı</text><text x="225" y="782" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mesaj ve araç sonucu bağlı mı</text><text x="225" y="814" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Durum ve çıkış doğru mu</text><rect x="470" y="670" width="410" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="670" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="703" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Oluşturma maliyeti</text><text x="675" y="750" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Oluşturma süresi</text><text x="675" y="782" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">Model girdi ve çıktı kullanımı</text><text x="675" y="814" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.5" font-weight="400" fill="#292929">Değişiklik ve doğrulama turları</text><defs /></svg>
