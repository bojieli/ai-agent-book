<title id="title">Agent izi — çok para birimli toplama görevinin ReAct döngüsü</title><desc id="desc">Sistem istemi ve araç tanımları kararlı önektir; her tur biriken mesaj geçmişini ekler. Üç tur sırasıyla döviz çevirir, hesaplar ve sonucu teslim eder.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1210" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="57" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Görece kararlı önek</text><text x="450" y="91" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Sistem istemi + araç tanımları: convert_currency, code_interpreter</text><rect x="110" y="135" width="770" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="495" y="168" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">user</text><text x="495" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ç1: 2,5 milyon USD; Ç2: 2,1 milyon EUR</text><text x="495" y="236" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">Ç3: 1,8 mn GBP; Ç4: 380 mn JPY; yıllık toplam ve çeyrek ort.</text><text x="60" y="320" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">1. tur</text><rect x="110" y="285" width="770" height="235" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="495" y="320" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.reasoning</text><text x="495" y="355" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">EUR, GBP, JPY gelirlerini USD'ye çevir</text><text x="495" y="394" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.tool_calls (ilk ID: convert_currency_0)</text><text x="495" y="430" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">convert_currency(2100000, "EUR", "USD")</text><text x="495" y="463" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">convert_currency(1800000, "GBP", "USD")</text><text x="495" y="496" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">convert_currency(380000000, "JPY", "USD")</text><rect x="110" y="535" width="770" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="495" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">tool · ilk tool_call_id: convert_currency_0</text><text x="495" y="605" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">EUR → 2,282,608.70 USD; GBP → 2,278,481.01 USD</text><text x="495" y="636" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">JPY → 2,541,806.02 USD</text><text x="60" y="700" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">2. tur</text><rect x="110" y="670" width="770" height="235" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="495" y="706" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.reasoning</text><text x="495" y="741" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Çeviri sonuçlarını oku, topla, 4'e böl</text><text x="495" y="780" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.tool_calls → code_interpreter</text><text x="495" y="818" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">total = 2500000 + 2282608.70 + 2278481.01 + 2541806.02</text><text x="495" y="851" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">average = total / 4</text><text x="495" y="884" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">print(round(total, 2), round(average, 2))</text><rect x="110" y="920" width="770" height="85" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="495" y="953" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">tool: hesaplama sonucu</text><text x="495" y="988" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">9602895.73    2400723.93</text><text x="60" y="1060" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">3. tur</text><rect x="110" y="1030" width="770" height="150" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="495" y="1065" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.content</text><text x="495" y="1106" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Yıllık toplam gelir: 9,602,895.73 USD</text><text x="495" y="1146" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Çeyrek ortalama gelir: 2,400,723.93 USD</text><path d="M495 110 L495 135" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
