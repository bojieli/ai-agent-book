<text x="114" y="344" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Araç</text><text x="544" y="344" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fatura arayüzü bir dolaşım ücreti döndürür</text><path d="M544 378 L544 418" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="422" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="422" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="478" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Context</text><text x="544" y="478" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kullanıcının işi ve bulunan döküm burada</text><path d="M544 512 L544 552" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="556" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
