<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="88.687mm" viewBox="0 0 900 753" role="img" aria-labelledby="title desc">
<title id="title">Uçak bileti formu ne gönderdi</title><desc id="desc">Pekin kullanıcının isteğinden, diğer dört alan tarayıcıdan geliyor. İki bilgi modelin yanıtında birleşir.</desc>
