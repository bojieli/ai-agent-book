<rect x="20" y="170" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="170" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent form üretir, yolcu gidiş-dönüş seçer</text><text x="450" y="250" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Kalkış şehri Şanghay, kalkış tarihi 11 Ağustos</text><text x="450" y="282" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.5" font-weight="400" fill="#292929">"Gidiş-dönüş" seçilince dönüş tarihi çıkar, yolcu 18 Ağustos'u seçer</text><path d="M450 315 L450 355" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
