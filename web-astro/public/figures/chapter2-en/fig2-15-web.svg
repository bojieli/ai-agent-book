<svg xmlns="http://www.w3.org/2000/svg" width="960" height="830" viewBox="0 0 960 830" role="img" aria-labelledby="title desc"><title id="title">Status insertion in the message list</title><desc id="desc">Web reading edition of Figure 2-15. Original source artwork is retained in the book repository.</desc><foreignObject width="960" height="830"><html xmlns="http://www.w3.org/1999/xhtml"><head><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#203047;background:#f7f9fc;font-size:19px;line-height:1.45}.page{padding:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 14px}.muted{color:#52627a;font-size:17px}.grid{display:grid;gap:18px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}.card{padding:20px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;min-width:0}.blue{background:#edf4ff;border-color:#a6bfe6}.amber{background:#fff5de;border-color:#dac287}.mono{font-family:monospace;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.row{padding:10px 14px;border:1px solid #cbd5e1;border-radius:7px;margin:8px 0;background:#fff}.tag{display:inline-block;border-radius:5px;background:#dce7f7;color:#243c61;padding:2px 7px;font-family:monospace;font-size:16px}.note{padding:16px 20px;margin-top:20px;border-left:4px solid #567baa;background:#eaf0f8;font-size:17px}.arrow{text-align:center;color:#526b8c;font-size:23px;padding:7px}.bar{height:10px;background:#6383ad;border-radius:4px;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:18px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #d7e0eb}th{font-size:16px;color:#52627a}.hit{background:#eaf0f8}.new{background:#fff0c9;border-color:#d4b362}.pill{float:right;font-size:13px;font-weight:bold;color:#52627a;margin-left:4px}.small{font-size:16px}</style></head><body><div class="page"><h1>Append state after the conversation history</h1><p class="muted">One illustrative API layout; the framework supplies the state message.</p><div class="row hit"><b>Stable prefix</b><div class="mono">System instructions; tool definitions in the separate tools field</div></div><div class="row "><b>User request</b><div class="mono">Help me cancel my plan.</div></div><div class="row "><b>Assistant ↔ tool</b><div class="mono">Call cancel_plan → receive contract details → explain result</div></div><div class="row "><b>User follow-up</b><div class="mono">Then help me check my call records.</div></div><div class="row amber"><b>Framework-generated state · user role</b><div class="mono">&lt;agent_status&gt;
Calls: 3/3
TODO: cancel plan (in progress)
&lt;/agent_status&gt;</div></div><div class="arrow">↓ Next model response</div><div class="note">The user role is an API representation here. The status is produced by the framework, not the end user. Appending it preserves the earlier prefix.</div></div></body></html></foreignObject></svg>