<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title desc"><title id="title">Skills in the agent trajectory</title><desc id="desc">Web reading edition of Figure 2-12. Original source artwork is retained in the book repository.</desc><foreignObject width="960" height="1000"><html xmlns="http://www.w3.org/1999/xhtml"><head><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#203047;background:#f7f9fc;font-size:19px;line-height:1.45}.page{padding:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 14px}.muted{color:#52627a;font-size:17px}.grid{display:grid;gap:18px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}.card{padding:20px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;min-width:0}.blue{background:#edf4ff;border-color:#a6bfe6}.amber{background:#fff5de;border-color:#dac287}.mono{font-family:monospace;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.row{padding:10px 14px;border:1px solid #cbd5e1;border-radius:7px;margin:8px 0;background:#fff}.tag{display:inline-block;border-radius:5px;background:#dce7f7;color:#243c61;padding:2px 7px;font-family:monospace;font-size:16px}.note{padding:16px 20px;margin-top:20px;border-left:4px solid #567baa;background:#eaf0f8;font-size:17px}.arrow{text-align:center;color:#526b8c;font-size:23px;padding:7px}.bar{height:10px;background:#6383ad;border-radius:4px;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:18px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #d7e0eb}th{font-size:16px;color:#52627a}.hit{background:#eaf0f8}.new{background:#fff0c9;border-color:#d4b362}.pill{float:right;font-size:13px;font-weight:bold;color:#52627a;margin-left:4px}.small{font-size:16px}</style></head><body><div class="page"><h1>Load the catalog first; load instructions when needed</h1><p class="muted">Illustrative Claude Code flow when the model invokes a Skill.</p><div class="row hit"><b>System instructions</b><div class="mono">You are a Claude Code assistant…</div></div><div class="row hit"><b>Tool definitions · separate API field</b><div class="mono">Skill, Read, Bash, Edit, Write, …</div></div><div class="row "><b>User request</b><div class="mono">Help me generate a presentation from this PDF.</div></div><div class="row blue"><b>Skills catalog · runtime context</b><div class="mono">Available skills: pdf, pptx, …</div></div><div class="row "><b>Assistant → Skill tool</b><div class="mono">Skill(skill: &quot;pptx&quot;)</div></div><div class="row "><b>Tool result · placeholder</b><div class="mono">Launching skill: pptx</div></div><div class="row amber"><b>Skill instructions · appended user message</b><div class="mono">Base directory: …
# PPTX Skill
## Workflow: …</div></div><div class="row "><b>Later tool calls and results</b><div class="mono">Read PDF → receive content → write slides → receive result</div></div><div class="note">New messages are appended. Existing prefix content can be reused while it remains unchanged and cached. Direct slash-command activation can skip the Skill tool round trip.</div></div></body></html></foreignObject></svg>