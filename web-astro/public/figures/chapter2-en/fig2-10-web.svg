<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title desc"><title id="title">Prefix reuse and cache invalidation</title><desc id="desc">Web reading edition of Figure 2-10. Original source artwork is retained in the book repository.</desc><foreignObject width="960" height="840"><html xmlns="http://www.w3.org/1999/xhtml"><head><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#203047;background:#f7f9fc;font-size:19px;line-height:1.45}.page{padding:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 14px}.muted{color:#52627a;font-size:17px}.grid{display:grid;gap:18px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}.card{padding:20px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;min-width:0}.blue{background:#edf4ff;border-color:#a6bfe6}.amber{background:#fff5de;border-color:#dac287}.mono{font-family:monospace;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.row{padding:10px 14px;border:1px solid #cbd5e1;border-radius:7px;margin:8px 0;background:#fff}.tag{display:inline-block;border-radius:5px;background:#dce7f7;color:#243c61;padding:2px 7px;font-family:monospace;font-size:16px}.note{padding:16px 20px;margin-top:20px;border-left:4px solid #567baa;background:#eaf0f8;font-size:17px}.arrow{text-align:center;color:#526b8c;font-size:23px;padding:7px}.bar{height:10px;background:#6383ad;border-radius:4px;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:18px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #d7e0eb}th{font-size:16px;color:#52627a}.hit{background:#eaf0f8}.new{background:#fff0c9;border-color:#d4b362}.pill{float:right;font-size:13px;font-weight:bold;color:#52627a;margin-left:4px}.small{font-size:16px}</style></head><body><div class="page"><h1>Reuse the stable prefix</h1><p class="muted">A changed token invalidates reuse from that point onward.</p><div class="card" style="margin-top:16px"><h2>Request 1 · compute</h2><div class="grid" style="grid-template-columns:2fr 1fr"><div class="row new">System prompt + tools · 1,200 tokens</div><div class="row">Weather request</div></div></div><div class="card" style="margin-top:16px"><h2>Request 2 · reuse</h2><div class="grid" style="grid-template-columns:2fr 1fr"><div class="row hit">Same system prompt + tools · cache hit</div><div class="row">Time request</div></div></div><div class="card" style="margin-top:16px"><h2>Request 3 · prefix changed</h2><div class="grid" style="grid-template-columns:2fr 1fr"><div class="row new">New timestamp + system prompt + tools · recompute</div><div class="row">Weather request</div></div></div><div class="note"><b>Reuse saves computation, not necessarily all charges.</b> Cached input may be billed at a reduced rate. A changed prefix must be processed again. Cache availability and pricing depend on the provider.</div><p class="muted" style="margin-top:14px">Illustrative TTFT for a 3,000-token context: cache hit ~0.5 s; miss 3–5 s. These are deployment-dependent examples, not a guarantee.</p></div></body></html></foreignObject></svg>