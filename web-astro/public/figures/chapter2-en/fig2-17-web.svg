<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" role="img" aria-labelledby="title desc"><title id="title">How six compression strategies work</title><desc id="desc">Web reading edition of Figure 2-17. Original source artwork is retained in the book repository.</desc><foreignObject width="960" height="920"><html xmlns="http://www.w3.org/1999/xhtml"><head><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#203047;background:#f7f9fc;font-size:19px;line-height:1.45}.page{padding:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 14px}.muted{color:#52627a;font-size:17px}.grid{display:grid;gap:18px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}.card{padding:20px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;min-width:0}.blue{background:#edf4ff;border-color:#a6bfe6}.amber{background:#fff5de;border-color:#dac287}.mono{font-family:monospace;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.row{padding:10px 14px;border:1px solid #cbd5e1;border-radius:7px;margin:8px 0;background:#fff}.tag{display:inline-block;border-radius:5px;background:#dce7f7;color:#243c61;padding:2px 7px;font-family:monospace;font-size:16px}.note{padding:16px 20px;margin-top:20px;border-left:4px solid #567baa;background:#eaf0f8;font-size:17px}.arrow{text-align:center;color:#526b8c;font-size:23px;padding:7px}.bar{height:10px;background:#6383ad;border-radius:4px;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:18px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #d7e0eb}th{font-size:16px;color:#52627a}.hit{background:#eaf0f8}.new{background:#fff0c9;border-color:#d4b362}.pill{float:right;font-size:13px;font-weight:bold;color:#52627a;margin-left:4px}.small{font-size:16px}</style></head><body><div class="page"><h1>Six ways to handle incoming search results</h1><p class="muted">The experiment averages ~52K characters per search call.</p><div class="grid two"><div class="card "><h2>1. No compression</h2><p>Retain each complete tool result.</p><p class="muted">166,043 tokens · 5 iterations · Failed</p></div><div class="card "><h2>2. Individual summary</h2><p>Summarize each result separately into 2–3 paragraphs.</p><p class="muted">276,608 tokens · 12 iterations · Success</p></div><div class="card "><h2>3. Combined summary</h2><p>Summarize all pages returned by one search together.</p><p class="muted">93,449 tokens · 10 iterations · Success</p></div><div class="card blue"><h2>4. Context-aware</h2><p>Use the current query and context to retain task-relevant information.</p><p class="muted">40,157 tokens · 7 iterations · Success</p></div><div class="card "><h2>5. Context-aware + citations</h2><p>Use task-aware summaries and retain source URL citations.</p><p class="muted">222,992 tokens · 10 iterations · Success</p></div><div class="card "><h2>6. Adaptive window</h2><p>Keep raw results below the threshold; compress in batches above 80% of the window.</p><p class="muted">174,601 tokens · 7 iterations · Success</p></div></div><div class="note">Compare what each strategy preserves, when it compresses, and whether it completes the task. Token totals describe the entire experimental run.</div></div></body></html></foreignObject></svg>