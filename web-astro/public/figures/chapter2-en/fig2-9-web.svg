<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">From API messages to model tokens</title><desc id="desc">Web reading edition of Figure 2-9. Original source artwork is retained in the book repository.</desc><foreignObject width="960" height="650"><html xmlns="http://www.w3.org/1999/xhtml"><head><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#203047;background:#f7f9fc;font-size:19px;line-height:1.45}.page{padding:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 14px}.muted{color:#52627a;font-size:17px}.grid{display:grid;gap:18px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}.card{padding:20px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;min-width:0}.blue{background:#edf4ff;border-color:#a6bfe6}.amber{background:#fff5de;border-color:#dac287}.mono{font-family:monospace;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.row{padding:10px 14px;border:1px solid #cbd5e1;border-radius:7px;margin:8px 0;background:#fff}.tag{display:inline-block;border-radius:5px;background:#dce7f7;color:#243c61;padding:2px 7px;font-family:monospace;font-size:16px}.note{padding:16px 20px;margin-top:20px;border-left:4px solid #567baa;background:#eaf0f8;font-size:17px}.arrow{text-align:center;color:#526b8c;font-size:23px;padding:7px}.bar{height:10px;background:#6383ad;border-radius:4px;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:18px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #d7e0eb}th{font-size:16px;color:#52627a}.hit{background:#eaf0f8}.new{background:#fff0c9;border-color:#d4b362}.pill{float:right;font-size:13px;font-weight:bold;color:#52627a;margin-left:4px}.small{font-size:16px}</style></head><body><div class="page"><h1>One conversation, two representations</h1><p class="muted">The chat template serializes structured messages into a token sequence.</p><div class="grid two"><div class="card "><h2>API messages</h2><div class="mono">{ &quot;role&quot;: &quot;system&quot;,
  &quot;content&quot;: &quot;You are an assistant&quot; }

{ &quot;role&quot;: &quot;user&quot;,
  &quot;content&quot;: &quot;Hello&quot; }</div></div><div class="card blue"><h2>Model token stream</h2><div class="row"><span class="tag">&lt;|im_start|&gt;</span> system<br/>You are an assistant<br/><span class="tag">&lt;|im_end|&gt;</span></div><div class="row"><span class="tag">&lt;|im_start|&gt;</span> user<br/>Hello<br/><span class="tag">&lt;|im_end|&gt;</span></div><div class="row"><span class="tag">&lt;|im_start|&gt;</span> assistant</div></div></div><div class="note">Generation begins after the assistant role marker. Special tokens identify message boundaries; they do not replace the message text.</div></div></body></html></foreignObject></svg>