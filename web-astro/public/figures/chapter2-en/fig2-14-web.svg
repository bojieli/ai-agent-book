<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title desc"><title id="title">Status bar comparison</title><desc id="desc">Web reading edition of Figure 2-14. Original source artwork is retained in the book repository.</desc><foreignObject width="960" height="800"><html xmlns="http://www.w3.org/1999/xhtml"><head><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#203047;background:#f7f9fc;font-size:19px;line-height:1.45}.page{padding:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 14px}.muted{color:#52627a;font-size:17px}.grid{display:grid;gap:18px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}.card{padding:20px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;min-width:0}.blue{background:#edf4ff;border-color:#a6bfe6}.amber{background:#fff5de;border-color:#dac287}.mono{font-family:monospace;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.row{padding:10px 14px;border:1px solid #cbd5e1;border-radius:7px;margin:8px 0;background:#fff}.tag{display:inline-block;border-radius:5px;background:#dce7f7;color:#243c61;padding:2px 7px;font-family:monospace;font-size:16px}.note{padding:16px 20px;margin-top:20px;border-left:4px solid #567baa;background:#eaf0f8;font-size:17px}.arrow{text-align:center;color:#526b8c;font-size:23px;padding:7px}.bar{height:10px;background:#6383ad;border-radius:4px;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:18px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #d7e0eb}th{font-size:16px;color:#52627a}.hit{background:#eaf0f8}.new{background:#fff0c9;border-color:#d4b362}.pill{float:right;font-size:13px;font-weight:bold;color:#52627a;margin-left:4px}.small{font-size:16px}</style></head><body><div class="page"><h1>Make the current state explicit</h1><p class="muted">Same task and history; different work required to recover the call count.</p><div class="grid two"><div class="card "><h2>Without a status bar</h2><div class="row">Call Xfinity · attempt 1<br/><span class="small">Waited 45 minutes; not connected</span></div><div class="row">Search for Xfinity deals</div><div class="row">Call Xfinity · attempt 2<br/><span class="small">Quoted $65/month</span></div><div class="row">Call Xfinity · attempt 3<br/><span class="small">Confirmed $59/month</span></div><div class="row">User: Can you call again?</div><p class="small">The model must recover the count from scattered records.</p></div><div class="card blue"><h2>With a status bar</h2><p>Same history and follow-up request.</p><div class="row amber"><div class="mono">&lt;agent_status&gt;
Calls to Xfinity: 3
Call limit reached: 3/3
TODO: contact Xfinity ✓
Confirm price reduction ✓
Time: 2025-09-14 10:30
State: awaiting confirmation
&lt;/agent_status&gt;</div></div><p class="small">The count is directly available when deciding whether another call is allowed.</p></div></div><div class="note">The status bar summarizes the trajectory. It supports decision-making; enforcement still belongs in the surrounding system.</div></div></body></html></foreignObject></svg>