<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="149.460mm" viewBox="0 0 900 1269" role="img" aria-labelledby="title desc">
<title id="title">Совместимость с синхронным интерфейсом и нативная асинхронность модели</title><desc id="desc">Дескрипторы фоновых задач, исходные ID вызовов и промежуточные указания.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1269" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="456" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="104" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Адаптация синхронного</tspan><tspan x="225" y="81">интерфейса в среде</tspan><tspan x="225" y="109">выполнения</tspan></text><text x="225" y="156" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="156">Инструмент возвращает task_id и</tspan><tspan x="225" y="182">pending</tspan></text><text x="225" y="214" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="214">Результат вызова</tspan><tspan x="225" y="240">сопоставляется с запросом</tspan></text><text x="225" y="272" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="272">Модель обрабатывает другие</tspan><tspan x="225" y="298">сообщения</tspan></text><text x="225" y="330" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="330">Фоновая задача завершена →</tspan><tspan x="225" y="356">новое событие</tspan></text><text x="225" y="388" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="388">Восстановление контекста</tspan><tspan x="225" y="414">задачи по task_id</tspan></text><rect x="470" y="20" width="410" height="456" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="104" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Нативные асинхронные</tspan><tspan x="675" y="81">инструменты модели</tspan></text><text x="675" y="156" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="156">Объявление инструмента: async:</tspan><tspan x="675" y="182">true</tspan></text><text x="675" y="214" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="214">Модель продолжает работу во</tspan><tspan x="675" y="240">время выполнения инструмента</tspan></text><text x="675" y="272" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="272">Результат связывается с</tspan><tspan x="675" y="298">исходным call_id</tspan></text><text x="675" y="330" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="330">Результат добавляется в</tspan><tspan x="675" y="356">актуальное состояние ответа</tspan></text><text x="675" y="388" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="388">Модель учитывает новый</tspan><tspan x="675" y="414">результат и продолжает</tspan><tspan x="675" y="440">принимать решения</tspan></text><rect x="20" y="521" width="860" height="204" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="521" width="860" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="554" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="554">Поиск площадки: получение уточнений пользователя во</tspan><tspan x="450" y="582">время выполнения</tspan></text><text x="450" y="629" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="629">Исходные условия: бюджет 2000 юаней, 20 человек</tspan></text><text x="450" y="661" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="661">A: 1800 юаней / 30 человек · B: 900 юаней / 12 человек · C: 600 юаней /</tspan><tspan x="450" y="687">8 человек</tspan></text><path d="M450 725 L450 745 L225 745 L225 765" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 745 L675 745 L675 765" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="765" width="410" height="225" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="765" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="798" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="798">Запрос ещё не завершён</tspan></text><text x="225" y="873" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="873">Фоновый поиск площадки</tspan></text><text x="225" y="931" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="931">Подготовка программы и</tspan><tspan x="225" y="957">чек-листа</tspan></text><rect x="470" y="765" width="410" height="225" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="765" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="798" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="798">Уточнение пользователя в</tspan><tspan x="675" y="826">процессе</tspan></text><text x="675" y="873" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="873">Обновление: бюджет 1000</tspan><tspan x="675" y="899">юаней, 10 человек</tspan></text><text x="675" y="931" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="931">Запись источника обновления и</tspan><tspan x="675" y="957">статуса подключения</tspan></text><path d="M225 990 L225 1025 L675 1025 L675 990" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 1025 L450 1065" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="1065" width="860" height="176" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="1065" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="1098" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="1098">Результаты и обновления учитываются при решении</tspan></text><text x="450" y="1145" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1145">По исходным условиям подходит A, по новым — B</tspan></text><text x="450" y="1177" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1177">Среда управляет состоянием инструментов; модель использует</tspan><tspan x="450" y="1203">обновлённые условия задачи</tspan></text></svg>