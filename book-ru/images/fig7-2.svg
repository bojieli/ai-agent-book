<text x="225" y="407" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="407">Среда: устройство</tspan><tspan x="225" y="435">пользователя</tspan></text><text x="225" y="482" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="482">Авиарежим ON · роуминг OFF</tspan></text><text x="225" y="514" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="514">Интерфейс пользователя:</tspan></text><text x="225" y="546" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="546">toggle_airplane_mode</tspan></text><text x="225" y="578" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="578">toggle_roaming</tspan></text><text x="225" y="610" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="610">check_status_bar</tspan></text><text x="225" y="642" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="642">run_speed_test</tspan></text><rect x="470" y="374" width="410" height="313" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="374" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="407" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="407">Среда: база данных</tspan><tspan x="675" y="435">оператора</tspan></text><text x="675" y="482" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="482">Клиент C1001 · линия L1002</tspan></text><text x="675" y="514" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="514">Интерфейс агента:</tspan></text><text x="675" y="546" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="546">get_customer_by_phone</tspan></text><text x="675" y="578" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="578">get_data_usage</tspan></text><text x="675" y="610" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="610">enable_roaming</tspan></text><text x="675" y="642" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="642">refuel_data</tspan></text><path d="M430 542 L470 542" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
