<text x="450" y="760" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="760">Изменение среды → наблюдение инструмента / отзыв</tspan><tspan x="450" y="788">пользователя → следующее решение</tspan></text><text x="450" y="835" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="835">Инструменты меняют состояние в рамках своих прав; наблюдения</tspan><tspan x="450" y="861">возвращаются через соответствующие интерфейсы</tspan></text><rect x="20" y="926" width="410" height="192" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
