<text x="675" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Оцениваемый Agent</tspan></text><text x="675" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="100">Задача и правила предметной</tspan><tspan x="675" y="126">области</tspan></text><text x="675" y="158" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="158">Инструменты проверки клиента</tspan><tspan x="675" y="184">и линии</tspan></text><text x="675" y="216" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="216">Помогает пользователю</tspan><tspan x="675" y="242">настроить устройство</tspan></text><text x="675" y="274" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="274">Продолжает принимать решения</tspan><tspan x="675" y="300">по результатам инструментов</tspan></text><path d="M430 131 L470 131" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
