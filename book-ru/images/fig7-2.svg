<text x="225" y="53" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Симулятор пользователя</tspan></text><text x="225" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="100">John Smith · во Франции</tspan></text><text x="225" y="158" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="158">555-123-2002</tspan></text><text x="225" y="216" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="216">Пошагово сообщает данные по</tspan><tspan x="225" y="242">сценарию</tspan></text><text x="225" y="274" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="274">Ожидает восстановления</tspan><tspan x="225" y="300">соединения до excellent</tspan></text><rect x="470" y="20" width="410" height="309" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
