<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="98.344mm" viewBox="0 0 900 835" role="img" aria-labelledby="title desc">
<title id="title">Что отправила форма заказа авиабилета</title><desc id="desc">Пекин указан пользователем, ещё четыре поля — браузером. Модель объединяет данные в ответе.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="835" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Поручение пользователя</tspan></text><text x="450" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Хочу заказать билет до Пекина</tspan></text><path d="M450 130 L450 170" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="170" width="860" height="199" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="170" width="860" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="203" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="203">Agent создаёт форму, пассажир выбирает билет туда и</tspan><tspan x="450" y="231">обратно</tspan></text><text x="450" y="278" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="278">Город отправления — Шанхай, дата — 11 августа</tspan></text><text x="450" y="310" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="310">После выбора «туда и обратно» появляется дата возвращения: 18</tspan><tspan x="450" y="336">августа</tspan></text><path d="M450 369 L450 409" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="409" width="860" height="220" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="409" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="442" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="442">Четыре поля, отправленные браузером</tspan></text><text x="450" y="489" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="489">departure_city = Шанхай</tspan></text><text x="450" y="521" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="521">departure_date = 2026-08-11</tspan></text><text x="450" y="553" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="553">trip_type = round_trip</tspan></text><text x="450" y="585" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="585">return_date = 2026-08-18</tspan></text><path d="M450 629 L450 669" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="669" width="860" height="138" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="669" width="860" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="702" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="702">Модель объединяет исходное поручение и форму и</tspan><tspan x="450" y="730">подтверждает маршрут</tspan></text><text x="450" y="777" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="777">Шанхай → Пекин: вылет 11 августа, возвращение 18 августа</tspan></text></svg>