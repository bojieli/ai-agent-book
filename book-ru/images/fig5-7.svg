<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="107.767mm" viewBox="0 0 900 915" role="img" aria-labelledby="title desc">
<title id="title">Процесс интеллектуальной диагностики рабочих логов</title><desc id="desc">Диагностика, тесты и задачи для возвратов и резервного сценария склада.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="915" fill="#ffffff" y="0" />
<rect x="70" y="20" width="760" height="206" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="20" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">① Трассы и требования</tspan></text><text x="450" y="100" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Возврат: перед операцией не проверено право на возврат</tspan></text><text x="450" y="132" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="132">Склад: тайм-аут запроса, нет резервного перехода на кэш</tspan></text><text x="450" y="164" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="164">Вход: вызовы инструментов, результаты, архитектурная</tspan><tspan x="450" y="190">документация и PRD</tspan></text><path d="M450 226 L450 281" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="281" width="760" height="174" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="281" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="314" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="314">② Локализация и структурированный отчёт</tspan></text><text x="450" y="361" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="361">Связь трасс, шагов диалога и пунктов требований</tspan></text><text x="450" y="393" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="393">Отчёт: приоритет, модуль, симптом, доказательства и</tspan><tspan x="450" y="419">рекомендации</tspan></text><path d="M450 455 L450 510" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="510" width="760" height="174" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="510" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="543" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="543">③ Регрессионные тесты</tspan></text><text x="450" y="590" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="590">Три теста: падают до исправления, проходят после</tspan></text><text x="450" y="622" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="622">От проверки наличия шага → к порядку, результатам и</tspan><tspan x="450" y="648">состоянию</tspan></text><path d="M450 684 L450 739" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="739" width="760" height="148" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="739" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="772" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="772">④ Рабочая задача</tspan></text><text x="450" y="819" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="819">Создание Issue через GitHub MCP</tspan></text><text x="450" y="851" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="851">Связь с диагностикой и тестами, фиксация статуса обработки</tspan></text></svg>