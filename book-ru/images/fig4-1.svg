<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="116.482mm" viewBox="0 0 900 989" role="img" aria-labelledby="title desc">
<title id="title">Последовательность взаимодействия по протоколу MCP</title><desc id="desc">MCP 2026-07-28: клиент может сначала узнать возможности сервера, затем получить список погодных инструментов и вызвать нужный. Каждый запрос содержит обязательные метаданные протокола; на схеме показаны бизнес-методы и параметры.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="989" fill="#ffffff" y="0" />
<rect x="20" y="20" width="280" height="142" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="160" y="57" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="160" y="57">MCP Client</tspan></text><text x="160" y="93" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="160" y="93">Клиент протокола</tspan><tspan x="160" y="119">внутри хоста</tspan></text><rect x="600" y="20" width="280" height="142" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="740" y="57" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="740" y="57">MCP Server</tspan></text><text x="740" y="93" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="740" y="93">Предоставляет</tspan><tspan x="740" y="119">инструмент прогноза</tspan><tspan x="740" y="145">погоды</tspan></text><path d="M160 162 L160 969" fill="none" stroke="#777777" stroke-width="2" stroke-dasharray="7 5" />
<path d="M740 162 L740 969" fill="none" stroke="#777777" stroke-width="2" stroke-dasharray="7 5" />
<rect x="20" y="187" width="860" height="73" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<text x="450" y="218" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="218">① Обнаружение возможностей (необязательно для</tspan><tspan x="450" y="246">клиента)</tspan></text><rect x="20" y="445" width="860" height="45" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<text x="450" y="476" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="476">② Обнаружение инструментов</tspan></text><rect x="20" y="741" width="860" height="45" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<text x="450" y="772" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="772">③ Вызов инструмента</tspan></text><text x="450" y="300" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="300">server/discover</tspan></text><path d="M160 315 L740 315" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="375" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="375">Версии протокола и возможности сервера</tspan></text><path d="M740 390 L160 390" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="515" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="515">tools/list</tspan></text><path d="M160 530 L740 530" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="600" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="600">Описание инструмента: get_weather</tspan></text><path d="M740 615 L160 615" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="240" y="635" width="420" height="86" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="661" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="661">location: название города (строка)</tspan></text><text x="450" y="688" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="688">Назначение: погода в указанном</tspan><tspan x="450" y="714">городе</tspan></text><text x="450" y="811" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="811">tools/call: get_weather</tspan></text><path d="M160 826 L740 826" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="860" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="860">arguments: {"location": "Beijing"}</tspan></text><text x="450" y="914" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="914">Результат: Пекин, 22°C, ясно</tspan></text><path d="M740 929 L160 929" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
</svg>