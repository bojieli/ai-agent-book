<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="118.956mm" viewBox="0 0 900 1010" role="img" aria-labelledby="title desc">
<title id="title">Полная структура Agent Trajectory с включёнными Skills</title><desc id="desc">Пример самостоятельной активации PPTX моделью: сначала виден каталог, после активации содержимое добавляется в диалог, затем читается статья и создаётся HTML.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1010" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="100" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Системные инструкции и определения инструментов</tspan></text><text x="450" y="94" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="94">system: правила ассистента tools: Skill, Read, Bash, Write…</tspan></text><rect x="20" y="151" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="165" y="189" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="165" y="189">user</tspan></text><path d="M305 161 L305 203" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="593" y="189" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="593" y="189">Создай мне PPT из PDF статьи</tspan></text><path d="M450 213 L450 229" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="229" width="860" height="62" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="165" y="267" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="165" y="267">Каталог Harness</tspan></text><path d="M305 239 L305 281" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="593" y="267" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="593" y="267">Доступные Skills: pdf, pptx…</tspan></text><path d="M450 291 L450 307" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="307" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="165" y="345" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="165" y="345">assistant</tspan></text><path d="M305 317 L305 359" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="593" y="345" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="593" y="345">call_1 → Skill(skill="pptx")</tspan></text><path d="M450 369 L450 385" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="385" width="860" height="88" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="165" y="423" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="165" y="423">tool · call_1</tspan></text><path d="M305 395 L305 463" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="593" y="423" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="593" y="423">Подтверждение активации PPTX</tspan><tspan x="593" y="449">Skill</tspan></text><path d="M450 473 L450 489" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="489" width="860" height="146" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="165" y="527" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="165" y="527">user ·</tspan></text><text x="165" y="611" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="165" y="611">Внедрение Harness</tspan></text><path d="M305 499 L305 625" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="593" y="527" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="593" y="527">Текст PPTX Skill: процесс,</tspan><tspan x="593" y="553">подробное руководство и точки</tspan><tspan x="593" y="579">входа скриптов</tspan></text><path d="M450 635 L450 651" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="651" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="165" y="689" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="165" y="689">assistant</tspan></text><path d="M305 661 L305 703" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="593" y="689" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="593" y="689">call_2 → Read (PDF статьи)</tspan></text><path d="M450 713 L450 729" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="729" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="165" y="767" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="165" y="767">tool · call_2</tspan></text><path d="M305 739 L305 781" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="593" y="767" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="593" y="767">Текст и графики статьи</tspan></text><path d="M450 791 L450 807" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="807" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="165" y="845" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="165" y="845">assistant</tspan></text><path d="M305 817 L305 859" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="593" y="845" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="593" y="845">call_3 → Write (HTML презентации)</tspan></text><path d="M450 869 L450 885" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="885" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="165" y="923" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="165" y="923">tool · call_3</tspan></text><path d="M305 895 L305 937" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="593" y="923" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="593" y="923">Результат записи: 12,345 байт</tspan></text><text x="450" y="994" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="994">… последующие вызовы инструментов …</tspan></text></svg>