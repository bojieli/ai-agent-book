<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="128.613mm" viewBox="0 0 900 1092" role="img" aria-labelledby="title desc">
<title id="title">Пространство действий Computer Use</title><desc id="desc">Примеры работы с GUI, командами, файлами и формами.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1092" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="244" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Инструмент GUI computer</tspan></text><text x="450" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Мышь: mouse_move · left / right / middle_click</tspan></text><text x="450" y="132" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="132">double / triple_click · left_click_drag · left_mouse_down / up</tspan></text><text x="450" y="164" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="164">Клавиатура: type · key · hold_key</tspan></text><text x="450" y="196" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="196">Прокрутка: scroll (направление, шаги и клавиши-модификаторы)</tspan></text><text x="450" y="228" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="228">Наблюдение: screenshot · cursor_position; ожидание: wait</tspan></text><rect x="20" y="304" width="410" height="275" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="304" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="337" font-size="26" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="337">Выполнение команд bash</tspan></text><text x="225" y="412" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="412">Постоянная сессия терминала</tspan></text><text x="225" y="444" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="444">Метка завершения и обработка</tspan><tspan x="225" y="470">тайм-аутов</tspan></text><text x="225" y="502" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="502">stdout / stderr и код выхода</tspan></text><rect x="470" y="304" width="410" height="275" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="304" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="337" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="337">Интерфейс редактирования</tspan><tspan x="675" y="365">файлов</tspan></text><text x="675" y="412" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="412">view · create · str_replace</tspan></text><text x="675" y="444" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="444">insert · undo_edit</tspan></text><text x="675" y="502" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="502">Проверка совпадения →</tspan><tspan x="675" y="528">изменение → проверка различий</tspan></text><rect x="20" y="619" width="860" height="166" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="619" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="652" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="652">Преобразование изображений и координат</tspan></text><text x="450" y="699" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="699">Реальный экран → изображение от инструмента → координаты модели</tspan></text><text x="450" y="731" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="731">Обратное преобразование → координаты рабочего стола →</tspan><tspan x="450" y="757">исполнитель</tspan></text><path d="M450 785 L450 820" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="820" width="860" height="244" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="820" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="853" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="853">Пример заполнения формы</tspan></text><text x="450" y="900" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="900">① screenshot: получить страницу</tspan></text><text x="450" y="932" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="932">② Модель находит поле имени → mouse_move(324, 156)</tspan></text><text x="450" y="964" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="964">③ left_click: установить фокус ввода</tspan></text><text x="450" y="996" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="996">④ type("John Smith"): ввести имя</tspan></text><text x="450" y="1028" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1028">⑤ Новый снимок: проверить содержимое поля</tspan></text></svg>