<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="105.529mm" viewBox="0 0 900 896" role="img" aria-labelledby="title desc">
<title id="title">Согласование разрешений и двустороннее масштабирование координат</title><desc id="desc">Одна центральная точка на рабочем столе и снимке инструмента с обратным пересчётом.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="896" fill="#ffffff" y="0" />
<text x="215" y="48" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="215" y="48">Реальный экран</tspan></text><text x="705" y="48" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="705" y="48">Снимок от инструмента</tspan></text><rect x="31.0" y="75" width="368" height="207" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<path d="M201 178.5 L229 178.5" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M215 164.5 L215 192.5" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="215" y="316" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="215" y="316">2560 × 1440</tspan></text><rect x="589.0" y="112" width="232" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<path d="M691 177 L719 177" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M705 163 L705 191" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="705" y="276" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="705" y="276">1366 × 768</tspan></text><path d="M410 176 L575 176" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="494" y="148" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="494" y="148">Масштабирование</tspan></text><path d="M790 242 L790 350 L65 350 L65 282" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="455" y="389" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="455" y="389">Точку модели (683, 384) преобразовать обратно в центр</tspan><tspan x="455" y="417">рабочего стола</tspan></text><rect x="20" y="448" width="860" height="178" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="448" width="860" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="481" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="481">Пересчитать по фактическому масштабу в обоих</tspan><tspan x="450" y="509">направлениях</tspan></text><text x="450" y="556" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="556">x = 683 × 2560 / 1366 = 1280</tspan></text><text x="450" y="588" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="588">y = 384 × 1440 / 768 = 720</tspan></text><path d="M450 626 L450 662" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="662" width="860" height="225" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="662" width="860" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="695" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="695">Нажать (1280, 720), сделать новый снимок и проверить</tspan><tspan x="450" y="723">результат</tspan></text><text x="450" y="770" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="770">При наличии полей сначала вычесть отступ, затем разделить на</tspan><tspan x="450" y="796">коэффициент масштаба</tspan></text><text x="450" y="828" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="828">При обрезке или нескольких экранах добавить смещение</tspan><tspan x="450" y="854">соответствующего начала координат</tspan></text></svg>