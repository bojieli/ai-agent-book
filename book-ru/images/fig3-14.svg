<title id="title">Контекстно-зависимый поиск</title><desc id="desc">Исходный документ и целевой фрагмент подаются модели для создания контекстного префикса. Затем префикс индексируется вместе с исходным текстом. В примере сохранён полный фрагмент о росте выручки ACME на 3% во втором квартале 2025 года.</desc>
