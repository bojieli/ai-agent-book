<text x="675" y="381" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="381">Определение символа и</tspan><tspan x="675" y="409">ссылки</tspan></text><text x="675" y="456" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="456">Запрос: ссылки на UserService</tspan></text><text x="675" y="514" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="514">Определение: класс сервиса,</tspan><tspan x="675" y="540">строка 12</tspan></text><text x="675" y="572" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="572">Ссылка: импорт, строка 34</tspan></text><text x="675" y="604" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="604">Ссылка: вызов, строка 56</tspan></text><text x="675" y="636" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="636">Ссылка: тест, строка 8</tspan></text></svg>