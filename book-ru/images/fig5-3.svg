<text x="225" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Поиск по регулярному</tspan><tspan x="225" y="81">выражению (Grep)</tspan></text><text x="225" y="128" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="128">Запрос: def handle_.*</tspan></text><text x="225" y="160" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="160">Строка 42: handle_request</tspan></text><text x="225" y="192" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="192">Строка 89: handle_timeout</tspan></text><text x="225" y="224" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="224">Строка 15: handle_connect</tspan></text><text x="225" y="256" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="256">Возвращает совпадения и их</tspan><tspan x="225" y="282">позиции</tspan></text><rect x="470" y="20" width="410" height="298" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Поиск по именам файлов</tspan><tspan x="675" y="81">(Glob)</tspan></text><text x="675" y="128" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="128">Запрос: **/test_*.py</tspan></text><text x="675" y="160" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="160">tests/test_api.py</tspan></text><text x="675" y="192" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="192">tests/test_auth.py</tspan></text><text x="675" y="224" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="224">tests/unit/test_parser.py</tspan></text><text x="675" y="256" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="256">Находит файлы по шаблону пути</tspan></text><rect x="20" y="348" width="410" height="376" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
