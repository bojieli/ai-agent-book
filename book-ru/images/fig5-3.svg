<text x="225" y="381" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="381">Семантический поиск по</tspan><tspan x="225" y="409">коду</tspan></text><text x="225" y="456" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="456">Запрос: обработка проверки</tspan><tspan x="225" y="482">пользовательского ввода</tspan></text><text x="225" y="514" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="514">validate_input: 0.91</tspan></text><text x="225" y="572" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="572">sanitize_fields: 0.87</tspan></text><text x="225" y="604" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="604">check_params: 0.82</tspan></text><text x="225" y="636" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="636">Отбор кандидатов и</tspan><tspan x="225" y="662">переранжирование (условные</tspan><tspan x="225" y="688">баллы)</tspan></text><rect x="470" y="348" width="410" height="376" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
