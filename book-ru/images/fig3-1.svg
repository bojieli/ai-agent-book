<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="102.467mm" viewBox="0 0 900 870" role="img" aria-labelledby="title desc">
<title id="title">Структура знаний главы</title><desc id="desc">Память пользователя и общая база знаний связаны поиском, объединяющим ключевые факты с деталями по запросу.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="870" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="390" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="59" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="59">Память пользователя</tspan></text><text x="225" y="120" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="120">Уровни записи · трёхуровневая</tspan><tspan x="225" y="146">оценка</tspan></text><text x="225" y="177" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="177">Четыре формата · исполняемое</tspan><tspan x="225" y="203">состояние</tspan></text><text x="225" y="234" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="234">Эпизодическая · семантическая ·</tspan><tspan x="225" y="260">процедурная память</tspan></text><text x="225" y="291" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="291">Mem0 · Memobase</tspan></text><text x="225" y="348" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="348">Сжатие и упорядочение ·</tspan><tspan x="225" y="374">обезличивание журналов</tspan></text><path d="M225 410 L225 450" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="20" width="410" height="390" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="59" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="59">Общая база знаний</tspan></text><text x="675" y="120" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="120">Разбиение документов ·</tspan><tspan x="675" y="146">мультимодальные материалы</tspan></text><text x="675" y="177" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="177">Плотный / разреженный ·</tspan><tspan x="675" y="203">гибридный поиск</tspan></text><text x="675" y="234" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="234">RAPTOR · GraphRAG</tspan></text><text x="675" y="291" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="291">Навигация по каталогам · Agentic</tspan><tspan x="675" y="317">RAG</tspan></text><text x="675" y="348" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="348">Префикс контекста · извлечение</tspan><tspan x="675" y="374">знаний из примеров</tspan></text><path d="M675 410 L675 450" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="450" width="860" height="126" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="486" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="486">Совместная основа: поиск и индексирование</tspan></text><text x="450" y="525" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="525">Разбиение · векторы / ключевые слова · объединение ·</tspan><tspan x="450" y="551">переранжирование</tspan></text><path d="M450 576 L450 616" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="616" width="860" height="229" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="656" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="656">Двухуровневая память</tspan></text><rect x="45" y="681" width="385" height="134" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="237" y="713" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="237" y="713">Структурированные</tspan><tspan x="237" y="741">карточки</tspan></text><text x="237" y="774" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="237" y="774">Ключевые факты и связи</tspan></text><rect x="470" y="681" width="385" height="134" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="662" y="713" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="662" y="713">Контекстно-зависимый</tspan><tspan x="662" y="741">поиск</tspan></text><text x="662" y="774" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="662" y="774">Извлечение исходных деталей</tspan><tspan x="662" y="800">по запросу</tspan></text></svg>