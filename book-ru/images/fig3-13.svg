<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="120.604mm" viewBox="0 0 900 1024" role="img" aria-labelledby="title desc">
<title id="title">Архитектура агентной RAG-системы</title><desc id="desc">Модель и Harness внутри агента организуют цикл поиска; внешние инструменты выполняют поиск и возвращают наблюдения. Интерфейс поиска по базе знаний поддерживает разные индексные бэкенды.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1024" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="423" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="59" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="59">Agent</tspan></text><rect x="45" y="85" width="355" height="318" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="222" y="124" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="222" y="124">Model</tspan></text><text x="222" y="173" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="222" y="173">Анализ задачи → выбор</tspan><tspan x="222" y="199">инструмента</tspan></text><text x="222" y="230" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="222" y="230">Чтение наблюдений → поиск</tspan><tspan x="222" y="256">пробелов в данных</tspan></text><text x="222" y="287" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="222" y="287">Продолжить поиск /</tspan><tspan x="222" y="313">сформировать ответ</tspan></text><rect x="500" y="85" width="355" height="318" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="677" y="124" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="677" y="124">Harness</tspan></text><text x="677" y="173" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="677" y="173">Формирование контекста и</tspan><tspan x="677" y="199">истории</tspan></text><text x="677" y="230" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="677" y="230">Проверка параметров ·</tspan><tspan x="677" y="256">запуск инструментов</tspan></text><text x="677" y="287" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="677" y="287">Состояние · бюджет</tspan><tspan x="677" y="313">выполнения</tspan></text><path d="M400 175 L500 175" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M500 348 L400 348" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="157" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="157">Решение</tspan></text><text x="450" y="381" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="381">Наблюдение</tspan></text><path d="M600 443 L600 518" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
