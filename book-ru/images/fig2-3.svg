<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="101.053mm" viewBox="0 0 900 858" role="img" aria-labelledby="title desc">
<title id="title">Полная последовательность двух вызовов API модели</title><desc id="desc">Время и погода в Ванкувере: модель создаёт два независимых вызова, Harness выполняет их и возвращает результаты с ID, затем модель формирует итоговый ответ.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="858" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="126" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="56" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="56">Первый вызов модели</tspan></text><text x="450" y="93" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="93">messages: system + user tools: инструмент времени + инструмент</tspan><tspan x="450" y="119">погоды</tspan></text><path d="M450 146 L450 183" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="183" width="860" height="145" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="219" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="219">assistant: tool_calls</tspan></text><text x="450" y="261" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="261">call_abc123 → get_current_time(timezone="America/Vancouver")</tspan></text><text x="450" y="302" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="302">call_def456 → get_weather(city="Vancouver", unit="celsius")</tspan></text><path d="M450 328 L450 351 L230 351 L230 386" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 351 L670 351 L670 386" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="386" width="420" height="151" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="230" y="420" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="230" y="420">Инструмент времени</tspan></text><text x="230" y="457" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="230" y="457">call_abc123</tspan></text><text x="230" y="492" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="230" y="492">Возвращает текущее время в</tspan><tspan x="230" y="518">Ванкувере</tspan></text><rect x="460" y="386" width="420" height="151" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="670" y="420" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="670" y="420">Инструмент погоды</tspan></text><text x="670" y="457" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="670" y="457">call_def456</tspan></text><text x="670" y="492" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="670" y="492">Возвращает температуру и</tspan><tspan x="670" y="518">погоду</tspan></text><text x="450" y="374" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="374">Независимые вызовы · Harness запускает параллельно</tspan></text><path d="M230 537 L230 568 L450 568" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M670 537 L670 568 L450 568 L450 602" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="602" width="860" height="126" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="637" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="637">Второй вызов модели · tools без изменений</tspan></text><text x="450" y="677" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="677">Исходные messages + сообщение assistant с вызовами + два</tspan><tspan x="450" y="703">результата с tool_call_id</tspan></text><path d="M450 728 L450 761" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="761" width="860" height="77" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="792" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="792">assistant: итоговый ответ (цикл завершён)</tspan></text><text x="450" y="825" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="825">«Сейчас в Ванкувере… Погода…»</tspan></text></svg>