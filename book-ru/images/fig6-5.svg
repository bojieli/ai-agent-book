<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="91.278mm" viewBox="0 0 900 775" role="img" aria-labelledby="title desc">
<title id="title">Эксперимент 6-2. Прерывание и возобновление асинхронного агента</title><desc id="desc">Ход, отмена и итоги трёх реальных задач-подпроцессов.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="775" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Среда выполнения запускает три фоновые задачи</tspan></text><text x="450" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Возврат task_id, сохранение статуса pending</tspan></text><path d="M150 120 L150 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="160" width="260" height="181" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="160" width="260" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="150" y="193" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="150" y="193">Задача T1</tspan></text><text x="150" y="240" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="150" y="240">+3% за каждый тик</tspan></text><text x="150" y="272" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="150" y="272">Завершается первой</tspan></text><path d="M450 120 L450 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="320" y="160" width="260" height="181" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="320" y="160" width="260" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="193" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="193">Задача T2</tspan></text><text x="450" y="240" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="240">+2% за каждый тик</tspan></text><text x="450" y="272" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="272">Фактический</tspan><tspan x="450" y="298">прогресс: 68%</tspan></text><path d="M750 120 L750 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="620" y="160" width="260" height="181" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="620" y="160" width="260" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="750" y="193" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="750" y="193">Задача T3</tspan></text><text x="750" y="240" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="750" y="240">+1% за каждый тик</tspan></text><text x="750" y="272" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="750" y="272">Фактический</tspan><tspan x="750" y="298">прогресс: 34%</tspan></text><path d="M150 341 L150 381" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="381" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="381" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="414" font-size="26" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="414">Событие завершения T1 → проверка прогресса T2 и T3</tspan></text><text x="450" y="461" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="461">T2 &gt; 50%: продолжить выполнение</tspan></text><text x="450" y="493" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="493">T3 ≤ 50%: cancel_tool(task_id) → подтвердить остановку процесса</tspan></text><path d="M450 526 L450 566" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="566" width="860" height="181" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="566" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="599" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="599">Сбор итоговых статусов и создание отчёта</tspan></text><text x="450" y="646" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="646">T1 и T2 возвращают результаты, T3 — запись об отмене</tspan></text><text x="450" y="678" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="678">Событие завершения связано с исходным ID задачи; конечный статус</tspan><tspan x="450" y="704">каждой задачи записывается</tspan></text></svg>