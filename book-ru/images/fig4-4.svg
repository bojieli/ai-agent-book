<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="124.609mm" viewBox="0 0 900 1058" role="img" aria-labelledby="title desc">
<title id="title">Контекст после динамического поиска: схемы инструментов разбросаны по траектории</title><desc id="desc">Два цикла поиска инструментов: цена акций и анализ участников GitHub. Новые описания входят в историю через tool_search_output и сохраняют своё место в следующих запросах.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1058" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="160" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="55" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="55">Стабильный префикс</tspan></text><text x="450" y="93" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="93">System Prompt</tspan></text><text x="450" y="129" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="129">Основные инструменты: web_search, code_interpreter</tspan></text><text x="450" y="162" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="162">Поиск инструментов: tool_search</tspan></text><path d="M450 180 L450 210" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="210" width="760" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="239" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="239">User</tspan></text><text x="450" y="269" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="269">Узнать цену акций NVDA</tspan></text><path d="M450 284 L450 300" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="300" width="760" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="329" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="329">Assistant</tspan></text><text x="450" y="359" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="359">tool_search_call (цена акций)</tspan></text><path d="M450 374 L450 390" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="390" width="760" height="74" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="419" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="419">tool_search_output</tspan></text><text x="450" y="449" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="449">Полная схема get_stock_quote</tspan></text><path d="M450 464 L450 480" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="480" width="760" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="509" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="509">Assistant → Tool Result</tspan></text><text x="450" y="539" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="539">Вызов get_stock_quote → возврат цены акций</tspan></text><path d="M450 554 L450 570" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="570" width="760" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="599" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="599">User</tspan></text><text x="450" y="629" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="629">Анализ участников репозитория GitHub</tspan></text><path d="M450 644 L450 660" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="660" width="760" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="689" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="689">Assistant</tspan></text><text x="450" y="719" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="719">tool_search_call(GitHub)</tspan></text><path d="M450 734 L450 750" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="750" width="760" height="74" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="779" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="779">tool_search_output</tspan></text><text x="450" y="809" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="809">Полная schema инструментов, включая list_contributors</tspan></text><path d="M450 824 L450 840" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="840" width="760" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="869" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="869">Assistant → Tool Result → ответ</tspan></text><text x="450" y="899" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="899">Вызов инструмента → получение списка участников → анализ</tspan></text><path d="M450 914 L450 945" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="945" width="760" height="88" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<text x="450" y="984" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="984">Следующий раунд: добавление сообщений в конец</tspan><tspan x="450" y="1012">истории</tspan></text></svg>