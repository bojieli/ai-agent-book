<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="125.080mm" viewBox="0 0 900 1062" role="img" aria-labelledby="title desc">
<title id="title">Конвейер LLM-as-a-Judge</title><desc id="desc">Пример оценки ответа о возврате с полными условиями задачи.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1062" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Задача и справочные данные</tspan></text><text x="450" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Возврат оформлен: $150 · срок — 3–5 рабочих дней</tspan></text><text x="450" y="132" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="132">Возврат тем же способом; указать сумму, срок и способ возврата</tspan></text><rect x="20" y="200" width="410" height="241" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="200" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="233" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="233">Rubric</tspan></text><text x="225" y="280" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="280">Точность фактов: обязательно</tspan></text><text x="225" y="338" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="338">Полнота информации: важно</tspan></text><text x="225" y="370" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="370">Ясность изложения: важно</tspan></text><text x="225" y="402" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="402">Выдуманные факты: отклонение</tspan></text><rect x="470" y="200" width="410" height="241" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="200" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="233" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="233">Ответ-кандидат</tspan></text><text x="675" y="280" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="280">Возврат оформлен, $150</tspan><tspan x="675" y="306">поступят</tspan></text><text x="675" y="338" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="338">в течение 3–5 рабочих дней.</tspan></text><path d="M225 441 L225 461 L675 461 L675 441" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 461 L450 491" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="491" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="491" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="524" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="524">Модель-судья</tspan></text><text x="450" y="571" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="571">Сверка по пунктам → балл + цитата-основание + обоснование</tspan></text><path d="M450 596 L450 631" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="631" width="860" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="631" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="664" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="664">Пример структурированного результата</tspan></text><text x="450" y="711" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="711">Факты: 4/4, сумма и срок совпадают</tspan></text><text x="450" y="743" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="743">Полнота: 2/4, не указан возврат тем же способом</tspan></text><text x="450" y="775" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="775">Изложение: 4/4 · Галлюцинации: PASS</tspan></text><path d="M450 806 L450 841" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="841" width="860" height="201" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="841" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="874" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="874">Заданные заранее правила агрегации и проверки</tspan></text><text x="450" y="921" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="921">Взвешивание по важности; условие отклонения → задача провалена</tspan></text><text x="450" y="953" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="953">Независимые оценки нескольких судей → ручная проверка</tspan><tspan x="450" y="979">расхождений</tspan></text><text x="450" y="1011" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1011">Связь низких оценок с ответом и исходной трассой</tspan></text></svg>