<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="86.213mm" viewBox="0 0 900 732" role="img" aria-labelledby="title desc">
<title id="title">Механизм оценки BM25</title><desc id="desc">При прочих равных показано, как на оценку слова запроса влияют частота слова, длина документа и частота документов.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="732" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="230" height="180" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="135" y="104" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="135" y="104">Насыщение</tspan><tspan x="135" y="132">частоты слова</tspan></text><text x="573.3" y="58" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="573.3" y="58">k₁ = 1.5, документ средней длины</tspan></text><text x="565" y="103" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="565" y="103">1, 2 и 3 вхождения</tspan></text><text x="565" y="178" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="565" y="178">Фактор частоты: 1.00 → 1.43 → 1.67</tspan></text><rect x="20" y="218" width="860" height="206" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="218" width="230" height="206" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="135" y="302" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="135" y="302">Нормализация</tspan><tspan x="135" y="330">по длине</tspan></text><text x="573.3" y="256" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="573.3" y="256">k₁ = 1.5, b = 0.75, частота слова — 1</tspan></text><text x="565" y="301" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="565" y="301">Длина документа растёт от</tspan><tspan x="565" y="327">средней до удвоенной</tspan></text><text x="565" y="402" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="565" y="402">Фактор частоты: 1.00 → 0.69</tspan></text><rect x="20" y="442" width="860" height="262" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="442" width="230" height="262" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="135" y="526" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="135" y="526">Обратная</tspan><tspan x="135" y="554">частота</tspan><tspan x="135" y="582">документов</tspan></text><text x="565" y="480" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="565" y="480">В корпусе 10 документов</tspan></text><text x="565" y="525" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="565" y="525">«модель» встречается в 3</tspan><tspan x="565" y="551">документах, «дистилляция» — в 2</tspan></text><text x="565" y="654" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="565" y="654">IDF: «модель» — 0.762, «дистилляция» —</tspan><tspan x="565" y="682">1.224</tspan></text></svg>