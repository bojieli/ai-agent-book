<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="130.498mm" viewBox="0 0 900 1108" role="img" aria-labelledby="title desc">
<title id="title">Процесс SQL-запроса в Agent</title><desc id="desc">Сервис контролируемого выполнения связывает базу данных с интерфейсом, а модель при необходимости поясняет агрегированные результаты.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1108" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Вопрос пользователя</tspan></text><text x="450" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Сколько действующих сотрудников в каждом отделе?</tspan></text><path d="M450 130 L450 170" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="170" width="860" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="170" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="203" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="203">Agent создаёт SQL Artifact</tspan></text><text x="450" y="250" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="250">SELECT department, COUNT(emp_id) AS active_count</tspan></text><text x="450" y="282" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="282">FROM employees WHERE leave_date IS NULL</tspan></text><text x="450" y="314" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="314">GROUP BY department;</tspan></text><path d="M450 350 L450 395" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="395" width="860" height="202" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="395" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="428" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="428">Сервис контролируемого выполнения</tspan></text><text x="450" y="475" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="475">Проверенный доступ · права на таблицы / столбцы / строки · проверка</tspan><tspan x="450" y="501">структуры запроса</tspan></text><text x="450" y="533" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="533">Привязка параметров · лимиты времени и строк · ограниченное</tspan><tspan x="450" y="559">подключение к БД</tspan></text><path d="M450 597 L450 617 L225 617 L225 637" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="637" width="410" height="242" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="637" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="670" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="670">Результат из БД (фрагмент)</tspan></text><text x="225" y="717" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="717">Отдел Сотрудников</tspan></text><text x="225" y="749" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="749">Маркетинг 9</tspan></text><text x="225" y="807" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="807">Разработка 5</tspan></text><rect x="470" y="637" width="410" height="242" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="637" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="670" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="670">Отображение</tspan></text><text x="675" y="717" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="717">Показать таблицу результатов</tspan></text><text x="675" y="749" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="749">Построить столбчатую</tspan><tspan x="675" y="775">диаграмму по тем же данным</tspan></text><text x="675" y="807" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="807">Сохранить фильтры, единицы и</tspan><tspan x="675" y="833">методику расчёта</tspan></text><path d="M430 732 L470 732" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="934" width="860" height="146" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="934" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="967" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="967">Пояснение по запросу</tspan></text><text x="450" y="1014" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1014">Передать модели нужные итоги для объяснения различий или ответа</tspan><tspan x="450" y="1040">на уточнения</tspan></text><path d="M225 879 L225 909 L450 909 L450 934" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
</svg>