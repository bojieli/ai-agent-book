<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="145.809mm" viewBox="0 0 900 1238" role="img" aria-labelledby="title desc">
<title id="title">Конвейер Agent, создающего другие Agent</title><desc id="desc">Обе схемы генерации используют общие критерии приёмки; качество и стоимость создания фиксируются отдельно.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1238" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="146" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Запрос пользователя</tspan></text><text x="450" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Создать Agent проверки релиза: прочитать результаты проверки</tspan><tspan x="450" y="126">развёртывания и решить, можно ли выпускать релиз</tspan></text><path d="M450 166 L450 186" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 216 L225 186 L675 186 L675 216" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="216" width="410" height="364" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="216" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="249" font-size="25" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="249">Схема A: генерация с нуля</tspan></text><text x="225" y="324" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="324">Реализация цикла выполнения и</tspan><tspan x="225" y="350">обработки сообщений</tspan></text><text x="225" y="408" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="408">Реализовать протокол</tspan><tspan x="225" y="434">инструментов и предметные</tspan><tspan x="225" y="460">инструменты</tspan></text><text x="225" y="492" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="492">Добавить CLI и тесты</tspan></text><rect x="470" y="216" width="410" height="364" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="216" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="249" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="249">Путь B: адаптация</tspan><tspan x="675" y="277">эталонной реализации</tspan></text><text x="675" y="324" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="324">Скопировать эталонный каркас</tspan><tspan x="675" y="350">чтения структурированных</tspan><tspan x="675" y="376">записей</tspan></text><text x="675" y="408" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="408">Заполнить статусы проверок и</tspan><tspan x="675" y="434">условия прохождения</tspan></text><text x="675" y="492" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="492">Создать предметные промпты,</tspan><tspan x="675" y="518">определения и описания</tspan><tspan x="675" y="544">инструментов</tspan></text><path d="M225 580 L225 625 L675 625 L675 580" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 625 L450 670" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="670" width="860" height="217" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="670" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="703" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="703">Совместная приёмка</tspan></text><text x="450" y="750" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="750">Структура файлов и сборка → генерация тестов → стандартное</tspan><tspan x="450" y="776">сопоставление вызовов инструментов</tspan></text><text x="450" y="808" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="808">Задачи реальной модели → многошаговое состояние → обрезка</tspan><tspan x="450" y="834">контекста и ограничения вызовов</tspan></text><path d="M450 887 L450 907" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 932 L225 907 L675 907 L675 932" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="932" width="410" height="278" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="932" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="965" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="965">Качество выполнения</tspan></text><text x="225" y="1012" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="1012">Выполнена ли предметная</tspan><tspan x="225" y="1038">задача</tspan></text><text x="225" y="1070" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="1070">Связаны ли сообщения с</tspan><tspan x="225" y="1096">результатами инструментов</tspan></text><text x="225" y="1128" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="1128">Корректны ли состояние и</tspan><tspan x="225" y="1154">завершение</tspan></text><rect x="470" y="932" width="410" height="278" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="932" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="965" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="965">Затраты на создание</tspan></text><text x="675" y="1012" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="1012">Время создания</tspan></text><text x="675" y="1070" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="1070">Объём ввода и вывода модели</tspan></text><text x="675" y="1128" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="1128">Число циклов правок и проверок</tspan></text></svg>