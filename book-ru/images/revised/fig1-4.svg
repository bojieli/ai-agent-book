<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="148.636mm" viewBox="0 0 900 1262" role="img" aria-labelledby="title desc">
<title id="title">Траектория агента — цикл ReAct для сводки по нескольким валютам</title><desc id="desc">Системный промпт и определения инструментов образуют стабильный префикс; на каждом ходе добавляется накопленная история. Три хода: конвертация, расчёт, выдача результата.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1262" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="116" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="57" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="57">Относительно стабильный префикс</tspan></text><text x="450" y="91" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="91">Системный промпт + определения инструментов: convert_currency,</tspan><tspan x="450" y="117">code_interpreter</tspan></text><rect x="110" y="161" width="770" height="156" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="495" y="194" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="495" y="194">user</tspan></text><text x="495" y="229" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="229">Q1: 2,5 млн USD; Q2: 2,1 млн EUR</tspan></text><text x="495" y="262" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="262">Q3: 1,8 млн GBP; Q4: 380 млн JPY; найти годовой итог и среднее</tspan><tspan x="495" y="288">за квартал</tspan></text><text x="60" y="372" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="60" y="372">Ход 1</tspan></text><rect x="110" y="337" width="770" height="235" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="495" y="372" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="495" y="372">assistant.reasoning</tspan></text><text x="495" y="407" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="407">Конвертировать доходы в EUR, GBP и JPY в USD</tspan></text><text x="495" y="446" font-size="25" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="495" y="446">assistant.tool_calls (первый ID: convert_currency_0)</tspan></text><text x="495" y="482" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="482">convert_currency(2100000, "EUR", "USD")</tspan></text><text x="495" y="515" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="515">convert_currency(1800000, "GBP", "USD")</tspan></text><text x="495" y="548" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="548">convert_currency(380000000, "JPY", "USD")</tspan></text><rect x="110" y="587" width="770" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="495" y="622" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="495" y="622">tool · первый tool_call_id: convert_currency_0</tspan></text><text x="495" y="657" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="657">EUR → 2,282,608.70 USD; GBP → 2,278,481.01 USD</tspan></text><text x="495" y="688" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="688">JPY → 2,541,806.02 USD</tspan></text><text x="60" y="752" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="60" y="752">Ход 2</tspan></text><rect x="110" y="722" width="770" height="235" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="495" y="758" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="495" y="758">assistant.reasoning</tspan></text><text x="495" y="793" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="793">Прочитать результаты конвертации, сложить и разделить на 4</tspan></text><text x="495" y="832" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="495" y="832">assistant.tool_calls → code_interpreter</tspan></text><text x="495" y="870" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="870">total = 2500000 + 2282608.70 + 2278481.01 + 2541806.02</tspan></text><text x="495" y="903" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="903">average = total / 4</tspan></text><text x="495" y="936" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="936">print(round(total, 2), round(average, 2))</tspan></text><rect x="110" y="972" width="770" height="85" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="495" y="1005" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="495" y="1005">tool: результат расчёта</tspan></text><text x="495" y="1040" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="1040">9602895.73 2400723.93</tspan></text><text x="60" y="1112" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="60" y="1112">Ход 3</tspan></text><rect x="110" y="1082" width="770" height="150" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="495" y="1117" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="495" y="1117">assistant.content</tspan></text><text x="495" y="1158" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="1158">Годовой доход: 9,602,895.73 USD</tspan></text><text x="495" y="1198" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495" y="1198">Средний квартальный доход: 2,400,723.93 USD</tspan></text><path d="M495 136 L495 161" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M495 317 L495 337" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M495 572 L495 587" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M495 697 L495 722" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M495 957 L495 972" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M495 1057 L495 1082" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
</svg>