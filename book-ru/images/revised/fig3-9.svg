<title id="title">Конвейер гибридного поиска и реранжирования</title><desc id="desc">Запрос XR-7003 из эксперимента 3-6. Два вида поиска оценивают документы отдельно, RRF объединяет их по рангам. После реранжирования первое место не меняется, второе — меняется.</desc>
