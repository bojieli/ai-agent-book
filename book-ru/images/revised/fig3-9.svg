<text x="450" y="449" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="449">RRF объединяет ранги и суммирует оценки одного</tspan><tspan x="450" y="477">документа</tspan></text><text x="450" y="522" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="522">xr_7003: 1/61 + 1/61 ≈ 0.0328, по-прежнему первый</tspan></text><text x="450" y="559" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="559">Далее: xr_7001, xr_7004</tspan></text><path d="M450 576 L450 625" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
