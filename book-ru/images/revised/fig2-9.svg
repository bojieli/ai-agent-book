<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="57.711mm" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
<title id="title">Сообщение пользователя и результат инструмента в шаблоне Qwen3</title><desc id="desc">Один текст поступает от пользователя и от инструмента. Обе части начинаются с маркера user, но результат инструмента дополнительно помечен тегом tool_response.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="490" fill="#ffffff" y="0" />
<rect x="20" y="20" width="420" height="164" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="230" y="60" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="230" y="60">Сообщение пользователя</tspan></text><text x="230" y="130" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="230" y="130">role: "user"</tspan></text><text x="230" y="168" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="230" y="168">content: "Ванкувер 17.9 °C"</tspan></text><path d="M230 184 L230 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="220" width="420" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="230" y="261" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="230" y="261">&lt;|im_start|&gt;user</tspan></text><text x="230" y="304" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="230" y="304">Ванкувер 17.9 °C&lt;|im_end|&gt;</tspan></text><rect x="460" y="20" width="420" height="164" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="670" y="60" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="670" y="60">Результат погодного</tspan><tspan x="670" y="88">инструмента</tspan></text><text x="670" y="130" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="670" y="130">role: "tool"</tspan></text><text x="670" y="168" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="670" y="168">content: "Ванкувер 17.9 °C"</tspan></text><path d="M670 184 L670 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="460" y="220" width="420" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="670" y="261" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="670" y="261">&lt;|im_start|&gt;user</tspan></text><text x="670" y="304" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="670" y="304">&lt;tool_response&gt;</tspan></text><text x="670" y="347" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="670" y="347">Ванкувер 17.9 °C</tspan></text><text x="670" y="390" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="670" y="390">&lt;/tool_response&gt;&lt;|im_end|&gt;</tspan></text><text x="450" y="469" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="469">Затем в обоих случаях ответ генерируется с &lt;|im_start|&gt;assistant</tspan></text></svg>