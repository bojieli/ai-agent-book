<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="117.660mm" viewBox="0 0 900 999" role="img" aria-labelledby="title desc">
<title id="title">Три стратегии обработки асинхронных событий</title><desc id="desc">От нового события к моменту обработки и судьбе исходной задачи и нового события.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="999" fill="#ffffff" y="0" />
<text x="450" y="48" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="48">Что делать с исходной задачей при новом событии?</tspan></text><rect x="20" y="82" width="210" height="236" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="177" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="125" y="177">Отмена</tspan></text><rect x="240" y="82" width="640" height="236" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="560" y="122" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="560" y="122">Пользователь говорит: «Остановись»</tspan></text><text x="560" y="175" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="560" y="175">Прекратить новые действия,</tspan><tspan x="560" y="201">запросить отмену</tspan></text><text x="560" y="257" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="560" y="257">Уточнить, что уже выполнено, записать конечное</tspan><tspan x="560" y="283">состояние</tspan></text><rect x="20" y="354" width="210" height="264" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="477" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="125" y="477">Очередь</tspan></text><rect x="240" y="354" width="640" height="264" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="560" y="394" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="560" y="394">Пользователь уточняет: «Только за</tspan><tspan x="560" y="422">последний месяц»</tspan></text><text x="560" y="475" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="560" y="475">Поиск ещё идёт — поставить</tspan><tspan x="560" y="501">уточнение в очередь</tspan></text><text x="560" y="557" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="560" y="557">После результатов поиска учесть новый диапазон</tspan><tspan x="560" y="583">дат</tspan></text><rect x="20" y="654" width="210" height="317" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="777" font-size="23" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="125" y="777">Параллельная</tspan><tspan x="125" y="804">обработка</tspan></text><rect x="240" y="654" width="640" height="317" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="560" y="694" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="560" y="694">Во время фонового анализа пользователь</tspan><tspan x="560" y="722">спрашивает о погоде</tspan></text><text x="560" y="775" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="560" y="775">Узнать погоду в отдельном</tspan><tspan x="560" y="801">контексте, продолжить основную</tspan><tspan x="560" y="827">задачу</tspan></text><text x="560" y="910" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="560" y="910">Отдельно сохранить ответ о погоде и результат</tspan><tspan x="560" y="936">анализа</tspan></text></svg>