<text x="272" y="1006" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="272" y="1006">create_issue</tspan></text><text x="548" y="1006" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="548" y="1006">0.12</tspan></text><text x="718" y="1006" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="718" y="1006">Создание</tspan><tspan x="718" y="1032">Issue</tspan></text><text x="450" y="1126" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1126">Три серых пункта: полные описания возвращаются в результатах поиска</tspan></text></svg>