<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="135.916mm" viewBox="0 0 900 1154" role="img" aria-labelledby="title desc">
<title id="title">Иерархический подбор инструментов (семантический поиск: сервер → инструмент)</title><desc id="desc">Пример: сначала выбирается сервер GitHub, затем — три наиболее похожих инструмента. Число инструментов и оценки иллюстрируют процесс.</desc>
