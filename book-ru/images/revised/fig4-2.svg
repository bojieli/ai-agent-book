<text x="100" y="288" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="100" y="288">GitHub</tspan></text><text x="100" y="323" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="100" y="323">0.92</tspan></text><rect x="195" y="253" width="160" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
