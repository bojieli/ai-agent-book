<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="118.956mm" viewBox="0 0 900 1010" role="img" aria-labelledby="title desc">
<title id="title">Схема марковского процесса принятия решений (MDP)</title><desc id="desc">Комната — лишь один компонент состояния; переход зависит также от предметов, дверей и стражника.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1010" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="131" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">MDP: S · A · P · R · γ</tspan></text><text x="450" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Множество состояний · множество действий · распределение</tspan><tspan x="450" y="126">переходов · награда · коэффициент дисконтирования</tspan></text><rect x="20" y="191" width="860" height="136" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="191" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="224" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="224">Положение: 5 комнат</tspan></text><text x="450" y="271" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="271">Вестибюль · кладовая · северный коридор · комната стражника ·</tspan><tspan x="450" y="297">сокровищница</tspan></text><rect x="20" y="367" width="410" height="262" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="367" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="400" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="400">Текущее состояние s</tspan></text><text x="225" y="447" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="447">Положение: кладовая</tspan></text><text x="225" y="479" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="479">Предметы: красный ключ</tspan></text><text x="225" y="537" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="537">Дверь: заперта</tspan></text><text x="225" y="595" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="595">Стражник: жив</tspan></text><rect x="470" y="367" width="410" height="262" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="367" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="400" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="400">Действие a</tspan></text><text x="675" y="447" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="447">Восток / запад / юг / север</tspan></text><text x="675" y="479" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="479">Подбор предмета / атака /</tspan><tspan x="675" y="505">создание</tspan></text><text x="675" y="537" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="537">Параметр: направление или</tspan><tspan x="675" y="563">целевой предмет</tspan></text><path d="M225 629 L225 652 L675 652 L675 629" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 652 L450 679" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="679" width="860" height="201" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="679" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="712" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="712">Переход P(s′ | s, a) и награда R</tspan></text><text x="450" y="759" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="759">Есть ключ + проход через запертую дверь → обновление позиции и</tspan><tspan x="450" y="785">состояния двери</tspan></text><text x="450" y="817" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="817">Есть серебряный меч + атака стража → обновление состояния стража</tspan></text><text x="450" y="849" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="849">Получение сокровища → завершение, r = +100</tspan></text><rect x="20" y="920" width="860" height="55" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="956" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="956">Коэффициент дисконтирования γ = 0.99</tspan></text></svg>