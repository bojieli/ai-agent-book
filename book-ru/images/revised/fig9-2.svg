<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="132.971mm" viewBox="0 0 900 1129" role="img" aria-labelledby="title desc">
<title id="title">Три уровня проверки траектории: от результатов среды до рубрики LLM</title><desc id="desc">Пример: сверить обещание полной компенсации со статусом операции, полномочиями, сроками и ответом поддержки.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1129" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="141" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Проверка одного возврата</tspan></text><text x="450" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Пользователь запросил полный возврат; поддержка ответила: «Вся</tspan><tspan x="450" y="126">сумма возвращена, поступит в течение семи дней».</tspan></text><rect x="20" y="216" width="430" height="167" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="216" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="249" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="235" y="249">Проверка результата</tspan></text><text x="235" y="322" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="235" y="322">Данные заказа: возвращена лишь</tspan><tspan x="235" y="348">часть суммы</tspan></text><path d="M450 274 L502 274" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="216" width="378" height="167" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="274" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="691" y="274">Полный возврат ещё не</tspan><tspan x="691" y="300">выполнен</tspan></text><rect x="20" y="418" width="430" height="167" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="418" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="451" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="235" y="451">Проверка процесса</tspan></text><text x="235" y="524" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="235" y="524">Журнал действий: возврат</tspan><tspan x="235" y="550">отправлен</tspan></text><path d="M450 476 L502 476" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="418" width="378" height="167" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="476" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="691" y="476">Нужно также проверить</tspan><tspan x="691" y="502">полномочия и срок зачисления</tspan></text><rect x="20" y="620" width="430" height="167" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="620" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="653" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="235" y="653">Качество · рубрика LLM</tspan></text><text x="235" y="726" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="235" y="726">Текст ответа: заявлены «вся</tspan><tspan x="235" y="752">сумма» и «семь дней»</tspan></text><path d="M450 678 L502 678" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="620" width="378" height="167" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="678" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="691" y="678">Оценка формулировки не</tspan><tspan x="691" y="704">заменяет проверку заказа</tspan></text><rect x="20" y="823" width="860" height="278" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="823" width="860" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="856" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="856">Записать в оценку траектории для последующей</tspan><tspan x="450" y="884">диагностики</tspan></text><text x="450" y="931" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="931">Результат задачи: выполнена частично; метка проблемы: обещанная</tspan><tspan x="450" y="957">сумма не совпадает с фактической</tspan></text><text x="450" y="989" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="989">Источники доказательств: заказ, журнал операций и слова поддержки</tspan></text><text x="450" y="1021" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1021">Нужно проверить: основание для срока в семь дней; сохранить записи</tspan><tspan x="450" y="1047">для независимой проверки</tspan></text></svg>