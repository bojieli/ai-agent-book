<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="146.044mm" viewBox="0 0 900 1240" role="img" aria-labelledby="title desc">
<title id="title">OpenVLA и среда воплощённого ИИ RoboTwin2</title><desc id="desc">Адаптация стратегии, управление суставами и обратная связь среды</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1240" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Задача: положить банку в кастрюлю</tspan></text><text x="450" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Инструкция + наблюдение → адаптация входа стратегии</tspan></text><path d="M225 120 L225 155" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 120 L675 155" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="155" width="410" height="263" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="155" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="188" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="188">Настройка наблюдений</tspan></text><text x="225" y="235" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="235">RGB: голова / левое запястье /</tspan><tspan x="225" y="261">правое запястье</tspan></text><text x="225" y="293" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="293">Пример изображения: 224 × 224</tspan></text><text x="225" y="351" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="351">Состояние суставов двух рук: 14</tspan><tspan x="225" y="377">измерений</tspan></text><rect x="470" y="155" width="410" height="263" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="155" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="188" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="188">Интерфейс стратегии</tspan></text><text x="675" y="235" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="235">OpenVLA: Llama 2 7B</tspan></text><text x="675" y="293" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="293">DINOv2 / SigLIP → визуальные</tspan><tspan x="675" y="319">tokens</tspan></text><text x="675" y="351" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="351">Адаптация задачи: вход и выход</tspan><tspan x="675" y="377">действий</tspan></text><path d="M430 276 L470 276" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 418 L675 458" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="458" width="860" height="237" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="458" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="491" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="491">Адаптация действий и управление</tspan></text><text x="450" y="538" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="538">По 6 суставов и 1 полю захвата на руку — всего 14 измерений</tspan></text><text x="450" y="570" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="570">Проверить порядок, нормализацию, частоту управления и ограничения</tspan><tspan x="450" y="596">суставов</tspan></text><text x="450" y="628" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="628">Блочная стратегия: вывести H шагов → выполнить h шагов → новое</tspan><tspan x="450" y="654">наблюдение</tspan></text><path d="M450 695 L450 735" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="735" width="860" height="211" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="735" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="768" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="768">RoboTwin2 · среда симуляции SAPIEN</tspan></text><text x="450" y="815" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="815">move_can_pot: объект, кастрюля и двурукий робот</tspan></text><text x="450" y="847" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="847">Рандомизация позиции / ориентации / вида · столкновения / контакты /</tspan><tspan x="450" y="873">трение</tspan></text><text x="450" y="905" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="905">Управление → обновление объектов и суставов → наблюдение камерой</tspan></text><path d="M20 830 L6 830 L6 276 L20 276" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 946 L450 991" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="991" width="860" height="221" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="991" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="1024" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="1024">Оценка и сброс</tspan></text><text x="450" y="1071" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1071">Условие успеха: целевое состояние объекта и контейнера</tspan></text><text x="450" y="1103" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1103">Время выполнения / шаги управления · тип сбоя</tspan></text><text x="450" y="1135" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1135">Фиксированный seed и диапазон рандомизации → reset → следующий</tspan><tspan x="450" y="1161">episode</tspan></text></svg>