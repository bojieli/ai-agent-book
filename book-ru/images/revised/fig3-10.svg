<title id="title">Иерархический древовидный индекс RAPTOR</title><desc id="desc">Исходные документы разбиваются на блоки, группируются по эмбеддингам и суммируются. Затем рекурсивно создаются сводки верхних уровней. Стрелки показывают направление построения индекса.</desc>
