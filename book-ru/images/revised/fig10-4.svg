<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="101.524mm" viewBox="0 0 900 862" role="img" aria-labelledby="title desc">
<title id="title">Последовательная координация Manager</title><desc id="desc">Manager поочерёдно вызывает участников сбора, анализа и написания и получает их результаты.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="862" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Manager · Планирование и диспетчеризация</tspan></text><text x="450" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Инструменты: call_agent_A / call_agent_B / call_agent_C</tspan></text><text x="450" y="132" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="132">Вспомогательные инструменты: search / write_file</tspan></text><text x="450" y="164" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="164">Следующий шаг определяется по результатам</tspan></text><path d="M125 200 L125 834" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="255" width="550" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="255" width="550" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="575" y="288" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="575" y="288">Agent A · Сбор материалов</tspan></text><text x="575" y="335" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="575" y="335">Поиск технической документации</tspan></text><text x="575" y="367" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="575" y="367">Извлечение ключевых фактов и источников</tspan></text><path d="M125 285 L300 285" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="270" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="210" y="270">1. Вызов</tspan></text><path d="M300 375 L125 375" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="410" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="210" y="410">Материалы и источники</tspan></text><rect x="300" y="449" width="550" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="449" width="550" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="575" y="482" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="575" y="482">Agent B · Анализ данных</tspan></text><text x="575" y="529" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="575" y="529">Сравнение вариантов и статистики</tspan></text><text x="575" y="561" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="575" y="561">Сводка выводов и обоснований</tspan></text><path d="M125 479 L300 479" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="464" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="210" y="464">2. Вызов</tspan></text><path d="M300 569 L125 569" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="604" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="210" y="604">Результаты анализа</tspan></text><rect x="300" y="643" width="550" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="643" width="550" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="575" y="676" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="575" y="676">Agent C · Создание отчёта</tspan></text><text x="575" y="723" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="575" y="723">Построение структуры отчёта</tspan></text><text x="575" y="755" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="575" y="755">Форматирование и запись по требованиям</tspan></text><path d="M125 673 L300 673" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="658" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="210" y="658">3. Вызов</tspan></text><path d="M300 763 L125 763" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="798" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="210" y="798">Файл отчёта</tspan></text></svg>