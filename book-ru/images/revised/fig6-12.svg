<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="93.869mm" viewBox="0 0 900 797" role="img" aria-labelledby="title desc">
<title id="title">Цикл восприятия, мышления и действий Computer Use Agent</title><desc id="desc">Скриншот, выбор и выполнение действия, возврат нового наблюдения.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="797" fill="#ffffff" y="0" />
<rect x="65" y="20" width="770" height="135" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="65" y="20" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">① Получить наблюдение</tspan></text><text x="450" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Скриншот рабочего стола / браузера / приложения</tspan></text><text x="450" y="132" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="132">Зафиксировать размер изображения и состояние интерфейса</tspan></text><path d="M450 155 L450 190" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="65" y="190" width="770" height="135" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="65" y="190" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="223" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="223">② Решение модели</tspan></text><text x="450" y="270" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="270">Вход: скриншот + задача + история и текущее состояние</tspan></text><text x="450" y="302" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="302">Пример выхода: нажать поле адреса доставки click(512, 250)</tspan></text><path d="M450 325 L450 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="65" y="360" width="770" height="248" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="65" y="360" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="393" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="393">③ Выполнить действие</tspan></text><text x="450" y="440" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="440">Проверка и диспетчеризация на уровне инструментов → xdotool</tspan><tspan x="450" y="466">/ Playwright</tspan></text><text x="450" y="498" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="498">Мышь: перемещение, щелчок, перетаскивание · клавиатура:</tspan><tspan x="450" y="524">ввод, сочетания клавиш</tspan></text><text x="450" y="556" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="556">Прокрутка: изменить область просмотра · ожидание:</tspan><tspan x="450" y="582">дождаться реакции интерфейса</tspan></text><path d="M450 608 L450 643" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="65" y="643" width="770" height="126" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
