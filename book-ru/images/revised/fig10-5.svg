<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="126.964mm" viewBox="0 0 900 1078" role="img" aria-labelledby="title desc">
<title id="title">Архитектура Agent для перевода книги</title><desc id="desc">Термины, перевод по главам, редактура и общие результаты.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1078" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="136" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Manager</tspan></text><text x="450" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Разделение глав · Отслеживание прогресса · Обработка ошибок ·</tspan><tspan x="450" y="126">Сборка перевода</tspan></text><path d="M450 156 L450 176 L225 176 L225 201" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 176 L675 176 L675 201" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="201" width="410" height="290" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="201" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="234" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="234">Glossary Agent</tspan></text><text x="225" y="281" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="281">Чтение оригинала, составление</tspan><tspan x="225" y="307">списка терминов и частей речи</tspan></text><text x="225" y="339" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="339">embedding (существительное)</tspan></text><text x="225" y="397" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="397">Утвердить перевод: «вектор</tspan><tspan x="225" y="423">эмбеддинга»</tspan></text><text x="225" y="455" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="455">Результат: JSON-глоссарий</tspan></text><rect x="470" y="201" width="410" height="290" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="201" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="234" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="234">Translation Agent × N</tspan></text><text x="675" y="281" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="281">Вход: глава + глоссарий +</tspan><tspan x="675" y="307">руководство</tspan></text><text x="675" y="339" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="339">Переводить каждую главу</tspan><tspan x="675" y="365">отдельно</tspan></text><text x="675" y="397" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="397">Сохранять соответствие</tspan><tspan x="675" y="423">оригинала и перевода</tspan></text><text x="675" y="455" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="455">Результат: перевод главы</tspan></text><path d="M430 378 L470 378" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 491 L675 536" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="536" width="410" height="298" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="536" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="569" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="569">Proofreading Agent</tspan></text><text x="675" y="616" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="616">Сверять перевод каждой главы с</tspan><tspan x="675" y="642">глоссарием</tspan></text><text x="675" y="674" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="674">Проверять единообразие</tspan><tspan x="675" y="700">терминов и стиля</tspan></text><text x="675" y="732" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="732">Отмечать сомнения в отчёте</tspan></text><text x="675" y="790" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="790">Результат: отчёт о проверке</tspan></text><rect x="20" y="536" width="410" height="298" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="536" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="569" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="569">Исправление перевода</tspan></text><text x="225" y="616" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="616">Manager решает по отчёту,</tspan><tspan x="225" y="642">нужна ли доработка</tspan></text><text x="225" y="674" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="674">Сверять термины с оригиналом</tspan></text><text x="225" y="732" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="732">Сохранять исправленный</tspan><tspan x="225" y="758">перевод главы</tspan></text><path d="M470 618 L430 618" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="870" width="860" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="870" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="903" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="903">Общие результаты</tspan></text><text x="450" y="950" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="950">Глоссарий: glossary.json</tspan></text><text x="450" y="982" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="982">Переводы глав: chapter{n}_zh.md</tspan></text><text x="450" y="1014" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1014">Отчёт о проверке: proofreading_report.json</tspan></text><path d="M225 834 L225 870" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 834 L675 870" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
