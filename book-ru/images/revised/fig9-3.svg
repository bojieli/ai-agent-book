<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="93.162mm" viewBox="0 0 900 791" role="img" aria-labelledby="title desc">
<title id="title">Четыре точки обновления медицинского Agent</title><desc id="desc">Одна система распознаёт изображение моделью, рассчитывает показатели программой, ищет рекомендации и оформляет результат по регламенту.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="791" fill="#ffffff" y="0" />
<text x="450" y="48" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="48">Где можно изменить один и тот же отчёт по снимку?</tspan></text><rect x="48" y="90" width="350" height="223" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="48" y="90" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="123" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="223" y="123">Параметры модели</tspan></text><text x="223" y="170" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="223" y="170">Распознать объект на</tspan><tspan x="223" y="196">снимке</tspan></text><text x="223" y="228" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="223" y="228">При ошибках распознавания</tspan><tspan x="223" y="254">улучшить модель</tspan><tspan x="223" y="280">восприятия</tspan></text><rect x="500" y="90" width="352" height="223" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="500" y="90" width="352" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="123" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="676" y="123">Программа</tspan></text><text x="676" y="170" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="676" y="170">Рассчитать показатели по</tspan><tspan x="676" y="196">результатам распознавания</tspan></text><text x="676" y="228" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="676" y="228">При изменении правил</tspan><tspan x="676" y="254">расчёта изменить код</tspan></text><path d="M398 167 L500 167" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="48" y="402" width="350" height="223" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="48" y="402" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="435" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="223" y="435">База знаний</tspan></text><text x="223" y="482" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="223" y="482">Найти применимые пункты</tspan><tspan x="223" y="508">рекомендаций</tspan></text><text x="223" y="540" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="223" y="540">При обновлении</tspan><tspan x="223" y="566">рекомендаций обновить</tspan><tspan x="223" y="592">источник</tspan></text><rect x="500" y="402" width="352" height="223" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="500" y="402" width="352" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="435" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="676" y="435">Инструкции (Skill)</tspan></text><text x="676" y="482" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="676" y="482">Оформить результаты</tspan><tspan x="676" y="508">расчёта по регламенту</tspan></text><text x="676" y="540" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="676" y="540">Указать использованные</tspan><tspan x="676" y="566">рекомендации и их версии</tspan></text><path d="M398 478 L500 478" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M676 313 L676 402" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="565" y="366" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="565" y="366">Значения показателей</tspan></text><path d="M676 625 L676 661" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="661" width="412" height="102" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="709" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="676" y="709">Черновик отчёта для</tspan><tspan x="676" y="737">проверки человеком</tspan></text></svg>