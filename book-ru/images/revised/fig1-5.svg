<title id="title">Вызов инструментов под управлением модели: клиентский и серверный циклы</title><desc id="desc">Цикл поиска Kimi организует клиент, а управляемые поиск и выполнение кода — сервер. Показаны задача, запросы, результаты и этапы анализа.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
