<text x="160" y="239" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="160" y="239">Клиентский</tspan><tspan x="160" y="267">Harness</tspan></text><text x="160" y="301" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="160" y="301">Проверить</tspan><tspan x="160" y="327">членство</tspan></text><text x="160" y="357" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="160" y="357">и статус столицы</tspan></text><rect x="330" y="208" width="240" height="216" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
