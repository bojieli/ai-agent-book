<rect x="20" y="20" width="860" height="98" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="62" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="62">Постобучение (включая обучение с подкреплением) →</tspan><tspan x="450" y="90">стратегия вызова инструментов моделью</tspan></text><rect x="20" y="143" width="860" height="542" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
