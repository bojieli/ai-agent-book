<title id="title">Prompt Cache: повторное использование KV Cache общего префикса между запросами</title><desc id="desc">Сравнение трёх запросов: общие системные инструкции и определения инструментов переиспользуются; временная метка в начале изменяет весь последующий префикс.</desc>
