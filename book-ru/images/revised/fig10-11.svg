<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="175.253mm" viewBox="0 0 900 1488" role="img" aria-labelledby="title desc">
<title id="title">Система голосовых агентов для «Мафии»</title><desc id="desc">Судья следит за правилами и закрытой информацией, игроки участвуют голосом и действиями ролей.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1488" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="171" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Судья · детерминированный игровой код</tspan></text><text x="450" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Ночь → день → голосование → итоги</tspan></text><text x="450" y="132" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="132">Управляет ролями, статусом игроков, доступными действиями и</tspan><tspan x="450" y="158">условиями победы</tspan></text><path d="M450 191 L450 211 L225 211 L225 231" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 211 L675 211 L675 231" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 211 L450 540 L225 540 L225 565" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 540 L675 540 L675 565" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="231" width="410" height="289" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="231" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="264" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="264">Оборотни × 2</tspan></text><text x="225" y="311" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="311">Видят: свою роль и</tspan><tspan x="225" y="337">союзника-оборотня</tspan></text><text x="225" y="369" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="369">Ночью: совместно выбирают</tspan><tspan x="225" y="395">жертву</tspan></text><text x="225" y="427" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="427">Стратегия: притворяться</tspan><tspan x="225" y="453">мирными, голосовать со всеми</tspan><tspan x="225" y="479">для прикрытия</tspan></text><rect x="470" y="231" width="410" height="289" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="231" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="264" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="264">Провидец × 1</tspan></text><text x="675" y="311" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="311">Видит: свою роль и результаты</tspan><tspan x="675" y="337">проверок</tspan></text><text x="675" y="369" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="369">Ночью: выбирает игрока для</tspan><tspan x="675" y="395">проверки</tspan></text><text x="675" y="427" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="427">Стратегия: вовремя раскрыть</tspan><tspan x="675" y="453">роль и результаты проверок</tspan></text><rect x="20" y="565" width="410" height="289" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="565" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="598" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="598">Ведьма × 1</tspan></text><text x="225" y="645" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="645">Видит: свою роль, зелья и</tspan><tspan x="225" y="671">предусмотренные правилами</tspan><tspan x="225" y="697">подсказки</tspan></text><text x="225" y="729" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="729">Ночью: использует противоядие</tspan><tspan x="225" y="755">или яд по правилам</tspan></text><text x="225" y="787" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="787">Стратегия: выбирает момент для</tspan><tspan x="225" y="813">зелья по ситуации</tspan></text><rect x="470" y="565" width="410" height="289" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="565" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="598" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="598">Мирные жители × 2</tspan></text><text x="675" y="645" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="645">Видят: свою роль и открытую</tspan><tspan x="675" y="671">информацию</tspan></text><text x="675" y="729" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="729">Основания: высказывания,</tspan><tspan x="675" y="755">голоса, объявленные результаты</tspan></text><text x="675" y="787" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="787">Днём: рассуждают, обсуждают и</tspan><tspan x="675" y="813">голосуют</tspan></text><rect x="20" y="909" width="860" height="298" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="909" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="942" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="942">Распределение информации и проверка действий</tspan></text><text x="450" y="989" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="989">Общий канал: высказывания, голоса и объявленные по правилам</tspan><tspan x="450" y="1015">результаты</tspan></text><text x="450" y="1047" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1047">Личные каналы ролей: проверки, обсуждение оборотней, подсказки</tspan><tspan x="450" y="1073">ведьме</tspan></text><text x="450" y="1105" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1105">Ведущий проверяет действия по роли, этапу и статусу игрока</tspan></text><text x="450" y="1137" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1137">Контекст каждого игрока содержит только доступную ему</tspan><tspan x="450" y="1163">информацию</tspan></text><rect x="20" y="1257" width="860" height="201" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="1257" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="1290" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="1290">Голосовая игра · пример на шестерых</tspan></text><text x="450" y="1337" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1337">1 человек + 5 AI, роли выше распределяются случайно</tspan></text><text x="450" y="1369" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1369">Голос игрока → ASR → агент / ведущий → TTS → аудио</tspan></text><text x="450" y="1401" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1401">Высказывания и действия по очереди в каждом этапе; итог — при</tspan><tspan x="450" y="1427">выполнении условия победы</tspan></text></svg>