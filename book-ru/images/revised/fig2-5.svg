<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="118.484mm" viewBox="0 0 900 1006" role="img" aria-labelledby="title desc">
<title id="title">Архитектура вызова инструментов локальной LLM</title><desc id="desc">Задача о времени и погоде в Ванкувере: клиент хранит сообщения, вызывает локальную модель и два инструмента, затем возвращает модели наблюдения.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1006" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="80" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="52" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="52">Запрос пользователя</tspan></text><text x="450" y="83" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="83">Узнать текущее время и погоду в Ванкувере</tspan></text><path d="M195 100 L195 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="150" width="350" height="836" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="195" y="188" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="195" y="188">Клиентский Harness</tspan></text><text x="195" y="240" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="195" y="240">Сформировать messages и</tspan><tspan x="195" y="266">tools</tspan></text><text x="195" y="315" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="195" y="315">Сохранить ответ</tspan><tspan x="195" y="341">модели и ID вызовов</tspan></text><text x="195" y="499" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="195" y="499">Разобрать и проверить</tspan><tspan x="195" y="525">параметры</tspan></text><text x="195" y="599" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="195" y="599">Запустить</tspan><tspan x="195" y="625">независимые</tspan><tspan x="195" y="651">вызовы</tspan></text><text x="195" y="747" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="195" y="747">Добавить</tspan><tspan x="195" y="773">результаты</tspan><tspan x="195" y="799">инструментов</tspan></text><text x="195" y="897" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="195" y="897">Снова вызвать модель →</tspan><tspan x="195" y="923">итоговый ответ</tspan></text><rect x="520" y="150" width="360" height="294" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="188" font-size="25" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="700" y="188">Локальный сервис LLM</tspan></text><text x="700" y="229" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="229">vLLM / Ollama</tspan></text><text x="700" y="295" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="700" y="295">Qwen3-0.6B</tspan></text><text x="700" y="363" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="363">Инференс · генерация</tspan><tspan x="700" y="389">вызовов инструментов или</tspan><tspan x="700" y="415">ответа</tspan></text><path d="M370 220 L520 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="445" y="207" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="445" y="207">Запрос к модели</tspan></text><path d="M520 352 L370 352" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="445" y="313" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="445" y="313">Ответ модели</tspan></text><rect x="520" y="484" width="360" height="502" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="700" y="549" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="700" y="549">Выполнение</tspan><tspan x="700" y="577">инструментов</tspan></text><text x="700" y="672" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="672">Время: America/Vancouver</tspan></text><text x="700" y="712" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="712">Погода: Vancouver, celsius</tspan></text><text x="700" y="838" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="838">Функции / внешние</tspan><tspan x="700" y="864">API</tspan></text><text x="700" y="931" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="931">Возвращает наблюдения:</tspan><tspan x="700" y="957">время, температуру и т. д.</tspan></text><path d="M370 657 L520 657" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="445" y="591" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="445" y="591">Запрос вызова</tspan></text><path d="M520 838 L370 838" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="445" y="746" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="445" y="746">Результат</tspan><tspan x="445" y="772">выполнения</tspan></text></svg>