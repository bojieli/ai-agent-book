<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="125.669mm" viewBox="0 0 900 1067" role="img" aria-labelledby="title desc">
<title id="title">Порядок сообщений при параллельном поиске</title><desc id="desc">Десять участников ищут параллельно. Проверив первого подходящего кандидата, Manager отменяет остальные поиски и ждёт подтверждений.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1067" fill="#ffffff" y="0" />
<text x="450" y="42" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="42">Учебный пример: десять участников параллельно ищут</tspan><tspan x="450" y="70">преподавателя</tspan></text><rect x="47" y="100" width="182" height="88" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="138" y="140" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="138" y="140">Manager</tspan></text><rect x="269" y="100" width="182" height="88" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="360" y="140" font-size="26" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="360" y="140">Участник 2</tspan></text><rect x="477" y="100" width="182" height="88" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="568" y="140" font-size="26" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="568" y="140">Участник 3</tspan></text><rect x="689" y="100" width="182" height="88" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="780" y="140" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="780" y="140">Остальные</tspan><tspan x="780" y="168">участники</tspan></text><text x="138" y="226" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="138" y="226">Координация</tspan></text><path d="M138 267 L138 778" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="360" y="226" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="360" y="226">Факультет</tspan><tspan x="360" y="252">математики</tspan></text><path d="M360 267 L360 419" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="568" y="226" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="568" y="226">Факультет</tspan><tspan x="568" y="252">физики</tspan></text><path d="M568 267 L568 517" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="780" y="226" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="780" y="226">Другие</tspan><tspan x="780" y="252">факультеты</tspan></text><path d="M780 267 L780 778" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="249" y="299" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="249" y="299">Назначить задачи</tspan></text><path d="M138 322 L360 322" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M138 322 L568 322" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M138 322 L780 322" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="62" y="330" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="62" y="330">0 s</tspan></text><text x="62" y="427" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="62" y="427">12 s</tspan></text><text x="249" y="401" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="249" y="401">Не найдено</tspan></text><path d="M360 419 L138 419" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="62" y="525" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="62" y="525">18 s</tspan></text><text x="353" y="499" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="353" y="499">Сообщить кандидата и источник</tspan></text><path d="M568 517 L138 517" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="62" y="706" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="62" y="706">18.1 s</tspan></text><text x="459" y="680" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="459" y="680">Отправить запрос отмены (terminate)</tspan></text><path d="M138 698 L780 698" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="62" y="786" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="62" y="786">19 s</tspan></text><text x="459" y="760" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="459" y="760">Закрыть браузер и подтвердить</tspan></text><path d="M780 778 L138 778" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="170" y="544" width="525" height="92" rx="6" fill="#eee" stroke="#333333" stroke-width="1.8" />
<text x="432" y="588" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="432" y="588">Проверить источник и атомарно записать</tspan><tspan x="432" y="614">первый подходящий результат</tspan></text><path d="M138 577 L170 577" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="832" width="840" height="207" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="832" width="840" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="865" font-size="25" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="865">При сведении отдельно записать причину завершения</tspan></text><text x="450" y="912" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="912">Для исходов «не найдено», «совпадение» и «отмена подтверждена»</tspan><tspan x="450" y="938">создаются отдельные записи.</tspan></text><text x="450" y="970" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="970">Участников, не закончивших за две минуты, отдельно отметить как</tspan><tspan x="450" y="996">превысивших время.</tspan></text></svg>