<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="145.102mm" viewBox="0 0 900 1232" role="img" aria-labelledby="title desc">
<title id="title">Цикл выполнения автономного агента</title><desc id="desc">Сохраняются рассуждения, действия, наблюдения и все условия выхода; завершённая задача сдаётся после проверки, а при ошибке или превышении бюджета прогресс сохраняется и формируется отчёт.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1232" fill="#ffffff" y="0" />
<rect x="190" y="30" width="360" height="273" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="370" y="65" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="370" y="65">Проверка</tspan><tspan x="370" y="93">бюджета</tspan><tspan x="370" y="121">выполнения и</tspan><tspan x="370" y="149">ошибок</tspan></text><text x="370" y="184" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="370" y="184">Максимум циклов · число</tspan><tspan x="370" y="210">ошибок</tspan></text><text x="370" y="240" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="370" y="240">Неустранимая ошибка</tspan></text><rect x="630" y="30" width="240" height="273" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="750" y="65" font-size="22" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="750" y="65">Остановить</tspan><tspan x="750" y="91">выполнение</tspan></text><text x="750" y="184" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="750" y="184">Сохранить</tspan><tspan x="750" y="210">прогресс</tspan></text><text x="750" y="240" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="750" y="240">Сообщить о</tspan><tspan x="750" y="266">незавершённом /</tspan></text><text x="750" y="298" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="750" y="298">Передать человеку</tspan></text><path d="M550 164 L630 164" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="590" y="54" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="590" y="54">Остановить</tspan></text><path d="M370 303 L370 373" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="440" y="344" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="440" y="344">Можно продолжить</tspan></text><rect x="190" y="373" width="360" height="168" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="370" y="409" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="370" y="409">Рассуждение и решение</tspan></text><text x="370" y="441" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="370" y="441">(Reasoning)</tspan></text><text x="370" y="481" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="370" y="481">«Нужно больше данных» /</tspan><tspan x="370" y="507">ответ готов</tspan></text><path d="M275 541 L275 611" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="360" y="585" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="360" y="585">Запрос инструмента</tspan></text><rect x="90" y="611" width="370" height="200" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="275" y="652" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="275" y="652">Действие (Acting)</tspan></text><text x="275" y="717" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="275" y="717">web_search(...)</tspan></text><text x="275" y="773" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="275" y="773">Harness проверяет и</tspan><tspan x="275" y="799">запускает выполнение</tspan></text><path d="M275 811 L275 886" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="90" y="886" width="370" height="207" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="275" y="926" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="275" y="926">Наблюдение</tspan><tspan x="275" y="954">(Observation)</tspan></text><text x="275" y="1022" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="275" y="1022">tool_result: "..."</tspan></text><text x="275" y="1052" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="275" y="1052">Результат или ошибка</tspan><tspan x="275" y="1078">добавляются в контекст</tspan></text><path d="M90 1004 L35 1004 L35 164 L190 164" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M550 460 L570 460 L570 586 L680 586 L680 611" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="705" y="532" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="705" y="532">final_answer или</tspan></text><text x="705" y="562" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="705" y="562">ответ без вызова инструментов</tspan></text><rect x="520" y="611" width="320" height="200" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="680" y="652" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="680" y="652">Проверка условий</tspan><tspan x="680" y="680">завершения</tspan></text><text x="680" y="722" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="680" y="722">Результат задачи ·</tspan><tspan x="680" y="748">обязательные артефакты</tspan></text><path d="M680 811 L680 886" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="727" y="856" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="727" y="856">Пройдено</tspan></text><rect x="520" y="886" width="320" height="141" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="680" y="965" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="680" y="965">Передать итоговый</tspan><tspan x="680" y="993">результат</tspan></text><path d="M840 699 L875 699 L875 1204 L35 1204 L35 1004" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="450" y="1143" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1143">Не пройдено: добавить замечания при приёмке и снова проверить бюджет</tspan><tspan x="450" y="1169">выполнения</tspan></text></svg>