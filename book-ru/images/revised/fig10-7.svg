<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="155.349mm" viewBox="0 0 900 1319" role="img" aria-labelledby="title desc">
<title id="title">Двухагентная архитектура Phone и Computer</title><desc id="desc">Два независимых цикла обмениваются полями и результатами через структурированные события</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1319" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="375" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Phone Agent · Node.js</tspan></text><text x="225" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="100">WebRTC: двусторонняя голосовая</tspan><tspan x="225" y="126">связь</tspan></text><text x="225" y="158" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="158">Речь → Silero VAD → ASR</tspan></text><text x="225" y="216" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="216">LLM: распознавание намерения и</tspan><tspan x="225" y="242">извлечение полей</tspan></text><text x="225" y="274" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="274">TTS: озвучивание уточнений и</tspan><tspan x="225" y="300">подтверждений</tspan></text><text x="225" y="332" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="332">Непрерывная обработка событий</tspan><tspan x="225" y="358">звонка</tspan></text><rect x="470" y="20" width="410" height="375" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Computer Agent · Python</tspan></text><text x="675" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="100">Снимок экрана → Vision LLM</tspan></text><text x="675" y="158" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="158">Чтение формы и текущего</tspan><tspan x="675" y="184">состояния страницы</tspan></text><text x="675" y="216" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="216">Планирование полей и порядка</tspan><tspan x="675" y="242">действий</tspan></text><text x="675" y="274" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="274">click / type / submit</tspan></text><text x="675" y="332" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="332">Чтение отклика страницы и</tspan><tspan x="675" y="358">проверка результата</tspan></text><rect x="20" y="430" width="860" height="136" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="430" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="463" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="463">Двусторонний канал WebSocket</tspan></text><text x="450" y="510" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="510">Каждое сообщение содержит ID задачи, тип, данные полей и текущее</tspan><tspan x="450" y="536">состояние</tspan></text><text x="124" y="618" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="124" y="618">Телефонная</tspan><tspan x="124" y="646">сторона</tspan></text><text x="776" y="618" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="776" y="618">Компьютерная</tspan><tspan x="776" y="646">сторона</tspan></text><path d="M124 662 L124 1134" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M776 662 L776 1262" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="450" y="714" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="714">Начать звонок: purpose / required_info</tspan></text><path d="M776 729 L124 729" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="799" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="799">info_collected: имя, контакты</tspan></text><path d="M124 814 L776 814" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="884" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="884">info_collected: получен номер документа</tspan></text><path d="M124 899 L776 899" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="969" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="969">fill_error: неверный формат номера документа</tspan></text><path d="M776 984 L124 984" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="1054" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1054">Повторить номер, подтвердить и отправить исправленный</tspan></text><path d="M124 1069 L776 1069" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="1119" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1119">task_completed: все нужные поля собраны</tspan></text><path d="M124 1134 L776 1134" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="300" y="1184" width="565" height="107" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="582" y="1232" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="582" y="1232">Сверить страницу на компьютере, отправить</tspan><tspan x="582" y="1258">с разрешения и проверить квитанцию</tspan></text></svg>