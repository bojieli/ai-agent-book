<title id="title">Полная база и четыре абляции эксперимента 1-1</title><desc id="desc">Во всех пяти условиях сохранены системный промпт и текущая задача. Определения инструментов, история вызовов, рассуждений и результаты инструментов сохраняются или удаляются по условиям группы.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
