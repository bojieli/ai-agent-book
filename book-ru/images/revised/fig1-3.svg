<text x="150" y="714" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="150" y="714">Вся история</tspan><tspan x="150" y="740">сообщений</tspan></text><text x="414" y="714" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="414" y="714">Повторять</tspan><tspan x="414" y="740">конвертацию до</tspan><tspan x="414" y="766">лимита</tspan></text><text x="666" y="714" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="666" y="714">5</tspan></text><text x="805" y="714" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="805" y="714">15</tspan></text><text x="450" y="846" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="846">Вся история сообщений включает прошлые вызовы инструментов,</tspan><tspan x="450" y="872">рассуждения и результаты.</tspan></text></svg>