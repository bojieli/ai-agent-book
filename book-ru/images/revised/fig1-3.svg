<text x="450" y="61" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="61">Kimi K3 · 25 августа 2026 года</tspan></text><text x="450" y="124" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="124">Во всех группах сохранены системный промпт и текущая задача</tspan><tspan x="450" y="150">пользователя</tspan></text><rect x="20" y="174" width="860" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
