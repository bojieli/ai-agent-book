<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="137.918mm" viewBox="0 0 900 1171" role="img" aria-labelledby="title desc">
<title id="title">Set-of-Mark и индекс структурированных элементов (реализация browser-use)</title><desc id="desc">Визуальные и DOM-кандидаты используют общие ссылочные метки с примерами элементов.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1171" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="220" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" font-size="25" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Визуальная разметка SoM</tspan></text><text x="225" y="128" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="128">Снимок → сегментация или</tspan><tspan x="225" y="154">обнаружение областей</tspan></text><text x="225" y="186" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="186">Присвоить номера</tspan><tspan x="225" y="212">областям-кандидатам</tspan></text><rect x="470" y="20" width="410" height="220" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Индекс DOM / элементов</tspan><tspan x="675" y="81">доступности</tspan></text><text x="675" y="128" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="128">CDP → DOM, компоновка и</tspan><tspan x="675" y="154">семантика</tspan></text><text x="675" y="186" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="186">Отобрать интерактивные</tspan><tspan x="675" y="212">элементы → присвоить номера</tspan></text><path d="M225 240 L225 265 L675 265 L675 240" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 265 L450 300" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="300" width="860" height="250" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<rect x="40" y="320" width="820" height="42" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="350" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="350">www.example.com</tspan></text><rect x="80" y="385" width="525" height="48" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="330" y="418" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="330" y="418">[1] Search</tspan></text><rect x="650" y="385" width="180" height="48" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="740" y="418" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="740" y="418">[2] Submit</tspan></text><rect x="80" y="462" width="525" height="48" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="330" y="495" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="330" y="495">[3] Enter your name…</tspan></text><text x="735" y="490" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="735" y="490">[4] Docs →</tspan></text><path d="M450 550 L450 591" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="591" width="860" height="151" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="591" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="624" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="624">Модель выбирает номер [2]</tspan></text><text x="450" y="671" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="671">Текущее DOM-сопоставление: [2] → кнопка submit-btn</tspan></text><text x="450" y="703" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="703">Имя доступности: Submit form</tspan></text><path d="M450 742 L450 783" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="783" width="860" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="783" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="816" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="816">Исполнитель проверяет видимость и интерактивность цели</tspan></text><text x="450" y="863" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="863">Нажать Submit, затем прочитать обновлённую страницу</tspan></text><path d="M450 898 L450 939" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="939" width="860" height="204" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="939" width="860" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="972" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="972">Страница обновилась: заново собрать и пронумеровать</tspan><tspan x="450" y="1000">кандидатов</tspan></text><text x="450" y="1047" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1047">Прокрутка и вставка элементов тоже могут менять сопоставление</tspan></text><text x="450" y="1079" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1079">Если структурированных данных нет, использовать визуальную</tspan><tspan x="450" y="1105">разметку или прогноз координат</tspan></text></svg>