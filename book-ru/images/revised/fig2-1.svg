<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="105.411mm" viewBox="0 0 900 895" role="img" aria-labelledby="title desc">
<title id="title">Обзор состава контекстного окна</title><desc id="desc">Пример с погодой в Пекине: системные инструкции, описание инструмента погоды, история с ID вызовов, текущее рассуждение и место генерации ответа.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="895" fill="#ffffff" y="0" />
<rect x="20" y="20" width="795" height="835" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="35" y="35" width="765" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="68" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="417" y="68">Системный промпт (System Prompt)</tspan></text><text x="417" y="107" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="417" y="107">You are a helpful assistant. Answer concisely.</tspan></text><text x="417" y="141" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="417" y="141">Use tools for real-time information.</tspan></text><rect x="35" y="170" width="765" height="205" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="203" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="417" y="203">Описания инструментов (Tool Definitions)</tspan></text><text x="417" y="242" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="417" y="242">{"name": "get_weather", "description": "узнать погоду в городе",</tspan></text><text x="417" y="276" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="417" y="276">"parameters": {"type": "object", "properties": {</tspan></text><text x="417" y="310" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="417" y="310">"city": {"type": "string"}}, "required": ["city"]}}</tspan></text><rect x="35" y="390" width="765" height="176" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="423" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="417" y="423">История диалога (Conversation History)</tspan></text><text x="417" y="462" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="417" y="462">user: Какая сегодня погода в Пекине?</tspan></text><text x="417" y="496" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="417" y="496">assistant: call_1 → get_weather(city="Пекин")</tspan></text><text x="417" y="530" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="417" y="530">tool (call_1): {"temp": "23°C", "conditions": "ясно"}</tspan></text><rect x="35" y="581" width="765" height="151" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="417" y="614" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="417" y="614">Рассуждение на этом шаге (Reasoning)</tspan></text><text x="417" y="653" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="417" y="653">&lt;think&gt;Погода в Пекине получена. Теперь сформирую</tspan><tspan x="417" y="679">ответ.&lt;/think&gt;</tspan></text><rect x="35" y="747" width="765" height="93" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="417" y="787" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="417" y="787">assistant: Сегодня в Пекине ясно, температура</tspan><tspan x="417" y="815">23°C…</tspan></text><path d="M835 35 L855 35 L855 732 L835 732" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="450" y="882" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="882">Текущая позиция генерации</tspan></text><path d="M450 860 L450 841" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="878" y="405" transform="rotate(-90 878 405)" text-anchor="middle" font-size="23" font-family="DejaVu Sans">Контекстное окно</text></svg>