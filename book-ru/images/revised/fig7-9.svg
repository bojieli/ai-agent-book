<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="133.796mm" viewBox="0 0 900 1136" role="img" aria-labelledby="title desc">
<title id="title">Как выбрать среду оценки</title><desc id="desc">Цифровые и роботизированные задачи идут от упрощённых тестов к целевой среде. На каждом этапе проверяется новое поведение.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1136" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="164" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Цифровая задача:</tspan><tspan x="225" y="81">оформить возврат</tspan></text><text x="225" y="128" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="128">Нужно проверить заказ и статус</tspan><tspan x="225" y="154">возврата</tspan></text><rect x="470" y="20" width="410" height="164" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Физическая задача: взять</tspan><tspan x="675" y="81">чашку</tspan></text><text x="675" y="128" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="128">Нужно проверить движение</tspan><tspan x="675" y="154">захвата и чашки</tspan></text><path d="M225 184 L225 224" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 184 L675 224" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="224" width="410" height="296" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="224" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="257" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="257">Имитация интерфейса</tspan><tspan x="225" y="285">инструмента</tspan></text><text x="225" y="332" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="332">Mock API возвращает данные</tspan><tspan x="225" y="358">заказа</tspan></text><text x="225" y="390" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="390">Обновляет состояние тестовых</tspan><tspan x="225" y="416">аккаунта и заказа</tspan></text><text x="225" y="448" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="448">Быстрый сброс и поочерёдная</tspan><tspan x="225" y="474">проверка правил</tspan></text><rect x="470" y="224" width="410" height="296" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="224" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="257" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="257">Физическая симуляция</tspan></text><text x="675" y="332" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="332">Isaac Gym поддерживает</tspan><tspan x="675" y="358">параллельную GPU-симуляцию</tspan></text><text x="675" y="390" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="390">RoboTwin2 позволяет случайно</tspan><tspan x="675" y="416">размещать объекты</tspan></text><text x="675" y="448" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="448">Проверка контакта, трения и</tspan><tspan x="675" y="474">управления суставами</tspan></text><path d="M225 520 L225 560" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="560" width="410" height="296" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="560" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="593" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="593">Управляемая цифровая</tspan><tspan x="225" y="621">среда</tspan></text><text x="225" y="668" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="668">AWorld предоставляет</tspan><tspan x="225" y="694">инструменты MCP</tspan></text><text x="225" y="726" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="726">AndroidWorld управляет</tspan><tspan x="225" y="752">интерфейсом приложений</tspan></text><text x="225" y="784" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="784">OSWorld восстанавливает снимки</tspan><tspan x="225" y="810">виртуальной машины</tspan></text><path d="M225 856 L225 906" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 520 L675 906" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="906" width="410" height="202" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="906" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="939" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="939">Реальные сервисы</tspan></text><text x="225" y="986" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="986">Проверка реальных прав доступа</tspan><tspan x="225" y="1012">и задержек</tspan></text><text x="225" y="1044" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="1044">и фактического поступления</tspan><tspan x="225" y="1070">возврата</tspan></text><rect x="470" y="906" width="410" height="202" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="906" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="939" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="939">Реальные роботы</tspan></text><text x="675" y="986" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="986">Проверка успешности захвата</tspan><tspan x="675" y="1012">предмета</tspan></text><text x="675" y="1044" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="1044">С учётом стоимости сброса и</tspan><tspan x="675" y="1070">безопасности</tspan></text></svg>