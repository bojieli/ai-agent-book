<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="74.082mm" viewBox="0 0 900 629" role="img" aria-labelledby="title desc">
<title id="title">Механизм «предлагающий — проверяющий» для создания PPT</title><desc id="desc">Исходник Slidev, скриншоты слайдов и структурированная обратная связь передаются между независимыми контекстами.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="629" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="446" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Предлагающий (Proposer)</tspan></text><text x="225" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="100">Вход: статья, тезисы и исходные</tspan><tspan x="225" y="126">диаграммы</tspan></text><text x="225" y="184" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="184">Выход: Slidev Markdown</tspan></text><text x="225" y="242" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="242">layout: two-cols</tspan></text><text x="225" y="274" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="274"># Архитектура Transformer</tspan></text><text x="225" y="332" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="332">Слева: самовнимание,</tspan><tspan x="225" y="358">многоголовое внимание</tspan></text><text x="225" y="390" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="390">Справа: схема архитектуры из</tspan><tspan x="225" y="416">статьи</tspan></text><rect x="470" y="20" width="410" height="446" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Проверяющий (Reviewer)</tspan></text><text x="675" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="100">Рендерит скриншоты слайдов,</tspan><tspan x="675" y="126">при необходимости сверяясь с</tspan><tspan x="675" y="152">исходником</tspan></text><text x="675" y="184" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="184">Проверяет: переполнение,</tspan><tspan x="675" y="210">тесноту, шрифт, текст и графику</tspan></text><text x="675" y="242" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="242">Слайд: 7</tspan></text><text x="675" y="274" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="274">Проблема: слишком мелкий</tspan><tspan x="675" y="300">шрифт</tspan></text><text x="675" y="332" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="332">Совет: увеличить до 14 pt</tspan></text><text x="675" y="390" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="390">После нового рендера проверить</tspan><tspan x="675" y="416">правку</tspan></text><path d="M275 466 L275 526 L625 526 L625 466" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="507" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="507">Исходник и результат рендера</tspan></text><path d="M790 466 L790 601 L110 601 L110 466" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="581" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="581">Слайд · проблема · совет по правке</tspan></text></svg>
