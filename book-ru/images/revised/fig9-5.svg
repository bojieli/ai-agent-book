<rect x="520" y="1025" width="360" height="271" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="1025" width="360" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="1058" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="700" y="1058">Публикация и</tspan><tspan x="700" y="1086">мониторинг работы</tspan></text><text x="700" y="1159" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="1159">Поэтапный запуск ·</tspan><tspan x="700" y="1185">мониторинг результатов</tspan></text><text x="700" y="1217" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="1217">Перевести в стабильную</tspan><tspan x="700" y="1243">версию / откатить</tspan></text><path d="M520 1161 L8 1161 L8 172 L20 172" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
