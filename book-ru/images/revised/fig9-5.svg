<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="155.584mm" viewBox="0 0 900 1321" role="img" aria-labelledby="title desc">
<title id="title">Два цикла: онлайн-выполнение и офлайн-эволюция</title><desc id="desc">Слева — запрос по текущей версии и ожидание ответа, справа — обучение по журналам. Проверенная новая версия используется в следующих задачах.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1321" fill="#ffffff" y="0" />
<rect x="20" y="20" width="360" height="278" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="200" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="200" y="53">Онлайн-выполнение</tspan></text><text x="200" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="200" y="100">Обработать заявку</tspan><tspan x="200" y="126">по текущей версии</tspan></text><text x="200" y="184" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="200" y="184">Записать действия и ответы</tspan></text><text x="200" y="216" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="200" y="216">После завершения</tspan><tspan x="200" y="242">уведомить пользователя</tspan></text><rect x="520" y="20" width="360" height="278" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="700" y="53">Офлайн-эволюция</tspan></text><text x="700" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="100">Объединить</tspan><tspan x="700" y="126">траектории и</tspan><tspan x="700" y="152">диагностику</tspan></text><text x="700" y="184" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="184">Найти общую первопричину</tspan></text><rect x="20" y="481" width="360" height="282" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="481" width="360" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="200" y="514" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="200" y="514">Ожидать хода</tspan><tspan x="200" y="542">обработки</tspan></text><text x="200" y="589" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="200" y="589">Получить уведомление об</tspan><tspan x="200" y="615">изменении статуса</tspan></text><text x="200" y="647" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="200" y="647">или повторить</tspan><tspan x="200" y="673">запрос в</tspan><tspan x="200" y="699">назначенное</tspan><tspan x="200" y="725">время.</tspan></text><path d="M120 298 L120 481" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="65" y="370" font-size="21" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="65" y="370">В</tspan><tspan x="65" y="395">обработке</tspan></text><path d="M278 481 L278 298" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="334" y="443" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="334" y="443">Пробуждение</tspan></text><path d="M380 172 L520 172" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
