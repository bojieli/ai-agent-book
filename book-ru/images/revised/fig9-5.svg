<rect x="520" y="753" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="786" font-size="25" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="700" y="786">Независимая проверка</tspan></text><text x="700" y="833" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="833">Новые задачи и прежние</tspan><tspan x="700" y="859">возможности</tspan></text><text x="700" y="891" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="700" y="891">Регрессионные проверки и</tspan><tspan x="700" y="917">проверка безопасности</tspan></text><path d="M520 864 L485 864 L485 483 L520 483" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
