<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="138.389mm" viewBox="0 0 900 1175" role="img" aria-labelledby="title desc">
<title id="title">Структура четырёх типов областей в виртуальной файловой системе агента</title><desc id="desc">Единый файловый интерфейс, четыре модели доступа и жизненного цикла, входы для пользователя и внешних ресурсов.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1175" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="136" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Agent A / Agent B</tspan></text><text x="225" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="100">Доступ определяется ролью и</tspan><tspan x="225" y="126">задачей</tspan></text><rect x="470" y="20" width="410" height="136" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Пользователь</tspan></text><text x="675" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="100">Загрузка материалов /</tspan><tspan x="675" y="126">скачивание результатов</tspan></text><path d="M225 156 L225 206" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 156 L675 206" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="206" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="206" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="239" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="239">Виртуальная файловая система</tspan></text><text x="450" y="286" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="286">Единый интерфейс: read_file · write_file · list_dir</tspan></text><text x="450" y="318" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="318">Монтирование и авторизация → доступ к разделам</tspan></text><path d="M225 351 L225 396" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 351 L675 396" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="396" width="410" height="395" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="396" width="410" height="108" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="429" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="429">Личная рабочая область ·</tspan><tspan x="225" y="457">Scratchpad</tspan></text><text x="225" y="536" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="536">Временные файлы · черновики ·</tspan><tspan x="225" y="562">журналы</tspan></text><text x="225" y="594" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="594">По умолчанию доступна только</tspan><tspan x="225" y="620">своему агенту</tspan></text><text x="225" y="652" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="652">Очищается вместе с</tspan><tspan x="225" y="678">экземпляром или архивируется</tspan><tspan x="225" y="704">по правилам</tspan></text><text x="225" y="736" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="736">Отдельный каталог для каждого</tspan><tspan x="225" y="762">экземпляра</tspan></text><rect x="470" y="396" width="410" height="395" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="396" width="410" height="108" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="429" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="429">Общая область · Shared</tspan></text><text x="675" y="489" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="489">Workspace</tspan></text><text x="675" y="536" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="536">Глоссарий · код · результаты</tspan></text><text x="675" y="594" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="594">Доступна авторизованным</tspan><tspan x="675" y="620">участникам и пользователю</tspan></text><text x="675" y="652" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="652">Хранится на протяжении задачи</tspan></text><text x="675" y="736" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="736">Проверка версий / блокировки /</tspan><tspan x="675" y="762">worktree</tspan></text><rect x="20" y="836" width="410" height="311" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="836" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="869" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="869">Подключённые внешние</tspan><tspan x="225" y="897">ресурсы</tspan></text><text x="225" y="944" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="944">Google Drive / Notion</tspan></text><text x="225" y="976" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="976">Адаптер обращается к API</tspan><tspan x="225" y="1002">исходной системы</tspan></text><text x="225" y="1034" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="1034">Чтение или запись по</tspan><tspan x="225" y="1060">разрешениям</tspan></text><text x="225" y="1092" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="1092">Тайм-ауты · кеширование ·</tspan><tspan x="225" y="1118">проверка версий</tspan></text><rect x="470" y="836" width="410" height="311" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="836" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="869" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="869">Встроенные системные</tspan><tspan x="675" y="897">ресурсы</tspan></text><text x="675" y="944" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="944">Skills · шаблоны · руководства</tspan></text><text x="675" y="976" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="976">Фиксированная версия · общий</tspan><tspan x="675" y="1002">доступ только для чтения</tspan></text><text x="675" y="1034" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="1034">Сначала каталог, затем чтение</tspan><tspan x="675" y="1060">по запросу</tspan></text><text x="675" y="1092" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="1092">Согласованность задачи при</tspan><tspan x="675" y="1118">смене версии</tspan></text><path d="M450 351 L450 806 L225 806 L225 836" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 806 L675 806 L675 836" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
</svg>