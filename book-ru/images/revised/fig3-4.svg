<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="98.933mm" viewBox="0 0 900 840" role="img" aria-labelledby="title desc">
<title id="title">Референсная архитектура совместной работы разных типов памяти</title><desc id="desc">Рабочая память хранит текущее состояние задачи; эпизодическая, семантическая и процедурная память подключаются через выборочную запись, поиск и активацию.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="840" fill="#ffffff" y="0" />
<rect x="210" y="20" width="480" height="176" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="60" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="60">Рабочая память</tspan></text><text x="450" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Текущая цель · диалог · результаты</tspan><tspan x="450" y="126">инструментов</tspan></text><text x="450" y="162" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="162">Состояние задачи и следующие шаги</tspan></text><path d="M320 196 L320 306" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="224" y="258" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="224" y="258">Выборочная запись</tspan></text><path d="M580 306 L580 196" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="683" y="258" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="683" y="258">Поиск и активация</tspan></text><rect x="20" y="306" width="860" height="504" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="348" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="348">Долговременная память: хранение между сеансами</tspan></text><rect x="40" y="376" width="240" height="399" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="160" y="416" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="160" y="416">Эпизодическая</tspan><tspan x="160" y="444">память</tspan></text><text x="160" y="490" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="160" y="490">События и</tspan><tspan x="160" y="516">хронология</tspan></text><text x="160" y="573" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="160" y="573">Люди, источники,</tspan><tspan x="160" y="599">состояния</tspan></text><text x="160" y="656" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="160" y="656">«В январе</tspan><tspan x="160" y="682">забронировали</tspan></text><text x="160" y="713" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="160" y="713">рейс в Токио»</tspan></text><rect x="330" y="376" width="240" height="399" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="416" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="416">Семантическая</tspan><tspan x="450" y="444">память</tspan></text><text x="450" y="490" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="490">Устойчивые факты</tspan><tspan x="450" y="516">и предпочтения</tspan></text><text x="450" y="573" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="573">Извлекается из</tspan><tspan x="450" y="599">высказываний или</tspan><tspan x="450" y="625">опыта</tspan></text><text x="450" y="656" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="656">«Предпочитает</tspan><tspan x="450" y="682">место у окна»</tspan></text><rect x="620" y="376" width="240" height="399" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="740" y="416" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="740" y="416">Процедурная</tspan><tspan x="740" y="444">память</tspan></text><text x="740" y="490" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="740" y="490">Процессы и</tspan><tspan x="740" y="516">практический</tspan><tspan x="740" y="542">опыт</tspan></text><text x="740" y="573" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="740" y="573">Шаги, условия,</tspan><tspan x="740" y="599">ветвления</tspan></text><text x="740" y="656" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="740" y="656">Забронировать</tspan><tspan x="740" y="682">рейс и отель</tspan></text><text x="740" y="713" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="740" y="713">Затем проверить</tspan><tspan x="740" y="739">документы</tspan></text></svg>