<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="134.502mm" viewBox="0 0 900 1142" role="img" aria-labelledby="title desc">
<title id="title">От оценённых траекторий к документу с практическими знаниями</title><desc id="desc">На примере тайм-аута запроса: сравнить успехи и сбои в исходных записях и проверить возможный вывод на новых задачах.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1142" fill="#ffffff" y="0" />
<rect x="70" y="20" width="760" height="142" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="20" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Исходная траектория</tspan></text><text x="450" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Инструмент запросов A превысил время ожидания;</tspan><tspan x="450" y="126">инструмент B вернул результат.</tspan></text><path d="M450 162 L450 197" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="197" width="760" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="197" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="230" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="230">Оценка одного случая: выдвинуть гипотезу</tspan></text><text x="450" y="277" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="277">При следующем тайм-ауте сразу менять инструмент?</tspan></text><path d="M450 313 L450 348" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="348" width="760" height="202" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="348" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="381" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="381">Сравнение траекторий: найти контрпример</tspan></text><text x="450" y="428" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="428">Другой похожий запрос тоже прервался по тайм-ауту, но</tspan><tspan x="450" y="454">повтор A сработал.</tspan></text><text x="450" y="486" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="486">В обеих записях сохранены версия инструмента, ошибка и</tspan><tspan x="450" y="512">результат.</tspan></text><path d="M450 550 L450 585" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="585" width="760" height="202" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="585" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="618" font-size="26" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="618">Возможный вывод: указать условия применения</tspan></text><text x="450" y="665" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="665">При тайм-ауте сначала повторить запрос; при повторных</tspan><tspan x="450" y="691">сбоях попробовать резервный инструмент.</tspan></text><text x="450" y="723" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="723">Приложить записи, подтверждающие и опровергающие</tspan><tspan x="450" y="749">рекомендацию.</tspan></text><path d="M450 787 L450 822" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="822" width="760" height="230" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="822" width="760" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="855" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="855">Независимо проверить, затем сделать доступным</tspan><tspan x="450" y="883">для поиска в новых задачах</tspan></text><text x="450" y="930" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="930">На отложенных запросах сравнить долю успехов и время</tspan><tspan x="450" y="956">выполнения.</tspan></text><text x="450" y="988" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="988">После применения рекомендации записывайте результаты</tspan><tspan x="450" y="1014">каждого запроса.</tspan></text><path d="M830 925 L865 925 L865 1112 L30 1112 L30 423 L70 423" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="1090" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1090">Новые данные: уточнить условия применимости / обновить / исключить</tspan></text></svg>