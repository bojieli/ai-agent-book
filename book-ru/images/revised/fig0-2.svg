<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="155.702mm" viewBox="0 0 900 1322" role="img" aria-labelledby="title desc">
<title id="title">Структура книги: создание Agent и развитие его возможностей</title><desc id="desc">Главы 1–6 посвящены созданию Agent, глава 7 — оценке и обратной связи, главы 8–10 — развитию через параметры, обновление системы и совместную работу.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1322" fill="#ffffff" y="0" />
<rect x="20" y="20" width="400" height="93" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="220" y="60" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="220" y="60">Часть 1. Как создать Agent</tspan></text><rect x="480" y="20" width="400" height="93" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="680" y="60" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="680" y="60">Часть 2. Как развивать</tspan><tspan x="680" y="88">возможности</tspan></text><text x="220" y="166" font-size="25" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="220" y="166">Глава 1. Введение в AI Agent</tspan></text><text x="220" y="208" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="220" y="208">Как модель вызывает</tspan><tspan x="220" y="234">инструменты?</tspan></text><path d="M20 304 L420 304" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="342" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="220" y="342">Глава 2. Инженерия</tspan><tspan x="220" y="370">контекста</tspan></text><text x="220" y="412" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="220" y="412">Какие сведения нужны для этого</tspan><tspan x="220" y="438">решения?</tspan></text><path d="M20 510 L420 510" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="574" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="220" y="574">Глава 3. Память пользователя</tspan><tspan x="220" y="602">и база знаний</tspan></text><text x="220" y="644" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="220" y="644">Как найти то, что обсуждалось</tspan><tspan x="220" y="670">раньше?</tspan></text><path d="M20 714 L420 714" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="752" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="220" y="752">Глава 4. Инструменты</tspan></text><text x="220" y="822" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="220" y="822">Как проверить статус и выполнить</tspan><tspan x="220" y="848">операцию?</tspan></text><path d="M20 918 L420 918" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="956" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="220" y="956">Глава 5. Coding Agent</tspan></text><text x="220" y="988" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="220" y="988">и универсальный Agent</tspan></text><text x="220" y="1028" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="220" y="1028">Можно ли решить эту задачу</tspan><tspan x="220" y="1054">программой?</tspan></text><path d="M20 1068 L420 1068" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="1162" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="220" y="1162">Глава 6. Взаимодействие</tspan></text><text x="220" y="1256" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="220" y="1256">Что делать, если пользователь</tspan><tspan x="220" y="1282">вмешался?</tspan></text><rect x="480" y="138" width="400" height="167" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="680" y="181" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="680" y="181">Глава 7. Оценка Agent</tspan></text><text x="680" y="258" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="680" y="258">Где ошибка? Помогло ли</tspan><tspan x="680" y="284">исправление?</tspan></text><path d="M680 305 L680 327 L500 327 L500 1151" fill="none" stroke="#333333" stroke-width="1.8" />
