<text x="701" y="770" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="701" y="770">Глава 9. Непрерывное</tspan><tspan x="701" y="798">развитие</tspan></text><text x="701" y="872" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="701" y="872">Как улучшать систему на</tspan><tspan x="701" y="898">опыте работы?</tspan></text><path d="M500 1151 L522 1151" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="1004" width="358" height="290" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="1076" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="701" y="1076">Глава 10. Совместная</tspan><tspan x="701" y="1104">работа нескольких</tspan><tspan x="701" y="1132">Agent</tspan></text><text x="701" y="1180" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="701" y="1180">Как участникам разделить</tspan><tspan x="701" y="1206">работу и передавать</tspan><tspan x="701" y="1232">задачи?</tspan></text></svg>