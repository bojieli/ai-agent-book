<rect x="522" y="390" width="358" height="238" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="462" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="701" y="462">Глава 8. Постобучение</tspan><tspan x="701" y="490">модели</tspan></text><text x="701" y="538" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="701" y="538">Как обновить модель</tspan><tspan x="701" y="564">обучением?</tspan></text><path d="M500 817 L522 817" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
