<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="176.196mm" viewBox="0 0 900 1496" role="img" aria-labelledby="title desc">
<title id="title">Классическое RL и современный LLM-агент</title><desc id="desc">На примере поиска сокровищ: пять аспектов устройства и затрат двух типов агентов.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1496" fill="#ffffff" y="0" />
<rect x="214" y="20" width="325" height="93" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="376" y="64" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="376" y="64">Табличное Q-learning</tspan></text><rect x="554" y="20" width="325" height="93" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="716" y="64" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="716" y="64">Предобученный</tspan><tspan x="716" y="92">LLM-агент</tspan></text><rect x="20" y="138" width="178" height="224" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="109" y="244" font-size="18" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="109" y="244">Представление</tspan><tspan x="109" y="266">действий</tspan></text><rect x="214" y="138" width="325" height="224" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="376" y="183" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="376" y="183">Выбор из доступных</tspan><tspan x="376" y="209">действий по таблице</tspan></text><text x="376" y="286" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="376" y="286">Перемещение / подбор /</tspan><tspan x="376" y="312">атака / создание</tspan></text><rect x="554" y="138" width="325" height="224" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="716" y="183" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="716" y="183">Сначала рассуждение на</tspan><tspan x="716" y="209">естественном языке</tspan></text><text x="716" y="286" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="716" y="286">В конце ответа —</tspan><tspan x="716" y="312">выбранное действие</tspan></text><rect x="20" y="377" width="178" height="282" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="109" y="509" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="109" y="509">Начальная</tspan><tspan x="109" y="537">стратегия</tspan></text><rect x="214" y="377" width="325" height="282" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="376" y="422" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="376" y="422">Заданные кодирование</tspan><tspan x="376" y="448">состояния и правила</tspan><tspan x="376" y="474">исследования</tspan></text><text x="376" y="557" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="376" y="557">Накопление Q-значений</tspan><tspan x="376" y="583">при взаимодействии</tspan></text><rect x="554" y="377" width="325" height="282" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="716" y="422" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="716" y="422">Предобученные знания и</tspan><tspan x="716" y="448">языковые способности</tspan></text><text x="716" y="557" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="716" y="557">Инструкция задачи и</tspan><tspan x="716" y="583">определения</tspan><tspan x="716" y="609">инструментов</tspan></text><rect x="20" y="674" width="178" height="254" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="109" y="780" font-size="22" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="109" y="780">Состояние</tspan><tspan x="109" y="806">и</tspan><tspan x="109" y="832">наблюдение</tspan></text><rect x="214" y="674" width="325" height="254" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="376" y="719" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="376" y="719">room / items / doors</tspan></text><text x="376" y="852" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="376" y="852">После кодирования —</tspan><tspan x="376" y="878">индекс Q-таблицы</tspan></text><rect x="554" y="674" width="325" height="254" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="716" y="719" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="716" y="719">«В кладовой есть</tspan><tspan x="716" y="745">красный ключ»</tspan></text><text x="716" y="852" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="716" y="852">Контекст объединяет</tspan><tspan x="716" y="878">наблюдения и историю</tspan></text><rect x="20" y="943" width="178" height="254" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="109" y="1049" font-size="22" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="109" y="1049">Выполнение</tspan><tspan x="109" y="1075">и обучение</tspan></text><rect x="214" y="943" width="325" height="254" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="376" y="988" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="376" y="988">Выбор действия по</tspan><tspan x="376" y="1014">таблице</tspan></text><text x="376" y="1095" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="376" y="1095">Обновление ценности</tspan><tspan x="376" y="1121">действия по награде</tspan></text><rect x="554" y="943" width="325" height="254" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="716" y="988" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="716" y="988">Анализ наблюдений и</tspan><tspan x="716" y="1014">выбор игрового действия</tspan></text><text x="716" y="1095" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="716" y="1095">Корректировка по</tspan><tspan x="716" y="1121">обратной связи из</tspan><tspan x="716" y="1147">контекста</tspan></text><rect x="20" y="1212" width="178" height="256" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="109" y="1350" font-size="18" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="109" y="1350">Переносимость</tspan><tspan x="109" y="1372">и затраты</tspan></text><rect x="214" y="1212" width="325" height="256" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="376" y="1257" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="376" y="1257">После изменения правил</tspan><tspan x="376" y="1283">проверить</tspan></text><text x="376" y="1315" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="376" y="1315">применимость значений</tspan></text><text x="376" y="1392" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="376" y="1392">Замер: 10 тыс. игр —</tspan><tspan x="376" y="1418">около 2,1 с</tspan></text><rect x="554" y="1212" width="325" height="256" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="716" y="1257" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="716" y="1257">Адаптация к задаче по</tspan><tspan x="716" y="1283">инструкциям и примерам</tspan></text><text x="716" y="1392" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="716" y="1392">Замер: первая игра —</tspan><tspan x="716" y="1418">около 7 минут</tspan></text></svg>