<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="122.489mm" viewBox="0 0 900 1040" role="img" aria-labelledby="title desc">
<title id="title">Процессы шести стратегий сжатия</title><desc id="desc">Шесть стратегий по-разному организуют материалы, учитывают контекст задачи, ссылки на источники и пороги окна.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1040" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="54" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="160" y="54">① Без сжатия</tspan></text><text x="605" y="54" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="605" y="54">Сохранить без изменений</tspan></text><rect x="40" y="72" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="105" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="222" y="105">Исходные результаты поиска</tspan></text><path d="M405 97 L490 97" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="72" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="105" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="105">Полные результаты</tspan></text><rect x="20" y="157" width="860" height="148" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="191" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="160" y="191">② Отдельные</tspan><tspan x="160" y="219">сводки</tspan></text><text x="605" y="191" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="605" y="191">Создать для каждого сводку из 2–3</tspan><tspan x="605" y="217">абзацев</tspan></text><rect x="40" y="237" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="270" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="222" y="270">Содержимое страниц</tspan></text><path d="M405 262 L490 262" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="237" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="270" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="270">Сводка каждой страницы</tspan></text><rect x="20" y="322" width="860" height="146" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="356" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="160" y="356">③ Общая сводка</tspan></text><text x="605" y="356" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="605" y="356">Объединить, удалить повторы и</tspan><tspan x="605" y="382">резюмировать</tspan></text><rect x="40" y="400" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="433" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="222" y="433">Пакет результатов поиска</tspan></text><path d="M405 425 L490 425" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="400" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="433" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="433">Общая сводка</tspan></text><rect x="20" y="485" width="860" height="174" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="519" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="160" y="519">④ С учётом</tspan><tspan x="160" y="547">контекста</tspan></text><text x="605" y="519" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="605" y="519">Извлечь нужное для задачи</tspan></text><rect x="40" y="565" width="365" height="76" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="598" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="222" y="598">Результаты поиска + запрос</tspan><tspan x="222" y="624">+ известные сведения</tspan></text><path d="M405 590 L490 590" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="565" width="370" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="598" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="598">Релевантные факты и</tspan><tspan x="675" y="624">пробелы</tspan></text><rect x="20" y="676" width="860" height="174" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="710" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="160" y="710">⑤ Контекст +</tspan><tspan x="160" y="738">ссылки</tspan></text><text x="605" y="710" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="605" y="710">Сжать, сохранив URL</tspan></text><rect x="40" y="756" width="365" height="76" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="789" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="222" y="789">Результаты поиска + запрос</tspan><tspan x="222" y="815">+ известные сведения</tspan></text><path d="M405 781 L490 781" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="756" width="370" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="789" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="789">Факты и источники</tspan></text><rect x="20" y="867" width="860" height="148" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="901" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="160" y="901">⑥ Адаптивное</tspan><tspan x="160" y="929">окно</tspan></text><text x="605" y="901" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="605" y="901">≤80% — сохранять; &gt;80% — пакетно</tspan><tspan x="605" y="927">сжимать</tspan></text><rect x="40" y="947" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="980" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="222" y="980">Текущий объём ввода</tspan></text><path d="M405 972 L490 972" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="947" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="980" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="980">Отметить сжатый результат</tspan></text></svg>