<text x="225" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Вызов инструментов ·</tspan><tspan x="225" y="81">задача по коду</tspan></text><text x="225" y="128" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="128">Агент вызывает инструменты и</tspan><tspan x="225" y="154">читает результаты</tspan></text><rect x="470" y="20" width="410" height="154" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
