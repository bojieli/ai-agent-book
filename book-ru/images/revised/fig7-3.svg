<text x="225" y="586" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="586">Исполняемый валидатор</tspan></text><text x="225" y="661" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="661">fib(10) == 55</tspan></text><text x="225" y="693" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="693">fib(0) == 0</tspan></text><text x="225" y="725" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="725">Все заданные тесты пройдены →</tspan><tspan x="225" y="751">1</tspan></text><text x="225" y="783" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="783">Иначе → 0</tspan></text><rect x="470" y="553" width="410" height="300" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="553" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="586" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="586">Состояние и уведомления</tspan><tspan x="675" y="614">проверяются отдельно</tspan></text><text x="675" y="661" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="661">Заказ: статус cancelled</tspan></text><text x="675" y="693" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="693">Запись о возврате: сумма $150</tspan></text><text x="675" y="725" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="725">Диалог: сообщено о 3–5 рабочих</tspan><tspan x="675" y="751">днях</tspan></text><text x="675" y="783" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="783">Результаты объединяются по</tspan><tspan x="675" y="809">правилам задачи</tspan></text></svg>