<text x="225" y="247" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="247">Генерация и выполнение</tspan></text><text x="225" y="294" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="294">Определить fib(n)</tspan></text><text x="225" y="326" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="326">run_python: выполнить</tspan><tspan x="225" y="352">решение-кандидат</tspan></text><text x="225" y="384" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="384">Ответ инструмента: результат /</tspan><tspan x="225" y="410">ошибка</tspan></text><rect x="470" y="214" width="410" height="294" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="214" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="247" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="247">Многошаговый диалог</tspan></text><text x="675" y="294" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="294">Найти заказ BK-98712</tspan></text><text x="675" y="326" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="326">Инструмент: confirmed / UA123</tspan></text><text x="675" y="384" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="384">После подтверждения</tspan><tspan x="675" y="410">пользователь отменяет билет</tspan><tspan x="675" y="436">через агента</tspan></text><text x="675" y="468" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="468">Агент сообщает срок</tspan><tspan x="675" y="494">поступления возврата</tspan></text><path d="M225 174 L225 214" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 174 L675 214" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
