<text x="675" y="53" font-size="27" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Диалог · возврат билета</tspan></text><text x="675" y="128" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="128">Агент общается с пользователем</tspan><tspan x="675" y="154">и вызывает инструменты</tspan></text><rect x="20" y="214" width="410" height="294" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
