<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="107.178mm" viewBox="0 0 900 910" role="img" aria-labelledby="title desc">
<title id="title">Рейтинг Elo и ранжирование попарным сравнением</title><desc id="desc">Пример анонимных кандидатов, ожидаемых баллов и онлайн-обновления рейтинга.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="910" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Задача и известные условия</tspan></text><text x="450" y="100" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Возврат $150 оформлен, срок — 3–5 рабочих дней тем же способом</tspan></text><rect x="20" y="160" width="410" height="192" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="160" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="193" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="193">Кандидат A</tspan></text><text x="225" y="240" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="240">Возврат $150 оформлен, срок —</tspan></text><text x="225" y="298" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="298">3–5 рабочих дней тем же</tspan><tspan x="225" y="324">способом.</tspan></text><rect x="470" y="160" width="410" height="192" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="160" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="193" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="193">Кандидат B</tspan></text><text x="675" y="240" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="240">Хорошо, возврат будет</tspan><tspan x="675" y="266">обработан.</tspan></text><path d="M225 352 L225 372 L675 372 L675 352" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 372 L450 397" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="397" width="860" height="131" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="397" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="430" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="430">Анонимная оценка: A лучше соответствует задаче</tspan></text><text x="450" y="477" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="477">Сравнить снова после смены мест; конфликт оценок отметить</tspan><tspan x="450" y="503">отдельно</tspan></text><path d="M450 528 L450 570" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="570" width="860" height="112" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="570" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="603" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="603">Как один голос меняет рейтинги двух кандидатов?</tspan></text><text x="450" y="650" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="650">Начальный рейтинг: A — 1200, B — 1000, K = 20</tspan></text><path d="M25 777 L875 777" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="70" y="815" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="70" y="815">A</tspan></text><text x="267" y="815" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="267" y="815">0.760</tspan></text><text x="450" y="815" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="815">1</tspan></text><text x="625" y="815" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="625" y="815">+4.8</tspan></text><text x="799" y="815" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="799" y="815">1204.8</tspan></text><path d="M25 844 L875 844" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="70" y="882" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="70" y="882">B</tspan></text><text x="267" y="882" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="267" y="882">0.240</tspan></text><text x="450" y="882" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="882">0</tspan></text><text x="625" y="882" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="625" y="882">−4.8</tspan></text><text x="799" y="882" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="799" y="882">995.2</tspan></text><text x="70" y="730" font-size="22" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="70" y="730">Кандидат</tspan></text><text x="267" y="730" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="267" y="730">Ожидаемый</tspan><tspan x="267" y="758">балл</tspan></text><text x="450" y="730" font-size="22" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="730">Фактический</tspan><tspan x="450" y="756">балл</tspan></text><text x="625" y="730" font-size="26" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="625" y="730">Изменение</tspan></text><text x="799" y="730" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="799" y="730">Новый</tspan><tspan x="799" y="758">рейтинг</tspan></text></svg>