<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="105.058mm" viewBox="0 0 900 892" role="img" aria-labelledby="title desc">
<title id="title">Предобучение на предсказании следующего Token</title><desc id="desc">Три префикса и цели одного обучающего предложения. Для первой позиции показаны распределение вероятностей и потеря.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="892" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="171" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Обучающий пример</tspan></text><text x="450" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Агенту нужно выполнить задачу в реальной среде</tspan></text><text x="450" y="132" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="132">Китайские токены показаны в транскрипции; границы условны и</tspan><tspan x="450" y="158">зависят от токенизатора.</tspan></text><text x="300" y="241" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="300" y="241">Прочитанный префикс</tspan></text><text x="718" y="241" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="718" y="241">Следующий токен</tspan><tspan x="718" y="269">исходного текста</tspan></text><rect x="20" y="298" width="558" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="299" y="338" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="299" y="338">Agent / xūyào / zài / zhēnshí / huánjìng</tspan></text><path d="M578 328 L635 328" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="635" y="298" width="245" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="757" y="338" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="757" y="338">zhōng</tspan></text><rect x="20" y="372" width="558" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="299" y="412" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="299" y="412">… / huánjìng / zhōng</tspan></text><path d="M578 402 L635 402" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="635" y="372" width="245" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="757" y="412" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="757" y="412">zhíxíng</tspan></text><rect x="20" y="446" width="558" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="299" y="486" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="299" y="486">… / huánjìng / zhōng / zhíxíng</tspan></text><path d="M578 476 L635 476" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="635" y="446" width="245" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="757" y="486" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="757" y="486">rènwu</tspan></text><rect x="20" y="554" width="860" height="181" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="554" width="860" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="587" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="587">Первая строка: какую вероятность модель даёт токену</tspan><tspan x="450" y="615">zhōng?</tspan></text><text x="450" y="662" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="662">Прогноз: zhōng — 42 %, lǐ — 28 %, xià — 15 %, прочие — 15 %</tspan></text><text x="450" y="694" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="694">Потеря в этой позиции: −ln(0.42) ≈ 0.87</tspan></text><path d="M450 735 L450 770" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="770" width="860" height="108" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="770" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="803" font-size="26" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="803">Объединяем потери всех позиций и обновляем модель</tspan></text><text x="504.4" y="850" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="504.4" y="850">L = −Σₜ log P(xₜ | x₁,…,xₜ₋₁) → градиент → оптимизатор</tspan></text></svg>