<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="176.313mm" viewBox="0 0 900 1497" role="img" aria-labelledby="title desc">
<title id="title">Конвейер извлечения структурированных знаний</title><desc id="desc">Из материалов дел выявляются модульные поля и извлекаются структурированные записи. Кодирование, нормализация и кластеризация формируют прототипы, а различия центров кластеров объясняют веса признаков.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1497" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="635" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="60" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="60">Этап 1: извлечение и структурирование знаний</tspan></text><rect x="40" y="90" width="230" height="409" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="155" y="131" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="155" y="131">Исходные</tspan><tspan x="155" y="159">судебные</tspan><tspan x="155" y="187">решения</tspan></text><text x="155" y="229" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="155" y="229">CAIL2018</tspan></text><text x="155" y="311" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="155" y="311">Выборка по</tspan><tspan x="155" y="337">составу</tspan><tspan x="155" y="363">преступления</tspan></text><path d="M270 221 L335 221" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="335" y="90" width="230" height="409" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="131" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="131">LLM выявляет</tspan><tspan x="450" y="159">факторы</tspan></text><text x="450" y="229" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="229">Поля</tspan><tspan x="450" y="255">формируются</tspan><tspan x="450" y="281">снизу вверх</tspan></text><text x="450" y="311" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="311">Определение</tspan><tspan x="450" y="337">значений</tspan></text><text x="450" y="395" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="395">и статусов</tspan><tspan x="450" y="421">отсутствия</tspan></text><path d="M565 221 L630 221" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="630" y="90" width="230" height="409" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="745" y="131" font-size="18" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="745" y="131">Структурированная</tspan><tspan x="745" y="153">запись</tspan></text><text x="745" y="229" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="745" y="229">Явка с повинной:</tspan><tspan x="745" y="255">true</tspan></text><text x="745" y="311" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="745" y="311">Компенсация: 500</tspan><tspan x="745" y="337">тыс. юаней</tspan></text><text x="745" y="451" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="745" y="451">Вред: тяжкий, II</tspan><tspan x="745" y="477">степень</tspan></text><rect x="40" y="529" width="820" height="101" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="561" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="561">Модульная схема: общие поля + поля состава</tspan></text><text x="450" y="591" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="591">Явка с повинной / компенсация / судимость; кража → сумма</tspan><tspan x="450" y="617">ущерба, вред → степень тяжести</tspan></text><path d="M450 655 L450 695" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="695" width="860" height="535" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="735" font-size="26" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="735">Этап 2: анализ признаков и моделирование прототипов</tspan></text><rect x="40" y="765" width="820" height="116" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="801" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="801">Кодирование и нормализация признаков</tspan></text><text x="450" y="837" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="837">One-hot для категорий · булевы признаки · логарифмирование</tspan><tspan x="450" y="863">чисел · нормализация</tspan></text><path d="M450 881 L450 898 L230 898 L230 916" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="40" y="916" width="380" height="279" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="230" y="955" font-size="26" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="230" y="955">Кластеризация KMeans</tspan></text><text x="230" y="999" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="230" y="999">Сравнение 2–5 кластеров по</tspan><tspan x="230" y="1025">составу</tspan></text><text x="230" y="1082" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="230" y="1082">Выбор по силуэту →</tspan><tspan x="230" y="1108">прототипы дел</tspan></text><text x="230" y="1139" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="230" y="1139">Признаки + сводка</tspan><tspan x="230" y="1165">распределения сроков</tspan></text><path d="M420 1001 L470 1001" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="916" width="390" height="279" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="665" y="955" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="665" y="955">Веса признаков</tspan></text><text x="665" y="999" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="665" y="999">Сравнение различий</tspan><tspan x="665" y="1025">нормализованных центров</tspan><tspan x="665" y="1051">кластеров</tspan></text><text x="665" y="1082" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="665" y="1082">Оценка роли признака в</tspan><tspan x="665" y="1108">различении прототипов</tspan></text><text x="665" y="1139" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="665" y="1139">Дополнительное объяснение</tspan><tspan x="665" y="1165">результатов сопоставления</tspan></text><path d="M450 1230 L450 1265" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="1265" width="860" height="207" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="1306" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="1306">Расширение: диалоговый поиск по делам</tspan></text><text x="450" y="1351" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1351">Уточнение ключевых фактов → сопоставление с прототипом дела →</tspan><tspan x="450" y="1377">объяснение статистики с учётом источников</tspan></text><text x="450" y="1415" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1415">Пример: сочетания признаков при спонтанной драке после ссоры и</tspan><tspan x="450" y="1441">заранее спланированном нападении с оружием</tspan></text></svg>