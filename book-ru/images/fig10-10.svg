<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="150.756mm" viewBox="0 0 900 1280" role="img" aria-labelledby="title desc">
<title id="title">Архитектура AI-городка</title><desc id="desc">Пример записей памяти Isabella, межсобытийных выводов и плана на день.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1280" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="136" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Isabella Rodriguez · владелица кафе Hobbs</tspan></text><text x="450" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Характер: дружелюбная, общительная · цель: подготовить вечеринку</tspan><tspan x="450" y="126">ко Дню святого Валентина</tspan></text><path d="M450 156 L450 201" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="201" width="860" height="280" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="201" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="234" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="234">Поток памяти · примеры записей</tspan></text><text x="450" y="281" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="281">08:30 Открытие кафе: важность 4, свежесть 0.60</tspan></text><text x="450" y="313" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="313">09:15 Разговор с Klaus: важность 5, свежесть 0.70</tspan></text><text x="450" y="345" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="345">10:00 Планирование вечеринки: важность 9, свежесть 0.80</tspan></text><text x="450" y="377" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="377">11:30 Приглашение Maria: важность 8, свежесть 0.85</tspan></text><text x="450" y="409" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="409">14:00 Просьба Maria о помощи: важность 7, свежесть 0.90</tspan></text><text x="450" y="441" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="441">Поиск: по свежести, важности и релевантности текущему вопросу</tspan></text><path d="M450 481 L450 501 L225 501 L225 526" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 501 L675 501 L675 526" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="526" width="410" height="325" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="526" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="559" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="559">Рефлексия · выводы по</tspan><tspan x="225" y="587">нескольким событиям</tspan></text><text x="225" y="634" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="634">Кто часто бывает в кафе?</tspan></text><text x="225" y="692" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="692">Maria, Klaus, Tom</tspan></text><text x="225" y="724" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="724">Кто может прийти на вечеринку?</tspan></text><text x="225" y="756" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="756">Завсегдатаи и их друзья</tspan></text><text x="225" y="788" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="788">Кто поможет с подготовкой?</tspan><tspan x="225" y="814">Maria</tspan></text><rect x="470" y="526" width="410" height="325" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="526" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="559" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="559">Планирование · пример</tspan><tspan x="675" y="587">распорядка дня</tspan></text><text x="675" y="634" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="634">08:00 Завтрак · 08:30 Открытие</tspan><tspan x="675" y="660">кафе</tspan></text><text x="675" y="692" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="692">12:00 Пригласить друзей</tspan></text><text x="675" y="724" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="724">14:00 Украсить помещение</tspan></text><text x="675" y="756" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="756">16:00 Приготовить еду</tspan></text><text x="675" y="788" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="788">18:00 Провести вечеринку</tspan></text><path d="M430 705 L470 705" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="887" width="860" height="298" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="887" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="920" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="920">Социальные взаимодействия в городке</tspan></text><text x="450" y="967" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="967">25 агентов, два дня жизни</tspan></text><text x="450" y="999" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="999">Распространение в разговорах: приглашение на вечеринку,</tspan><tspan x="450" y="1025">выдвижение Sam в мэры</tspan></text><text x="450" y="1057" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1057">Память и отношения: узнавать знакомых, продолжать тему</tspan><tspan x="450" y="1083">фотопроекта</tspan></text><text x="450" y="1115" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1115">Действия: планировать мероприятия, приглашать друзей, приходить</tspan><tspan x="450" y="1141">на встречи</tspan></text><path d="M675 851 L675 887" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 1185 L675 1250 L7 1250 L7 351 L20 351" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="490" y="1235" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="490" y="1235">Новые взаимодействия пополняют память</tspan></text></svg>