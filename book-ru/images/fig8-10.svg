<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="131.676mm" viewBox="0 0 900 1118" role="img" aria-labelledby="title desc">
<title id="title">Конвейер контролируемой донастройки (SFT)</title><desc id="desc">Источники данных, контроль каждого token и примеры разного поведения.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1118" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="171" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Определение задач и создание примеров</tspan></text><text x="450" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Примеры людей · генерация учителем · успешные или исправленные</tspan><tspan x="450" y="126">траектории</tspan></text><text x="450" y="158" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="158">Вход x: задача, контекст, инструменты; цель y: ответ или действие</tspan></text><path d="M450 191 L450 226" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="226" width="860" height="131" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="226" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="259" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="259">Фильтрация и разделение</tspan></text><text x="450" y="306" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="306">Проверка содержания, формата и результатов инструментов →</tspan><tspan x="450" y="332">дедупликация → разделение на обучение и отложенные задачи</tspan></text><path d="M450 357 L450 392" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="392" width="860" height="166" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="392" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="425" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="425">Оптимизация по каждому token</tspan></text><text x="504.4" y="472" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="504.4" y="472">L = −Σₜ log P(yₜ | x, y₁,…,yₜ₋₁)</tspan></text><text x="450" y="504" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="504">Целевые ответы и действия входят в функцию потерь; вход служит</tspan><tspan x="450" y="530">контекстом</tspan></text><path d="M450 558 L450 593" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="593" width="860" height="131" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="593" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="626" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="626">Независимая оценка</tspan></text><text x="450" y="673" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="673">Формат и инструкции · результат задачи · вне распределения ·</tspan><tspan x="450" y="699">исходные способности</tspan></text><rect x="20" y="769" width="410" height="314" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="769" width="410" height="104" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="802" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="802">Управление речью и</tspan><tspan x="225" y="830">языком</tspan></text><text x="225" y="905" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="905">Речь: говорящий / аудиоконтекст</tspan></text><text x="225" y="963" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="963">Метки выразительности:</tspan><tspan x="225" y="989">&lt;laugh&gt; / &lt;sigh&gt;</tspan></text><text x="225" y="1021" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="1021">Язык: примеры на заданном</tspan><tspan x="225" y="1047">языке генерации</tspan></text><rect x="470" y="769" width="410" height="314" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="769" width="410" height="104" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="802" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="802">Дистилляция и</tspan><tspan x="675" y="830">использование</tspan><tspan x="675" y="858">инструментов</tspan></text><text x="675" y="905" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="905">Учитель с длинным промптом →</tspan><tspan x="675" y="931">ученик с коротким</tspan></text><text x="675" y="963" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="963">Пример рассуждения → целевая</tspan><tspan x="675" y="989">последовательность ученика</tspan></text><text x="675" y="1021" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="1021">JSON инструментов / траектория</tspan><tspan x="675" y="1047">восстановления после ошибок</tspan></text></svg>