<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="111.300mm" viewBox="0 0 900 945" role="img" aria-labelledby="title desc">
<title id="title">Распределение заслуг при многораундовом взаимодействии</title><desc id="desc">Пять шагов одного маршрута расположены по строкам: сравниваются награда только в конце и пошаговые оценки с обратной связью по процессу.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="945" fill="#ffffff" y="0" />
<text x="450" y="53" font-size="30" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Один маршрут, две схемы вознаграждения</tspan></text><text x="102" y="120" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="102" y="120">Шаг</tspan></text><text x="314" y="120" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="314" y="120">Наблюдение и</tspan><tspan x="314" y="148">действие</tspan></text><text x="590" y="120" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="590" y="120">Награда</tspan><tspan x="590" y="148">только в</tspan><tspan x="590" y="176">конце</tspan></text><text x="784" y="120" font-size="18" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="784" y="120">С</tspan><tspan x="784" y="142">промежуточными</tspan><tspan x="784" y="164">наградами</tspan></text><path d="M32 202 L868 202" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="102" y="250" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="102" y="250">1</tspan></text><text x="314" y="250" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="314" y="250">Осмотреть путь</tspan><tspan x="314" y="276">впереди и</tspan><tspan x="314" y="302">повернуть</tspan><tspan x="314" y="328">налево</tspan></text><text x="590" y="250" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="590" y="250">0</tspan></text><text x="784" y="250" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="784" y="250">+1</tspan></text><path d="M32 352 L868 352" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="102" y="400" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="102" y="400">2</tspan></text><text x="314" y="400" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="314" y="400">Распознать</tspan><tspan x="314" y="426">указатель и</tspan><tspan x="314" y="452">подтвердить</tspan><tspan x="314" y="478">направление</tspan></text><text x="590" y="400" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="590" y="400">0</tspan></text><text x="784" y="400" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="784" y="400">+1</tspan></text><path d="M32 502 L868 502" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="102" y="550" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="102" y="550">3</tspan></text><text x="314" y="550" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="314" y="550">Пропустить</tspan><tspan x="314" y="578">поворот и</tspan><tspan x="314" y="606">продолжить</tspan><tspan x="314" y="634">прямо</tspan></text><text x="590" y="550" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="590" y="550">0</tspan></text><text x="784" y="550" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="784" y="550">−1</tspan></text><path d="M32 658 L868 658" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="102" y="706" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="102" y="706">4</tspan></text><text x="314" y="706" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="314" y="706">Обнаружить</tspan><tspan x="314" y="732">отклонение и</tspan><tspan x="314" y="758">развернуться</tspan></text><text x="590" y="706" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="590" y="706">0</tspan></text><text x="784" y="706" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="784" y="706">0</tspan></text><path d="M32 782 L868 782" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="102" y="830" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="102" y="830">5</tspan></text><text x="314" y="830" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="314" y="830">Достичь цели и</tspan><tspan x="314" y="856">завершить</tspan><tspan x="314" y="882">навигацию</tspan></text><text x="590" y="830" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="590" y="830">+10</tspan></text><text x="784" y="830" font-size="27" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="784" y="830">+10</tspan></text><path d="M32 905 L868 905" fill="none" stroke="#333333" stroke-width="1.8" />
</svg>