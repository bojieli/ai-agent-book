<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="121.076mm" viewBox="0 0 900 1028" role="img" aria-labelledby="title desc">
<title id="title">Сравнение архитектур Q-learning и LLM Agent в игре с поиском сокровищ</title><desc id="desc">Два пути принятия решений в одной среде и два режима замера: после обучения и при первом запуске.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1028" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="258" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Q-learning Agent</tspan></text><text x="225" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="100">Кодирование комнат, предметов,</tspan><tspan x="225" y="126">дверей и стражей</tspan></text><text x="225" y="158" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="158">В этой Q-таблице — 142</tspan><tspan x="225" y="184">состояния</tspan></text><text x="225" y="216" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="216">Исследование доступных</tspan><tspan x="225" y="242">действий или поиск по таблице</tspan></text><rect x="470" y="20" width="410" height="258" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">LLM Agent · Kimi K3</tspan></text><text x="675" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="100">Чтение описания комнаты и</tspan><tspan x="675" y="126">доступных действий</tspan></text><text x="675" y="158" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="158">Хранение до 50 эпизодов опыта</tspan></text><text x="675" y="216" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="216">Возврат выбранного действия</tspan><tspan x="675" y="242">текстом</tspan></text><path d="M225 278 L225 318" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 278 L675 318" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="318" width="410" height="194" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="318" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="351" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="351">Выбор действия по</tspan><tspan x="225" y="379">Q-значению</tspan></text><text x="225" y="426" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="426">Например: go north</tspan></text><text x="225" y="458" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="458">Среда выполняет «идти на</tspan><tspan x="225" y="484">север»</tspan></text><rect x="470" y="318" width="410" height="194" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="318" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="351" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="351">Извлечение действия из</tspan><tspan x="675" y="379">ответа</tspan></text><text x="675" y="426" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="426">ACTION: take red key</tspan></text><text x="675" y="458" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="458">Среда выполняет «поднять</tspan><tspan x="675" y="484">красный ключ»</tspan></text><path d="M225 512 L225 537 L675 537 L675 512" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 537 L450 572" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="572" width="860" height="136" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="572" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="605" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="605">Одна и та же среда поиска сокровищ</tspan></text><text x="450" y="652" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="652">Позиция · предметы · двери · стражи → действие → наблюдение и</tspan><tspan x="450" y="678">награда</tspan></text><path d="M20 622 L7 622 L7 136 L20 136" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M880 622 L893 622 L893 136 L880 136" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="748" width="410" height="260" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="748" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="781" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="781">Жадная оценка после</tspan><tspan x="225" y="809">обучения</tspan></text><text x="225" y="856" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="856">Фиксация Q-таблицы после</tspan><tspan x="225" y="882">10,000 игр</tspan></text><text x="225" y="914" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="914">Отдельный замер на 100 играх:</tspan><tspan x="225" y="940">все пройдены</tspan></text><text x="225" y="972" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="972">В среднем 12 шагов за игру</tspan></text><rect x="470" y="748" width="410" height="260" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="748" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="781" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="781">Замеренная траектория</tspan><tspan x="675" y="809">первой игры</tspan></text><text x="675" y="856" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="856">Шаг 9: создан серебряный меч</tspan></text><text x="675" y="914" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="914">Шаг 14: побеждён сильный</tspan><tspan x="675" y="940">страж</tspan></text><text x="675" y="972" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="972">Шаг 17: получено сокровище</tspan></text></svg>