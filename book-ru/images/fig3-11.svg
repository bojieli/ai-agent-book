<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="86.802mm" viewBox="0 0 900 737" role="img" aria-labelledby="title desc">
<title id="title">Граф знаний GraphRAG: сущности и связи</title><desc id="desc">Два врача Чжана имеют разные идентификаторы сущностей и связи. Адрес стоматолога ищется по цепочке: пользователь → врач → больница → адрес.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="737" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="93" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="62" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="62">Запрос: каков адрес больницы, где работает мой</tspan><tspan x="450" y="90">стоматолог?</tspan></text><rect x="20" y="148" width="410" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="225" y="192" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="192">Пользователь</tspan></text><rect x="470" y="148" width="410" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="675" y="192" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="192">Отец пользователя</tspan></text><path d="M225 213 L225 334" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="333" y="272" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="333" y="272">Обращаться для лечения зубов</tspan></text><rect x="20" y="334" width="410" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="225" y="369" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="369">Врач Чжан-A</tspan></text><text x="225" y="404" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="404">Отделение: стоматология</tspan></text><path d="M225 424 L225 484" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="290" y="463" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="290" y="463">Работает в</tspan></text><rect x="20" y="484" width="410" height="98" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="225" y="528" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="528">Стоматологическая</tspan><tspan x="225" y="556">больница «Жэньай»</tspan></text><path d="M675 213 L675 334" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="783" y="272" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="783" y="272">Обращаться при</tspan><tspan x="783" y="298">болезнях сердца</tspan></text><rect x="470" y="334" width="410" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="675" y="369" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="369">Врач Чжан-B</tspan></text><text x="675" y="404" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="404">Отделение: кардиология</tspan></text><path d="M675 424 L675 484" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="740" y="463" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="740" y="463">Работает в</tspan></text><rect x="470" y="484" width="410" height="98" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="675" y="528" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="528">Больница «Хуашань» ·</tspan><tspan x="675" y="556">кардиоцентр</tspan></text><path d="M225 582 L225 642" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="285" y="621" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="285" y="621">Адрес</tspan></text><rect x="20" y="642" width="410" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="225" y="684" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="684">Район Сюйхуэй, улица XX</tspan></text></svg>