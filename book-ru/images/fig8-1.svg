<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="119.898mm" viewBox="0 0 900 1018" role="img" aria-labelledby="title desc">
<title id="title">Цикл взаимодействия Agent со средой в обучении с подкреплением</title><desc id="desc">Стратегия, действия, наблюдения, награды и фрагмент траектории поиска сокровищ.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1018" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="321" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Agent · исследователь</tspan></text><text x="225" y="128" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="128">Стратегия π: выбор действия по</tspan><tspan x="225" y="154">наблюдению</tspan></text><text x="225" y="186" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="186">Перемещение / подбор /</tspan><tspan x="225" y="212">создание / атака</tspan></text><text x="225" y="244" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="244">ε-жадная стратегия: ε = 0.1</tspan></text><text x="225" y="276" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="276">90% — жадный выбор, 10% —</tspan><tspan x="225" y="302">случайное исследование</tspan></text><rect x="470" y="20" width="410" height="321" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Учебный пример · поиск</tspan><tspan x="675" y="81">сокровищ</tspan></text><text x="675" y="128" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="128">Комнаты / предметы / двери /</tspan><tspan x="675" y="154">стражи</tspan></text><text x="675" y="186" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="186">Переход по действию и</tspan><tspan x="675" y="212">текущему состоянию</tspan></text><text x="675" y="244" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="244">Пример: перемещение, r = 0</tspan></text><text x="675" y="276" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="276">Взять ключ: +5; победить</tspan><tspan x="675" y="302">стража: +50</tspan></text><path d="M225 341 L225 386 L675 386 L675 341" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="459.8" y="376" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="459.8" y="376">Действие aₜ: двигаться на восток</tspan></text><rect x="20" y="426" width="860" height="166" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="426" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="459" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="459">Отклик среды</tspan></text><text x="476.4" y="506" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="476.4" y="506">Наблюдение oₜ₊₁: комната, видимые предметы, состояние дверей</tspan><tspan x="476.4" y="532">и стражей</tspan></text><text x="476.4" y="564" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="476.4" y="564">Награда rₜ₊₁: отклик на это действие</tspan></text><path d="M880 174 L893 174 L893 496 L880 496" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M20 496 L7 496 L7 174 L20 174" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="632" width="860" height="201" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="632" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="665" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="665">Фрагмент траектории</tspan></text><text x="450" y="712" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="712">Вестибюль → на восток → кладовая, r = 0</tspan></text><text x="450" y="744" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="744">Кладовая → взять красный ключ → ключ получен, r = +5</tspan></text><text x="450" y="776" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="776">Исследовать дальше → создать серебряный меч, r = +10 → атаковать</tspan><tspan x="450" y="802">стража, r = +50</tspan></text><rect x="20" y="878" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="878" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="911" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="911">Дисконтированный доход</tspan></text><text x="539.1" y="958" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="539.1" y="958">Gₜ = rₜ₊₁ + γrₜ₊₂ + γ²rₜ₊₃ + …, γ = 0.99</tspan></text></svg>