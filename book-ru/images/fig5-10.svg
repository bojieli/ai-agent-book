<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="123.313mm" viewBox="0 0 900 1047" role="img" aria-labelledby="title desc">
<title id="title">Цикл самосоздания Agent</title><desc id="desc">Создание поддержки интернет-магазина по образцу авиационной; доработка или сохранение по итогам многораундовых тестов.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1047" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="176" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Эталонная реализация: авиационная поддержка</tspan></text><text x="450" y="100" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">В prompt заданы отмена и перевод; инструмент — cancel_order</tspan></text><text x="450" y="132" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="132">Модель выбирает инструмент → проверка и выполнение → запись</tspan><tspan x="450" y="158">результата → продолжение или выход</tspan></text><path d="M450 196 L450 233" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="233" width="860" height="204" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="233" width="860" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="266" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="266">Создатель копирует каркас и адаптирует его к</tspan><tspan x="450" y="294">интернет-магазину</tspan></text><text x="450" y="341" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="341">Замена правил возврата и доставки, подключение refund_order</tspan></text><text x="450" y="373" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="373">Сохранение ID вызовов и связей сообщений; состояние между</tspan><tspan x="450" y="399">раундами, бюджет и условия выхода</tspan></text><path d="M450 437 L450 474" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="474" width="860" height="202" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="474" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="507" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="507">Проверка новой поддержки интернет-магазина</tspan></text><text x="450" y="554" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="554">Проверка структуры и компиляции, соответствия запросов и ответов</tspan><tspan x="450" y="580">инструментов</tspan></text><text x="450" y="612" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="612">Выполнение возврата, проверка инструментов и состояния между</tspan><tspan x="450" y="638">раундами</tspan></text><path d="M230 676 L230 732" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M680 676 L680 732" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="732" width="410" height="247" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="732" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="765" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="765">Сбой: исправить и</tspan><tspan x="225" y="793">повторить</tspan></text><text x="225" y="840" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="840">Найти дефект и вернуть</tspan><tspan x="225" y="866">создателю</tspan></text><rect x="470" y="732" width="410" height="287" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="732" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="765" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="765">Успех: сохранить версию и</tspan><tspan x="675" y="793">тест-кейсы</tspan></text><text x="675" y="840" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="840">Общие исправления</tspan><tspan x="675" y="866">возвращаются в эталонный</tspan><tspan x="675" y="892">каркас</tspan></text><text x="675" y="924" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="924">Сценарии интернет-магазина</tspan><tspan x="675" y="950">сохраняются со</tspan><tspan x="675" y="976">специализированным Agent</tspan></text><path d="M20 821 L5 821 L5 332 L20 332" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
</svg>