<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="76.791mm" viewBox="0 0 900 652" role="img" aria-labelledby="title desc">
<title id="title">Визуализация обновления Q-значения</title><desc id="desc">Одношаговая цель, TD-ошибка и обновлённое значение в примере с красным ключом.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="652" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Обновление Q-learning</tspan></text><text x="450" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Q(s,a) ← Q(s,a) + α[r + γ max Q(s′,a′) − Q(s,a)]</tspan></text><rect x="20" y="165" width="410" height="234" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="165" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="198" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="198">Текущее состояние и</tspan><tspan x="225" y="226">действие</tspan></text><text x="225" y="273" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="273">Кладовая, ключа ещё нет</tspan></text><text x="225" y="305" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="305">Действие: взять красный ключ</tspan></text><text x="225" y="363" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="363">Q(s,a) = 0.25</tspan></text><rect x="470" y="165" width="410" height="234" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="165" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="198" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="198">Отклик за шаг</tspan></text><text x="675" y="273" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="273">Награда за шаг: 5 − 0.5 = 4.5</tspan></text><text x="675" y="305" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="305">Следующее состояние: есть</tspan><tspan x="675" y="331">красный ключ</tspan></text><text x="675" y="363" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="363">max Q(s′,a′) = 0.63</tspan></text><path d="M430 283 L470 283" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 399 L225 419 L675 419 L675 399" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 419 L450 444" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="444" width="860" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="444" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="477" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="477">α = 0.2, γ = 0.99</tspan></text><text x="450" y="524" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="524">TD-цель: 4.5 + 0.99 × 0.63 = 5.1237</tspan></text><text x="450" y="556" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="556">TD-ошибка: 5.1237 − 0.25 = 4.8737</tspan></text><text x="450" y="588" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="588">Новая оценка: 0.25 + 0.2 × 4.8737 = 1.22474</tspan></text></svg>