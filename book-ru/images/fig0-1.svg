<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="98.462mm" viewBox="0 0 900 836" role="img" aria-labelledby="title desc">
<title id="title">Agent = LLM + контекст + инструменты</title><desc id="desc">Начните с поручения по счёту и читайте сверху вниз. Модель решает запросить счёт, инструмент возвращает детализацию; она попадает в контекст, и модель решает, что делать дальше.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="836" fill="#ffffff" y="0" />
<rect x="24" y="20" width="180" height="116" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="20" width="660" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="76" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="114" y="76">Контекст</tspan></text><text x="544" y="76" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="544" y="76">Поручение пользователя: выяснить,</tspan><tspan x="544" y="102">за что переплата в этом месяце</tspan></text><path d="M544 136 L544 176" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="180" width="180" height="116" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="180" width="660" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="236" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="114" y="236">LLM</tspan></text><text x="544" y="236" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="544" y="236">Решение: сначала проверить счёт</tspan><tspan x="544" y="262">за этот месяц</tspan></text><path d="M544 296 L544 336" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="340" width="180" height="116" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="340" width="660" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="396" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="114" y="396">Инструмент</tspan></text><text x="544" y="396" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="544" y="396">Интерфейс счетов возвращает</tspan><tspan x="544" y="422">плату за роуминг</tspan></text><path d="M544 456 L544 496" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="500" width="180" height="142" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="500" width="660" height="142" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="556" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="114" y="556">Контекст</tspan></text><text x="544" y="556" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="544" y="556">Здесь находятся поручение</tspan><tspan x="544" y="582">пользователя и найденные</tspan><tspan x="544" y="608">сведения</tspan></text><path d="M544 642 L544 682" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="686" width="180" height="116" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="686" width="660" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="742" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="114" y="742">LLM</tspan></text><text x="544" y="742" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="544" y="742">Решение: уточнить у поддержки</tspan><tspan x="544" y="768">основание для платы за роуминг</tspan></text></svg>