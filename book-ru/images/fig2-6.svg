<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="80.207mm" viewBox="0 0 900 681" role="img" aria-labelledby="title desc">
<title id="title">Наглядное представление механизма внимания</title><desc id="desc">Каждая строка матрицы причинного внимания соответствует одному Query. Веса последней строки задают взвешенную сумму Value в четырёх позициях.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="681" fill="#ffffff" y="0" />
<text x="450" y="48" font-size="26" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="48">Столбцы соответствуют позициям, предоставляющим Key</tspan></text><text x="118" y="104" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="118" y="104">Позиция</tspan><tspan x="118" y="130">Query</tspan></text><text x="290" y="104" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="290" y="104">Пекин</tspan></text><text x="435" y="104" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="435" y="104">de</tspan></text><text x="580" y="104" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="580" y="104">погода</tspan></text><text x="725" y="104" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="725" y="104">какая</tspan></text><text x="125" y="201" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="125" y="201">Пекин</tspan></text><rect x="220" y="156" width="140" height="70" rx="6" fill="#999999" stroke="#333333" stroke-width="1.8" />
<text x="290" y="200" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="290" y="200">1.00</tspan></text><rect x="365" y="156" width="140" height="70" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
