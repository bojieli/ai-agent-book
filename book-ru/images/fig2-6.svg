<text x="580" y="428" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="580" y="428">0.55</tspan></text><rect x="655" y="384" width="140" height="70" rx="6" fill="#f3f3f3" stroke="#333333" stroke-width="1.8" />
