<text x="435" y="352" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="435" y="352">0.10</tspan></text><rect x="510" y="308" width="140" height="70" rx="6" fill="#b6b6b6" stroke="#333333" stroke-width="1.8" />
