<text x="450" y="572" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="572">Выход в позиции «какая» — последняя строка</tspan></text><text x="450" y="620" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="620">0,35 V(Пекин) + 0,05 V(de) + 0,55 V(погода) + 0,05 V(какая)</tspan></text></svg>