<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="148.400mm" viewBox="0 0 900 1260" role="img" aria-labelledby="title desc">
<title id="title">Замкнутый цикл взаимодействия Agent и Environment и внутренняя структура Model–Harness</title><desc id="desc">Agent включает равноправные Model и Harness. Harness формирует контекст, вызывает инструменты и управляет выполнением; среда принимает действия, обновляет состояние и возвращает наблюдения.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1260" fill="#ffffff" y="0" />
<rect x="20" y="20" width="552" height="1220" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="296" y="63" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="296" y="63">Agent (интеллектуальный агент)</tspan></text><rect x="35" y="100" width="210" height="374" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="140" y="144" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="140" y="144">Model</tspan></text><text x="140" y="196" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="140" y="196">Понимание ·</tspan><tspan x="140" y="222">рассуждение</tspan></text><text x="140" y="290" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="140" y="290">Выбор</tspan><tspan x="140" y="316">следующего</tspan><tspan x="140" y="342">действия</tspan></text><rect x="263" y="100" width="292" height="1110" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="409" y="144" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="409" y="144">Harness</tspan></text><rect x="276" y="166" width="266" height="419" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="409" y="233" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="409" y="233">Управление</tspan><tspan x="409" y="261">контекстом</tspan></text><text x="409" y="356" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="409" y="356">Инструкции ·</tspan><tspan x="409" y="382">определения</tspan><tspan x="409" y="408">инструментов</tspan></text><text x="409" y="472" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="409" y="472">Наблюдения ·</tspan><tspan x="409" y="498">история · память</tspan></text><text x="409" y="560" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="409" y="560">Состояние задачи</tspan></text><rect x="276" y="681" width="266" height="207" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="409" y="746" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="409" y="746">Интерфейс</tspan><tspan x="409" y="774">инструментов</tspan></text><text x="409" y="840" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="409" y="840">Проверка вызовов ·</tspan><tspan x="409" y="866">диспетчеризация</tspan></text><rect x="276" y="909" width="266" height="276" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
