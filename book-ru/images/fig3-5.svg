<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="130.733mm" viewBox="0 0 900 1110" role="img" aria-labelledby="title desc">
<title id="title">Процесс RAG-запроса: поиск, дополнение и генерация</title><desc id="desc">По запросу о возврате находятся правила и инструкции. Они вместе с вопросом поступают в модель для генерации конкретного ответа.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1110" fill="#ffffff" y="0" />
<rect x="20" y="20" width="290" height="164" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="165" y="58" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="165" y="58">Вопрос</tspan><tspan x="165" y="86">пользователя</tspan></text><text x="165" y="127" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="165" y="127">Как оформить возврат?</tspan></text><rect x="440" y="20" width="440" height="164" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="660" y="58" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="660" y="58">База знаний</tspan></text><text x="660" y="127" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="660" y="127">Правила возврата · инструкция ·</tspan><tspan x="660" y="153">срок зачисления</tspan></text><path d="M165 184 L165 229 L290 229" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M660 184 L660 229 L610 229" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="290" y="199" width="320" height="128" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="237" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="237">Поиск Top-k</tspan><tspan x="450" y="265">фрагментов</tspan></text><text x="450" y="304" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="304">Плотные векторы / BM25</tspan></text><path d="M450 327 L450 362" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="362" width="860" height="221" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="399" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="399">Результаты поиска</tspan></text><text x="450" y="443" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="443">① Полный возврат доступен в течение 7 дней после получения. Нужен</tspan><tspan x="450" y="469">номер заказа.</tspan></text><text x="450" y="512" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="512">Средства поступят в течение 3–5 рабочих дней.</tspan></text><text x="450" y="555" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="555">② Мои заказы → выбрать заказ → оформить возврат.</tspan></text><path d="M450 583 L450 623" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="623" width="860" height="151" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="662" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="662">Дополненный вход модели</tspan></text><text x="450" y="709" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="709">Инструкция + вопрос пользователя + найденные фрагменты и их</tspan><tspan x="450" y="735">источники</tspan></text><path d="M450 774 L450 809" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="290" y="809" width="320" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="851" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="851">LLM генерирует ответ</tspan></text><path d="M450 874 L450 914" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="914" width="860" height="171" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="952" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="952">Ответ</tspan></text><text x="450" y="995" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="995">В течение 7 дней после получения откройте «Мои заказы», выберите</tspan><tspan x="450" y="1021">заказ и оформите возврат.</tspan></text><text x="450" y="1060" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1060">Укажите номер заказа. Средства поступят в течение 3–5 рабочих дней.</tspan></text></svg>