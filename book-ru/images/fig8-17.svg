<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="135.680mm" viewBox="0 0 900 1152" role="img" aria-labelledby="title desc">
<title id="title">Цикл ReTool: чередование текстово-кодовых рассуждений и обратной связи от песочницы</title><desc id="desc">Пример решения уравнения, интерфейс выполнения и конфигурация обучения PPO.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
