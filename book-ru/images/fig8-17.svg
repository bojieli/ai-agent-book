<text x="285" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="285" y="53">Текстовое рассуждение</tspan></text><text x="285" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="285" y="100">Решить x² + 2x − 8 = 0</tspan></text><text x="285" y="132" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="285" y="132">Вызвать sympy для вычисления корней</tspan></text><path d="M285 160 L285 195" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="195" width="530" height="206" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="195" width="530" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="285" y="228" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="285" y="228">Генерация кода</tspan></text><text x="285" y="275" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="285" y="275">from sympy import symbols, solve</tspan></text><text x="285" y="333" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="285" y="333">x = symbols("x")</tspan></text><text x="285" y="365" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="285" y="365">solve(x**2 + 2*x - 8, x)</tspan></text><rect x="595" y="195" width="285" height="302" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="595" y="195" width="285" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="737.5" y="228" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="737.5" y="228">SandboxFusion</tspan></text><text x="737.5" y="275" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="737.5" y="275">128 параллельных</tspan><tspan x="737.5" y="301">воркеров</tspan></text><text x="737.5" y="333" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="737.5" y="333">Выполнение Python</tspan></text><text x="737.5" y="365" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="737.5" y="365">sympy / numpy</tspan></text><text x="737.5" y="397" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="737.5" y="397">scipy</tspan></text><text x="737.5" y="429" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="737.5" y="429">Тайм-аут и</tspan><tspan x="737.5" y="455">ограничение памяти</tspan></text><path d="M550 260 L595 260" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M595 371 L572 371 L572 502 L550 502" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
