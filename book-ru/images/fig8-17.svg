<rect x="20" y="602" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="602" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="635" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="635">Дальнейшие рассуждения и ответ</tspan></text><text x="450" y="682" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="682">Проверка: 2² + 2×2 − 8 = 0</tspan></text><text x="450" y="714" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="714">Итоговый ответ: x = −4 или x = 2</tspan></text><rect x="20" y="787" width="410" height="330" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="787" width="410" height="76" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="820" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="820">Конфигурация обучения</tspan><tspan x="225" y="848">PPO</tspan></text><text x="225" y="895" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="895">Qwen2.5-32B</tspan></text><text x="225" y="927" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="927">SFT: около 1 часа</tspan></text><text x="225" y="959" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="959">RL: около 9 дней / 400 шагов</tspan></text><text x="225" y="991" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="991">На каждом шаге: 32 задачи × 16</tspan><tspan x="225" y="1017">кандидатов</tspan></text><text x="225" y="1049" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="1049">В среднем около 7–9 раундов</tspan><tspan x="225" y="1075">взаимодействия</tspan></text><rect x="470" y="787" width="410" height="330" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
