<rect x="100" y="766" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="799" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="799">TTS и воспроизведение</tspan></text><text x="450" y="846" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="846">Fish Audio S1: текст → аудиоблоки</tspan></text><text x="450" y="878" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="878">Передача по сети → буфер воспроизведения → динамик</tspan></text></svg>