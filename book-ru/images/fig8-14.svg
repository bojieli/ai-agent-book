<text x="675" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Несколько раундов ·</tspan><tspan x="675" y="81">навигация по панорамам</tspan><tspan x="675" y="109">улиц</tspan></text><text x="675" y="156" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="156">Просмотр панорамы → повернуть</tspan><tspan x="675" y="182">налево</tspan></text><text x="675" y="214" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="214">Осмотреть дорожный знак →</tspan><tspan x="675" y="240">скорректировать направление</tspan></text><text x="675" y="272" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="272">Пропустить поворот → найти</tspan><tspan x="675" y="298">обратный путь</tspan></text><text x="675" y="330" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="330">Достичь цели → итоговая</tspan><tspan x="675" y="356">награда</tspan></text><rect x="20" y="440" width="410" height="284" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
