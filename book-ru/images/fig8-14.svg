<text x="225" y="53" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Один раунд · GeneralPoints</tspan></text><text x="225" y="156" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="156">Ввод: [7, J, 3, 5] → 24</tspan></text><text x="225" y="214" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="214">Модель генерирует рассуждение</tspan><tspan x="225" y="240">и ответ</tspan></text><text x="225" y="272" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="272">Проверка ответа → итоговая</tspan><tspan x="225" y="298">награда</tspan></text><text x="225" y="330" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="330">Выборка нескольких ответов →</tspan><tspan x="225" y="356">обновление стратегии</tspan></text><rect x="470" y="20" width="410" height="375" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
