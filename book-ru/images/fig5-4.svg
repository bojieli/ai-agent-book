<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="120.604mm" viewBox="0 0 900 1024" role="img" aria-labelledby="title desc">
<title id="title">Сравнение пяти способов правки файлов</title><desc id="desc">Пример: правка функции foo с ориентирами и условиями проверки.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1024" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="264" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="53">Diff + Apply Model</tspan></text><text x="225" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="100">− def foo(x): return x</tspan></text><text x="225" y="132" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="132">+ def foo(x, y=0): return x+y</tspan></text><text x="225" y="164" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="164">Модель описывает правку,</tspan><tspan x="225" y="190">приложение определяет место</tspan></text><text x="225" y="222" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="222">Проверка: различия после</tspan><tspan x="225" y="248">применения и тесты</tspan></text><rect x="470" y="20" width="410" height="264" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="53">Old String → New String</tspan></text><text x="675" y="100" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="100">old: def foo(x): return x</tspan></text><text x="675" y="132" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="132">new: def foo(x,y=0): return x+y</tspan></text><text x="675" y="164" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="164">Найти и заменить точный текст</tspan></text><text x="675" y="222" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="222">Проверка: число совпадений и</tspan><tspan x="675" y="248">контекст</tspan></text><rect x="20" y="324" width="410" height="316" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="324" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="357" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="357">По номеру строки</tspan></text><text x="225" y="404" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="404">Диапазон: строки 42—43</tspan></text><text x="225" y="462" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="462">Заменить новым определением</tspan><tspan x="225" y="488">функции и выражением возврата</tspan></text><text x="225" y="520" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="520">Крупные правки задаются</tspan><tspan x="225" y="546">компактным диапазоном</tspan></text><text x="225" y="578" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="578">Проверка: версия файла и сдвиг</tspan><tspan x="225" y="604">строк</tspan></text><rect x="470" y="324" width="410" height="316" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="324" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="357" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="357">Команды в стиле Vim</tspan></text><text x="675" y="404" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="404">42G: перейти · cw: изменить</tspan><tspan x="675" y="430">слово</tspan></text><text x="675" y="462" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="462">dd: удалить строку · yy / p:</tspan><tspan x="675" y="488">копировать и вставить</tspan></text><text x="675" y="520" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="520">Составные действия в режиме</tspan><tspan x="675" y="546">редактирования</tspan></text><text x="675" y="578" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="578">Проверка: режим, курсор и</tspan><tspan x="675" y="604">фактические различия</tspan></text><rect x="20" y="680" width="410" height="316" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="680" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="713" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="713">По началу и концу</tspan></text><text x="225" y="760" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="760">start: def foo(x):</tspan></text><text x="225" y="818" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="818">end: return x</tspan></text><text x="225" y="876" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="876">new: новая функция целиком</tspan></text><text x="225" y="934" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="934">Проверка: сочетание границ и</tspan><tspan x="225" y="960">диапазон замены</tspan></text><rect x="470" y="680" width="410" height="316" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="680" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="713" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="713">Общие этапы проверки</tspan></text><text x="675" y="760" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="760">Прочитать нужный контекст →</tspan><tspan x="675" y="786">найти место</tspan></text><text x="675" y="818" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="818">Применить правку → проверить</tspan><tspan x="675" y="844">различия</tspan></text><text x="675" y="876" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="876">Запустить тесты → устранить</tspan><tspan x="675" y="902">ошибки</tspan></text><text x="675" y="934" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="934">Сохранить версию и точку</tspan><tspan x="675" y="960">восстановления</tspan></text></svg>