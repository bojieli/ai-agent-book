<text x="450" y="831" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="831">④ Как результаты влияют на следующий цикл</tspan></text><text x="450" y="878" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="878">Попарная статистика и причины сбоев: сравнить модели или изменить</tspan><tspan x="450" y="904">Harness</tspan></text><text x="450" y="936" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="936">Добавить регрессионные задачи из случаев сбоев</tspan></text><path d="M20 872 L7 872 L7 443 L20 443" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
