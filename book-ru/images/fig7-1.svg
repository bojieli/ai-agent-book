<rect x="20" y="578" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="611" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="611">③ Как проверять</tspan></text><text x="450" y="658" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="658">Программные проверки: тесты / состояние / параметры</tspan></text><text x="450" y="690" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="690">Rubric: факты / полнота / связи / ограничения</tspan></text><text x="450" y="722" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="722">Оценка моделью и человеком: семантика / попарные предпочтения</tspan></text><path d="M450 758 L450 798" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
