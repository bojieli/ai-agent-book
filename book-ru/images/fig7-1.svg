<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">① Определение успеха</tspan></text><text x="450" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Pass@1: успех с одной попытки · Pass@k: хотя бы один успех за k</tspan><tspan x="450" y="126">попыток</tspan></text><text x="450" y="158" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="158">Best@k: лучший результат среди кандидатов · Pass^k: успех во всех k</tspan><tspan x="450" y="184">попытках</tspan></text><path d="M450 217 L450 260" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="260" width="860" height="273" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="260" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="293" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="293">② Источники задач</tspan></text><text x="450" y="340" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="340">Открытый бенчмарк: сравнение возможностей, примеры среды и</tspan><tspan x="450" y="366">критериев</tspan></text><text x="450" y="398" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="398">Собственный бизнес-набор: задачи по целевому распределению и</tspan><tspan x="450" y="424">ключевым границам</tspan></text><text x="450" y="456" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="456">Рабочие трассы: обезличенные случаи исправлений и сбоев после</tspan><tspan x="450" y="482">ручной проверки</tspan></text><path d="M450 533 L450 578" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
