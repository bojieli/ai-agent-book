<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="131.087mm" viewBox="0 0 900 1113" role="img" aria-labelledby="title desc">
<title id="title">Сквозной процесс: от статьи до видеообзора</title><desc id="desc">Два этапа: создание и проверка PPT; постраничное озвучивание и сведение звука с видео.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1113" fill="#ffffff" y="0" />
<rect x="100" y="20" width="700" height="181" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="20" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">① Разбор статьи и планирование</tspan></text><text x="450" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">Выделение разделов, результатов и ссылок на</tspan><tspan x="450" y="126">иллюстрации</tspan></text><text x="450" y="158" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="158">Планирование слайдов и подбор иллюстраций к тезисам</tspan></text><path d="M450 201 L450 241" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="241" width="700" height="181" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="241" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="274" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="274">② Создание и проверка Slidev</tspan></text><text x="450" y="321" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="321">Компоновка кода, текста и иллюстраций</tspan></text><text x="450" y="353" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="353">Постраничный рендеринг → визуальная проверка →</tspan><tspan x="450" y="379">правки</tspan></text><path d="M450 422 L450 462" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="462" width="700" height="181" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="462" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="495" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="495">③ Снимки слайдов и текст пояснений</tspan></text><text x="450" y="542" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="542">Сохранение порядка слайдов и соответствия</tspan><tspan x="450" y="568">иллюстраций</tspan></text><text x="450" y="600" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="600">Разговорные пояснения к каждому слайду</tspan></text><path d="M450 643 L450 683" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="683" width="700" height="181" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="683" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="716" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="716">④ TTS и синхронизация звука с видео</tspan></text><text x="450" y="763" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="763">Постраничный синтез речи и считывание длительности</tspan><tspan x="450" y="789">аудио</tspan></text><text x="450" y="821" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="821">Настройка длительности кадров и проверка переходов</tspan></text><path d="M450 864 L450 904" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="904" width="700" height="181" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="904" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="937" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="937">⑤ Сборка и проверка видео</tspan></text><text x="450" y="984" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="984">Сведение аудио и видео в FFmpeg</tspan></text><text x="450" y="1016" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="1016">Проверка иллюстраций, текста, пояснений и</tspan><tspan x="450" y="1042">синхронизации</tspan></text></svg>