<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="120.133mm" viewBox="0 0 900 1020" role="img" aria-labelledby="title desc">
<title id="title">Рабочий процесс Coding Agent</title><desc id="desc">Пять этапов с обратной связью от тестов и ревью.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1020" fill="#ffffff" y="0" />
<rect x="20" y="20" width="650" height="171" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="345" y="53">① Документирование проекта</tspan></text><text x="345" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="345" y="100">Прочитать README и архитектурную документацию</tspan></text><text x="345" y="132" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="345" y="132">Найти исходники через Glob, собрать инструкции</tspan><tspan x="345" y="158">проекта</tspan></text><path d="M345 191 L345 221" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="221" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="221" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="254" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="345" y="254">② Анализ требований</tspan></text><text x="345" y="301" font-size="23" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="345" y="301">Воспроизвести: 100 юаней идут перед 20 юанями</tspan></text><text x="345" y="333" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="345" y="333">Найти сортировку через Grep, проследить тип суммы</tspan></text><path d="M345 366 L345 396" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="396" width="650" height="171" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="396" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="429" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="345" y="429">③ Проектирование</tspan></text><text x="345" y="476" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="345" y="476">Решить, где преобразовать сумму в число</tspan></text><text x="345" y="508" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="345" y="508">Отправить проектное решение на ревью по процессу</tspan><tspan x="345" y="534">проекта</tspan></text><path d="M345 567 L345 597" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="597" width="650" height="171" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="597" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="630" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="345" y="630">④ Разработка и тестирование</tspan></text><text x="345" y="677" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="345" y="677">Изменить сравнение через Edit, повторить исходный</tspan><tspan x="345" y="703">тест</tspan></text><text x="345" y="735" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="345" y="735">Дополнительно проверить дробные и равные суммы</tspan></text><path d="M345 768 L345 798" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="798" width="650" height="197" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="798" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="831" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="345" y="831">⑤ Ревью и сдача</tspan></text><text x="345" y="878" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="345" y="878">Проверить через Lint; оценить читаемость,</tspan><tspan x="345" y="904">безопасность и производительность</tspan></text><text x="345" y="936" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="345" y="936">Обновить архитектурную документацию, проверить</tspan><tspan x="345" y="962">изменения и результат сдачи</tspan></text><path d="M670 868 L690 868 L690 669 L670 669" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="780" y="788" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="780" y="788">Замечания ревью</tspan></text></svg>