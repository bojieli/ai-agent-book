<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="151.933mm" viewBox="0 0 900 1290" role="img" aria-labelledby="title desc">
<title id="title">Оптимизация KV Cache при динамической загрузке инструментов</title><desc id="desc">Слева: изменение начала списка инструментов вызывает пересчёт с места изменения. Справа: префикс сохраняется, результаты поиска добавляются в конец истории. Попадание в кеш также зависит от политики сервиса.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1290" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="83" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="57" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="57">Изменение начала списка</tspan><tspan x="225" y="85">инструментов</tspan></text><rect x="470" y="20" width="410" height="83" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="57" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="57">Добавление описаний в</tspan><tspan x="675" y="85">конец истории</tspan></text><rect x="20" y="123" width="410" height="100" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<text x="225" y="157" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="157">System Prompt</tspan></text><text x="225" y="193" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="193">Роли и правила</tspan></text><rect x="20" y="243" width="410" height="189" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="277" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="277">Список инструментов:</tspan><tspan x="225" y="305">изменён в этом цикле</tspan></text><text x="225" y="341" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="341">Существующие описания</tspan><tspan x="225" y="367">инструментов</tspan></text><text x="225" y="397" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="397">+ get_stock_quote</tspan></text><rect x="20" y="462" width="410" height="126" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="225" y="496" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="496">User</tspan></text><text x="225" y="558" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="558">Узнать цену акций NVDA</tspan></text><rect x="20" y="618" width="410" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="225" y="652" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="652">Assistant</tspan></text><text x="225" y="688" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="688">Вызов get_stock_quote</tspan></text><rect x="20" y="748" width="410" height="126" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="225" y="782" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="782">Tool Result</tspan></text><text x="225" y="844" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="844">Результат запроса цены акций</tspan></text><path d="M225 223 L225 243" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 432 L225 462" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 588 L225 618" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 718 L225 748" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="929" width="410" height="179" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<text x="225" y="963" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="225" y="963">Граница повторного</tspan><tspan x="225" y="991">использования кеша</tspan></text><text x="225" y="1027" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="1027">До места изменения кеш</tspan><tspan x="225" y="1053">используется повторно</tspan></text><text x="225" y="1083" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="225" y="1083">После него — пересчёт</tspan></text><rect x="470" y="123" width="410" height="150" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<text x="675" y="157" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="157">Стабильный префикс</tspan></text><text x="675" y="193" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="193">Роли и правила</tspan></text><text x="675" y="223" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="223">web_search, code_interpreter</tspan></text><text x="675" y="253" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="253">discover_tools</tspan></text><rect x="470" y="321" width="410" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="675" y="381" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="381">User</tspan></text><text x="675" y="417" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="417">Узнать цену акций NVDA</tspan></text><rect x="470" y="457" width="410" height="136" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="675" y="491" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="491">Assistant: discover_tools</tspan></text><text x="675" y="527" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="527">Мне нужен инструмент для</tspan><tspan x="675" y="553">запроса цен акций</tspan></text><rect x="470" y="613" width="410" height="110" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="647" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="647">Результаты поиска</tspan></text><text x="675" y="683" font-size="25" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="683">Полная схема get_stock_quote</tspan></text><rect x="470" y="743" width="410" height="136" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="675" y="777" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="777">Новая запись состояния</tspan></text><text x="675" y="813" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="813">Доступные инструменты:</tspan><tspan x="675" y="839">web_search …</tspan></text><text x="675" y="869" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="869">+ get_stock_quote</tspan></text><rect x="470" y="899" width="410" height="164" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="675" y="933" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="933">Assistant → Tool Result</tspan></text><text x="675" y="997" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="997">Вызов get_stock_quote</tspan></text><text x="675" y="1027" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="1027">Результат запроса цены акций</tspan></text><path d="M675 273 L675 321" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 437 L675 457" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 593 L675 613" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 723 L675 743" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 879 L675 899" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="1088" width="410" height="177" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<text x="675" y="1122" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="675" y="1122">Следующий запрос</tspan></text><text x="675" y="1158" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="1158">Существующие описания</tspan><tspan x="675" y="1184">остаются на месте</tspan></text><text x="675" y="1214" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="675" y="1214">Новый контент добавляется</tspan><tspan x="675" y="1240">дальше</tspan></text></svg>