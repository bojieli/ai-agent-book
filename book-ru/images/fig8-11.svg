<text x="450" y="53" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="53">Сначала диагностировать выполнение задачи</tspan></text><text x="450" y="100" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="100">pass@k · доля разбора формата · частичный прогресс · причины сбоев</tspan></text><path d="M160 125 L160 180" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 125 L450 180" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M740 125 L740 180" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="180" width="270" height="397" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="180" width="270" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="155" y="213" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="155" y="213">Mid-training</tspan></text><text x="155" y="260" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="155" y="260">Знания предметной</tspan><tspan x="155" y="286">области и</tspan><tspan x="155" y="312">представления</tspan></text><text x="155" y="344" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="155" y="344">Длина и базовые</tspan><tspan x="155" y="370">способности</tspan></text><text x="155" y="428" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="155" y="428">Корпус предметной</tspan><tspan x="155" y="454">области</tspan></text><text x="155" y="512" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="155" y="512">Обучение длине /</tspan><tspan x="155" y="538">смешанные данные</tspan></text><rect x="315" y="180" width="270" height="397" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="315" y="180" width="270" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="213" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="213">SFT</tspan></text><text x="450" y="260" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="260">Примеры ответов и</tspan><tspan x="450" y="286">действий</tspan></text><text x="450" y="344" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="344">Формат / протокол /</tspan><tspan x="450" y="370">восстановление</tspan></text><text x="450" y="428" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="428">Качественные</tspan><tspan x="450" y="454">целевые</tspan><tspan x="450" y="480">последовательности</tspan></text><text x="450" y="512" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="512">Обучение на каждом</tspan><tspan x="450" y="538">token</tspan></text><rect x="610" y="180" width="270" height="397" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="610" y="180" width="270" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="745" y="213" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="745" y="213">RL</tspan></text><text x="745" y="260" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="745" y="260">Исполнимые,</tspan><tspan x="745" y="286">оцениваемые</tspan><tspan x="745" y="312">траектории</tspan></text><text x="745" y="344" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="745" y="344">Различия внутри</tspan><tspan x="745" y="370">группы / полезная</tspan><tspan x="745" y="396">обратная связь</tspan></text><text x="745" y="428" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="745" y="428">Интерактивная среда</tspan><tspan x="745" y="454">и награда</tspan></text><text x="745" y="512" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="745" y="512">Сэмплирование →</tspan><tspan x="745" y="538">оценка → обновление</tspan></text><path d="M160 577 L160 612 L740 612 L740 577" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 577 L450 652" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="652" width="860" height="197" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="652" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="685" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="685">Независимая оценка и выбор следующего шага</tspan></text><text x="450" y="732" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="732">Целевые способности · перенос · сохранение способностей · стоимость</tspan><tspan x="450" y="758">обучения и работы</tspan></text><text x="450" y="790" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="790">Улучшить базовые способности → примеры → стратегию; сочетать по</tspan><tspan x="450" y="816">проблеме</tspan></text></svg>