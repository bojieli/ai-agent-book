<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="103.291mm" viewBox="0 0 900 877" role="img" aria-labelledby="title desc">
<title id="title">Выбор и сочетание Mid-training, SFT и RL</title><desc id="desc">От диагностики задачи — к обучению, затем независимая оценка определяет следующий этап.</desc>
