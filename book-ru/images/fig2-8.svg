<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="76.320mm" viewBox="0 0 900 648" role="img" aria-labelledby="title desc">
<title id="title">Чат-шаблон преобразует сообщения в последовательность token</title><desc id="desc">Запрос содержит системную инструкцию и вопрос пользователя. Шаблон разделяет сообщения и добавляет начальный маркер assistant для продолжения.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="648" fill="#ffffff" y="0" />
<rect x="20" y="20" width="370" height="603" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="205" y="64" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="205" y="64">Сообщения в</tspan><tspan x="205" y="92">API-запросе</tspan></text><rect x="34" y="153" width="342" height="142" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="205" y="193" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="205" y="193">system</tspan></text><text x="205" y="236" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="205" y="236">You are a helpful</tspan></text><text x="205" y="268" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="205" y="268">assistant.</tspan></text><rect x="34" y="335" width="342" height="162" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="205" y="401" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="205" y="401">user</tspan></text><text x="205" y="444" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="205" y="444">Какая сегодня погода в</tspan><tspan x="205" y="470">Пекине?</tspan></text><text x="451" y="238" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="451" y="238">Чат-</tspan></text><text x="451" y="310" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="451" y="310">шаблон</tspan></text><path d="M390 335 L510 335" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="510" y="20" width="375" height="603" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="697" y="64" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="697" y="64">Выход шаблона</tspan></text><text x="697" y="140" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="697" y="140">&lt;|im_start|&gt;system</tspan></text><text x="697" y="187" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="697" y="187">You are a helpful assistant.</tspan></text><text x="697" y="234" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="697" y="234">&lt;|im_end|&gt;</tspan></text><text x="697" y="313" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="697" y="313">&lt;|im_start|&gt;user</tspan></text><text x="697" y="360" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="697" y="360">Какая сегодня погода в</tspan><tspan x="697" y="386">Пекине?</tspan></text><text x="697" y="433" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="697" y="433">&lt;|im_end|&gt;</tspan></text><rect x="526" y="480" width="343" height="124" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
