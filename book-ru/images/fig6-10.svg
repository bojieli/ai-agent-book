<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="64.189mm" viewBox="0 0 900 545" role="img" aria-labelledby="title desc">
<title id="title">200-мс микроходы в полнодуплексном диалоге</title><desc id="desc">Вверху ввод пользователя и вывод ассистента выровнены по времени. Во втором фрагменте пользователь перебивает ещё говорящего ассистента, в третьем ассистент замолкает. Внизу те же ввод и вывод показаны в порядке обработки моделью.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="545" fill="#ffffff" y="0" />
<text x="80" y="60" font-size="24" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="80" y="60">Время</tspan></text><text x="80" y="92" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="80" y="92">(ms)</tspan></text><path d="M166 97 L881 97" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M166 60 L166 104" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="166" y="49" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="166" y="49">0</tspan></text><path d="M340 60 L340 104" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="340" y="49" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="340" y="49">200</tspan></text><path d="M514 60 L514 104" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="514" y="49" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="514" y="49">400</tspan></text><path d="M688 60 L688 104" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="688" y="49" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="688" y="49">600</tspan></text><path d="M862 60 L862 104" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="862" y="49" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="862" y="49">800</tspan></text><text x="84" y="161" font-size="19" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="84" y="161">Ввод</tspan><tspan x="84" y="184">пользователя</tspan></text><rect x="168" y="122" width="170" height="81" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="253" y="161" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="253" y="161">Тишина</tspan></text><rect x="342" y="122" width="170" height="81" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="427" y="161" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="427" y="161">«не»</tspan></text><rect x="516" y="122" width="170" height="81" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="601" y="161" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="601" y="161">«пят»</tspan></text><rect x="690" y="122" width="170" height="81" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="775" y="161" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="775" y="161">«ницу»</tspan></text><text x="84" y="256" font-size="24" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="84" y="256">Вывод</tspan><tspan x="84" y="284">ассистента</tspan></text><rect x="168" y="217" width="170" height="86" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="253" y="256" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="253" y="256">«пят»</tspan></text><rect x="342" y="217" width="170" height="86" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="427" y="256" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="427" y="256">«четыре»</tspan></text><rect x="516" y="217" width="170" height="86" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="601" y="256" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="601" y="256">Тишина</tspan></text><rect x="690" y="217" width="170" height="86" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="775" y="256" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="775" y="256">Тишина</tspan></text><text x="450" y="350" font-size="28" font-family="DejaVu Sans" font-weight="700" text-anchor="middle" fill="#292929"><tspan x="450" y="350">Порядок обработки того же диалога моделью</tspan></text><rect x="25" y="378" width="85" height="84" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="67.5" y="416" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="67.5" y="416">Вх1</tspan></text><path d="M111 407 L129 407" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="132" y="378" width="85" height="84" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="174.5" y="416" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="174.5" y="416">Вых1</tspan></text><path d="M218 407 L236 407" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="239" y="378" width="85" height="84" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="281.5" y="416" font-size="26" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="281.5" y="416">Вх2</tspan></text><path d="M325 407 L343 407" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="346" y="378" width="85" height="84" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="388.5" y="416" font-size="21" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="388.5" y="416">Выход</tspan><tspan x="388.5" y="441">2</tspan></text><path d="M432 407 L450 407" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="453" y="378" width="85" height="84" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="495.5" y="416" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="495.5" y="416">Вход</tspan><tspan x="495.5" y="442">3</tspan></text><path d="M539 407 L557 407" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="560" y="378" width="85" height="84" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="602.5" y="416" font-size="21" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="602.5" y="416">Выход</tspan><tspan x="602.5" y="441">3</tspan></text><path d="M646 407 L664 407" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="667" y="378" width="85" height="84" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="709.5" y="416" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="709.5" y="416">Вход</tspan><tspan x="709.5" y="442">4</tspan></text><path d="M753 407 L771 407" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="774" y="378" width="85" height="84" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="816.5" y="416" font-size="21" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="816.5" y="416">Выход</tspan><tspan x="816.5" y="441">4</tspan></text><text x="450" y="503" font-size="22" font-family="DejaVu Sans" font-weight="400" text-anchor="middle" fill="#292929"><tspan x="450" y="503">«Вход» и «выход» обозначают по одному блоку; число соответствует</tspan><tspan x="450" y="529">временной ячейке сверху.</tspan></text></svg>