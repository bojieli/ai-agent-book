<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="81.620mm" viewBox="0 0 900 693" role="img" aria-labelledby="title desc">
<ns0:title id="title">Loop de percepção-raciocínio-ação de um agente de Computer Use</ns0:title><ns0:desc id="desc">Captura de tela, decisão da ação, execução e retorno da nova observação.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="693" fill="#ffffff" y="0" />
<ns0:rect x="65" y="20" width="770" height="135" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="65" y="20" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Obter a observação</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Captura do desktop / navegador / aplicativo</ns0:text><ns0:text x="437" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Registra o tamanho da imagem e o estado da interface</ns0:text><ns0:path d="M450 155 L450 190" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="65" y="190" width="770" height="135" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="65" y="190" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Decisão do modelo</ns0:text><ns0:text x="437" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Entrada: captura + tarefa + histórico e estado atual</ns0:text><ns0:text x="445.61" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Exemplo: clicar no campo de endereço click(512, 250)</ns0:text><ns0:path d="M450 325 L450 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="65" y="360" width="770" height="170" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="65" y="360" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="393" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Executar a ação</ns0:text><ns0:text x="445.1" y="440" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ferramentas validam e despacham → xdotool / Playwright</ns0:text><ns0:text x="437" y="472" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">Mouse: mover, clicar, arrastar · teclado: digitar, atalhos</ns0:text><ns0:text x="437" y="504" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">Rolar: muda a área visível · esperar: resposta da interface</ns0:text><ns0:path d="M450 530 L450 565" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="65" y="565" width="770" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="65" y="565" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="598" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ Ler o estado após a ação</ns0:text><ns0:text x="437" y="645" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.2" font-weight="400" fill="#292929">Nova captura: o campo recebeu o foco ou surgiu um login?</ns0:text><ns0:path d="M65 615 L25 615 L25 85 L65 85" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:defs /></ns0:svg>
