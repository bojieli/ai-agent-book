<ns0:text x="661" y="188" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">2º plano analisa a fundo</ns0:text><ns0:text x="662" y="235" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Consulta recursos e preços</ns0:text><ns0:text x="662" y="267" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Resultado: falta o roaming</ns0:text><ns0:path d="M225 295 L225 325 L675 325 L675 295" fill="none" stroke="#333333" stroke-width="1.8" />
