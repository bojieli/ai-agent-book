<title id="title">Estrutura de montagem das quatro áreas do sistema de arquivos virtual do agente</title><desc id="desc">Interface de arquivos unificada, quatro tipos de permissão e ciclo de vida, e as entradas do usuário e dos recursos externos.</desc>
