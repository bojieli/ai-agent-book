<text x="450" y="385" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Gerar atualizações candidatas</text><text x="450" y="432" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Conhecimento · instruções (Prompt / Skill) ·</text><text x="450" y="463.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">programas · parâmetros</text><path d="M450 482 L450 518" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
