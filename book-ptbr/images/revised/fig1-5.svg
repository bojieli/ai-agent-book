<title id="title">Chamada de ferramentas conduzida pelo modelo: ciclo no cliente e ciclo hospedado no servidor</title><desc id="desc">Na busca com o Kimi, o cliente organiza o ciclo; na busca e na execução de código hospedadas, o servidor organiza o ciclo. Mostram-se tarefa, consultas, resultados retornados e etapas de análise.</desc>
