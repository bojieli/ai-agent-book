<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="75.378mm" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura de chamada de ferramentas com LLM local</title><desc id="desc">Tarefa de hora e clima em Vancouver: o cliente mantém as mensagens, chama o modelo local, despacha duas ferramentas e devolve as observações ao modelo.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="640" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="80" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="52" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Solicitação do usuário</text><text x="450" y="83" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Consultar hora e clima atuais em Vancouver</text><path d="M195 100 L195 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="150" width="350" height="470" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="195" y="188" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Harness do cliente</text><text x="195" y="240" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">Organiza messages/tools</text><text x="195" y="289" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Guarda respostas e IDs</text><text x="195" y="395" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Valida os argumentos</text><text x="195" y="441" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Despacha em paralelo</text><text x="195" y="537" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Anexa resultados</text><text x="195" y="583" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">Nova chamada → resposta</text><rect x="520" y="150" width="360" height="190" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="188" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Serviço de LLM local</text><text x="700" y="229" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">vLLM / Ollama</text><text x="700" y="269" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Qwen3-0.6B</text><text x="700" y="311" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">Gera chamada ou resposta</text><path d="M370 220 L520 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="445" y="207" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Requisição</text><path d="M520 300 L370 300" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="445" y="287" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Resposta</text><rect x="520" y="380" width="360" height="240" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="700" y="419" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Executa ferramentas</text><text x="700" y="462" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hora: America/Vancouver</text><text x="700" y="502" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">Clima: Vancouver/celsius</text><text x="700" y="550" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Funções / APIs externas</text><text x="700" y="591" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Devolve hora e clima</text><path d="M370 447 L520 447" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="445" y="433" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chamadas</text><path d="M520 550 L370 550" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="445" y="536" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Resultados</text><defs /></svg>
