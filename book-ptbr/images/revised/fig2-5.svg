<ns0:title id="title">Arquitetura de chamada de ferramentas com LLM local</ns0:title><ns0:desc id="desc">Tarefa de hora e tempo em Vancouver: o cliente mantém as mensagens, chama o modelo local, despacha duas ferramentas e devolve as observações ao modelo.</ns0:desc>
