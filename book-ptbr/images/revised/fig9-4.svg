<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="109.769mm" viewBox="0 0 900 932" role="img" aria-labelledby="title desc">
<ns0:title id="title">Das trajetórias avaliadas ao documento de conhecimento de experiência</ns0:title><ns0:desc id="desc">Tomando um tempo esgotado de consulta como exemplo: confrontar sucessos e falhas nos registros brutos e validar a experiência candidata em novas tarefas.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="932" fill="#ffffff" y="0" />
<ns0:rect x="70" y="20" width="760" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="20" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Trajetória bruta</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">A ferramenta A esgotou o tempo; a B trouxe o resultado.</ns0:text><ns0:path d="M450 136 L450 171" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="171" width="760" height="116" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="171" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="204" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Avaliação individual: levantar hipótese</ns0:text><ns0:text x="437" y="251" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">No próximo timeout, trocar logo de ferramenta?</ns0:text><ns0:path d="M450 287 L450 322" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="322" width="760" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="322" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="355" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="700" fill="#292929">Comparação entre trajetórias: buscar contraexemplos</ns0:text><ns0:text x="437" y="402" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Outra consulta igual também expirou; repetir A funcionou.</ns0:text><ns0:text x="437" y="434" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ambos os registros guardam versão, erro e retorno.</ns0:text><ns0:path d="M450 472 L450 507" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="507" width="760" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="507" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="540" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Experiência candidata: definir as condições</ns0:text><ns0:text x="437" y="587" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Timeout: repetir antes; se persistir, usar a reserva.</ns0:text><ns0:text x="437" y="619" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.9" font-weight="400" fill="#292929">Anexar os registros que apoiam e contrariam a sugestão.</ns0:text><ns0:path d="M450 657 L450 692" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="70" y="692" width="760" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="70" y="692" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="725" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Validar à parte antes de liberar à recuperação</ns0:text><ns0:text x="437" y="772" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="400" fill="#292929">Comparar taxa de sucesso e tempo em consultas reservadas.</ns0:text><ns0:text x="437" y="804" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">Adotada a sugestão, seguir registrando cada consulta.</ns0:text><ns0:path d="M830 767 L865 767 L865 902 L30 902 L30 397 L70 397" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="437" y="880" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Novas evidências: revisar condições / atualizar / descartar</ns0:text><ns0:defs /></ns0:svg>
