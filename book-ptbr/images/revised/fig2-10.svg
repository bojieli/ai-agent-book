<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="70.667mm" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Prompt Cache: KV Cache de prefixo reutilizado entre solicitações</title><desc id="desc">Três solicitações comparadas: prompt de sistema e ferramentas comuns são reutilizados; um timestamp inserido no início altera o prefixo seguinte.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="600" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="160" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="96" y="55" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Req. 1</text><rect x="40" y="75" width="545" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="312" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">System Prompt + Tools</text><rect x="610" y="75" width="250" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="735" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">user: E o tempo?</text><text x="312" y="165" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">1º processamento (prefixo: 1200 tokens)</text><text x="735" y="165" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">→ gera resposta</text><rect x="20" y="210" width="860" height="160" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="96" y="245" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Req. 2</text><rect x="40" y="265" width="545" height="57" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="312" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">System Prompt + Tools</text><rect x="610" y="265" width="250" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="735" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">user: Que horas?</text><text x="312" y="355" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Reutiliza o prefixo comum</text><text x="735" y="355" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">→ gera resposta</text><rect x="20" y="400" width="860" height="160" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="96" y="435" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Req. 3</text><rect x="40" y="455" width="545" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="312" y="492" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">10:30:45 + System Prompt + Tools</text><rect x="610" y="455" width="250" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="735" y="492" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">user: E o tempo?</text><text x="312" y="545" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Prefixo mudou: reprocessar</text><text x="735" y="545" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">→ gera resposta</text><path d="M312 180 L312 210" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M312 370 L312 400" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
