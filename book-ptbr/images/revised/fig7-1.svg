<title id="title">As quatro etapas de um sistema de avaliação de agentes</title><desc id="desc">Métricas, origem das tarefas, formas de verificação, resultados e infraestrutura de apoio.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
