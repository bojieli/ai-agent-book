<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Definição de sucesso</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Pass@1: sucesso único · Pass@k: ao menos 1 em k</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Best@k: maior nota · Pass^k: sucesso nas k vezes</text><path d="M450 165 L450 208" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="208" width="860" height="195" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
