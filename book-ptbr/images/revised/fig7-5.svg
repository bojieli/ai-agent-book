<ns0:text x="436" y="848" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Regras prévias de agregação e revisão</ns0:text><ns0:text x="437" y="895" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Peso por importância; veto → tarefa falha</ns0:text><ns0:text x="437" y="927" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Juízes independentes → divergências à revisão humana</ns0:text><ns0:text x="437" y="959" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Itens fracos ligados à trajetória</ns0:text><ns0:defs /></ns0:svg>
