<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="115.776mm" viewBox="0 0 900 983" role="img" aria-labelledby="title desc">
<ns0:title id="title">Pipeline de ponta a ponta do artigo ao vídeo explicativo</ns0:title><ns0:desc id="desc">Duas fases: geração e revisão do PPT; narração por slide e montagem de som e imagem.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="983" fill="#ffffff" y="0" />
<ns0:rect x="100" y="20" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="100" y="20" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Análise do artigo e planejamento</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Extrair seções, contribuições e figuras</ns0:text><ns0:text x="437" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Planejar slides e associar figuras às teses</ns0:text><ns0:path d="M450 175 L450 215" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="100" y="215" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="100" y="215" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="248" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Geração e revisão no Slidev</ns0:text><ns0:text x="437" y="295" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Código, texto e figuras combinados</ns0:text><ns0:text x="437" y="327" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Renderizar → revisão visual → alterar</ns0:text><ns0:path d="M450 370 L450 410" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="100" y="410" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="100" y="410" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="443" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Capturas e roteiro por slide</ns0:text><ns0:text x="437" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Manter a ordem e a relação com as figuras</ns0:text><ns0:text x="437" y="522" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Narração falada para cada slide</ns0:text><ns0:path d="M450 565 L450 605" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="100" y="605" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="100" y="605" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="638" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ TTS e sincronia de som e imagem</ns0:text><ns0:text x="437" y="685" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Voz por slide; ler a duração do áudio</ns0:text><ns0:text x="437" y="717" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Duração de cada slide; checar transições</ns0:text><ns0:path d="M450 760 L450 800" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="100" y="800" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="100" y="800" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="833" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑤ Montagem e verificação do vídeo</ns0:text><ns0:text x="437" y="880" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">FFmpeg une áudio e imagem</ns0:text><ns0:text x="437" y="912" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Conferir figuras, narração e sincronia</ns0:text><ns0:defs /></ns0:svg>
