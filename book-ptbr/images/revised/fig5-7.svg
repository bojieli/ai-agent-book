<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="98.580mm" viewBox="0 0 900 837" role="img" aria-labelledby="title desc">
<title id="title">Pipeline de diagnóstico inteligente de logs de produção</title><desc id="desc">Casos de direito a reembolso e de fallback do estoque ligam diagnóstico, testes e itens de trabalho.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="837" fill="#ffffff" y="0" />
<rect x="70" y="20" width="760" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="20" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Trajetórias e requisitos</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Reembolso: sem checar o direito antes</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Estoque: timeout sem fallback para o cache</text><text x="450" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Entrada: chamadas, resultados, arquitetura e PRD</text><path d="M450 200 L450 255" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="255" width="760" height="148" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="255" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="288" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Localização e relatório estruturado</text><text x="450" y="335" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ligar trajetórias, rodadas e requisitos</text><text x="450" y="367" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23" font-weight="400" fill="#292929">Relatório: prioridade, módulo, sintoma, evidência e sugestão</text><path d="M450 403 L450 458" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="458" width="760" height="148" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="458" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="491" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Testes de regressão</text><text x="450" y="538" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Três testes: falham no defeito, passam na correção</text><text x="450" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Checar a etapa → ampliar p/ ordem, resultado, estado</text><path d="M450 606 L450 661" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="661" width="760" height="148" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="661" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="694" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ Item de trabalho</text><text x="450" y="741" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Criar Issue via GitHub MCP</text><text x="450" y="773" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Vincular diagnóstico e testes; acompanhar estado</text><defs /></svg>
