<ns0:title id="title">Fluxo de processamento das seis estratégias de compressão</ns0:title><ns0:desc id="desc">Cada estratégia organiza o material, o contexto da tarefa, os links de origem e o limiar da janela à sua maneira.</ns0:desc>
