<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="100.111mm" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de processamento das seis estratégias de compressão</title><desc id="desc">Cada estratégia organiza o material, o contexto da tarefa, os links de origem e o limiar da janela à sua maneira.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="850" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="54" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.4" font-weight="700" fill="#292929">① Sem compressão</text><text x="605" y="54" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mantém tudo</text><rect x="40" y="72" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="105" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Resultados brutos</text><path d="M405 97 L490 97" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="72" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="105" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Resultado completo</text><rect x="20" y="157" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="191" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Individual</text><text x="605" y="191" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Resumo de 2–3 parágrafos cada</text><rect x="40" y="209" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="242" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Conteúdo de cada página</text><path d="M405 234 L490 234" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="209" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="242" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Resumo por página</text><rect x="20" y="294" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="328" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Combinado</text><text x="605" y="328" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mescla, deduplica e resume</text><rect x="40" y="346" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="379" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Lote de resultados</text><path d="M405 371 L490 371" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="346" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="379" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Resumo consolidado</text><rect x="20" y="431" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="465" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ Contextual</text><text x="605" y="465" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Extrai conforme a tarefa</text><rect x="40" y="483" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="516" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Busca + consulta + contexto</text><path d="M405 508 L490 508" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="483" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="516" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.5" font-weight="400" fill="#292929">Fatos relevantes e lacunas</text><rect x="20" y="568" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="602" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑤ Com citações</text><text x="605" y="602" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Resume e mantém URLs</text><rect x="40" y="620" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="653" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Busca + consulta + contexto</text><path d="M405 645 L490 645" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="620" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="653" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fatos e fontes</text><rect x="20" y="705" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="739" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑥ Adaptativo</text><text x="605" y="739" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">≤80%: mantém; &gt;80%: resume em lote</text><rect x="40" y="757" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="790" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Uso atual da entrada</text><path d="M405 782 L490 782" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="757" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="790" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Marca [COMPRESSED]</text><defs /></svg>
