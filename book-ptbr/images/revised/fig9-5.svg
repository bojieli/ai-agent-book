<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="106.000mm" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Ciclo duplo de execução online e evolução offline</title><desc id="desc">À esquerda, consultar com a versão atual e aguardar o retorno; à direita, aprender com os logs. A nova versão validada passa a ser usada nas tarefas seguintes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="900" fill="#ffffff" y="0" />
<rect x="20" y="20" width="360" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="200" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Execução online</text><text x="200" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">Atender na versão atual</text><text x="200" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Registrar ações e retornos</text><text x="200" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">Avisar o usuário ao concluir</text><rect x="520" y="20" width="360" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Evolução offline</text><text x="700" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Agregar e diagnosticar</text><text x="700" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Buscar causas comuns</text><rect x="20" y="350" width="360" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="350" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="200" y="383" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Aguardar andamento</text><text x="200" y="430" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">Receber aviso de mudança</text><text x="200" y="462" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">ou consultar na hora marcada.</text><path d="M120 220 L120 350" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="65" y="292" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">Em</text><text x="65" y="318.143" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">andamento</text><path d="M278 350 L278 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="334" y="312" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Retomar</text><path d="M380 120 L520 120" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
