<rect x="520" y="490" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="490" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="523" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="700" fill="#292929">Validação independente</text><text x="700" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">Tarefas novas e antigas</text><text x="700" y="602" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Regressão e segurança</text><path d="M520 575 L485 575 L485 352 L520 352" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="434" y="460" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Revisar</text><path d="M700 655 L700 710" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="520" y="710" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="710" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="743" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Publicar e monitorar</text><text x="700" y="790" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Implantação gradual</text><text x="700" y="822" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Promover a estável / rollback</text><path d="M520 792 L8 792 L8 120 L20 120" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="260" y="775" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Novas tarefas usam a nova versão</text><defs /></svg>
