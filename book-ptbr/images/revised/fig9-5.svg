<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="106.000mm" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<ns0:title id="title">Ciclo duplo de execução online e evolução offline</ns0:title><ns0:desc id="desc">À esquerda, consultar com a versão atual e aguardar o retorno; à direita, aprender com os logs. A nova versão validada passa a ser usada nas tarefas seguintes.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="900" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="360" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="186" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Execução online</ns0:text><ns0:text x="187" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">Atender na versão atual</ns0:text><ns0:text x="187" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Registrar ações e retornos</ns0:text><ns0:text x="187" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">Avisar o usuário ao concluir</ns0:text><ns0:rect x="520" y="20" width="360" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="520" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="686" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Evolução offline</ns0:text><ns0:text x="687" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Agregar e diagnosticar</ns0:text><ns0:text x="687" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Buscar causas comuns</ns0:text><ns0:rect x="20" y="350" width="360" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="350" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="186" y="383" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Aguardar andamento</ns0:text><ns0:text x="187" y="430" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">Receber aviso de mudança</ns0:text><ns0:text x="187" y="462" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">ou consultar na hora marcada.</ns0:text><ns0:path d="M120 220 L120 350" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
