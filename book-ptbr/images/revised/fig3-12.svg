<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="92.102mm" viewBox="0 0 900 782" role="img" aria-labelledby="title desc">
<title id="title">RAG de busca única e RAG com consultas sucessivas</title><desc id="desc">Para a mesma pergunta sobre troca, a primeira busca encontra a linha do produto. A busca única só responde com as evidências atuais; a busca em várias rodadas complementa as cláusulas por modelo e data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="782" fill="#ffffff" y="0" />
<rect x="32" y="20" width="836" height="82" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="70" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.4" font-weight="700" fill="#292929">Posso trocar este produto pela garantia do mês passado?</text><path d="M450 102 L450 136" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="150" y="136" width="600" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="180" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">1ª busca nos dados do produto</text><text x="450" y="222" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Achou a linha; falta a garantia do mês passado</text><path d="M450 246 L450 276 L223 276 L223 314" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 276 L666 276 L666 314" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="36" y="314" width="374" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="357" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Busca única</text><path d="M223 379 L223 419" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="479" y="314" width="374" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="666" y="357" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.8" font-weight="700" fill="#292929">O agente decide se busca mais</text><path d="M666 379 L666 419" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="36" y="419" width="374" height="134" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="223" y="464" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Responde com o que tem</text><text x="223" y="512" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Só confirma a linha</text><rect x="479" y="419" width="374" height="134" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="666" y="464" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.6" font-weight="700" fill="#292929">Verifica as evidências</text><text x="666" y="512" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">As cláusulas bastam?</text><path d="M666 553 L666 608" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="479" y="608" width="374" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="666" y="654" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.5" font-weight="700" fill="#292929">Faltam cláusulas: buscar</text><text x="666" y="698" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.2" font-weight="400" fill="#292929">Busca por modelo e vigência</text><path d="M853 669 L882 669 L882 472 L853 472" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M479 486 L442 486 L442 680 L410 680" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="36" y="608" width="374" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="653" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Encerra a busca</text><text x="223" y="700" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">Responde se há evidência</text><text x="223" y="738" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.3" font-weight="400" fill="#292929">Sem orçamento, diz o que falta</text><defs /></svg>
