<title id="title">Estrutura do livro: construir agentes e elevar sua capacidade</title><desc id="desc">Os Capítulos 1 a 6 estabelecem os métodos de construção, o Capítulo 7 fornece o feedback da avaliação e os Capítulos 8 a 10 elevam a capacidade por meio dos parâmetros, da atualização do sistema e da colaboração.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="840" fill="#ffffff" y="0" />
<rect x="20" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="220" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="700" fill="#292929">Parte 1: construir agentes</text><rect x="480" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="680" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="700" fill="#292929">Parte 2: elevar a capacidade</text><text x="220" y="138" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Cap. 1 Primeiros passos</text><text x="220" y="180" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Como o modelo chama ferramentas?</text><path d="M20 224 L420 224" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="262" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="700" fill="#292929">Cap. 2 Engenharia de contexto</text><text x="220" y="304" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">De que informação a decisão precisa?</text><path d="M20 348 L420 348" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="386" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="700" fill="#292929">Cap. 3 Memória e conhecimento</text><text x="220" y="428" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.1" font-weight="400" fill="#292929">Como recuperar o que já foi tratado?</text><path d="M20 472 L420 472" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="510" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Cap. 4 Ferramentas</text><text x="220" y="552" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="400" fill="#292929">Como consultar e agir no serviço?</text><path d="M20 596 L420 596" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="634" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.1" font-weight="700" fill="#292929">Cap. 5 Agentes de programação</text><text x="220" y="666" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">e de propósito geral</text><text x="220" y="706" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="400" fill="#292929">Dá para resolver com um programa?</text><path d="M20 720 L420 720" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="758" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Cap. 6 Interação</text><text x="220" y="800" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">E se o usuário interromper?</text><rect x="480" y="110" width="400" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
