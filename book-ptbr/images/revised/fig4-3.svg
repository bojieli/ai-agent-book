<ns0:title id="title">Otimização do cache KV para o carregamento dinâmico de ferramentas</ns0:title><ns0:desc id="desc">À esquerda, alterar a lista de ferramentas no início faz recalcular a partir do ponto alterado; à direita, o prefixo é mantido e os resultados da descoberta são acrescentados ao fim do histórico. O acerto de cache também depende da política do serviço.</ns0:desc>
