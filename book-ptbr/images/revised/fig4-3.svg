<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="123.667mm" viewBox="0 0 900 1050" role="img" aria-labelledby="title desc">
<title id="title">Otimização do cache KV para o carregamento dinâmico de ferramentas</title><desc id="desc">À esquerda, alterar a lista de ferramentas no início faz recalcular a partir do ponto alterado; à direita, o prefixo é mantido e os resultados da descoberta são acrescentados ao fim do histórico. O acerto de cache também depende da política do serviço.</desc>
