<ns0:title id="title">A interação em circuito fechado entre Agent e Environment e a estrutura Model–Harness dentro do agente</ns0:title><ns0:desc id="desc">O agente contém Model e Harness lado a lado. O Harness organiza o contexto, despacha ferramentas e gerencia a execução; o ambiente recebe ações, atualiza seu estado e retorna observações.</ns0:desc>
