<ns0:title id="title">Arquitetura do experimento GeneralPoints (treino e teste das variantes GP-L e GP-VL)</ns0:title><ns0:desc id="desc">Exemplo de cartas, mudança de distribuição, inicialização comum e dois ramos de treinamento.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
