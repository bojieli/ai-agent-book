<rect x="177" y="20" width="545" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="449.5" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Modelo de política πθ</text><text x="449.5" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="400" fill="#292929">gera busca, código, consulta ou resposta</text><path d="M450 138 L450 190" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="177" y="190" width="545" height="118" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="177" y="190" width="545" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="449.5" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Harness</text><text x="449.5" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">monta o contexto, valida e registra a trajetória</text><path d="M450 308 L450 361" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
