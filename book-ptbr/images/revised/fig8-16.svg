<title id="title">Ciclo de recompensa do RL com chamada de ferramentas</title><desc id="desc">A tarefa atual segue decidindo com as observações devolvidas pelas ferramentas; ao terminar, a trajetória vai para o treinamento.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
