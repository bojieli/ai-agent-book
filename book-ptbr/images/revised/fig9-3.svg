<ns0:title id="title">Quatro pontos de atualização de um agente de imagens médicas</ns0:title><ns0:desc id="desc">O mesmo sistema usa um modelo para reconhecer imagens, um programa para calcular indicadores, recupera diretrizes e organiza os resultados segundo o protocolo de laudos.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="607" fill="#ffffff" y="0" />
<ns0:text x="435" y="48" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">Num mesmo laudo de imagem, onde mexer?</ns0:text><ns0:rect x="48" y="90" width="350" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="48" y="90" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="209" y="123" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Parâmetros do modelo</ns0:text><ns0:text x="210" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">Reconhecer alvos na imagem</ns0:text><ns0:text x="210" y="202" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">Erro: melhorar o modelo</ns0:text><ns0:rect x="500" y="90" width="352" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="500" y="90" width="352" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="662" y="123" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Programa</ns0:text><ns0:text x="663" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Calcular indicadores</ns0:text><ns0:text x="663" y="202" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Mudou a regra: alterar código</ns0:text><ns0:path d="M398 167 L500 167" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="48" y="324" width="350" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="48" y="324" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="209" y="357" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Base de conhecimento</ns0:text><ns0:text x="210" y="404" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Buscar diretriz aplicável</ns0:text><ns0:text x="210" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.6" font-weight="400" fill="#292929">Nova versão: atualizar fonte</ns0:text><ns0:rect x="500" y="324" width="352" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
