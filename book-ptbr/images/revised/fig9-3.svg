<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="71.491mm" viewBox="0 0 900 607" role="img" aria-labelledby="title desc">
<title id="title">Quatro pontos de atualização de um agente de imagens médicas</title><desc id="desc">O mesmo sistema usa um modelo para reconhecer imagens, um programa para calcular indicadores, recupera diretrizes e organiza os resultados segundo o protocolo de laudos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="607" fill="#ffffff" y="0" />
<text x="450" y="48" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">Num mesmo laudo de imagem, onde mexer?</text><rect x="48" y="90" width="350" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="48" y="90" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="123" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Parâmetros do modelo</text><text x="223" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">Reconhecer alvos na imagem</text><text x="223" y="202" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">Erro: melhorar o modelo</text><rect x="500" y="90" width="352" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="500" y="90" width="352" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="123" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Programa</text><text x="676" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Calcular indicadores</text><text x="676" y="202" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Mudou a regra: alterar código</text><path d="M398 167 L500 167" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="48" y="324" width="350" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="48" y="324" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="357" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Base de conhecimento</text><text x="223" y="404" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Buscar diretriz aplicável</text><text x="223" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.6" font-weight="400" fill="#292929">Nova versão: atualizar fonte</text><rect x="500" y="324" width="352" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="500" y="324" width="352" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="357" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Instruções (Skill)</text><text x="676" y="404" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">Organizar pelo protocolo</text><text x="676" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">Citar diretrizes e versões</text><path d="M398 400 L500 400" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M676 235 L676 324" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="525" y="288" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Valores dos indicadores</text><path d="M676 469 L676 505" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="505" width="412" height="74" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="553" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="700" fill="#292929">Rascunho para revisão humana</text><defs /></svg>
