<ns0:title id="title">Estrutura do contexto após a descoberta dinâmica: esquemas de ferramentas espalhados pela trajetória</ns0:title><ns0:desc id="desc">Duas rodadas de descoberta de ferramentas, com a consulta de cotação e a análise de contribuidores do GitHub. As novas definições entram no histórico via tool_search_output e mantêm sua posição nas requisições seguintes.</ns0:desc>
