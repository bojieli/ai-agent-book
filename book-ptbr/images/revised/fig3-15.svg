<text x="450" y="563" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Codificação e padronização de atributos</text><text x="450" y="599" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">One-hot · indicadores booleanos · log de valores · padronização</text><path d="M450 617 L450 634 L230 634 L230 652" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="40" y="652" width="380" height="175" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="230" y="691" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agrupamento KMeans</text><text x="230" y="735" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">De 2 a 5 grupos por crime</text><text x="230" y="766" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Silhueta → protótipos</text><text x="230" y="797" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.8" font-weight="400" fill="#292929">Atributos + resumo das penas</text><path d="M420 737 L470 737" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="652" width="390" height="175" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="665" y="691" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Pesos dos atributos</text><text x="665" y="735" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Diferenças entre centros</text><text x="665" y="766" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">Quanto cada atributo distingue</text><text x="665" y="797" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Explica correspondências</text><path d="M450 862 L450 897" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="897" width="860" height="155" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="938" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Extensão: consulta de casos em diálogo</text><text x="450" y="983" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Completar fatos → casar protótipo → explicar estatísticas com fontes</text><text x="450" y="1021" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">Ex.: briga sem armas após discussão vs. ataque armado premeditado</text><defs /></svg>
