<title id="title">Camada de entrada: adaptadores, envelope unificado e log de entrada</title><desc id="desc">Cada origem grava no log de entrada por seu adaptador, o roteamento despacha ao runtime e a resposta volta ao canal de conversa pelo adaptador de saída.</desc>
