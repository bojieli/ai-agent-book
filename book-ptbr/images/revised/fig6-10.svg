<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="52.058mm" viewBox="0 0 900 442" role="img" aria-labelledby="title desc">
<title id="title">Microturnos de 200 milissegundos na interação full-duplex</title><desc id="desc">A metade superior alinha no tempo a entrada do usuário e a saída do assistente. No segundo trecho, o usuário interrompe enquanto o assistente ainda fala; no terceiro, o assistente para. A metade inferior mostra as mesmas entradas e saídas na ordem em que o modelo as processa.</desc>
