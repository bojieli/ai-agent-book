<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="63.600mm" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<ns0:title id="title">Mecanismo de pontuação do BM25</ns0:title><ns0:desc id="desc">Mantendo as demais condições fixas, observa-se como a frequência do termo, o comprimento do documento e a frequência nos documentos alteram a pontuação de um termo da consulta.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="540" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="121" y="104" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="700" fill="#292929">Saturação de TF</ns0:text><ns0:text x="552" y="58" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">k₁ = 1,5; documento de comprimento médio</ns0:text><ns0:text x="552" y="103" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">O termo aparece 1, 2 e 3 vezes</ns0:text><ns0:text x="556.74" y="150" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Fator de TF: 1,00 → 1,43 → 1,67</ns0:text><ns0:rect x="20" y="190" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="190" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="121" y="274" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.1" font-weight="700" fill="#292929">Normalização</ns0:text><ns0:text x="557.78" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">k₁ = 1,5; b = 0,75; TF = 1</ns0:text><ns0:text x="552" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Documento passa do médio ao dobro</ns0:text><ns0:text x="556.74" y="320" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Fator de TF: 1,00 → 0,69</ns0:text><ns0:rect x="20" y="360" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="360" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="121" y="444" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">IDF</ns0:text><ns0:text x="552" y="398" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Corpus de 10 documentos</ns0:text><ns0:text x="552" y="443" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">“modelo” em 3 docs., “destilação” em 2</ns0:text><ns0:text x="556.74" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">IDF: “modelo” 0,762; “destilação” 1,224</ns0:text><ns0:defs /></ns0:svg>
