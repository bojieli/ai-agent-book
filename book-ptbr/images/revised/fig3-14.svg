<ns0:title id="title">Recuperação contextual</ns0:title><ns0:desc id="desc">O documento original e o bloco-alvo entram juntos no modelo, que gera um prefixo de contexto; depois, prefixo e texto original são indexados. O exemplo mantém o trecho completo sobre o crescimento de 3% na receita da ACME no 2º trimestre de 2025.</ns0:desc>
