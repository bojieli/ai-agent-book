<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="103.880mm" viewBox="0 0 900 882" role="img" aria-labelledby="title desc">
<ns0:title id="title">O ciclo de execução de um agente autônomo</ns0:title><ns0:desc id="desc">Mostra raciocínio, ação, observação e todas as condições de saída; a tarefa concluída é verificada antes da entrega, e erros ou orçamento esgotado levam a salvar o progresso e relatar.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="882" fill="#ffffff" y="0" />
<ns0:rect x="190" y="30" width="360" height="137" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="356" y="65" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="700" fill="#292929">Checar orçamento e erros</ns0:text><ns0:text x="357" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Máx. de rodadas · erros</ns0:text><ns0:text x="357" y="130" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Erro irrecuperável</ns0:text><ns0:rect x="630" y="30" width="240" height="137" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="736" y="65" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Encerrar</ns0:text><ns0:text x="737" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.3" font-weight="400" fill="#292929">Salvar progresso</ns0:text><ns0:text x="737" y="130" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Relatar pendências/</ns0:text><ns0:text x="737" y="162" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">passar a humano</ns0:text><ns0:path d="M550 80 L630 80" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="577" y="54" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fim</ns0:text><ns0:path d="M370 167 L370 237" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="427" y="208" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Segue</ns0:text><ns0:rect x="190" y="237" width="360" height="142" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="356" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Raciocínio e decisão</ns0:text><ns0:text x="356" y="305" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">(Reasoning)</ns0:text><ns0:text x="357" y="345" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">“Falta informação” / responder</ns0:text><ns0:path d="M275 379 L275 449" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="347" y="423" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Pedido de ferramenta</ns0:text><ns0:rect x="90" y="449" width="370" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
