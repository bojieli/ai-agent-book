<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="103.880mm" viewBox="0 0 900 882" role="img" aria-labelledby="title desc">
<title id="title">O ciclo de execução de um agente autônomo</title><desc id="desc">Mostra raciocínio, ação, observação e todas as condições de saída; a tarefa concluída é verificada antes da entrega, e erros ou orçamento esgotado levam a salvar o progresso e relatar.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="882" fill="#ffffff" y="0" />
<rect x="190" y="30" width="360" height="137" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="370" y="65" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="700" fill="#292929">Checar orçamento e erros</text><text x="370" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Máx. de rodadas · erros</text><text x="370" y="130" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Erro irrecuperável</text><rect x="630" y="30" width="240" height="137" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="750" y="65" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Encerrar</text><text x="750" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.3" font-weight="400" fill="#292929">Salvar progresso</text><text x="750" y="130" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Relatar pendências/</text><text x="750" y="157" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">passar a humano</text><path d="M550 80 L630 80" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="590" y="54" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fim</text><path d="M370 167 L370 237" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="440" y="208" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Segue</text><rect x="190" y="237" width="360" height="142" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="370" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Raciocínio e decisão</text><text x="370" y="305" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">(Reasoning)</text><text x="370" y="345" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">“Falta informação” / responder</text><path d="M275 379 L275 449" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="412" y="423" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Pedido de ferramenta</text><rect x="90" y="449" width="370" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="275" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Ação (Acting)</text><text x="275" y="527" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">web_search(...)</text><text x="275" y="557" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">Harness valida e despacha</text><path d="M275 569 L275 644" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="90" y="644" width="370" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="275" y="684" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.0" font-weight="700" fill="#292929">Observação (Observation)</text><text x="275" y="724" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tool_result: "..."</text><text x="275" y="754" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.4" font-weight="400" fill="#292929">Resultado/erro vai ao contexto</text><path d="M90 706 L35 706 L35 80 L190 80" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M550 324 L570 324 L570 424 L680 424 L680 449" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="705" y="370" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">final_answer ou</text><text x="705" y="400" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">resp. sem chamada</text><rect x="520" y="449" width="320" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="680" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.2" font-weight="700" fill="#292929">Verificar conclusão</text><text x="680" y="532" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Resultado · produtos</text><path d="M680 569 L680 644" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="727" y="614" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sim</text><rect x="520" y="644" width="320" height="85" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="680" y="695" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.7" font-weight="700" fill="#292929">Entregar resultado</text><path d="M840 509 L875 509 L875 854 L35 854 L35 706" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="450" y="819" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Não: inclui o feedback da verificação e volta ao orçamento</text><defs /></svg>
