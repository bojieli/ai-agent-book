<ns0:text x="211" y="698" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Controle de voz e idioma</ns0:text><ns0:text x="212" y="745" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.3" font-weight="400" fill="#292929">voz: locutor / contexto de áudio</ns0:text><ns0:text x="217.79" y="777" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">marcas: &lt;laugh&gt; / &lt;sigh&gt;</ns0:text><ns0:text x="212" y="809" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">idioma: demonstrações no idioma-alvo</ns0:text><ns0:rect x="470" y="665" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="665" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="661" y="698" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Destilação e ferramentas</ns0:text><ns0:text x="662" y="745" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929">professor (prompt longo) → aluno</ns0:text><ns0:text x="662" y="777" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">raciocínio → sequência-alvo do aluno</ns0:text><ns0:text x="662" y="809" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">JSON / recuperação de erros</ns0:text><ns0:defs /></ns0:svg>
