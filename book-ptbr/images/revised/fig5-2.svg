<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="104.822mm" viewBox="0 0 900 890" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de trabalho de um agente de programação</title><desc id="desc">Fluxo de cinco etapas com feedback de testes e revisão.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="890" fill="#ffffff" y="0" />
<rect x="20" y="20" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Documentação do projeto</text><text x="345" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Ler o README e a documentação de arquitetura</text><text x="345" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21" font-weight="400" fill="#292929">Glob localiza os arquivos-fonte; organizar instruções do projeto</text><path d="M345 165 L345 195" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="195" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="195" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Compreensão dos requisitos</text><text x="345" y="275" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Reproduzir: 100 yuans antes de 20 yuans</text><text x="345" y="307" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.9" font-weight="400" fill="#292929">Grep acha a ordenação; rastrear o tipo do valor</text><path d="M345 340 L345 370" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="370" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="370" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Documento de design</text><text x="345" y="450" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Decidir onde converter o valor em número</text><text x="345" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Submeter o design à revisão do projeto</text><path d="M345 515 L345 545" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="545" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="545" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="578" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ Código e testes</text><text x="345" y="625" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Edit corrige a comparação; repetir o caso</text><text x="345" y="657" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Testar valores decimais e valores iguais</text><path d="M345 690 L345 720" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="720" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="720" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="753" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑤ Revisão e entrega</text><text x="345" y="800" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.1" font-weight="400" fill="#292929">Lint; revisar legibilidade, segurança, desempenho</text><text x="345" y="832" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Atualizar a arquitetura; conferir a entrega</text><path d="M670 790 L690 790 L690 617 L670 617" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="790" y="697" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">Feedback</text><text x="790" y="727" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">da revisão</text><defs /></svg>
