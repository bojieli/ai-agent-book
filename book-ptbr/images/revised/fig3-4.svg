<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="74.200mm" viewBox="0 0 900 630" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura de referência para a cooperação entre tipos de memória</title><desc id="desc">A memória de trabalho guarda o estado da tarefa atual; as memórias episódica, semântica e procedimental participam por escrita seletiva e por recuperação e ativação.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="630" fill="#ffffff" y="0" />
<rect x="210" y="20" width="480" height="150" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Memória de trabalho</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Objetivo · conversa · resultados</text><text x="450" y="136" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Estado e próximos passos</text><path d="M320 170 L320 280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="224" y="232" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Escrita seletiva</text><path d="M580 280 L580 170" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="683" y="214" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Recuperação</text><text x="683" y="245" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">e ativação</text><rect x="20" y="280" width="860" height="320" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="322" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Memória de longo prazo: entre sessões</text><rect x="40" y="350" width="240" height="215" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="160" y="390" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Episódica</text><text x="160" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">Eventos e cronologia</text><text x="160" y="467" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">Pessoa · fonte · estado</text><text x="160" y="498" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">“Reservou voo</text><text x="160" y="529" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">a Tóquio (jan.)”</text><rect x="330" y="350" width="240" height="215" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="390" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Semântica</text><text x="450" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">Fatos e preferências</text><text x="450" y="467" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">Extraídos de relatos</text><text x="450" y="498" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">“Prefere janela”</text><rect x="620" y="350" width="240" height="215" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="740" y="390" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.4" font-weight="700" fill="#292929">Procedimental</text><text x="740" y="436" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">Fluxos e experiência</text><text x="740" y="467" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">Passos e ramos</text><text x="740" y="498" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">Reservar voo e hotel,</text><text x="740" y="529" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">conferir documentos</text><defs /></svg>
