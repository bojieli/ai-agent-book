<text x="335" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Gerente de projeto</text><text x="335" y="450" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Divide tarefas, arquivos e dependências</text><text x="335" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Distribui o trabalho por módulo</text><path d="M335 515 L335 545" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
