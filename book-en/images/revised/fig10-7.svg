<text x="450" y="615" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">info_collected: name, contact info</text><path d="M124 630 L776 630" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
