<title id="title">Pre-training: next-token prediction</title><desc id="desc">Three prefixes and targets from the same training sentence. The first position is expanded into an example probability distribution and its loss.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="810" fill="#ffffff" y="0" />
