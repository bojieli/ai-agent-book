<ns0:title id="title">Model-driven tool calling: a client-side loop and a server-hosted loop</ns0:title><ns0:desc id="desc">For Kimi search, the client runs the loop; for hosted search and code execution, the server runs the loop. The figure keeps the task, queries, returned results and analysis steps.</ns0:desc>
