<ns0:title id="title">Agentic RAG System Architecture</ns0:title><ns0:desc id="desc">Inside the Agent, the model and the Harness run the retrieval loop; external tools execute searches and return observations. The knowledge-base search interface can connect to different index backends.</ns0:desc>
