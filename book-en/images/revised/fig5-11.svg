<ns0:title id="title">Pipeline of an Agent That Creates Agents</ns0:title><ns0:desc id="desc">Two generation routes share the same acceptance criteria; quality and creation cost are recorded for each.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="898" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">User Requirement</ns0:text><ns0:text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">Build a release-review Agent: read deploy checks, decide to ship</ns0:text><ns0:path d="M450 140 L450 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M225 190 L225 160 L675 160 L675 190" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="190" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="190" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="225" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Route A: From Scratch</ns0:text><ns0:text x="225" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Write run loop &amp; messages</ns0:text><ns0:text x="225" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">Tool protocol &amp; domain tools</ns0:text><ns0:text x="225" y="334" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Add CLI entry and tests</ns0:text><ns0:rect x="470" y="190" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="190" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="675" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.0" font-weight="700" fill="#292929">Route B: Adapt a Reference</ns0:text><ns0:text x="675" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Copy a record-reader base</ns0:text><ns0:text x="675" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">Set status fields, criteria</ns0:text><ns0:text x="675" y="334" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Write prompts, tools, docs</ns0:text><ns0:path d="M225 370 L225 415 L675 415 L675 370" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M450 415 L450 460" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="460" width="860" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="460" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="493" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Shared Acceptance</ns0:text><ns0:text x="450" y="540" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Structure &amp; build → generated tests → tool-call pairing</ns0:text><ns0:text x="450" y="572" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Real-model tasks → multi-turn state → trimming &amp; call limits</ns0:text><ns0:path d="M450 625 L450 645" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M225 670 L225 645 L675 645 L675 670" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="670" width="410" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="670" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="225" y="703" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Task Quality</ns0:text><ns0:text x="225" y="750" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Domain task completed?</ns0:text><ns0:text x="225" y="782" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tool results matched?</ns0:text><ns0:text x="225" y="814" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">State and exits correct?</ns0:text><ns0:rect x="470" y="670" width="410" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="670" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="675" y="703" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Creation Cost</ns0:text><ns0:text x="675" y="750" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Creation time</ns0:text><ns0:text x="675" y="782" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Input/output tokens</ns0:text><ns0:text x="675" y="814" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Revise &amp; verify rounds</ns0:text><ns0:defs /></ns0:svg>
