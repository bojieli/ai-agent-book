<ns0:title id="title">Composition of the context window</ns0:title><ns0:desc id="desc">Beijing weather example: system instructions, the weather tool definition, history with call IDs, the current reasoning, and where the answer is generated.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="841" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="795" height="781" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="35" y="35" width="765" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="417" y="68" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">System Prompt</ns0:text><ns0:text x="417.004" y="107" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">You are a helpful assistant. Answer concisely.</ns0:text><ns0:text x="417.004" y="141" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Use tools for real-time information.</ns0:text><ns0:rect x="35" y="170" width="765" height="205" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="417" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Tool Definitions</ns0:text><ns0:text x="417.004" y="242" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.1" font-weight="400" fill="#292929">{"name": "get_weather", "description": "Get city weather",</ns0:text><ns0:text x="417.004" y="276" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">"parameters": {"type": "object", "properties": {</ns0:text><ns0:text x="417.004" y="310" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">"city": {"type": "string"}}, "required": ["city"]}}</ns0:text><ns0:rect x="35" y="390" width="765" height="176" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="417" y="423" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Conversation History</ns0:text><ns0:text x="417" y="462" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">user: What's the weather in Beijing today?</ns0:text><ns0:text x="420.41" y="496" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">assistant: call_1 → get_weather(city="Beijing")</ns0:text><ns0:text x="417.004" y="530" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tool (call_1): {"temp": "23°C", "conditions": "sunny"}</ns0:text><ns0:rect x="35" y="581" width="765" height="125" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="417" y="614" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Reasoning</ns0:text><ns0:text x="416.995" y="653" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">&lt;think&gt;Got the Beijing weather; now summarize.&lt;/think&gt;</ns0:text><ns0:rect x="35" y="721" width="765" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="411.4" y="761" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant: Beijing is sunny today, 23°C…</ns0:text><ns0:path d="M835 35 L855 35 L855 706 L835 706" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="879" y="405" transform="rotate(-90 879 405)" dominant-baseline="middle" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Context window</ns0:text><ns0:text x="450" y="828" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Current generation position</ns0:text><ns0:path d="M450 806 L450 787" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:defs /></ns0:svg>
