<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="89.511mm" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">Resolution matching and two-way coordinate scaling</title><desc id="desc">The same center point marked on the desktop and the tool screenshot, with the inverse conversion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="760" fill="#ffffff" y="0" />
<text x="215" y="48" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Real screen</text><text x="705" y="48" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Tool screenshot</text><rect x="31.0" y="75" width="368" height="207" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<path d="M201 178.5 L229 178.5" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M215 164.5 L215 192.5" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="214.995" y="316" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">2560 × 1440</text><rect x="589.0" y="112" width="232" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<path d="M691 177 L719 177" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M705 163 L705 191" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="705.005" y="276" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">1366 × 768</text><path d="M410 176 L575 176" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="494" y="148" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Scale</text><path d="M790 242 L790 350 L65 350 L65 282" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="455" y="389" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Model point (683, 384) maps back to desktop center</text><rect x="20" y="420" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="420" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="453" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Convert using each axis's actual ratio</text><text x="449.995" y="500" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">x = 683 × 2560 / 1366 = 1280</text><text x="450.005" y="532" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">y = 384 × 1440 / 768 = 720</text><path d="M450 570 L450 606" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="606" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="606" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="639" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Click (1280, 720), then re-screenshot to check</text><text x="450" y="686" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">With letterboxing, subtract padding, then divide by scale</text><text x="450" y="718" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">With cropping or multiple screens, add the origin offset</text><defs /></svg>
