<ns0:rect x="20" y="192" width="420" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="230.004" y="233" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">&lt;|im_start|&gt;user</ns0:text><ns0:text x="229.995" y="276" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Vancouver 17.9 °C&lt;|im_end|&gt;</ns0:text><ns0:rect x="460" y="20" width="420" height="136" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
