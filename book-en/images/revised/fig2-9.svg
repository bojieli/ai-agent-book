<ns0:title id="title">User message vs. tool result in the Qwen3 template</ns0:title><ns0:desc id="desc">The same text comes from the user in one case and from a tool in the other. Both start with the user marker; the tool result is additionally wrapped in tool_response tags.</ns0:desc>
