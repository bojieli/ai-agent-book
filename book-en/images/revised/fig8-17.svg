<rect x="470" y="735" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="768" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">AIME 2024 accuracy</text><text x="670.83" y="815" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">SFT baseline: ≈ 25%</text><text x="670.83" y="847" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Step 110: ≈ 52%</text><text x="670.83" y="879" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Step 400: 67.0%</text><defs /></svg>
