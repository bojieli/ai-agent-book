<text x="737.504" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">SandboxFusion</text><text x="737.504" y="275" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">128 parallel workers</text><text x="737.5" y="307" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Python execution</text><text x="737.503" y="339" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">sympy / numpy</text><text x="737.503" y="371" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">scipy</text><text x="737.5" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929">Time/memory limits</text><path d="M550 260 L595 260" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
