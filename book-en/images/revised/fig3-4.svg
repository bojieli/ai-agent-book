<title id="title">Reference Architecture for Coordinating Memory Types</title><desc id="desc">Working memory holds the current task state; episodic, semantic and procedural memory take part in the current task through selective writing and retrieval-based activation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="630" fill="#ffffff" y="0" />
<rect x="210" y="20" width="480" height="150" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
