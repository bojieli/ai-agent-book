<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="113.538mm" viewBox="0 0 900 964" role="img" aria-labelledby="title desc">
<title id="title">Evolution of Dense Embeddings</title><desc id="desc">From static word vectors and contextual token representations to sentence vectors designed for similarity, and then to multiple retrieval representations. Dimensions follow the configurations shown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="964" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="220" height="140" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="129.93" y="63" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">2013</text><text x="130.32" y="110" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Word2Vec</text><text x="440" y="77" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Co-occurrence in local windows</text><text x="440" y="107" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Predict context or center word</text><path d="M640 40 L640 140" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="761" y="77" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Static vectors</text><text x="761" y="107" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Example: 300-dim</text><path d="M450 160 L450 195" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
