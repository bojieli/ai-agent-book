<ns0:text x="452.3" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">GUI tool: computer</ns0:text><ns0:text x="449.996" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mouse: mouse_move · left / right / middle_click</ns0:text><ns0:text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="400" fill="#292929">double / triple_click · left_click_drag · left_mouse_down / up</ns0:text><ns0:text x="450.003" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Keyboard: type · key · hold_key</ns0:text><ns0:text x="450" y="196" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Scroll: scroll (direction, amount, modifiers)</ns0:text><ns0:text x="450.001" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Observe: screenshot · cursor_position; Wait: wait</ns0:text><ns0:rect x="20" y="304" width="410" height="195" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
