<ns0:title id="title">Structured Knowledge Extraction Pipeline</ns0:title><ns0:desc id="desc">Modular fields are discovered from case materials and used to extract structured records, which are encoded, standardized and clustered into prototypes; feature weights are explained by differences between cluster centers.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="1077" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="397" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="60" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Stage 1: Knowledge extraction and structuring</ns0:text><ns0:rect x="40" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="155" y="131" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="700" fill="#292929">Raw judgments</ns0:text><ns0:text x="155.58" y="173" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">CAIL2018</ns0:text><ns0:text x="155" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.6" font-weight="400" fill="#292929">Charge sampling</ns0:text><ns0:path d="M270 165 L335 165" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="335" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="131" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM factors</ns0:text><ns0:text x="450" y="173" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Derive fields</ns0:text><ns0:text x="450" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Define values</ns0:text><ns0:text x="450" y="235" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">and nulls</ns0:text><ns0:path d="M565 165 L630 165" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="630" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="745" y="131" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Records</ns0:text><ns0:text x="745.6" y="173" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">surrender: true</ns0:text><ns0:text x="745" y="203" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">damages: ¥500k</ns0:text><ns0:text x="745" y="265" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">harm: serious II</ns0:text><ns0:rect x="40" y="317" width="820" height="75" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="349" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Modular schema: common fields + charge extensions</ns0:text><ns0:text x="450" y="379" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="400" fill="#292929">surrender / damages / priors; theft → amount, injury → severity</ns0:text><ns0:path d="M450 417 L450 457" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="457" width="860" height="405" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="497" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Stage 2: Feature analysis and prototype modeling</ns0:text><ns0:rect x="40" y="527" width="820" height="90" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="563" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Feature encoding and standardization</ns0:text><ns0:text x="450" y="599" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">one-hot · boolean flags · log transform · standardize</ns0:text><ns0:path d="M450 617 L450 634 L230 634 L230 652" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="40" y="652" width="380" height="175" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="230" y="691" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">KMeans clustering</ns0:text><ns0:text x="230" y="735" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">2–5 clusters per charge</ns0:text><ns0:text x="230" y="766" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Silhouette → prototypes</ns0:text><ns0:text x="230" y="797" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Features, sentence stats</ns0:text><ns0:path d="M420 737 L470 737" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="470" y="652" width="390" height="175" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="665" y="691" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Feature weights</ns0:text><ns0:text x="665" y="735" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Compare scaled centers</ns0:text><ns0:text x="665" y="766" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Score feature separation</ns0:text><ns0:text x="665" y="797" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Help explain matches</ns0:text><ns0:path d="M450 862 L450 897" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="897" width="860" height="155" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="938" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Extension: conversational case lookup</ns0:text><ns0:text x="450" y="983" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929">Fill in key facts → match a prototype → explain statistics with sources</ns0:text><ns0:text x="450" y="1021" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">e.g., unarmed fight after a quarrel vs. premeditated armed assault</ns0:text><ns0:defs /></ns0:svg>
