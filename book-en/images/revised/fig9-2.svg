<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="102.113mm" viewBox="0 0 900 867" role="img" aria-labelledby="title desc">
<title id="title">Three layers of trajectory verification, from environment outcomes to an LLM rubric</title><desc id="desc">Example: the agent's promise of a full refund is checked item by item against business state, authorization, timing and the reply.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="867" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Reviewing the same refund</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">User wants a full refund; reply: “Fully refunded, in 7 days.”</text><rect x="20" y="190" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Outcome verifier</text><text x="235" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Order: only partly refunded</text><path d="M450 248 L502 248" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="190" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="248" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.0" font-weight="400" fill="#292929">The full refund is not done</text><rect x="20" y="340" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="340" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="373" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Process verifier</text><text x="235" y="420" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Action log: refund submitted</text><path d="M450 398 L502 398" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="340" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="398" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="400" fill="#292929">Authorization and timing</text><text x="691" y="429.311" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="400" fill="#292929">still need checking</text><rect x="20" y="490" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="490" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="236.02" y="523" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Quality · LLM Rubric</text><text x="235" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">Reply claims “full” and “7 days”</text><path d="M450 548 L502 548" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="490" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="548" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Wording scores can’t</text><text x="691" y="579.72" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">replace order checks</text><rect x="20" y="641" width="860" height="198" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="641" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="674" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Record in the trajectory evaluation for later diagnosis</text><text x="450" y="721" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Outcome: partial; issue: promised amount ≠ actual</text><text x="450" y="753" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Evidence: the order, action log and the Agent’s exact words</text><text x="450" y="785" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929">To verify: basis for “7 days”; keep records for independent checks</text><defs /></svg>
