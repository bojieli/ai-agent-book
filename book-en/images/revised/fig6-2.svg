<ns0:title id="title">Ingress Layer: Adapters, Unified Envelope, and Ingress Log</ns0:title><ns0:desc id="desc">Each source writes to the ingress log through its own adapter; routing dispatches to the runtime, and replies return to the conversation channel through the outbound adapter.</ns0:desc>
