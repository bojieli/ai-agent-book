<text x="450" y="481" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ How to verify</text><text x="450" y="528" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Program assertions: tests / state / arguments</text><text x="450" y="560" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Rubric: facts / completeness / relations / constraints</text><text x="450" y="592" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Model &amp; human judges: semantic quality / pairwise preference</text><path d="M450 628 L450 668" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
