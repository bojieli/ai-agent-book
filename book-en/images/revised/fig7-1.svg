<title id="title">Four Components of an Agent Evaluation System</title><desc id="desc">Metrics, task sources, verification methods, and how results and supporting infrastructure feed the next round.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
