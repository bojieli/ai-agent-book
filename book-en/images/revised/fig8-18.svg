<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="94.811mm" viewBox="0 0 900 805" role="img" aria-labelledby="title desc">
<title id="title">AWorld-train Tool Calling and Training Loop</title><desc id="desc">The top half shows tool interaction within a single trajectory; the bottom half shows the policy update after a batch of trajectories is collected.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="805" fill="#ffffff" y="0" />
<text x="450" y="40" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">One task: the same policy can call tools repeatedly</text><rect x="30" y="82" width="245" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="82" width="245" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="151.88" y="115" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">AgentLoop</text><text x="152.5" y="162" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Current policy</text><text x="152.5" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Chooses action</text><rect x="625" y="82" width="245" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="625" y="82" width="245" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="747.5" y="115" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">MCP sandbox</text><text x="747.5" y="162" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Runs tools</text><text x="747.5" y="194" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.5" font-weight="400" fill="#292929">Keeps task state</text><text x="450" y="95" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Call and arguments</text><path d="M275 115 L625 115" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="161" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Result or error</text><path d="M625 184 L275 184" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M150 227 L150 370" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="306" y="293" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Hand off trajectory</text><text x="563" y="341" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">A batch of tasks: collect, score, and train</text><rect x="30" y="370" width="385" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="370" width="385" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="222.5" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">VeRL adapter</text><text x="222.5" y="450" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">Gathers parallel rollouts</text><text x="222.5" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Scores; builds samples</text><rect x="495" y="370" width="375" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="495" y="370" width="375" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="682.5" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Training backend</text><text x="682.496" y="450" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Uses GRPO or PPO</text><text x="682.5" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">Updates policy parameters</text><path d="M415 440 L495 440" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M680 520 L680 570 L15 570 L15 150 L30 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="440" y="555" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Next batch uses the updated policy</text><rect x="30" y="618" width="840" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="618" width="840" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="651" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Paper timing: single-node sequential → distributed</text><text x="450" y="698" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Trajectory collection: 7,695 s → 525 s (≈ 14.6×)</text><text x="450" y="730" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Parameter update: 144 s in both setups</text><defs /></svg>
