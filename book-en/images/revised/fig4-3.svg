<text x="675.004" y="799" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Assistant → Tool Result</text><text x="675.002" y="835" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Calls get_stock_quote</text><text x="675" y="865" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Returns the stock price</text><path d="M675 245 L675 265" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
