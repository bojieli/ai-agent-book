<text x="675" y="539" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Discovery result</text><text x="674.999" y="575" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="400" fill="#292929">Full get_stock_quote schema</text><rect x="470" y="635" width="410" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
