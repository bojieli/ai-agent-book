<ns0:title id="title">KV cache optimization for dynamic tool loading</ns0:title><ns0:desc id="desc">Left: editing the tool list near the front forces recomputation from the point of change. Right: the prefix is kept and discovery results are appended at the end of the history. Cache hits also depend on the provider's policy.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="1050" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="410" height="55" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="225" y="57" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.1" font-weight="700" fill="#292929">Edit the tool list up front</ns0:text><ns0:rect x="470" y="20" width="410" height="55" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="675" y="57" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Append at the end</ns0:text><ns0:rect x="20" y="95" width="410" height="100" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
