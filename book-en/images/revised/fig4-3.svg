<ns0:text x="225" y="249" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.9" font-weight="700" fill="#292929">Tool list: changed this turn</ns0:text><ns0:text x="225" y="285" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Existing tool definitions</ns0:text><ns0:text x="225.002" y="315" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">+ get_stock_quote</ns0:text><ns0:rect x="20" y="380" width="410" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
