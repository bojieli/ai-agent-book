<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="123.667mm" viewBox="0 0 900 1050" role="img" aria-labelledby="title desc">
<title id="title">KV cache optimization for dynamic tool loading</title><desc id="desc">Left: editing the tool list near the front forces recomputation from the point of change. Right: the prefix is kept and discovery results are appended at the end of the history. Cache hits also depend on the provider's policy.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1050" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="55" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="57" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.1" font-weight="700" fill="#292929">Edit the tool list up front</text><rect x="470" y="20" width="410" height="55" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="57" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Append at the end</text><rect x="20" y="95" width="410" height="100" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<text x="225.004" y="129" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">System Prompt</text><text x="225" y="165" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Role and rules</text><rect x="20" y="215" width="410" height="135" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="249" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.9" font-weight="700" fill="#292929">Tool list: changed this turn</text><text x="225" y="285" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Existing tool definitions</text><text x="225.002" y="315" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">+ get_stock_quote</text><rect x="20" y="380" width="410" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="225.004" y="414" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">User</text><text x="225" y="450" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Get NVDA's stock price</text><rect x="20" y="510" width="410" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="225.004" y="544" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Assistant</text><text x="225.002" y="580" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Calls get_stock_quote</text><rect x="20" y="640" width="410" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
