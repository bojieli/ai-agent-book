<title id="title">Supervised Fine-Tuning (SFT) Pipeline</title><desc id="desc">Data sources, token-level supervision, and the kinds of behavior demonstrated.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="880" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Define the task and generate demonstrations</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.5" font-weight="400" fill="#292929">Human demos · teacher-generated · successful or repaired trajectories</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Input x: task, context, tool definitions; target y: answer or action</text><path d="M450 165 L450 200" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="200" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="200" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="233" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Filter and split</text><text x="450" y="280" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Verify content, format, tool results → dedupe → split train / held-out</text><path d="M450 305 L450 340" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="340" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="340" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="373" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Token-level optimization</text><text x="453.41" y="420" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">L = −Σₜ log P(yₜ | x, y₁,…,yₜ₋₁)</text><text x="450" y="452" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.6" font-weight="400" fill="#292929">Target answers and actions count toward the loss; input is context</text><path d="M450 480 L450 515" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="515" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="515" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="548" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Independent evaluation</text><text x="450" y="595" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">Format &amp; instruction following · task quality · OOD · retained skills</text><rect x="20" y="665" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="665" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="698" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.2" font-weight="700" fill="#292929">Speech and language control</text><text x="225" y="745" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.7" font-weight="400" fill="#292929">Speech: speaker / audio context</text><text x="225.005" y="777" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929">Expressive tags: &lt;laugh&gt; / &lt;sigh&gt;</text><text x="225" y="809" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">Language: per-language demos</text><rect x="470" y="665" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="665" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="698" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="27.3" font-weight="700" fill="#292929">Distillation and tool use</text><text x="675" y="745" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929">Long-prompt teacher → student</text><text x="675" y="777" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.8" font-weight="400" fill="#292929">Reasoning demos → student targets</text><text x="675" y="809" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tool JSON / error recovery</text><defs /></svg>
