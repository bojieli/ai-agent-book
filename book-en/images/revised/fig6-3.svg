<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="86.449mm" viewBox="0 0 900 734" role="img" aria-labelledby="title desc">
<title id="title">Three Strategies for Asynchronous Events</title><desc id="desc">When a new event arrives, what happens to the original task and to the new event.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="734" fill="#ffffff" y="0" />
<text x="450" y="48" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">A new event arrives: what happens to the current task?</text><rect x="20" y="82" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="177" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Cancel</text><rect x="240" y="82" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="554.4" y="122" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">User says "stop"</text><text x="560" y="175" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Stop new actions; request cancellation</text><text x="560" y="231" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Confirm how far it got; record final state</text><rect x="20" y="302" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="397" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Queue</text><rect x="240" y="302" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="554.4" y="342" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">User adds "only the last month"</text><text x="560" y="395" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Search running; queue the new request</text><text x="560" y="451" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Then filter results by the new range</text><rect x="20" y="522" width="210" height="184" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="125" y="617" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Parallel</text><rect x="240" y="522" width="640" height="184" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="560" y="562" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">User asks about weather mid-analysis</text><text x="560" y="615" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Weather in new context; main task goes on</text><text x="560" y="671" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Save weather answer and analysis separately</text><defs /></svg>
