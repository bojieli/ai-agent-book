<ns0:title id="title">A chat template turns messages into a token sequence</ns0:title><ns0:desc id="desc">The request contains a system instruction and a user question. The template marks the boundaries of both messages, then appends an assistant start marker for the model to continue from.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="542" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="370" height="497" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
