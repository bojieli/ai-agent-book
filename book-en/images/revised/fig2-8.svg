<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="63.836mm" viewBox="0 0 900 542" role="img" aria-labelledby="title desc">
<title id="title">A chat template turns messages into a token sequence</title><desc id="desc">The request contains a system instruction and a user question. The template marks the boundaries of both messages, then appends an assistant start marker for the model to continue from.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="542" fill="#ffffff" y="0" />
<rect x="20" y="20" width="370" height="497" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="205" y="64" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">API request messages</text><rect x="34" y="125" width="342" height="142" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="204.996" y="165" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">system</text><text x="205.002" y="208" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">You are a helpful</text><text x="209.19" y="240" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">assistant.</text><rect x="34" y="307" width="342" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="205.004" y="347" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">user</text><text x="205" y="390" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">Beijing weather today?</text><text x="451" y="210" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22" font-weight="400" fill="#292929">Chat</text><text x="451" y="282" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22" font-weight="400" fill="#292929">template</text><path d="M390 307 L510 307" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="510" y="20" width="375" height="497" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="697" y="64" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Template output</text><text x="696.998" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">&lt;|im_start|&gt;system</text><text x="701.19" y="159" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.9" font-weight="400" fill="#292929">You are a helpful assistant.</text><text x="696.995" y="206" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">&lt;|im_end|&gt;</text><text x="697.004" y="285" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">&lt;|im_start|&gt;user</text><text x="697" y="332" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Beijing weather today?</text><text x="696.995" y="379" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">&lt;|im_end|&gt;</text><rect x="526" y="400" width="343" height="98" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
