<title id="title">Voice Werewolf Agent system</title><desc id="desc">The judge maintains the rules and private information; players take part through voice and role actions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
