<title id="title">Shared context vs. independent context</title><desc id="desc">Role switching in a CSV-script task that carries history forward, versus independent-context handoffs in book translation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
