<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="106.824mm" viewBox="0 0 900 907" role="img" aria-labelledby="title desc">
<title id="title">Message timeline of parallel search</title><desc id="desc">Ten members search in parallel. After the Manager verifies the first valid candidate, it sends a cancellation to the members still searching and waits for their acknowledgments.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="907" fill="#ffffff" y="0" />
<text x="450" y="42" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">Example: ten members search for a faculty member</text><rect x="47" y="72" width="182" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="140.3" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Manager</text><rect x="269" y="72" width="182" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="360.14" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Member 2</text><rect x="477" y="72" width="182" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="568.14" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Member 3</text><rect x="689" y="72" width="182" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="780" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Others</text><text x="138" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Coordinates</text><path d="M138 185 L138 670" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="360" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mathematics</text><path d="M360 185 L360 337" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="568" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Physics</text><path d="M568 185 L568 435" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="780" y="170" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Other schools</text><path d="M780 185 L780 670" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="249" y="217" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Dispatch</text><path d="M138 240 L360 240" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M138 240 L568 240" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M138 240 L780 240" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="63.72" y="248" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">0 s</text><text x="63.72" y="345" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">12 s</text><text x="249" y="319" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Not found</text><path d="M360 337 L138 337" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="63.72" y="443" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">18 s</text><text x="353" y="417" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Candidate + source</text><path d="M568 435 L138 435" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="63.72" y="598" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">18.1 s</text><text x="459" y="572" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Send cancel request (terminate)</text><path d="M138 590 L780 590" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="63.72" y="678" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">19 s</text><text x="459" y="652" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Close browser, then acknowledge</text><path d="M780 670 L138 670" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="170" y="462" width="525" height="66" rx="6" fill="#eee" stroke="#333333" stroke-width="1.8" />
<text x="432" y="506" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">Verify, atomically record first hit</text><path d="M138 495 L170 495" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="724" width="840" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="30" y="724" width="840" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="757" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Summary records each end reason</text><text x="450" y="804" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Not found, matched, cancel confirmed: each has a record.</text><text x="450" y="836" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Members unfinished after 2 min are logged as timed out.</text><defs /></svg>
