<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="81.620mm" viewBox="0 0 900 693" role="img" aria-labelledby="title desc">
<title id="title">The Computer Use Agent's perceive–think–act loop</title><desc id="desc">Screenshot, action decision, execution, and the new observation fed back.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="693" fill="#ffffff" y="0" />
<rect x="65" y="20" width="770" height="135" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="65" y="20" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Observe</text><text x="450" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Screenshot of desktop / browser / app</text><text x="450" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Record screen size and UI state</text><path d="M450 155 L450 190" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="65" y="190" width="770" height="135" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="65" y="190" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="223" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Model decides</text><text x="450" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Input: screenshot + task + history and current state</text><text x="453.41" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Example: click address field → click(512, 250)</text><path d="M450 325 L450 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="65" y="360" width="770" height="170" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="65" y="360" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="393" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Execute action</text><text x="450.001" y="440" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.8" font-weight="400" fill="#292929">Tool layer validates, dispatches → xdotool / Playwright</text><text x="450" y="472" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Mouse: move, click, drag · Keyboard: type, key combos</text><text x="450" y="504" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Scroll: move viewport · Wait: let the UI respond</text><path d="M450 530 L450 565" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="65" y="565" width="770" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="65" y="565" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="598" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ Read post-action state</text><text x="450" y="645" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">New screenshot: field focused, or a login popup?</text><path d="M65 615 L25 615 L25 85 L65 85" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<defs /></svg>
