<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="104.822mm" viewBox="0 0 900 890" role="img" aria-labelledby="title desc">
<title id="title">Coding Agent Workflow</title><desc id="desc">Five-stage workflow with test and review feedback.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="890" fill="#ffffff" y="0" />
<rect x="20" y="20" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Project Documentation</text><text x="345" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Read the README and architecture docs</text><text x="345" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">Glob source files, write project instructions</text><path d="M345 165 L345 195" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="195" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="195" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="228" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Requirement Understanding</text><text x="345" y="275" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Reproduce: ¥100 sorts before ¥20</text><text x="345" y="307" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">Grep for the sort entry, trace the amount type</text><path d="M345 340 L345 370" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="370" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="370" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="403" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Design Document</text><text x="345" y="450" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Decide where to convert amounts to numbers</text><text x="345" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Submit for design review per project process</text><path d="M345 515 L345 545" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="545" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="545" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="578" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ Coding and Testing</text><text x="345" y="625" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Edit the comparison, rerun the original case</text><text x="345" y="657" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Also test decimal and equal amounts</text><path d="M345 690 L345 720" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="720" width="650" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="720" width="650" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="345" y="753" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑤ Review and Delivery</text><text x="345" y="800" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929">Lint; review readability, security, performance</text><text x="345" y="832" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Update architecture docs; check and deliver</text><path d="M670 790 L690 790 L690 617 L670 617" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="780" y="710" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22" font-weight="400" fill="#292929">Review feedback</text><defs /></svg>
