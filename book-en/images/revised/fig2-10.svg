<ns0:title id="title">Prompt Cache: Reusing the KV Cache of a Shared Prefix Across Requests</ns0:title><ns0:desc id="desc">Three requests compared: the shared system prompt and tool definitions can be reused; a timestamp inserted at the very front changes the prefix that follows.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="600" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="160" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="96.14" y="55" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.1" font-weight="700" fill="#292929">Request 1</ns0:text><ns0:rect x="40" y="75" width="545" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="312.004" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">System Prompt + Tools</ns0:text><ns0:rect x="610" y="75" width="250" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="735" y="112" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">user: Weather?</ns0:text><ns0:text x="312" y="165" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">First pass (example prefix: 1,200 tokens)</ns0:text><ns0:text x="735" y="165" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">→ Generate answer</ns0:text><ns0:rect x="20" y="210" width="860" height="160" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="96.14" y="245" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.1" font-weight="700" fill="#292929">Request 2</ns0:text><ns0:rect x="40" y="265" width="545" height="57" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="312.004" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">System Prompt + Tools</ns0:text><ns0:rect x="610" y="265" width="250" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="735" y="302" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">user: Time?</ns0:text><ns0:text x="312" y="355" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Reuse shared prefix</ns0:text><ns0:text x="735" y="355" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">→ Generate answer</ns0:text><ns0:rect x="20" y="400" width="860" height="160" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="96.14" y="435" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.1" font-weight="700" fill="#292929">Request 3</ns0:text><ns0:rect x="40" y="455" width="545" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="312.004" y="492" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">10:30:45 + System Prompt + Tools</ns0:text><ns0:rect x="610" y="455" width="250" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="735" y="492" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">user: Weather?</ns0:text><ns0:text x="312" y="545" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Prefix changed, reprocess</ns0:text><ns0:text x="735" y="545" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">→ Generate answer</ns0:text><ns0:path d="M312 180 L312 210" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M312 370 L312 400" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
