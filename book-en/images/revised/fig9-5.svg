<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="106.000mm" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">The dual loop of online execution and offline evolution</title><desc id="desc">On the left, the current version submits requests and waits for receipts; on the right, the system learns from the logs. A new version that passes verification serves later tasks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="900" fill="#ffffff" y="0" />
<rect x="20" y="20" width="360" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="200" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Online execution</text><text x="200" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">Run the current version</text><text x="200" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Log actions, receipts</text><text x="200" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Notify user when done</text><rect x="520" y="20" width="360" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="20" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Offline evolution</text><text x="700" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Aggregate and diagnose</text><text x="700" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">Find shared root causes</text><rect x="20" y="350" width="360" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="350" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="200" y="383" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Await progress</text><text x="200" y="430" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">On a status update,</text><text x="200" y="462" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.0" font-weight="400" fill="#292929">or recheck at a set time.</text><path d="M120 220 L120 350" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="65" y="292" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">Pending</text><path d="M278 350 L278 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="334" y="312" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Wake</text><path d="M380 120 L520 120" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="80" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">Experience</text><text x="450" y="104" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20" font-weight="400" fill="#292929">logs</text><rect x="520" y="270" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="270" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="303" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Candidate changes</text><text x="700" y="350" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929">Knowledge · Instructions</text><text x="700" y="382" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Programs · Parameters</text><path d="M700 220 L700 270" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M700 435 L700 490" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="520" y="490" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="490" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="523" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Independent check</text><text x="700" y="570" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">New tasks, old abilities</text><text x="700" y="602" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Regression and safety</text><path d="M520 575 L485 575 L485 352 L520 352" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="434" y="460" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Rework</text><path d="M700 655 L700 710" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="520" y="710" width="360" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="520" y="710" width="360" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="700" y="743" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Release and monitor</text><text x="700" y="790" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Canary · Monitoring</text><text x="700" y="822" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Promote / Roll back</text><path d="M520 792 L8 792 L8 120 L20 120" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="260" y="775" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Later tasks use the new version</text><defs /></svg>
