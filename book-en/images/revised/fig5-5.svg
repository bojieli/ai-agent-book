<ns0:title id="title">Proposer-Reviewer Mechanism for PPT Generation</ns0:title><ns0:desc id="desc">Slidev source, per-slide screenshots and structured feedback pass between separate contexts.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
