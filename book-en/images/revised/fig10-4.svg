<title id="title">Sequential coordination by a Manager</title><desc id="desc">The Manager calls the research, analysis, and writing members in turn and receives each result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="862" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Manager · Planning &amp; Dispatch</text><text x="449.51" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tools: call_agent_A / call_agent_B / call_agent_C</text><text x="450.002" y="132" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Helper tools: search / write_file</text><text x="450" y="164" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Decides the next step from each result</text><path d="M125 200 L125 834" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="255" width="550" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="255" width="550" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="575" y="288" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent A · Research</text><text x="575" y="335" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Search technical documents</text><text x="575" y="367" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Extract key facts and sources</text><path d="M125 285 L300 285" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="270" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">1. Call</text><path d="M300 375 L125 375" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="410" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Sources</text><rect x="300" y="449" width="550" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="300" y="449" width="550" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="575" y="482" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent B · Analysis</text><text x="575" y="529" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Compare options and statistics</text><text x="575" y="561" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Summarize findings and evidence</text><path d="M125 479 L300 479" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="210" y="464" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">2. Call</text><path d="M300 569 L125 569" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
