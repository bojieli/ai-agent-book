<title id="title">200 ms micro-turns in full-duplex interaction</title><desc id="desc">The top half aligns user input and Agent output in time. In the second slot the user cuts in while the Agent is still speaking; in the third, the Agent stops. The bottom half lays out the same inputs and outputs in the order the model processes them.</desc>
