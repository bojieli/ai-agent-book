<text x="688.005" y="49" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">600</text><path d="M862 60 L862 104" fill="none" stroke="#333333" stroke-width="1.8" />
