<ns0:title id="title">GeneralPoints Experimental Architecture (Training and Testing Design for the GP-L and GP-VL Variants)</ns0:title><ns0:desc id="desc">Card example, distribution shift, shared initialization, and the two training branches.</ns0:desc>
