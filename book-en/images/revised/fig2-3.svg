<ns0:title id="title">Full interaction sequence of two model API calls</ns0:title><ns0:desc id="desc">Vancouver time and weather: the model issues two independent calls, the Harness executes them and returns results with IDs, then the model generates the final answer.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="780" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="56" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">First model call</ns0:text><ns0:text x="450" y="93" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">messages: system + user  ·  tools: time + weather</ns0:text><ns0:path d="M450 120 L450 157" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="157" width="860" height="145" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="193" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant: tool_calls</ns0:text><ns0:text x="453.41" y="235" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">call_abc123 → get_current_time(timezone="America/Vancouver")</ns0:text><ns0:text x="453.41" y="276" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">call_def456 → get_weather(city="Vancouver", unit="celsius")</ns0:text><ns0:path d="M450 302 L450 325 L230 325 L230 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M450 325 L670 325 L670 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="360" width="420" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="230" y="394" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Time tool</ns0:text><ns0:text x="229.995" y="431" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">call_abc123</ns0:text><ns0:text x="230" y="466" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929">Returns current Vancouver time</ns0:text><ns0:rect x="460" y="360" width="420" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="670" y="394" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Weather tool</ns0:text><ns0:text x="670.005" y="431" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">call_def456</ns0:text><ns0:text x="670" y="466" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">Returns temperature and conditions</ns0:text><ns0:text x="450" y="348" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Harness runs both in parallel</ns0:text><ns0:path d="M230 485 L230 516 L450 516" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M670 485 L670 516 L450 516 L450 550" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="550" width="860" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="585" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Second model call · tools unchanged</ns0:text><ns0:text x="450" y="625" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.9" font-weight="400" fill="#292929">Previous messages + assistant call message + two results with tool_call_id</ns0:text><ns0:path d="M450 650 L450 683" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="683" width="860" height="77" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="714" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant: final reply (loop ends)</ns0:text><ns0:text x="444.8" y="747" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">"It is now … in Vancouver, and the weather is …"</ns0:text><ns0:defs /></ns0:svg>
