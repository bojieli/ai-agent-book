<ns0:text x="675" y="193" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Multi-turn interaction</ns0:text><ns0:text x="674.995" y="240" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Look up booking BK-98712</ns0:text><ns0:text x="675.005" y="272" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tool: confirmed / UA123</ns0:text><ns0:text x="675" y="304" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">User confirms; Agent cancels</ns0:text><ns0:text x="675" y="336" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Agent states refund timing</ns0:text><ns0:path d="M225 120 L225 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
