<ns0:text x="225" y="428" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Executable verifier</ns0:text><ns0:text x="224.995" y="475" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">fib(10) == 55</ns0:text><ns0:text x="224.995" y="507" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">fib(0) == 0</ns0:text><ns0:text x="224.995" y="539" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">All specified tests pass → 1</ns0:text><ns0:text x="224.995" y="571" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Otherwise → 0</ns0:text><ns0:rect x="470" y="395" width="410" height="220" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
