<ns0:title id="title">Context after dynamic discovery: tool schemas are scattered through the trajectory</ns0:title><ns0:desc id="desc">Two rounds of tool discovery, for a stock quote and a GitHub contributor analysis. New definitions enter the history with tool_search_output and keep their position in later requests.</ns0:desc>
