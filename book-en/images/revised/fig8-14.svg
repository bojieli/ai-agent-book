<title id="title">Comparison of Single-Turn RL and Multi-Turn RL</title><desc id="desc">Interaction scope, feedback, and state handling for a card answer versus continuous navigation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
