<ns0:title id="title">The closed loop between Agent and Environment, and the Model–Harness structure inside the Agent</ns0:title><ns0:desc id="desc">An Agent contains a Model and a Harness side by side. The Harness organizes context, dispatches tools and manages the run; the environment receives actions, updates its state and returns observations.</ns0:desc>
