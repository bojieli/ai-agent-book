<ns0:title id="title">MCP protocol interaction sequence</ns0:title><ns0:desc id="desc">MCP 2026-07-28: the client may first discover the server's capabilities, then list and call the weather tool. Every request carries the required protocol metadata; the figure spells out the business methods and parameters.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="883" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="280" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="162.51" y="57" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">MCP Client</ns0:text><ns0:text x="160" y="93" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Client inside the host</ns0:text><ns0:rect x="600" y="20" width="280" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="740.004" y="57" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">MCP Server</ns0:text><ns0:text x="740" y="93" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">Provides a weather tool</ns0:text><ns0:path d="M160 110 L160 863" fill="none" stroke="#777777" stroke-width="2" stroke-dasharray="7 5" />
<ns0:path d="M740 110 L740 863" fill="none" stroke="#777777" stroke-width="2" stroke-dasharray="7 5" />
<ns0:rect x="20" y="135" width="860" height="45" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="166" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① Capability discovery (optional for the client)</ns0:text><ns0:rect x="20" y="365" width="860" height="45" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="396" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② Tool discovery</ns0:text><ns0:rect x="20" y="635" width="860" height="45" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="666" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ Tool call</ns0:text><ns0:text x="450.004" y="220" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">server/discover</ns0:text><ns0:path d="M160 235 L740 235" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="450" y="295" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Supported versions and server capabilities</ns0:text><ns0:path d="M740 310 L160 310" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="450.001" y="435" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tools/list</ns0:text><ns0:path d="M160 450 L740 450" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="450.004" y="520" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tool definition: get_weather</ns0:text><ns0:path d="M740 535 L160 535" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="240" y="555" width="420" height="60" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="581" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">location: city name (string)</ns0:text><ns0:text x="450" y="608" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Purpose: weather for a city</ns0:text><ns0:text x="450.004" y="705" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tools/call: get_weather</ns0:text><ns0:path d="M160 720 L740 720" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="453.41" y="754" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">arguments: {"location": "Beijing"}</ns0:text><ns0:text x="450" y="808" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tool result: Beijing, 22°C, sunny</ns0:text><ns0:path d="M740 823 L160 823" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:defs /></ns0:svg>
