<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="103.880mm" viewBox="0 0 900 882" role="img" aria-labelledby="title desc">
<ns0:title id="title">The execution loop of an autonomous Agent</ns0:title><ns0:desc id="desc">Reasoning, action, observation and every exit condition are shown. A completed task is verified before delivery; errors or an exhausted budget save progress and report.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="882" fill="#ffffff" y="0" />
<ns0:rect x="190" y="30" width="360" height="137" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="370" y="65" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.7" font-weight="700" fill="#292929">Check budget and errors</ns0:text><ns0:text x="370" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">Max rounds · Error count</ns0:text><ns0:text x="370" y="130" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Unrecoverable errors</ns0:text><ns0:rect x="630" y="30" width="240" height="137" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="750" y="65" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Stop the run</ns0:text><ns0:text x="750" y="100" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Save progress</ns0:text><ns0:text x="750" y="130" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="20.9" font-weight="400" fill="#292929">Report unfinished</ns0:text><ns0:text x="750" y="162" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">or hand off</ns0:text><ns0:path d="M550 80 L630 80" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="590" y="54" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Stop</ns0:text><ns0:path d="M370 167 L370 237" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="440" y="208" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Continue</ns0:text><ns0:rect x="190" y="237" width="360" height="142" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="370" y="273" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Reasoning and</ns0:text><ns0:text x="370" y="305" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">decision-making</ns0:text><ns0:text x="370" y="345" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.5" font-weight="400" fill="#292929">"Need more info" / answer</ns0:text><ns0:path d="M275 379 L275 449" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="360" y="423" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Tool request</ns0:text><ns0:rect x="90" y="449" width="370" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="275" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Acting</ns0:text><ns0:text x="278.41" y="527" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">web_search(...)</ns0:text><ns0:text x="275" y="557" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Harness checks, runs it</ns0:text><ns0:path d="M275 569 L275 644" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="90" y="644" width="370" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="275" y="684" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Observation</ns0:text><ns0:text x="275.002" y="724" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">tool_result: "..."</ns0:text><ns0:text x="275" y="754" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="24.3" font-weight="400" fill="#292929">Result/error into context</ns0:text><ns0:path d="M90 706 L35 706 L35 80 L190 80" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M550 324 L570 324 L570 424 L680 424 L680 449" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="705" y="370" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">final_answer, or a</ns0:text><ns0:text x="705" y="400" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">reply with no tool call</ns0:text><ns0:rect x="520" y="449" width="320" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="680" y="490" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Verify completion</ns0:text><ns0:text x="680" y="532" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="22.9" font-weight="400" fill="#292929">Task result · Artifacts</ns0:text><ns0:path d="M680 569 L680 644" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:text x="727" y="614" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Pass</ns0:text><ns0:rect x="520" y="644" width="320" height="85" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="680" y="695" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="25.4" font-weight="700" fill="#292929">Deliver final result</ns0:text><ns0:path d="M840 509 L875 509 L875 854 L35 854 L35 706" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="450" y="819" text-anchor="middle" font-family="&quot;DejaVu Sans&quot;, Arial, &quot;Helvetica Neue&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fail: add the review feedback, then check the budget again</ns0:text><ns0:defs /></ns0:svg>
