<ns0:title id="title">تحقق ثلاثي الطبقات من المسار: من نتائج البيئة إلى LLM Rubric</ns0:title><ns0:desc id="desc">مثال: مطابقة وعد خدمة العملاء باسترداد كامل المبلغ مع حالة الطلب والصلاحيات والمهلة الزمنية ونص الرد، بندًا بندًا.</ns0:desc>
