<title id="title">تسلسل التفاعل الكامل لاستدعاءين لـ API النموذج</title><desc id="desc">وقت فانكوفر وطقسها: يُصدر النموذج استدعاءين مستقلين، وتنفذهما منظومة التشغيل وتعيد النتائج مع معرّفاتها، ثم يولّد النموذج الإجابة النهائية.</desc>
