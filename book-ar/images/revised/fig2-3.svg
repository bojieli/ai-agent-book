<ns0:title id="title">تسلسل التفاعل الكامل لاستدعاءين لـ API النموذج</ns0:title><ns0:desc id="desc">وقت فانكوفر وطقسها: يُصدر النموذج استدعاءين مستقلين، وتنفذهما منظومة التشغيل وتعيد النتائج مع معرّفاتها، ثم يولّد النموذج الإجابة النهائية.</ns0:desc>
