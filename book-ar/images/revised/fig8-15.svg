<ns0:title id="title">إسناد الفضل في التفاعل متعدد الجولات</ns0:title><ns0:desc id="desc">خمس خطوات من رحلة ملاحة واحدة في صفوف، مع مقارنة الدرجة لكل خطوة بين المكافأة في النهاية فقط وإضافة تغذية العملية.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="545" fill="#ffffff" y="0" />
<ns0:text x="435" y="53" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929" direction="rtl">رحلة ملاحة واحدة بخطتي مكافأة</ns0:text><ns0:text x="88" y="120" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الخطوة</ns0:text><ns0:text x="300" y="120" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الملاحظة والإجراء</ns0:text><ns0:text x="576" y="120" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">النهاية فقط</ns0:text><ns0:text x="770" y="120" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">مع مكافأة المسار</ns0:text><ns0:path d="M32 146 L868 146" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="94.51" y="194" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">1</ns0:text><ns0:text x="300.5" y="194" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">يرى الطريق، فينعطف يسارًا</ns0:text><ns0:text x="582.51" y="194" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">0</ns0:text><ns0:text x="776.51" y="194" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">‎+1</ns0:text><ns0:path d="M32 218 L868 218" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="94.51" y="266" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">2</ns0:text><ns0:text x="300.5" y="266" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">يقرأ اللافتة، فيؤكد الاتجاه</ns0:text><ns0:text x="582.51" y="266" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">0</ns0:text><ns0:text x="776.51" y="266" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">‎+1</ns0:text><ns0:path d="M32 290 L868 290" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="93.74" y="338" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">3</ns0:text><ns0:text x="300" y="338" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">يفوّت التقاطع، ويواصل السير</ns0:text><ns0:text x="581.74" y="338" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">0</ns0:text><ns0:text x="775.74" y="338" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">‎−1</ns0:text><ns0:path d="M32 362 L868 362" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="94.51" y="410" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">4</ns0:text><ns0:text x="300.5" y="410" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">يكتشف الانحراف، فيعود أدراجه</ns0:text><ns0:text x="582.51" y="410" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">0</ns0:text><ns0:text x="776.51" y="410" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">0</ns0:text><ns0:path d="M32 434 L868 434" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="94.51" y="482" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">5</ns0:text><ns0:text x="300.5" y="482" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">يبلغ الهدف، فينهي الملاحة</ns0:text><ns0:text x="582.51" y="482" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">‎+10</ns0:text><ns0:text x="776.51" y="482" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929" direction="rtl">‎+10</ns0:text><ns0:path d="M32 505 L868 505" fill="none" stroke="#333333" stroke-width="1.8" />
