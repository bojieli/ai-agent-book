<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="99.051mm" viewBox="0 0 900 841" role="img" aria-labelledby="title desc">
<ns0:title id="title">نظرة عامة على مكونات نافذة السياق</ns0:title><ns0:desc id="desc">مثال طقس بكين: تعليمات النظام، وتعريف أداة الطقس، والسجل مع معرّفات الاستدعاء، والاستدلال الحالي، وموضع توليد الإجابة.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="841" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="795" height="781" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="35" y="35" width="765" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="403" y="68" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">موجّه النظام (System Prompt)</ns0:text><ns0:text x="413.39" y="107" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">You are a helpful assistant. Answer concisely.‎</ns0:text><ns0:text x="413.39" y="141" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">Use tools for real-time information.‎</ns0:text><ns0:rect x="35" y="170" width="765" height="205" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="403" y="203" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">تعريفات الأدوات (Tool Definitions)</ns0:text><ns0:text x="413.39" y="242" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="21.6" font-weight="400" fill="#292929" direction="rtl">‪{"name": "get_weather", "description": "الاستعلام عن طقس مدينة",‬</ns0:text><ns0:text x="412.61" y="276" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">‎"parameters": {"type": "object", "properties": {‎</ns0:text><ns0:text x="412.61" y="310" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">‎"city": {"type": "string"}}, "required": ["city"]}}‎</ns0:text><ns0:rect x="35" y="390" width="765" height="176" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="403" y="423" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">سجل المحادثة (Conversation History)</ns0:text><ns0:text x="404" y="462" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">user: كيف الطقس في بكين اليوم؟</ns0:text><ns0:text x="412.61" y="496" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">‪assistant: call_1 → get_weather(city="بكين")‬</ns0:text><ns0:text x="412.61" y="530" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929" direction="rtl">‪tool (call_1): {"temp": "23°C", "conditions": "مشمس"}‬</ns0:text><ns0:rect x="35" y="581" width="765" height="125" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="403" y="614" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">استدلال هذه الجولة (Reasoning)</ns0:text><ns0:text x="409.78" y="653" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="25.3" font-weight="400" fill="#292929" direction="rtl">‪&lt;think&gt;حصلتُ على طقس بكين، وسألخّص الإجابة الآن&lt;/think&gt;‬</ns0:text><ns0:rect x="35" y="721" width="765" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="403" y="761" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">assistant: الطقس في بكين مشمس اليوم، ‪23°C‬…</ns0:text><ns0:path d="M835 35 L855 35 L855 706 L835 706" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="866" y="335" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">ال</ns0:text><ns0:text x="866" y="370" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">س</ns0:text><ns0:text x="866" y="405" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">ي</ns0:text><ns0:text x="866" y="440" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">ا</ns0:text><ns0:text x="866" y="475" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">ق</ns0:text><ns0:text x="437" y="828" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">موضع التوليد الحالي</ns0:text><ns0:path d="M450 806 L450 787" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:defs /></ns0:svg>
