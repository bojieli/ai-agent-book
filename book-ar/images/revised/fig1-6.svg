<ns0:title id="title">حلقة تنفيذ Agent المستقل</ns0:title><ns0:desc id="desc">يُحتفظ بالاستدلال والإجراء والملاحظة وجميع شروط الخروج؛ عند اكتمال المهمة تُسلَّم النتيجة بعد التحقق، وعند وقوع خطأ أو تجاوز الميزانية يُحفظ التقدم ويُرفع تقرير.</ns0:desc>
