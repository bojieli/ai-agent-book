<ns0:title id="title">فضاء الأفعال في Computer Use</ns0:title><ns0:desc id="desc">أمثلة على الواجهة الرسومية، وتنفيذ الأوامر، وتحرير الملفات، وتعبئة النماذج.</ns0:desc>
