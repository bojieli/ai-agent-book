<title id="title">آلية التقييم في BM25</title><desc id="desc">مع تثبيت بقية الشروط، نلاحظ كيف يغيّر كلٌّ من تكرار المصطلح وطول المستند وتكرار المستندات درجةَ مصطلح استعلام واحد.</desc>
