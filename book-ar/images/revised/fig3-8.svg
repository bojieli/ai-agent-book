<text x="135" y="104" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">تشبع التكرار</text><text x="565" y="58" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">⁦k₁ = 1.5⁩، والمستند بطول المتوسط تمامًا</text><text x="565" y="103" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الظهور مرة، مرتين، 3 مرات</text><text x="565" y="150" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">عامل التكرار: 1.00 ← 1.43 ← 1.67</text><rect x="20" y="190" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="135" y="274" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">تطبيع الطول</text><text x="565" y="228" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">⁦k₁ = 1.5⁩، ⁦b = 0.75⁩، والتكرار 1</text><text x="565" y="273" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">يزداد طول المستند من المتوسط إلى الضعف</text><text x="565" y="320" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">عامل التكرار: 1.00 ← 0.69</text><rect x="20" y="360" width="860" height="152" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="360" width="230" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="135" y="444" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">ندرة المصطلح</text><text x="565" y="398" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">مجموعة نصوص من 10 مستندات</text><text x="565" y="443" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">«النموذج» في 3 مستندات، و«التقطير» في 2</text><text x="565" y="490" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">IDF: «النموذج» 0.762، «التقطير» 1.224</text><defs /></svg>
