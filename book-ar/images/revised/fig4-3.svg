<ns0:title id="title">تحسين KV Cache عند التحميل الديناميكي للأدوات</ns0:title><ns0:desc id="desc">يعرض اليسار كيف يؤدي تعديل قائمة الأدوات في المقدمة إلى إعادة الحساب من نقطة التغيير؛ ويعرض اليمين الإبقاء على البادئة وإلحاق نتيجة الاكتشاف بنهاية السجل. يتأثر إصابة الذاكرة المؤقتة أيضًا بسياسة الخدمة.</ns0:desc>
