<ns0:rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="441.75" y="53" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">MDP: S · A · P · R · γ</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الحالات · الإجراءات · توزيع الانتقال · المكافأة · معامل الخصم</ns0:text><ns0:rect x="20" y="165" width="860" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
