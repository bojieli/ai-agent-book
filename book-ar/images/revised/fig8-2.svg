<ns0:title id="title">مخطط عملية قرار ماركوف (MDP)</ns0:title><ns0:desc id="desc">الغرفة مكوِّن واحد فقط من الحالة؛ والانتقال يعتمد أيضًا على الأغراض والأبواب والحراس.</ns0:desc>
