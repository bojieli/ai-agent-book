<ns0:text x="436" y="198" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">مكوِّن الموقع: 5 غرف</ns0:text><ns0:text x="437" y="245" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">قاعة المدخل · المخزن · الممر الشمالي · غرفة الحارس · غرفة الكنز</ns0:text><ns0:rect x="20" y="315" width="410" height="210" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="315" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="218.07" y="348" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الحالة الراهنة s</ns0:text><ns0:text x="212" y="395" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الموقع: المخزن</ns0:text><ns0:text x="212" y="427" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الأغراض: يحمل المفتاح الأحمر</ns0:text><ns0:text x="212" y="459" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الباب: مقفل</ns0:text><ns0:text x="212" y="491" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الحارس: حي</ns0:text><ns0:rect x="470" y="315" width="410" height="210" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
