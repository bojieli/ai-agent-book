<ns0:title id="title">أدوار دقيقة مدتها 200 مللي ثانية في التفاعل ثنائي الاتجاه الكامل</ns0:title><ns0:desc id="desc">يحاذي النصف العلوي مدخلات المستخدم ومخرجات المساعد زمنيًا. في المقطع الثاني يقاطع المستخدم والمساعد ما زال يتكلم، وفي الثالث يتوقف المساعد. ويعرض النصف السفلي المدخلات والمخرجات نفسها بترتيب معالجة النموذج.</ns0:desc>
