<title id="title">أدوار دقيقة مدتها 200 مللي ثانية في التفاعل ثنائي الاتجاه الكامل</title><desc id="desc">يحاذي النصف العلوي مدخلات المستخدم ومخرجات المساعد زمنيًا. في المقطع الثاني يقاطع المستخدم والمساعد ما زال يتكلم، وفي الثالث يتوقف المساعد. ويعرض النصف السفلي المدخلات والمخرجات نفسها بترتيب معالجة النموذج.</desc>
