<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="71.491mm" viewBox="0 0 900 607" role="img" aria-labelledby="title desc">
<title id="title">أربعة مواضع لتحديث Agent للتصوير الطبي</title><desc id="desc">يستخدم النظام نفسه النموذج لتمييز الصور، والبرنامج لحساب المؤشرات، ويسترجع الإرشادات، ثم ينظّم النتائج وفق إجراءات كتابة التقارير.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="607" fill="#ffffff" y="0" />
<text x="450" y="48" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929" direction="rtl">في تقرير التصوير نفسه، أين يمكن أن يقع التعديل؟</text><rect x="48" y="90" width="350" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="48" y="90" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="123" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">معاملات النموذج</text><text x="223" y="170" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">تمييز الأهداف في الصورة</text><text x="223" y="202" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929" direction="rtl">تحسين نموذج الإدراك عند الخطأ</text><rect x="500" y="90" width="352" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="500" y="90" width="352" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="123" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">البرامج</text><text x="676" y="170" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="20.7" font-weight="400" fill="#292929" direction="rtl">حساب المؤشرات من نتائج التمييز</text><text x="676" y="202" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929" direction="rtl">تغيّرت قواعد الحساب؟ عدّل الشفرة</text><path d="M398 167 L500 167" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="48" y="324" width="350" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="48" y="324" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="357" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">قاعدة المعرفة</text><text x="223" y="404" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929" direction="rtl">استرجاع بنود الإرشادات المناسبة</text><text x="223" y="436" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="21.7" font-weight="400" fill="#292929" direction="rtl">تحديث المصدر مع كل إصدار جديد</text><rect x="500" y="324" width="352" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="500" y="324" width="352" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="357" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">التعليمات (Skill)‎</text><text x="676" y="404" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929" direction="rtl">تنظيم نتائج الحساب وفق الإجراءات</text><text x="676" y="436" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929" direction="rtl">ذكر الإرشادات وإصداراتها</text><path d="M398 400 L500 400" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M676 235 L676 324" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="565" y="288" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">قيم المؤشرات</text><path d="M676 469 L676 505" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="505" width="412" height="74" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="553" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="21.8" font-weight="700" fill="#292929" direction="rtl">مسودة التقرير، تُسلَّم لمراجعة بشرية</text><defs /></svg>
