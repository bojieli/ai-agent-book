<ns0:rect x="48" y="324" width="350" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="48" y="324" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="209" y="357" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">قاعدة المعرفة</ns0:text><ns0:text x="210" y="404" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929" direction="rtl">استرجاع بنود الإرشادات المناسبة</ns0:text><ns0:text x="210" y="436" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="21.7" font-weight="400" fill="#292929" direction="rtl">تحديث المصدر مع كل إصدار جديد</ns0:text><ns0:rect x="500" y="324" width="352" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
