<title id="title">الحلقة المزدوجة: التنفيذ عبر الإنترنت والتطور دون اتصال</title><desc id="desc">على اليسار يُستعلم وفق الإصدار الحالي ويُنتظر الإشعار، وعلى اليمين يُتعلَّم من السجلات. ويُتاح الإصدار الجديد الذي اجتاز التحقق للمهام اللاحقة.</desc>
