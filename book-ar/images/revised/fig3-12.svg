<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="92.102mm" viewBox="0 0 900 782" role="img" aria-labelledby="title desc">
<title id="title">RAG أحادي الاسترجاع مقابل RAG القابل لمواصلة البحث</title><desc id="desc">في سؤال الاستبدال نفسه، يعثر الاسترجاع الأول على سلسلة المنتج. لا يستطيع الاسترجاع الواحد إلا الإجابة بالأدلة المتاحة؛ أما الاسترجاع متعدد الجولات فيستكمل البحث عن البنود بحسب الطراز والتاريخ.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
