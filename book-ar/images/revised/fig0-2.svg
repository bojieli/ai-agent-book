<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="98.933mm" viewBox="0 0 900 840" role="img" aria-labelledby="title desc">
<ns0:title id="title">بنية الكتاب: بناء Agent وتحسين قدراته</ns0:title><ns0:desc id="desc">تؤسس الفصول من الأول إلى السادس منهجية البناء، ويوفر الفصل السابع تغذية راجعة عبر التقييم، وترفع الفصول من الثامن إلى العاشر القدرات عبر المعاملات وتحديث النظام والتعاون.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="840" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="214.11" y="60" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.7" font-weight="700" fill="#292929" direction="rtl">الجزء الأول: كيف نبني Agent</ns0:text><ns0:rect x="480" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="666" y="60" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.2" font-weight="700" fill="#292929" direction="rtl">الجزء الثاني: كيف نحسّن القدرات</ns0:text><ns0:text x="206" y="138" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.7" font-weight="700" fill="#292929" direction="rtl">الفصل الأول: مدخل إلى AI Agent</ns0:text><ns0:text x="207" y="180" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">كيف يستدعي النموذج الأدوات؟</ns0:text><ns0:path d="M20 224 L420 224" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="206" y="262" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الفصل الثاني: هندسة السياق</ns0:text><ns0:text x="207" y="304" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929" direction="rtl">ما المعلومات اللازمة لهذا القرار؟</ns0:text><ns0:path d="M20 348 L420 348" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="206" y="386" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="22.1" font-weight="700" fill="#292929" direction="rtl">الفصل الثالث: الذاكرة وقاعدة المعرفة</ns0:text><ns0:text x="207" y="428" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="22.6" font-weight="400" fill="#292929" direction="rtl">كيف نستعيد ما نوقش في المرة السابقة؟</ns0:text><ns0:path d="M20 472 L420 472" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="206" y="510" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الفصل الرابع: الأدوات</ns0:text><ns0:text x="207" y="552" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="21.7" font-weight="400" fill="#292929" direction="rtl">كيف نستعلم عن الحالة وننجز المعاملات؟</ns0:text><ns0:path d="M20 596 L420 596" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="214.11" y="634" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الفصل الخامس: Coding Agent</ns0:text><ns0:text x="214.11" y="666" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">والوكيل العام</ns0:text><ns0:text x="207" y="706" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929" direction="rtl">هل يمكن كتابة برنامج لإنجاز المهمة؟</ns0:text><ns0:path d="M20 720 L420 720" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:text x="206" y="758" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الفصل السادس: التفاعل</ns0:text><ns0:text x="207" y="800" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="21.3" font-weight="400" fill="#292929" direction="rtl">ماذا لو قاطع المستخدم في منتصف المهمة؟</ns0:text><ns0:rect x="480" y="110" width="400" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="666" y="153" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الفصل السابع: تقييم Agent</ns0:text><ns0:text x="667" y="204" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">أين الخطأ؟ وهل نجح الإصلاح؟</ns0:text><ns0:path d="M680 225 L680 247 L500 247 L500 747" fill="none" stroke="#333333" stroke-width="1.8" />
<ns0:path d="M500 347 L522 347" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="522" y="282" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="687" y="328" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="22.8" font-weight="700" fill="#292929" direction="rtl">الفصل الثامن: ما بعد التدريب</ns0:text><ns0:text x="688" y="376" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929" direction="rtl">كيف نحدّث النموذج بالتدريب؟</ns0:text><ns0:path d="M500 547 L522 547" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="522" y="482" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="687" y="528" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="22.5" font-weight="700" fill="#292929" direction="rtl">الفصل التاسع: التطور المستمر</ns0:text><ns0:text x="688" y="576" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="20.4" font-weight="400" fill="#292929" direction="rtl">كيف نحسّن النظام بخبرة التشغيل؟</ns0:text><ns0:path d="M500 747 L522 747" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="522" y="682" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<ns0:text x="687" y="728" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.3" font-weight="700" fill="#292929" direction="rtl">الفصل العاشر: تعاون الوكلاء</ns0:text><ns0:text x="688" y="776" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="22.4" font-weight="400" fill="#292929" direction="rtl">كيف تُوزَّع المهام وتُسلَّم؟</ns0:text><ns0:defs /></ns0:svg>
