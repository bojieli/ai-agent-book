<ns0:title id="title">الاسترجاع المدرك للسياق</ns0:title><ns0:desc id="desc">يُدخَل المستند الأصلي والمقطع المستهدف معًا إلى النموذج لتوليد بادئة سياقية، ثم تُفهرس البادئة مع النص الأصلي. يحتفظ المثال بالمقطع الكامل عن نمو إيرادات شركة ACME بنسبة 3% في الربع الثاني من 2025.</ns0:desc>
