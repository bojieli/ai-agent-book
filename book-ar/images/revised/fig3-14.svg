<title id="title">الاسترجاع المدرك للسياق</title><desc id="desc">يُدخَل المستند الأصلي والمقطع المستهدف معًا إلى النموذج لتوليد بادئة سياقية، ثم تُفهرس البادئة مع النص الأصلي. يحتفظ المثال بالمقطع الكامل عن نمو إيرادات شركة ACME بنسبة 3% في الربع الثاني من 2025.</desc>
