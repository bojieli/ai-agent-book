<title id="title">التنبؤ بالـ Token التالي في التدريب المسبق</title><desc id="desc">ثلاث بادئات وأهدافها من جملة التدريب نفسها. يُوسَّع الموضع الأول إلى توزيع احتمالي توضيحي والخسارة المقابلة.</desc>
