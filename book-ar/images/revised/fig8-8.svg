<ns0:title id="title">التنبؤ بالـ Token التالي في التدريب المسبق</ns0:title><ns0:desc id="desc">ثلاث بادئات وأهدافها من جملة التدريب نفسها. يُوسَّع الموضع الأول إلى توزيع احتمالي توضيحي والخسارة المقابلة.</ns0:desc>
