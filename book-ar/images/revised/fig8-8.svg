<ns0:text x="436" y="533" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">توسيع الصف الأول: ما احتمال «المهام» عند النموذج؟</ns0:text><ns0:text x="438.03" y="580" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">مثال التنبؤ: المهام 42% · الأوامر 28% · الخطة 15% · غيرها 15%</ns0:text><ns0:text x="442.78" y="612" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">خسارة هذا الموضع: ‎−ln‎(0.42)‎ ≈ 0.87</ns0:text><ns0:path d="M450 653 L450 688" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
