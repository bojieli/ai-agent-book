<?xml version="1.0" encoding="UTF-8"?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="106.000mm" height="135.444mm" viewBox="0 0 900 1150" role="img" aria-labelledby="title desc">
<ns0:title id="title">نظام وكلاء لعبة المستذئب الصوتية</ns0:title><ns0:desc id="desc">يحفظ الحَكَم القواعد والمعلومات الخاصة، ويشارك اللاعبون بالصوت وأفعال أدوارهم.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
<ns0:rect width="900" height="1150" fill="#ffffff" y="0" />
<ns0:rect x="20" y="20" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="53" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الحَكَم · شيفرة لعب حتمية</ns0:text><ns0:text x="437" y="100" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الليل ← النهار ← التصويت ← الحسم</ns0:text><ns0:text x="437" y="132" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">يحفظ الأدوار وحالة البقاء وصلاحيات الأفعال وشروط الفوز</ns0:text><ns0:path d="M450 165 L450 185 L225 185 L225 205" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M450 185 L675 185 L675 205" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M450 185 L450 410 L225 410 L225 435" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:path d="M450 410 L675 410 L675 435" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="205" width="410" height="185" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="205" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="216.74" y="238" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">مستذئب × 2</ns0:text><ns0:text x="212" y="285" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">يرى: هويته وزميله المستذئب</ns0:text><ns0:text x="212" y="317" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">ليلًا: اختيار الضحية معًا</ns0:text><ns0:text x="212" y="349" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929" direction="rtl">الخطة: التنكر ومجاراة التصويت</ns0:text><ns0:rect x="470" y="205" width="410" height="185" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="205" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="666.74" y="238" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">العرّاف × 1</ns0:text><ns0:text x="662" y="285" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">يرى: هويته ونتائج الكشف</ns0:text><ns0:text x="662" y="317" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">ليلًا: كشف هوية لاعب واحد</ns0:text><ns0:text x="662" y="349" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الخطة: كشف هويته في حينه</ns0:text><ns0:rect x="20" y="435" width="410" height="185" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="435" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="216.74" y="468" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الساحرة × 1</ns0:text><ns0:text x="212" y="515" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.7" font-weight="400" fill="#292929" direction="rtl">ترى: هويتها والجرعات والتلميحات</ns0:text><ns0:text x="212" y="547" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="24.9" font-weight="400" fill="#292929" direction="rtl">ليلًا: استخدام الترياق أو السم</ns0:text><ns0:text x="212" y="579" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="24.0" font-weight="400" fill="#292929" direction="rtl">الخطة: توقيت الجرعات بحسب الوضع</ns0:text><ns0:rect x="470" y="435" width="410" height="185" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="435" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="666.74" y="468" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">قروي × 2</ns0:text><ns0:text x="662" y="515" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">يرى: هويته والمعلومات العامة</ns0:text><ns0:text x="662" y="547" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="22.2" font-weight="400" fill="#292929" direction="rtl">الأدلة: الأقوال والأصوات والنتائج</ns0:text><ns0:text x="662" y="579" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="21.5" font-weight="400" fill="#292929" direction="rtl">نهارًا: الاستنتاج والنقاش والتصويت</ns0:text><ns0:rect x="20" y="675" width="860" height="220" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="675" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="708" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">توزيع المعلومات وفحص الأفعال</ns0:text><ns0:text x="437" y="755" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">القناة العامة: الكلام والتصويت والنتائج المعلنة وفق القواعد</ns0:text><ns0:text x="437" y="787" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">القنوات الخاصة: الكشف، وتشاور المستذئبين، وتلميحات الساحرة</ns0:text><ns0:text x="437" y="819" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">يفحص الحَكَم الأفعال بحسب الهوية والمرحلة وحالة البقاء</ns0:text><ns0:text x="437" y="851" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">لا يتلقى سياق كل لاعب إلا ما يحق له معرفته</ns0:text><ns0:rect x="20" y="945" width="860" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="945" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="978" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">التفاعل الصوتي · مثال بستة لاعبين</ns0:text><ns0:text x="437" y="1025" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">لاعب بشري + 5 بالذكاء الاصطناعي، بتوزيع عشوائي للأدوار</ns0:text><ns0:text x="437" y="1057" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">صوت اللاعب ← ASR ← الوكيل أو الحَكَم ← TTS ← صوت</ns0:text><ns0:text x="437" y="1089" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الكلام والأفعال بالتناوب حسب المرحلة؛ الحسم عند تحقق شرط الفوز</ns0:text><ns0:defs /></ns0:svg>
