<ns0:title id="title">تسلسل الرسائل في البحث المتوازي</ns0:title><ns0:desc id="desc">عشرة أعضاء يبحثون بالتوازي. بعد أن يتحقق Manager من أول مرشح صالح، يرسل طلب إلغاء إلى الأعضاء الذين ما زالوا يبحثون وينتظر التأكيد.</ns0:desc>
