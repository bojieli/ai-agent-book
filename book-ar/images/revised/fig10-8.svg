<ns0:text x="436" y="757" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">تسجيل سبب الانتهاء لكل عضو عند التجميع</ns0:text><ns0:text x="437" y="804" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929" direction="rtl">لكلٍّ من «انتهى البحث دون نتيجة» و«تطابق» و«أُكّد الإلغاء» سجلٌّ خاص.</ns0:text><ns0:text x="437" y="836" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">العضو الذي لم ينتهِ بعد دقيقتين يُسجَّل منفصلًا كمهلة منتهية.</ns0:text><ns0:defs /></ns0:svg>
