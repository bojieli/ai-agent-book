<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="111.889mm" viewBox="0 0 900 950" role="img" aria-labelledby="title desc">
<title id="title">مسار استعلام RAG: الاسترجاع والتعزيز والتوليد</title><desc id="desc">يُسترجع لسؤال الاسترداد مقاطع من السياسة ودليل الإجراءات، ثم تُدمج المقاطع مع السؤال لتكوين مدخلات النموذج، فيُولَّد جواب محدد.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="950" fill="#ffffff" y="0" />
<rect x="20" y="20" width="290" height="110" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="165" y="58" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">سؤال المستخدم</text><text x="165" y="99" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">كيف أسترد المبلغ؟</text><rect x="440" y="20" width="440" height="110" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="660" y="58" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">قاعدة المعرفة</text><text x="660" y="99" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">السياسة · الخطوات · مدة الوصول</text><path d="M165 130 L165 175 L290 175" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M660 130 L660 175 L610 175" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="290" y="145" width="320" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="183" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">استرجاع مقاطع Top-k</text><text x="450" y="222" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">متجهات كثيفة / BM25</text><path d="M450 245 L450 280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="280" width="860" height="195" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="317" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">نتائج الاسترجاع</text><text x="450" y="361" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="25.0" font-weight="400" fill="#292929" direction="rtl">① يمكن طلب استرداد كامل خلال 7 أيام من الاستلام، مع تقديم رقم الطلب.</text><text x="450" y="404" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">يصل المبلغ المسترد خلال 3–5 أيام عمل.</text><text x="450" y="447" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">② طلباتي ← اختيار الطلب ← طلب الاسترداد.</text><path d="M450 475 L450 515" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="515" width="860" height="125" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="554" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">مدخلات النموذج بعد التعزيز</text><text x="450" y="601" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929" direction="rtl">تعليمات المهمة + سؤال المستخدم + المقاطع المسترجعة ومعرّفات مصادرها</text><path d="M450 640 L450 675" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="290" y="675" width="320" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="717" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.5" font-weight="700" fill="#292929" direction="rtl">توليد الجواب عبر LLM</text><path d="M450 740 L450 780" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="780" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="818" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الجواب</text><text x="450" y="861" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929" direction="rtl">ادخل إلى «طلباتي» خلال 7 أيام من الاستلام، واختر الطلب ثم اطلب الاسترداد.</text><text x="450" y="900" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929" direction="rtl">قدّم رقم الطلب عند التقديم، ويُتوقع وصول المبلغ خلال 3–5 أيام عمل.</text><defs /></svg>
