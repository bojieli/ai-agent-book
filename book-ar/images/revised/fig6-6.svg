<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="105.647mm" viewBox="0 0 900 897" role="img" aria-labelledby="title desc">
<title id="title">توافق الواجهات المتزامنة واللاتزامن الأصلي في النموذج</title><desc id="desc">مقبض المهمة الخلفية، ومعرّف الاستدعاء الأصلي، والتوجيه أثناء التنفيذ.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="897" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="244" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="53" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">تكييف الواجهة المتزامنة</text><text x="225" y="100" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929" direction="rtl">الأداة تعيد task_id وpending</text><text x="225" y="132" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929" direction="rtl">نتيجة هذا الاستدعاء تُقرن بطلبه</text><text x="225" y="164" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">النموذج يعالج رسائل أخرى</text><text x="225" y="196" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="25.0" font-weight="400" fill="#292929" direction="rtl">الاكتمال في الخلفية ← حدث جديد</text><text x="225" y="228" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.4" font-weight="400" fill="#292929" direction="rtl">استعادة سياق المهمة عبر task_id</text><rect x="470" y="20" width="410" height="244" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="53" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="27.0" font-weight="700" fill="#292929" direction="rtl">أدوات النموذج غير المتزامنة</text><text x="675" y="100" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">إعلان الأداة async: true</text><text x="675" y="132" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.8" font-weight="400" fill="#292929" direction="rtl">النموذج يعمل أثناء تنفيذ الأداة</text><text x="675" y="164" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.3" font-weight="400" fill="#292929" direction="rtl">النتيجة مرتبطة بـ call_id الأصلي</text><text x="675" y="196" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929" direction="rtl">النتيجة تدخل أحدث حالة استجابة</text><text x="675" y="228" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">النموذج يدمج النتيجة ويقرر</text><rect x="20" y="309" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="309" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="342" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الاستعلام عن قاعة: استقبال تحديث المستخدم أثناء التنفيذ</text><text x="450" y="389" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الشروط الأولية: ميزانية 2000 يوان، 20 شخصًا</text><text x="450" y="421" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="24.2" font-weight="400" fill="#292929" direction="rtl">A ‏1800 يوان / 30 شخصًا · B ‏900 يوان / 12 شخصًا · C ‏600 يوان / 8 أشخاص</text><path d="M450 459 L450 479 L225 479 L225 499" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 479 L675 479 L675 499" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="499" width="410" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="499" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="532" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">الاستعلام لم يكتمل بعد</text><text x="225" y="579" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الخلفية تواصل البحث عن قاعة</text><text x="225" y="611" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الواجهة تعدّ الجدول والتحضير</text><rect x="470" y="499" width="410" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="499" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="532" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="700" fill="#292929" direction="rtl">توجيه المستخدم أثناء التنفيذ</text><text x="675" y="579" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">تحديث: 1000 يوان، 10 أشخاص</text><text x="675" y="611" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">تسجيل مصدر التحديث وحالته</text><path d="M225 644 L225 679 L675 679 L675 644" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 679 L450 719" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="719" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="719" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="752" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">النتيجة والتحديث يدخلان القرار معًا</text><text x="450" y="799" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">وفق الشروط الأولية يمكن اختيار A؛ ووفق الجديدة يُختار B</text><text x="450" y="831" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="24.7" font-weight="400" fill="#292929" direction="rtl">بيئة التشغيل تدير حالة الأدوات؛ والنموذج يعتمد شروط المهمة المحدّثة</text><defs /></svg>
