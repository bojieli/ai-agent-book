<ns0:title id="title">مسار استخراج المعرفة المنظَّمة</ns0:title><ns0:desc id="desc">تُكتشف الحقول المعيارية من مواد القضايا، وتُستخرج سجلات منظّمة، ثم تُرمَّز وتُوحَّد وتُجمَّع لتكوين نماذج أولية، وتُفسَّر أوزان الخصائص بحسب الفروق بين مراكز العناقيد.</ns0:desc>
<ns0:defs><ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></ns0:marker></ns0:defs>
