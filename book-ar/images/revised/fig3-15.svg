<title id="title">مسار استخراج المعرفة المنظَّمة</title><desc id="desc">تُكتشف الحقول المعيارية من مواد القضايا، وتُستخرج سجلات منظّمة، ثم تُرمَّز وتُوحَّد وتُجمَّع لتكوين نماذج أولية، وتُفسَّر أوزان الخصائص بحسب الفروق بين مراكز العناقيد.</desc>
