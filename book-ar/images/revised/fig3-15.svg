<ns0:text x="731" y="131" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">سجلات منظّمة</ns0:text><ns0:text x="737.8" y="173" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.1" font-weight="400" fill="#292929" direction="rtl">تسليم النفس: true</ns0:text><ns0:text x="732" y="203" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929" direction="rtl">تعويض: 500 ألف يوان</ns0:text><ns0:text x="732" y="265" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="21.0" font-weight="400" fill="#292929" direction="rtl">إصابة جسيمة درجة 2</ns0:text><ns0:rect x="40" y="317" width="820" height="75" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="349" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">Schema معيارية: حقول عامة + امتدادات التهمة</ns0:text><ns0:text x="437" y="379" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="23.1" font-weight="400" fill="#292929" direction="rtl">تسليم النفس/التعويض/السوابق؛ السرقة ← المبلغ، الإيذاء ← درجة الإصابة</ns0:text><ns0:path d="M450 417 L450 457" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="457" width="860" height="405" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:text x="436" y="497" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">المرحلة الثانية: تحليل الخصائص ونمذجة النماذج الأولية</ns0:text><ns0:rect x="40" y="527" width="820" height="90" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
