<ns0:text x="211" y="53" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">GP-L · نقل القواعد</ns0:text><ns0:text x="217.78" y="100" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="24.6" font-weight="400" fill="#292929" direction="rtl">المدخل: ‎[7, J, 3, 5]‎، الهدف 24</ns0:text><ns0:text x="217.78" y="132" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">التدريب: J / Q / K = 10</ns0:text><ns0:text x="217.78" y="164" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">‎(J−7)‎ × ‎(5+3)‎ = 24</ns0:text><ns0:text x="217.79" y="196" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">الاختبار: J=11، Q=12، K=13</ns0:text><ns0:text x="217.78" y="228" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">التعبير الأصلي يعطي الآن 32</ns0:text><ns0:rect x="470" y="20" width="410" height="245" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
