<ns0:title id="title">التسلسل الزمني لتفاعلات بروتوكول MCP</ns0:title><ns0:desc id="desc">MCP 2026-07-28: يمكن للعميل أن يكتشف قدرات الخادم أولًا، ثم يسرد أداة الطقس ويستدعيها. يحمل كل طلب بيانات البروتوكول الوصفية اللازمة؛ ويعرض الشكل طرائق العمل ومعاملاتها بالتفصيل.</ns0:desc>
