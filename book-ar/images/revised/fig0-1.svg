<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="80.089mm" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
<title id="title">Agent = LLM + السياق + الأدوات</title><desc id="desc">ابدأ من طلب يتعلق بفاتورة واقرأ من الأعلى إلى الأسفل. يقرر النموذج أولًا الاستعلام عن الفاتورة، فتعيد الأداة التفاصيل؛ تدخل التفاصيل إلى السياق، ويقرر النموذج بناءً عليها الخطوة التالية.</desc>
