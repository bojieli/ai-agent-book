<ns0:title id="title">Agent = LLM + السياق + الأدوات</ns0:title><ns0:desc id="desc">ابدأ من طلب يتعلق بفاتورة واقرأ من الأعلى إلى الأسفل. يقرر النموذج أولًا الاستعلام عن الفاتورة، فتعيد الأداة التفاصيل؛ تدخل التفاصيل إلى السياق، ويقرر النموذج بناءً عليها الخطوة التالية.</ns0:desc>
