<ns0:title id="title">تصنيف Elo والترتيب بالمقارنة الزوجية</ns0:title><ns0:desc id="desc">مثال عددي على مرشحين مجهولين، والدرجة المتوقعة، والتحديث المتتابع.</ns0:desc>
