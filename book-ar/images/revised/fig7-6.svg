<ns0:text x="436" y="378" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929" direction="rtl">حكم مجهول الهوية: A أنسب للمهمة</ns0:text><ns0:text x="437" y="425" text-anchor="middle" font-family="&quot;Noto Naskh Arabic&quot;, &quot;Noto Sans Arabic&quot;, Amiri, &quot;Geeza Pro&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929" direction="rtl">إعادة المقارنة بعد تبديل الموضعين؛ ويُوسَم التعارض</ns0:text><ns0:path d="M450 450 L450 492" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<ns0:rect x="20" y="492" width="860" height="112" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<ns0:rect x="20" y="492" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
