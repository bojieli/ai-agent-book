<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="98.933mm" viewBox="0 0 900 840" role="img" aria-labelledby="title desc">
<title id="title">நூலின் அமைப்பு: ஏஜெண்டை உருவாக்குதலும் அதன் திறனை மேம்படுத்துதலும்</title><desc id="desc">அத்தியாயங்கள் 1–6 உருவாக்கும் முறையை அமைக்கின்றன; அத்தியாயம் 7 மதிப்பீட்டுப் பின்னூட்டம் தருகிறது; அத்தியாயங்கள் 8–10 அளவுருக்கள், அமைப்பு மேம்பாடு, கூட்டுழைப்பு வழியாகத் திறனை உயர்த்துகின்றன.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="840" fill="#ffffff" y="0" />
<rect x="20" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="220" y="60" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.9" font-weight="700" fill="#292929">பகுதி 1: ஏஜெண்டை உருவாக்குதல்</text><rect x="480" y="20" width="400" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="680" y="60" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பகுதி 2: திறனை உயர்த்துதல்</text><text x="220" y="138" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.1" font-weight="700" fill="#292929">அத்தியாயம் 1 AI ஏஜெண்ட் அறிமுகம்</text><text x="220" y="180" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">மாதிரி கருவிகளை எப்படி அழைக்கிறது?</text><path d="M20 224 L420 224" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="262" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">அத்தியாயம் 2 சூழல் பொறியியல்</text><text x="220" y="304" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.9" font-weight="400" fill="#292929">இந்த முடிவுக்கு என்ன தகவல் தேவை?</text><path d="M20 348 L420 348" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="386" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.3" font-weight="700" fill="#292929">அத்தியாயம் 3 நினைவகம், அறிவுத் தளம்</text><text x="220" y="428" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">முன்பு பேசியதை எப்படி மீட்பது?</text><path d="M20 472 L420 472" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="510" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">அத்தியாயம் 4 கருவிகள்</text><text x="220" y="552" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.6" font-weight="400" fill="#292929">நிலை அறிவது, பணி முடிப்பது எப்படி?</text><path d="M20 596 L420 596" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="634" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">அத்தியாயம் 5 Coding Agent</text><text x="220" y="666" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">மற்றும் பொது ஏஜெண்ட்</text><text x="220" y="706" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.8" font-weight="400" fill="#292929">இதற்கு ஒரு நிரல் எழுத முடியுமா?</text><path d="M20 720 L420 720" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="220" y="758" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">அத்தியாயம் 6 இடைவினை</text><text x="220" y="800" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பயனர் இடையில் குறுக்கிட்டால்?</text><rect x="480" y="110" width="400" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="680" y="153" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.7" font-weight="700" fill="#292929">அத்தியாயம் 7 ஏஜெண்ட் மதிப்பீடு</text><text x="680" y="204" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">எங்கே தவறு? திருத்தம் பலித்ததா?</text><path d="M680 225 L680 247 L500 247 L500 747" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M500 347 L522 347" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="282" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="328" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.5" font-weight="700" fill="#292929">அத்தியாயம் 8 பின்-பயிற்சி</text><text x="701" y="376" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">பயிற்சியால் மாதிரியை மேம்படுத்துவது?</text><path d="M500 547 L522 547" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="482" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="528" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.6" font-weight="700" fill="#292929">அத்தியாயம் 9 தொடர் பரிணாமம்</text><text x="701" y="576" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">அனுபவத்தால் மேம்பாடு?</text><path d="M500 747 L522 747" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="522" y="682" width="358" height="130" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="701" y="728" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.7" font-weight="700" fill="#292929">அத்தியாயம் 10 பல ஏஜெண்டுகள்</text><text x="701" y="776" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">பணிப் பகிர்வும் ஒப்படைப்பும் எப்படி?</text><defs /></svg>
