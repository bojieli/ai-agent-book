<title id="title">ஏஜெண்ட் சார் RAG அமைப்புக் கட்டமைப்பு</title><desc id="desc">ஏஜெண்டினுள் மாதிரியும் Harness-உம் மீட்டெடுப்புச் சுழற்சியை ஒழுங்கமைக்கின்றன; வெளிக் கருவிகள் தேடலை இயக்கி அவதானிப்பைத் திருப்புகின்றன. அறிவுத்தள மீட்டெடுப்பு இடைமுகம் பல்வேறு சுட்டுப் பின்தளங்களுடன் இணையலாம்.</desc>
