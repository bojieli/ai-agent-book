<text x="225" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Diff + Apply Model</text><text x="225" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">− def foo(x): return x</text><text x="225" y="132" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">+ def foo(x, y=0): return x+y</text><text x="225" y="164" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.1" font-weight="400" fill="#292929">மாதிரி விவரிக்கும், Apply பொருத்தும்</text><text x="225" y="196" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">சரிபார்: diff, சோதனைகள்</text><rect x="470" y="20" width="410" height="212" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
