<title id="title">Skills-இன் படிநிலை வெளிப்படுத்தல் பொறிமுறை</title><desc id="desc">PPTX எடுத்துக்காட்டு: திறன் அட்டவணையிலிருந்து உருவாக்கச் செயல்முறையைத் தேர்ந்து, பின் HTML வழிகாட்டி, XML குறிப்பைப் படிக்கிறது அல்லது முன்னோட்ட ஸ்கிரிப்டை அழைக்கிறது.</desc>
