<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="91.867mm" viewBox="0 0 900 780" role="img" aria-labelledby="title desc">
<title id="title">இரு மாதிரி API அழைப்புகள் கொண்ட முழு இடைவினை வரிசை</title><desc id="desc">வான்கூவர் நேரமும் வானிலையும்: மாதிரி இரண்டு தனி அழைப்புகளை உருவாக்குகிறது; Harness அவற்றை இயக்கி ID-யுடன் முடிவுகளைத் திருப்புகிறது; பின் மாதிரி இறுதிப் பதிலை உருவாக்குகிறது.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="780" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="56" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">முதல் மாதிரி அழைப்பு</text><text x="450" y="93" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">messages: system + user · tools: நேரக் கருவி + வானிலைக் கருவி</text><path d="M450 120 L450 157" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
