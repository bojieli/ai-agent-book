<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="54.413mm" viewBox="0 0 900 462" role="img" aria-labelledby="title desc">
<title id="title">Qwen3 வார்ப்புருவில் பயனர் செய்தியும் கருவி முடிவும்</title><desc id="desc">ஒரே உரை ஒருமுறை பயனரிடமிருந்தும், ஒருமுறை கருவியிடமிருந்தும் வருகிறது. இரண்டும் user குறியுடன் தொடங்குகின்றன; கருவி முடிவுக்குக் கூடுதலாக tool_response குறிச்சொல் உண்டு.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
