<title id="title">Chat Template செய்திகளை token வரிசையாக மாற்றுகிறது</title><desc id="desc">கோரிக்கையில் கணினி அறிவுறுத்தலும் பயனர் கேள்வியும் உள்ளன. வார்ப்புரு இரு செய்திகளின் எல்லைகளைக் குறித்து, மாதிரி தொடர்வதற்காக assistant தொடக்கக் குறியைச் சேர்க்கிறது.</desc>
