<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="142.511mm" viewBox="0 0 900 1210" role="img" aria-labelledby="title desc">
<title id="title">ஏஜெண்ட் பாதை — பல நாணயத் தொகுப்புப் பணியின் ReAct சுழற்சி</title><desc id="desc">சிஸ்டம் ப்ராம்ப்ட்டும் கருவி வரையறைகளும் நிலையான முன்னொட்டாக உள்ளன; ஒவ்வொரு சுற்றிலும் சேர்ந்துவரும் செய்தி வரலாறு இணைகிறது. மூன்று சுற்றுகள் முறையே நாணய மாற்றம், கணக்கீடு, முடிவை ஒப்படைத்தல்.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1210" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="57" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ஒப்பீட்டளவில் நிலையான முன்னொட்டு</text><text x="450" y="91" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.6" font-weight="400" fill="#292929">சிஸ்டம் ப்ராம்ப்ட் + கருவி வரையறைகள்: convert_currency, code_interpreter</text><rect x="110" y="135" width="770" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="495" y="168" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">user</text><text x="495" y="203" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Q1: 2.5M USD; Q2: 2.1M EUR</text><text x="495" y="236" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.8" font-weight="400" fill="#292929">Q3: 1.8M GBP; Q4: 380M JPY; ஆண்டு மொத்தமும் காலாண்டுச் சராசரியும்?</text><text x="60" y="320" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">சுற்று 1</text><rect x="110" y="285" width="770" height="235" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="495" y="320" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.reasoning</text><text x="495" y="355" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">EUR, GBP, JPY வருவாயை USD-க்கு மாற்று</text><text x="495" y="394" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.tool_calls (முதல் ID: convert_currency_0)</text><text x="495" y="430" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">convert_currency(2100000, "EUR", "USD")</text><text x="495" y="463" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">convert_currency(1800000, "GBP", "USD")</text><text x="495" y="496" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">convert_currency(380000000, "JPY", "USD")</text><rect x="110" y="535" width="770" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="495" y="570" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">tool · முதல் tool_call_id: convert_currency_0</text><text x="495" y="605" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">EUR → 2,282,608.70 USD; GBP → 2,278,481.01 USD</text><text x="495" y="636" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">JPY → 2,541,806.02 USD</text><text x="60" y="700" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">சுற்று 2</text><rect x="110" y="670" width="770" height="235" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="495" y="706" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.reasoning</text><text x="495" y="741" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">மாற்று முடிவுகளைக் கூட்டி 4-ஆல் வகு</text><text x="495" y="780" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.tool_calls → code_interpreter</text><text x="495" y="818" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">total = 2500000 + 2282608.70 + 2278481.01 + 2541806.02</text><text x="495" y="851" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">average = total / 4</text><text x="495" y="884" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">print(round(total, 2), round(average, 2))</text><rect x="110" y="920" width="770" height="85" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="495" y="953" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">tool: கணக்கீட்டு முடிவு</text><text x="495" y="988" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">9602895.73    2400723.93</text><text x="60" y="1060" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">சுற்று 3</text><rect x="110" y="1030" width="770" height="150" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="495" y="1065" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">assistant.content</text><text x="495" y="1106" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ஆண்டு மொத்த வருவாய்: 9,602,895.73 USD</text><text x="495" y="1146" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">காலாண்டுச் சராசரி வருவாய்: 2,400,723.93 USD</text><path d="M495 110 L495 135" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
