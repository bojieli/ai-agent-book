<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="126.847mm" viewBox="0 0 900 1077" role="img" aria-labelledby="title desc">
<title id="title">கட்டமைக்கப்பட்ட அறிவுப் பிரித்தெடுப்புக் குழாய்</title><desc id="desc">வழக்குப் பொருட்களிலிருந்து தொகுதிப் புலங்களைக் கண்டறிந்து, கட்டமைந்த பதிவுகளைப் பிரித்தெடுத்து, குறியாக்கம், இயல்பாக்கம், கொத்தாக்கம் வழியாக முன்மாதிரிகளை உருவாக்கி, கொத்து மைய வேறுபாட்டால் அம்ச எடைகளை விளக்குகிறது.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1077" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="397" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="60" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">கட்டம் 1: அறிவுப் பிரித்தெடுப்பும் கட்டமைப்பும்</text><rect x="40" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="155" y="131" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.6" font-weight="700" fill="#292929">மூலத் தீர்ப்புகள்</text><text x="155" y="173" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">CAIL2018</text><text x="155" y="203" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="17.5" font-weight="400" fill="#292929">குற்றவகைப்படி மாதிரியெடுப்பு</text><path d="M270 165 L335 165" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="335" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="131" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="21.0" font-weight="700" fill="#292929">LLM காரணி கண்டறிதல்</text><text x="450" y="173" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="19.1" font-weight="400" fill="#292929">புலங்களைத் தொகுத்தல்</text><text x="450" y="203" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">மதிப்புகளும்</text><text x="450" y="235" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">விடுபட்ட நிலையும்</text><path d="M565 165 L630 165" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="630" y="90" width="230" height="197" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="745" y="131" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">கட்டமைந்த பதிவு</text><text x="745" y="173" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">சரணடைவு: true</text><text x="745" y="203" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="21.4" font-weight="400" fill="#292929">இழப்பீடு: ¥5 லட்சம்</text><text x="745" y="265" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="21.9" font-weight="400" fill="#292929">காயம்: கடுமை நிலை 2</text><rect x="40" y="317" width="820" height="75" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="349" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">தொகுதி Schema: பொதுப் புலம் + குற்றவகை நீட்சி</text><text x="450" y="379" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">சரணடைவு / இழப்பீடு / முன்குற்றம்; திருட்டு → தொகை, காயம் → காய நிலை</text><path d="M450 417 L450 457" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="457" width="860" height="405" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="497" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.6" font-weight="700" fill="#292929">கட்டம் 2: அம்சப் பகுப்பாய்வும் முன்மாதிரி மாதிரியாக்கமும்</text><rect x="40" y="527" width="820" height="90" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="563" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">அம்சக் குறியாக்கமும் இயல்பாக்கமும்</text><text x="450" y="599" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">வகை one-hot · பூலியன் குறி · மடக்கை மாற்றம் · இயல்பாக்கம்</text><path d="M450 617 L450 634 L230 634 L230 652" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="40" y="652" width="380" height="175" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="230" y="691" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">KMeans கொத்தாக்கம்</text><text x="230" y="735" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">குற்றவகைப்படி 2–5 கொத்துகள்</text><text x="230" y="766" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">Silhouette → வழக்கு முன்மாதிரி</text><text x="230" y="797" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.7" font-weight="400" fill="#292929">அம்சம் + தண்டனைப் பரவல் சுருக்கம்</text><path d="M420 737 L470 737" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="652" width="390" height="175" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="665" y="691" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">அம்ச எடை</text><text x="665" y="735" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">இயல்பாக்கிய கொத்து மைய வேறுபாடு</text><text x="665" y="766" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">முன்மாதிரி வேறுபாட்டுப் பங்கு</text><text x="665" y="797" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">பொருத்த முடிவை விளக்க உதவி</text><path d="M450 862 L450 897" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="897" width="860" height="155" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="938" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பயன்பாட்டு நீட்சி: உரையாடல் வழி வழக்குத் தேடல்</text><text x="450" y="983" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">முக்கிய உண்மைகள் சேர் → முன்மாதிரி பொருத்து → மூலத்துடன் விளக்கு</text><text x="450" y="1021" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">எ.கா.: வாக்குவாதத்துக்குப் பின் கைகலப்பு vs திட்டமிட்ட ஆயுதத் தாக்குதல்</text><defs /></svg>
