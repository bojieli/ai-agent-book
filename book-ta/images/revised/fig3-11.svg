<text x="740" y="409" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">பணியிடம்</text><rect x="470" y="430" width="410" height="70" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="675" y="474" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="21.8" font-weight="700" fill="#292929">ஹுவாஷான் மருத்துவமனை, இதயப் பிரிவு</text><path d="M225 500 L225 560" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="285" y="539" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">முகவரி</text><rect x="20" y="560" width="410" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="225" y="602" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">ஷூஹுய் மாவட்டம், XX சாலை</text><defs /></svg>
