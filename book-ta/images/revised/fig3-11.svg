<text x="783" y="244" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">இதய நோய்க்கு</text><rect x="470" y="280" width="410" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
