<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="77.144mm" viewBox="0 0 900 655" role="img" aria-labelledby="title desc">
<title id="title">GraphRAG பொருள்—உறவு அறிவு வரைபடம்</title><desc id="desc">இரண்டு டாக்டர் ஜாங்குகளுக்கு வெவ்வேறு உட்பொருள் அடையாளங்களும் உறவுகளும் உள்ளன. பல் மருத்துவரின் முகவரி பயனர், மருத்துவர், மருத்துவமனை, முகவரி என வரிசையாகத் தேடப்படுகிறது.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="655" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="62" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">வினவல்: என் பல் மருத்துவரின் மருத்துவமனை முகவரி?</text><rect x="20" y="120" width="410" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="225" y="164" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பயனர்</text><rect x="470" y="120" width="410" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="675" y="164" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பயனரின் தந்தை</text><path d="M225 185 L225 280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="333" y="244" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">பல் சிகிச்சைக்கு</text><rect x="20" y="280" width="410" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="225" y="315" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">டாக்டர் ஜாங்-A</text><text x="225" y="350" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">பிரிவு: பல் மருத்துவம்</text><path d="M225 370 L225 430" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="290" y="409" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">பணியிடம்</text><rect x="20" y="430" width="410" height="70" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
