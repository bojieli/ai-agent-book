<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="102.113mm" viewBox="0 0 900 867" role="img" aria-labelledby="title desc">
<title id="title">சூழல் முடிவிலிருந்து LLM Rubric வரை: மூன்றடுக்குப் பாதைச் சரிபார்ப்பு</title><desc id="desc">எடுத்துக்காட்டு: வாடிக்கையாளர் சேவையின் முழுப் பணத்திருப்ப வாக்குறுதியை வணிக நிலை, அனுமதி, காலம், பதில் ஆகியவற்றுடன் ஒவ்வொன்றாகச் சரிபார்த்தல்.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="867" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ஒரே பணத்திருப்பத்தை ஆய்வு செய்</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">பயனர் முழுப் பணம் கேட்டார்; பதில்: "முழுதும் திருப்பினோம், 7 நாளில் வரும்."</text><rect x="20" y="190" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="223" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">முடிவுச் சரிபார்ப்பி</text><text x="235" y="270" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ஆர்டர் பதிவு: பகுதித் தொகை மட்டும்</text><path d="M450 248 L502 248" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="190" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="232.14" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">முழுப் பணத்திருப்பம்</text><text x="691" y="263.86" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">இன்னும் முடியவில்லை</text><rect x="20" y="340" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="340" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="373" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">செயல்முறைச் சரிபார்ப்பி</text><text x="235" y="420" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">செயல் log: பணத்திருப்பம் சமர்ப்பிப்பு</text><path d="M450 398 L502 398" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="340" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="382.14" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">அனுமதியும் வரும் காலமும்</text><text x="691" y="413.86" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">சரிபார்க்க வேண்டும்</text><rect x="20" y="490" width="430" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="490" width="430" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="235" y="523" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">தரம் · LLM Rubric</text><text x="235" y="570" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பதில் மூலம்: "முழுதும்", "7 நாள்"</text><path d="M450 548 L502 548" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="502" y="490" width="378" height="115" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="691" y="532.14" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">நடை மதிப்பெண்</text><text x="691" y="563.86" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ஆர்டர் சோதனைக்கு மாற்றல்ல</text><rect x="20" y="641" width="860" height="198" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="641" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="674" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பாதை மதிப்பீட்டில் எழுதி, கண்டறிதலுக்கு அனுப்பு</text><text x="450" y="721" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">பணி முடிவு: பகுதி நிறைவு; சிக்கல்: வாக்குறுதித் தொகை ≠ உண்மைத் தொகை</text><text x="450" y="753" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">சான்று இடம்: உரிய ஆர்டர், செயல் பதிவு, சேவையின் மூலச் சொற்கள்</text><text x="450" y="785" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">சரிபார்க்க வேண்டியது: 7 நாள் அடிப்படை; தனிச் சோதனைக்குப் பதிவு</text><defs /></svg>
