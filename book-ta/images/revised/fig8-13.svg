<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ஒரே பணியும் தொடக்கக் குறியீடும்</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">parser.py: வெற்று உள்ளீட்டில் IndexError; சோதனைக் கோப்பு பாதுகாப்பில்</text><text x="450" y="132" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23" font-weight="400" fill="#292929">ஒரே உத்தியிலிருந்து தனித்தனியே மாதிரியெடுத்து → 16 தனிமைப்படுத்திய sandbox</text><path d="M450 165 L450 195" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="195" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="195" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="228" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">சரிபார்ப்பி ஒவ்வொரு patch-ஐயும் சோதிக்கும்</text><text x="450" y="275" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">patch-ஐப் பொருத்தி, சோதனை இயக்கி, பாதுகாத்த கோப்புகளைச் சரிபார்</text><text x="450" y="307" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.8" font-weight="400" fill="#292929">எல்லாச் சோதனையும் வெற்றி + சோதனைக் கோப்பு மாறவில்லை → 1; மற்றவை 0</text><path d="M450 340 L450 385" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
