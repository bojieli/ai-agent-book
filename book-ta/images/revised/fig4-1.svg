<title id="title">MCP நெறிமுறை இடைவினை நேரவரிசை</title><desc id="desc">MCP 2026-07-28: கிளையண்ட் முதலில் சர்வர் திறன்களைக் கண்டறிந்து, பின் வானிலைக் கருவியைப் பட்டியலிட்டு அழைக்கலாம். ஒவ்வொரு கோரிக்கையும் தேவையான நெறிமுறை மெட்டாடேட்டாவைக் கொண்டுள்ளது; படத்தில் வணிக முறைகளும் அளவுருக்களும் விரிக்கப்பட்டுள்ளன.</desc>
