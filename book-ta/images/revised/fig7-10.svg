<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="124.609mm" viewBox="0 0 900 1058" role="img" aria-labelledby="title desc">
<title id="title">OpenVLA, RoboTwin2 உடல்சார் நுண்ணறிவுச் சூழல்</title><desc id="desc">உத்தித் தழுவல், மூட்டுக் கட்டுப்பாடு, சூழல் பின்னூட்டம்.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1058" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பணி: டப்பாவைப் பாத்திரத்தில் வை</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">அறிவுறுத்தல் + அவதானிப்பு → உத்தி உள்ளீட்டுத் தழுவல்</text><path d="M225 120 L225 155" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 120 L675 155" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="155" width="410" height="185" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="155" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="188" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">அவதானிப்பு அமைப்பு</text><text x="225" y="235" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.4" font-weight="400" fill="#292929">தலை, இரு மணிக்கட்டு RGB</text><text x="225" y="267" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பட உள்ளீடு: 224 × 224</text><text x="225" y="299" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.6" font-weight="400" fill="#292929">இரு கை மூட்டு நிலை: 14</text><rect x="470" y="155" width="410" height="185" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="155" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="188" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">உத்தி இடைமுகம்</text><text x="675" y="235" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">OpenVLA: Llama 2 7B</text><text x="675" y="267" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">DINOv2 / SigLIP → காட்சி tokens</text><text x="675" y="299" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பணித் தழுவல்: உள்ளீடு, செயல்</text><path d="M430 250 L470 250" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M675 340 L675 380" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="380" width="860" height="185" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="380" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="413" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">செயல் தழுவலும் கட்டுப்பாடும்</text><text x="450" y="460" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ஒவ்வொரு கைக்கும் 6 மூட்டு + 1 பிடிப்பான்: மொத்தம் 14 பரிமாணம்</text><text x="450" y="492" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">வரிசை, இயல்பாக்கம், கட்டுப்பாட்டு அதிர்வெண், மூட்டு வரம்புகளைச் சரிபார்</text><text x="450" y="524" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Action chunking: H படி வெளியீடு → h படி இயக்கம் → மீண்டும் கவனி</text><path d="M450 565 L450 605" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="605" width="860" height="185" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="605" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="638" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">RoboTwin2 · SAPIEN உருவகப்படுத்தல் சூழல்</text><text x="450" y="685" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">move_can_pot: பொருள், பாத்திரம், இருகை ரோபோ</text><text x="450" y="717" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">இடம் / திசை / தோற்றம் சீரற்றல் · மோதல் / தொடுகை / உராய்வு</text><text x="450" y="749" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">கட்டுப்பாடு → பொருள், மூட்டு நிலை புதுப்பிப்பு → கேமரா அவதானிப்பு</text><path d="M20 700 L6 700 L6 250 L20 250" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 790 L450 835" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="835" width="860" height="195" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="835" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="868" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">மதிப்பீடும் reset-உம்</text><text x="450" y="915" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">வெற்றி நிபந்தனை: இலக்குப் பொருள், கொள்கலனின் பணி நிலை</text><text x="450" y="947" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">நிறைவு நேரம் / கட்டுப்பாட்டுப் படிகள் · தோல்வி வகை</text><text x="450" y="979" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">நிலையான seed, சீரற்ற வரம்பு → reset → அடுத்த episode</text><defs /></svg>
