<title id="title">அடுக்குக் கருவிப் பொருத்தம் (சர்வர் நிலை → கருவி நிலை இரு அடுக்குப் பொருள் தேடல்)</title><desc id="desc">மாதிரி மதிப்பெண்கள்: முதலில் GitHub சர்வர் தேர்ந்தெடுக்கப்படுகிறது; பின் கருவி ஒப்புமைப்படி மூன்று வேட்பாளர்கள் திருப்பப்படுகின்றன. சர்வர் கருவி எண்ணிக்கையும் மதிப்பெண்களும் செயல்முறையைக் காட்டுவதற்கே.</desc>
