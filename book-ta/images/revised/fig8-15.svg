<title id="title">பல சுற்று ஊடாட்டத்தில் credit assignment</title><desc id="desc">ஒரே வழிசெலுத்தலின் ஐந்து படிகள் வரிசையாக; இறுதியில் மட்டும் வெகுமதி தருவதையும் செயல்முறைப் பின்னூட்டம் சேர்ப்பதையும் படிவாரியாக ஒப்பிடுகிறது.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="545" fill="#ffffff" y="0" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">ஒரே பயணம், இரு வெகுமதித் திட்டங்கள்</text><text x="102" y="120" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">படி</text><text x="314" y="120" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">கவனிப்பும் செயலும்</text><text x="590" y="120" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">இறுதியில் மட்டும்</text><text x="784" y="102.92" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">செயல்முறை</text><text x="784" y="132.2" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">வெகுமதியுடன்</text><path d="M32 146 L868 146" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="102" y="194" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">1</text><text x="314" y="194" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">பார்த்து, இடது திருப்பம்</text><text x="590" y="194" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">0</text><text x="784" y="194" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">+1</text><path d="M32 218 L868 218" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="102" y="266" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">2</text><text x="314" y="266" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">பலகை கண்டு திசை உறுதி</text><text x="590" y="266" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">0</text><text x="784" y="266" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">+1</text><path d="M32 290 L868 290" fill="none" stroke="#333333" stroke-width="1.8" />
