<text x="102" y="410" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">4</text><text x="314" y="410" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">விலகல் உணர்ந்து திரும்பல்</text><text x="590" y="410" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">0</text><text x="784" y="410" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">0</text><path d="M32 434 L868 434" fill="none" stroke="#333333" stroke-width="1.8" />
<text x="102" y="482" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">5</text><text x="314" y="482" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">இலக்கை அடைந்து முடிவு</text><text x="590" y="482" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">+10</text><text x="784" y="482" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="27.0" font-weight="400" fill="#292929">+10</text><path d="M32 505 L868 505" fill="none" stroke="#333333" stroke-width="1.8" />
