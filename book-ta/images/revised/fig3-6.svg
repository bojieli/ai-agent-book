<title id="title">அடர்த்தியான உட்பொதிவுத் தொழில்நுட்பத்தின் பரிணாமம்</title><desc id="desc">நிலையான சொல் வெக்டர், சூழல் சார்ந்த token பிரதிநிதித்துவம் முதல் ஒப்புமைக் கணக்கீட்டுக்கான வாக்கிய வெக்டர், பல்வகை மீட்டெடுப்புப் பிரதிநிதித்துவம் வரை. பரிமாணங்கள் படத்தில் குறிப்பிட்ட உள்ளமைவின்படி.</desc>
