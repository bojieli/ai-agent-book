<text x="360" y="170" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">கணிதத் துறை</text><path d="M360 185 L360 337" fill="none" stroke="#333333" stroke-width="1.8" />
