<title id="title">தன்னாட்சி ஏஜெண்டின் இயக்கச் சுழற்சி</title><desc id="desc">பகுத்தறிவு, செயல், அவதானிப்பு, எல்லா வெளியேறும் நிபந்தனைகளும் காட்டப்பட்டுள்ளன; பணி முடிந்தால் சரிபார்த்து ஒப்படைக்கப்படுகிறது; பிழை அல்லது வரம்பு மீறினால் முன்னேற்றம் சேமிக்கப்பட்டு அறிக்கையிடப்படுகிறது.</desc>
