<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="92.220mm" viewBox="0 0 900 783" role="img" aria-labelledby="title desc">
<title id="title">ஏஜெண்ட் சுயதூக்கல் சுழற்சி</title><desc id="desc">விமானச் சேவை மாதிரிச் செயலாக்கத்திலிருந்து மின்வணிக வாடிக்கையாளர் சேவை உருவாக்கப்பட்டு, பல சுற்றுச் சோதனை முடிவுகளின்படி திருத்தப்படுகிறது அல்லது சேமிக்கப்படுகிறது.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="783" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">குறிப்புச் செயலாக்கம்: விமான வாடிக்கையாளர் சேவை</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">ப்ராம்ப்ட்டில் ரத்து, மாற்றல் விதிகள்; கருவி cancel_order</text><text x="450" y="132" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">மாதிரி கருவி தேர்வு → சரிபார்த்து இயக்கு → முடிவு எழுது → தொடர் / வெளியேறு</text><path d="M450 170 L450 207" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="207" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="207" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="240" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.6" font-weight="700" fill="#292929">உருவாக்குநர் சட்டகத்தை நகலெடுத்து மின்வணிகத்துக்கு மாற்றல்</text><text x="450" y="287" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">பணத்திருப்பம், அனுப்புகை விதிகள்; refund_order இணைப்பு</text><text x="450" y="319" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">அழைப்பு ID, செய்தித் தொடர்பு தக்கவைப்பு; சுற்றுகளிடை நிலை, வரம்பு, வெளியேற்றம்</text><path d="M450 357 L450 394" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="394" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="394" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="427" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">புதிய மின்வணிகச் சேவையைச் சரிபார்த்தல்</text><text x="450" y="474" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">அமைப்பு, தொகுப்பு; கருவிக் கோரிக்கை–பதில் இணை சோதனை</text><text x="450" y="506" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">பணத்திருப்பப் பணி இயக்கம்; கருவி நடத்தை, பல சுற்று நிலை</text><path d="M230 544 L230 600" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M680 544 L680 600" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="600" width="410" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="600" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="633" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">தோல்வி: திருத்தி மீண்டும்</text><text x="225" y="680" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">குறையைக் கண்டு உருவாக்குநருக்கு</text><rect x="470" y="600" width="410" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="600" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="633" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.8" font-weight="700" fill="#292929">தேர்ச்சி: பதிப்பு, சோதனை சேமி</text><text x="675" y="680" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">பொதுத் திருத்தம் சட்டகத்துக்கு</text><text x="675" y="712" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">மின்வணிகச் சோதனை ஏஜெண்டுடன்</text><path d="M20 661 L5 661 L5 278 L20 278" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<defs /></svg>
