<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="92.102mm" viewBox="0 0 900 782" role="img" aria-labelledby="title desc">
<title id="title">ஏஜெண்ட் சார் RAG-உம் ஏஜெண்ட் அல்லாத RAG-உம்: ஒப்பீடு</title><desc id="desc">ஒரே மாற்றுக் கேள்விக்கு முதல் தேடல் தயாரிப்புத் தொடரைக் காண்கிறது. ஒற்றைத் தேடல் உள்ள சான்றின்படி மட்டுமே பதிலளிக்கும்; பல சுற்றுத் தேடல் மாதிரி எண், தேதிப்படி விதிகளை மேலும் தேடும்.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="782" fill="#ffffff" y="0" />
<rect x="32" y="20" width="836" height="82" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="70" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">கடந்த மாத உத்தரவாத விதிப்படி இதை மாற்ற முடியுமா?</text><path d="M450 102 L450 136" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="150" y="136" width="600" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="180" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">முதல் தேடல்: தயாரிப்புத் தகவல்</text><text x="450" y="222" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">தொடர் கிடைத்தது; கடந்த மாத உத்தரவாத விதி இல்லை</text><path d="M450 246 L450 276 L223 276 L223 314" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 276 L666 276 L666 314" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="36" y="314" width="374" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="357" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ஒற்றைத் தேடல்</text><path d="M223 379 L223 419" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="479" y="314" width="374" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="666" y="357" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.8" font-weight="700" fill="#292929">மேலும் தேடலா? ஏஜெண்ட் முடிவு</text><path d="M666 379 L666 419" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="36" y="419" width="374" height="134" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="223" y="464" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">உள்ள சான்றுப்படி பதில்</text><text x="223" y="512" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">தொடரை மட்டுமே உறுதிசெய்யலாம்</text><rect x="479" y="419" width="374" height="134" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="666" y="464" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">சான்று சோதனை</text><text x="666" y="512" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">தீர்மானிக்க விதி போதுமா?</text><path d="M666 553 L666 608" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="479" y="608" width="374" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="666" y="654" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="700" fill="#292929">விதி இல்லை, தொடர்ந்து தேடு</text><text x="666" y="698" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="21.2" font-weight="400" fill="#292929">மாதிரி எண், அமல் தேதிப்படி தேடல்</text><path d="M853 669 L882 669 L882 472 L853 472" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M479 486 L442 486 L442 680 L410 680" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="36" y="608" width="374" height="152" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="653" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">தேடல் முடிவு</text><text x="223" y="700" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">சான்று போதுமெனில் பதில்</text><text x="223" y="738" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="21.3" font-weight="400" fill="#292929">வரம்பு தீர்ந்தால் குறையைக் கூறு</text><defs /></svg>
