<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="100.111mm" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
<title id="title">ஆறு சுருக்க உத்திகளின் செயலாக்க ஓட்டம்</title><desc id="desc">ஆறு உத்திகளும் தத்தம் பொருள் ஒழுங்கமைப்பு, பணிச் சூழல், மூல இணைப்புகள், சாளர வரம்புக் கையாளலைக் காட்டுகின்றன.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="850" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="54" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① சுருக்கமில்லை</text><text x="605" y="54" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">நேரடியாகத் தக்கவை</text><rect x="40" y="72" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="105" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">மூலத் தேடல் முடிவுகள்</text><path d="M405 97 L490 97" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="72" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="105" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">முழு முடிவுகள்</text><rect x="20" y="157" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="191" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="21" font-weight="700" fill="#292929">② தனித்தனி முடிவுச் சுருக்கம்</text><text x="605" y="191" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">தனித்தனியே 2–3 பத்திச் சுருக்கம்</text><rect x="40" y="209" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="242" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">ஒவ்வொரு பக்க உள்ளடக்கம்</text><path d="M405 234 L490 234" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="209" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="242" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">பக்கவாரிச் சுருக்கம்</text><rect x="20" y="294" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="328" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.4" font-weight="700" fill="#292929">③ கூட்டுச் சுருக்கம்</text><text x="605" y="328" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">இணைத்து, மீள்வு நீக்கி, சுருக்கு</text><rect x="40" y="346" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="379" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">தேடல் முடிவுத் தொகுதி</text><path d="M405 371 L490 371" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="346" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="379" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">ஒருங்கிணைந்த சுருக்கம்</text><rect x="20" y="431" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="465" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">④ சூழல் விழிப்பு</text><text x="605" y="465" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">பணிக்கேற்பப் பிரித்தெடு</text><rect x="40" y="483" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="516" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">முடிவு + வினவல் + அறிந்தவை</text><path d="M405 508 L490 508" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="483" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="516" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">உண்மைகள், இடைவெளிகள்</text><rect x="20" y="568" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="602" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.9" font-weight="700" fill="#292929">⑤ விழிப்பு + மேற்கோள்</text><text x="605" y="602" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">சுருக்கி URL-ஐத் தக்கவை</text><rect x="40" y="620" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="653" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">முடிவு + வினவல் + அறிந்தவை</text><path d="M405 645 L490 645" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="620" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="653" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">உண்மைகளும் மூலங்களும்</text><rect x="20" y="705" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="160" y="739" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">⑥ தகவமைவு சாளரம்</text><text x="605" y="739" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">≤80% தக்கவை; &gt;80% தொகுதிச் சுருக்கம்</text><rect x="40" y="757" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="222" y="790" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">தற்போதைய உள்ளீட்டு அளவு</text><path d="M405 782 L490 782" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="490" y="757" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="790" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">சுருக்கியவற்றைக் குறி</text><defs /></svg>
