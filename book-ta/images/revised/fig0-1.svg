<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="80.089mm" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
<title id="title">ஏஜெண்ட் = LLM + சூழல் + கருவிகள்</title><desc id="desc">ஒரு கட்டணக் கோரிக்கையிலிருந்து தொடங்கி மேலிருந்து கீழாகப் படிக்கவும். மாதிரி முதலில் கட்டணத்தைச் சரிபார்க்க முடிவுசெய்கிறது; கருவி விவரங்களைத் தருகிறது; விவரங்கள் சூழலில் சேர்ந்ததும் மாதிரி அடுத்த படியைத் தீர்மானிக்கிறது.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="680" fill="#ffffff" y="0" />
<rect x="24" y="20" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="20" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="76" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">சூழல்</text><text x="544" y="76" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பயனர் கோரிக்கை: இம்மாதக் கூடுதல் கட்டணம் ஏன்?</text><path d="M544 110 L544 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="154" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="154" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="210" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM</text><text x="544" y="210" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.0" font-weight="400" fill="#292929">முதலில் இம்மாதக் கட்டண விவரத்தைப் பார்க்க முடிவு</text><path d="M544 244 L544 284" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="288" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="288" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="344" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">கருவி</text><text x="544" y="344" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">கட்டண API ஒரு ரோமிங் கட்டணத்தைக் காட்டுகிறது</text><path d="M544 378 L544 418" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="24" y="422" width="180" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<rect x="214" y="422" width="660" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="114" y="478" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">சூழல்</text><text x="544" y="478" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பயனர் கோரிக்கையும் கிடைத்த விவரங்களும் இங்கே</text><path d="M544 512 L544 552" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
