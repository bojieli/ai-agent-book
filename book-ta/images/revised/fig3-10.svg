<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="70.196mm" viewBox="0 0 900 596" role="img" aria-labelledby="title desc">
<title id="title">RAPTOR மரவடிவ அடுக்குச் சுட்டு</title><desc id="desc">மூல ஆவணம் துண்டுகளாகப் பிரிக்கப்பட்ட பின், உட்பொதிவின்படி கொத்தாக்கிச் சுருக்கம் உருவாக்கி, மீண்டும் மீண்டும் உயர்நிலைச் சுருக்கங்கள் அமைகின்றன. அம்புகள் சுட்டு உருவாகும் திசையைக் காட்டுகின்றன.</desc>
