<title id="title">கவனப் பொறிமுறையின் உள்ளுணர்வுப் புரிதல்</title><desc id="desc">காரணவியல் கவன அணியின் ஒவ்வொரு வரிசையும் ஒரு வினவலுக்கு ஒத்தது; கடைசி வரிசையின் எடைகளைக் கொண்டு நான்கு இடங்களின் Value-களை எடையிட்டுக் கூட்டுகிறோம்.</desc>
