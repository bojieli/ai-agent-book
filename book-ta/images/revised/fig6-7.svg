<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="108.356mm" viewBox="0 0 900 920" role="img" aria-labelledby="title desc">
<title id="title">குரல் Agent தொடர் குழாய்</title><desc id="desc">ஒலிப் பிடிப்பு, முடிவுப்புள்ளி, அறிதல், பதில், தொகுப்பு, இயக்க இடைமுகங்கள்.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="920" fill="#ffffff" y="0" />
<rect x="100" y="20" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="20" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ஒலிப் பிடிப்பும் அனுப்புதலும்</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">உலாவி AudioWorklet → WebSocket</text><text x="450" y="132" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ஒலித் துண்டு → resample / வடிவ மாற்றம்</text><path d="M450 165 L450 200" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="200" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="200" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="233" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">VAD, முடிவுப்புள்ளி தர்க்கம்</text><text x="450" y="280" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Silero VAD: பேச்சுப் பகுதிகளைக் கண்டறி</text><text x="450" y="312" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">அமைதி வரம்பு + சூழல் → ஒலிப் பகுதியைச் சமர்ப்பி</text><path d="M450 345 L450 380" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="380" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="380" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="413" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ASR → உரை</text><text x="450" y="460" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Whisper / SenseVoice</text><text x="450" y="492" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ஒலி → எழுத்துப்படி; முடிவுப்புள்ளி, நேரமுத்திரை தக்கவை</text><path d="M450 525 L450 560" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="560" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="560" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="593" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">LLM → பதில் உரை</text><text x="450" y="640" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">எழுத்துப்படியையும் பணிச் சூழலையும் படி</text><text x="450" y="672" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">TTS-க்கு ஏற்ற உரையை உருவாக்கு</text><path d="M450 705 L450 740" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="100" y="740" width="700" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="100" y="740" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="773" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">TTS, ஒலி இயக்கம்</text><text x="450" y="820" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Fish Audio S1: உரை → ஒலித் துண்டுகள்</text><text x="450" y="852" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பிணைய அனுப்புதல் → இயக்க buffer → ஒலிபெருக்கி</text><defs /></svg>
