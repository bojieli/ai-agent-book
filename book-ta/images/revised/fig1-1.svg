<title id="title">ஏஜெண்ட்–Environment மூடிய சுழற்சி இடைவினைும் ஏஜெண்டின் உள் Model–Harness அமைப்பும்</title><desc id="desc">ஏஜெண்டில் Model, Harness இரண்டும் இணையாக உள்ளன. Harness சூழலை ஒழுங்கமைத்து, கருவிகளை இயக்கி, ஓட்டத்தை நிர்வகிக்கிறது; சூழல் (Environment) செயல்களைப் பெற்று நிலையைப் புதுப்பித்து அவதானிப்புகளைத் திருப்பி அனுப்புகிறது.</desc>
