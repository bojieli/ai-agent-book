<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="104.233mm" viewBox="0 0 900 885" role="img" aria-labelledby="title desc">
<title id="title">ஏஜெண்ட் மெய்நிகர் கோப்பு முறைமையில் நான்கு பகுதி வகைகளின் மவுண்ட் அமைப்பு</title><desc id="desc">ஒருங்கிணைந்த கோப்பு இடைமுகம், நான்கு வகை அனுமதிகளும் ஆயுட்காலமும், பயனர் மற்றும் வெளி வளங்களின் நுழைவாயில்கள்.</desc>
