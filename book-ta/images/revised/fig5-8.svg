<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="88.687mm" viewBox="0 0 900 753" role="img" aria-labelledby="title desc">
<title id="title">விமான டிக்கெட் படிவம் எதைச் சமர்ப்பித்தது</title><desc id="desc">பெய்ஜிங் பயனரின் வேண்டுகோளிலிருந்து வருகிறது; மற்ற நான்கு புலங்களும் உலாவியிலிருந்து வருகின்றன. மாதிரி பதிலளிக்கும்போது இரண்டும் இணைகின்றன.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="753" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பயனர் வேண்டுகோள்</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25" font-weight="400" fill="#292929">பெய்ஜிங்குக்கு ஒரு விமானப் பயணச்சீட்டு முன்பதிவு செய்ய வேண்டும்</text><path d="M450 130 L450 170" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="170" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="170" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="203" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Agent படிவம் உருவாக்குகிறது; பயணி இருவழியைத் தேர்கிறார்</text><text x="450" y="250" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">புறப்படும் நகரம்: ஷாங்காய்; புறப்படும் தேதி: ஆகஸ்ட் 11</text><text x="450" y="282" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">"இருவழி" எனில் திரும்பும் தேதி; பயணி: ஆக. 18</text><path d="M450 315 L450 355" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="355" width="860" height="220" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="355" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="388" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">உலாவி சமர்ப்பித்த நான்கு புலங்கள்</text><text x="450" y="435" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">departure_city = ஷாங்காய்</text><text x="450" y="467" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">departure_date = 2026-08-11</text><text x="450" y="499" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">trip_type = round_trip</text><text x="450" y="531" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">return_date = 2026-08-18</text><path d="M450 575 L450 615" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="615" width="860" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="615" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="648" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26" font-weight="700" fill="#292929">வேண்டுகோள் + படிவம் → மாதிரி பயணத்தை உறுதிசெய்கிறது</text><text x="450" y="695" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ஷாங்காய் → பெய்ஜிங், ஆகஸ்ட் 11 புறப்பாடு, ஆகஸ்ட் 18 திரும்புதல்</text><defs /></svg>
