<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="52.058mm" viewBox="0 0 900 442" role="img" aria-labelledby="title desc">
<title id="title">முழு இருவழி உரையாடலில் 200 மில்லிவினாடி நுண்சுற்றுகள்</title><desc id="desc">மேல்பகுதி பயனர் உள்ளீட்டையும் உதவியாளர் வெளியீட்டையும் நேரப்படி சீரமைக்கிறது. இரண்டாம் பகுதியில் உதவியாளர் பேசிக்கொண்டிருக்கும்போதே பயனர் குறுக்கிடுகிறார்; மூன்றாம் பகுதியில் உதவியாளர் நிறுத்துகிறார். கீழ்ப்பகுதி அதே உள்ளீடுகளையும் வெளியீடுகளையும் மாதிரி கையாளும் வரிசையில் விரிக்கிறது.</desc>
