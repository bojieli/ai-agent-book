<title id="title">கருவி மாறும் ஏற்றுதலின் KV Cache உகப்பாக்கம்</title><desc id="desc">இடப்புறம்: முன்பகுதிக் கருவிப் பட்டியலை மாற்றினால் மாற்றப் புள்ளியிலிருந்து மீண்டும் கணக்கிட வேண்டும். வலப்புறம்: முன்னொட்டைத் தக்கவைத்து, கண்டறிந்த முடிவை வரலாற்றின் இறுதியில் சேர்த்தல். Cache பொருத்தம் சேவைக் கொள்கையையும் சார்ந்தது.</desc>
