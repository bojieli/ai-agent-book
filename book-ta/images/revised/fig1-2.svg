<title id="title">ஏஜெண்ட் திறன் மேம்பாட்டின் மூன்று நிலைகள்</title><desc id="desc">சூழல், வெளிப் படைப்புகள், மாதிரி அளவுருக்கள் — ஒவ்வொன்றின் தாங்கி, முறை, மேம்பாட்டுப் பண்புகள்.</desc>
