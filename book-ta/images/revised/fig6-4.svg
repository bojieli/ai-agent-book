<title id="title">சோதனை 6-1: நிகழ்வு இயக்கும் Agent கட்டமைப்பு</title><desc id="desc">மின்னஞ்சல் கையாளும் எடுத்துக்காட்டு, விரிவாக்கக்கூடிய நிகழ்வு, கருவி, நிலைப்புத்தன்மை இடைமுகங்கள்.</desc>
