<text x="450" y="833" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">③ MPS: கருத்தாக்கமும் வெளிப்பாடும் இணைந்து</text><text x="450" y="880" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Step-Audio R1.1 · கிடைக்கும் உள்ளடக்கம், முன்னேற்றப்படி நகர்வு</text><rect x="20" y="935" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="935" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="968" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Formulation Brain</text><text x="225" y="1015" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">கருத்தாக்கம், reasoning</text><text x="225" y="1047" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.9" font-weight="400" fill="#292929">பேசத்தக்க இடைநிலை உள்ளடக்கம்</text><rect x="470" y="935" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="935" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="968" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Articulation Brain</text><text x="675" y="1015" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">முந்தைய வெளியீட்டுடன் பேச்சு</text><text x="675" y="1047" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பேச்சுத் துண்டுகள் தொடரும்</text><path d="M430 1005 L470 1005" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
