<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="129.909mm" viewBox="0 0 900 1103" role="img" aria-labelledby="title desc">
<title id="title">வேக/மெதுவான சிந்தனைக் கட்டமைப்பும் வழிமுறை ஒப்பீடும்</title><desc id="desc">பணி உறுதிப்படுத்தல், பின்னணிப் பரிந்துரை, கருத்தாக்கமும் வெளிப்பாடும் ஆகியவற்றின் மூன்று அமைப்புகள்.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="1103" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">① வேகமான எதிர்வினை + மெதுவான பதில்</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பயனர்: இந்தத் திட்டம் எனக்குப் பொருந்துமா?</text><rect x="20" y="155" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="155" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="188" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">முன்னணி உடனடி எதிர்வினை</text><text x="225" y="235" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">சர்வதேச roaming சரிபார்ப்பு</text><text x="225" y="267" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">எளிய கேள்விக்கு நேரடிப் பதில்</text><rect x="470" y="155" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="155" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="188" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பின்னணி ஆழ்ந்த பகுப்பாய்வு</text><text x="675" y="235" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">வசதிகளும் விலையும் தேடல்</text><text x="675" y="267" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">முடிவு: தேவையான roaming இல்லை</text><path d="M225 295 L225 325 L675 325 L675 295" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 325 L450 350" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="350" width="860" height="95" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="350" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="383" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">ஒருங்கிணைந்த பதில்</text><text x="450" y="430" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">சரிபார்த்த பின் பரிந்துரை; பயனரிடம் முன்பு சொன்னதைக் கண்காணி</text><rect x="20" y="485" width="860" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="485" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="518" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">② முன்னணி உரையாடல் + பின்னணிப் பரிந்துரை</text><text x="450" y="565" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பயனர் நிபந்தனை → பின்னணிப் பணி புதுப்பிப்பு → முன்னணியில் பரிந்துரை</text><rect x="20" y="620" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="620" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="653" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">முன்னணி உரையாடல்</text><text x="225" y="700" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">தொடர் கேள்வி, முன்னேற்றம் கூறல்</text><text x="225" y="732" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">நடப்புத் தலைப்புக்கேற்ற பேச்சு</text><rect x="470" y="620" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="620" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="653" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பின்னணி reasoning, கருவிகள்</text><text x="675" y="700" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பணி, நிபந்தனை, சான்று, நிலை</text><text x="675" y="732" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.9" font-weight="400" fill="#292929">நிபந்தனை மாறினால் மறுபரிந்துரை</text><path d="M430 650 L470 650" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M470 725 L430 725" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
