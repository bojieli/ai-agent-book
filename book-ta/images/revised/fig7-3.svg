<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="75.731mm" viewBox="0 0 900 643" role="img" aria-labelledby="title desc">
<title id="title">கருவி அழைப்பு வகையும் மனித–இயந்திர இடைவினை வகையும்: மதிப்பீட்டுச் சூழல்கள்</title><desc id="desc">இயக்கக்கூடிய குறியீட்டுப் பணியும், போலிப் பயனருடன் ஊடாடும் பணியும் — எடுத்துக்காட்டுகள்.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
