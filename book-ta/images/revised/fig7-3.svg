<text x="675" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.5" font-weight="700" fill="#292929">மனித இடைவினை · பயணச்சீட்டு ரத்து</text><text x="675" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Agent பேசும், கருவியும் அழைக்கும்</text><rect x="20" y="160" width="410" height="190" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
