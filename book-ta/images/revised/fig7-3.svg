<text x="225" y="193" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">உருவாக்கமும் இயக்கமும்</text><text x="225" y="240" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">fib(n)-ஐ வரையறு</text><text x="225" y="272" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">run_python: வேட்பு நிரலை இயக்கு</text><text x="225" y="304" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">கருவி: இயக்க முடிவு / பிழை</text><rect x="470" y="160" width="410" height="190" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="160" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
