<title id="title">கருவி அழைப்பு RL வெகுமதி வளையம்</title><desc id="desc">நடப்புப் பணி கருவி தரும் அவதானிப்பைக் கொண்டு அடுத்த முடிவை எடுக்கிறது; பணி முடிந்ததும் பாதை பயிற்சிக்குச் செல்கிறது.</desc>
