<title id="title">புதையல் விளையாட்டில் Q-learning, LLM ஏஜெண்ட் கட்டமைப்பு ஒப்பீடு</title><desc id="desc">ஒரே சூழலில் இரு முடிவுப் பாதைகள்; பயிற்சிக்குப் பிந்தைய மதிப்பீடு, முதல் ஓட்டம் எனும் இரு அளவீட்டு நிலைகள்.</desc>
