<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="77.733mm" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">இந்த அத்தியாயத்தின் அறிவு வரைபடம்</title><desc id="desc">பயனர் நினைவகமும் பகிரப்பட்ட அறிவுத்தளமும் மீட்டெடுப்புத் தொழில்நுட்பத்தால் இணைகின்றன; முக்கிய உண்மைகளையும் தேவைக்கேற்ற விவரங்களையும் இணைக்கின்றன.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="660" fill="#ffffff" y="0" />
<rect x="20" y="20" width="410" height="260" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="410" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="59" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பயனர் நினைவகம்</text><text x="225" y="120" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.0" font-weight="400" fill="#292929">பதிவு நிலைகள் · மூன்றடுக்கு மதிப்பீடு</text><text x="225" y="151" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.6" font-weight="400" fill="#292929">நான்கு வடிவங்கள் · இயக்கக்கூடிய நிலை</text><text x="225" y="182" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.5" font-weight="400" fill="#292929">நிகழ்வு · பொருள் · செயல்முறை நினைவகம்</text><text x="225" y="213" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">Mem0 · Memobase</text><text x="225" y="244" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="19.4" font-weight="400" fill="#292929">சுருக்கி ஒழுங்கமைத்தல் · பதிவு மறைப்பு</text><path d="M225 280 L225 320" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="20" width="410" height="260" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="20" width="410" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="59" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பகிரப்பட்ட அறிவுத்தளம்</text><text x="675" y="120" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.6" font-weight="400" fill="#292929">ஆவணத் துண்டாக்கம் · பல்லூடகப் பொருள்</text><text x="675" y="151" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="19.3" font-weight="400" fill="#292929">அடர்த்தி / அரிதான · கலப்பு மீட்டெடுப்பு</text><text x="675" y="182" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">RAPTOR · GraphRAG</text><text x="675" y="213" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">அட்டவணை வழிசெலுத்தல் · Agentic RAG</text><text x="675" y="244" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="17.9" font-weight="400" fill="#292929">சூழல் முன்னொட்டு · அறிவுப் பிரித்தெடுப்பு</text><path d="M675 280 L675 320" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="320" width="860" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="450" y="356" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பொதுப் பயன்பாடு: மீட்டெடுப்பும் சுட்டும்</text><text x="450" y="395" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">துண்டாக்கம் · வெக்டர் / சொல் · இணைப்பு · மறுவரிசை</text><path d="M450 420 L450 460" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="460" width="860" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<text x="450" y="500" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">இரட்டை அடுக்கு நினைவகம்</text><rect x="45" y="525" width="385" height="80" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="237" y="557" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">கட்டமைந்த அட்டைகள்</text><text x="237" y="590" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">முக்கிய உண்மைகள், உறவுகள்</text><rect x="470" y="525" width="385" height="80" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="662" y="557" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.8" font-weight="700" fill="#292929">சூழல் விழிப்பு மீட்டெடுப்பு</text><text x="662" y="590" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">மூல விவரம் தேவைக்கேற்ப</text><defs /></svg>
