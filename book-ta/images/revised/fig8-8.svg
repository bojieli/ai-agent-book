<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="95.400mm" viewBox="0 0 900 810" role="img" aria-labelledby="title desc">
<title id="title">முன்பயிற்சியில் அடுத்த Token கணிப்பு</title><desc id="desc">ஒரே பயிற்சி வாக்கியத்தின் மூன்று முன்னொட்டுகளும் இலக்குகளும். முதல் நிலை எடுத்துக்காட்டு நிகழ்தகவுப் பரவலாகவும் அதன் இழப்பாகவும் விரிக்கப்படுகிறது.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="810" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பயிற்சி எடுத்துக்காட்டு</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ஏஜெண்ட் உண்மைச் சூழலில் பணிகளைச் செய்ய வேண்டும்</text><text x="450" y="132" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.5" font-weight="400" fill="#292929">கீழே விளக்கத்துக்கான பிரிப்பு; உண்மை எல்லைகளை tokenizer தீர்மானிக்கும்</text><text x="300" y="215" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">படித்த முன்னொட்டு</text><text x="718" y="215" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">மூலத்தின் அடுத்த token</text><rect x="20" y="244" width="558" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="299" y="284" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">ஏஜெண்ட் / உண்மைச்</text><path d="M578 274 L635 274" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="635" y="244" width="245" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="757" y="284" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">சூழலில்</text><rect x="20" y="318" width="558" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="299" y="358" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">… / உண்மைச் / சூழலில்</text><path d="M578 348 L635 348" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="635" y="318" width="245" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="757" y="358" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பணிகளை</text><rect x="20" y="392" width="558" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8" />
<text x="299" y="432" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">… / சூழலில் / பணிகளை</text><path d="M578 422 L635 422" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="635" y="392" width="245" height="60" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="757" y="432" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">செய்ய</text><rect x="20" y="500" width="860" height="153" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="500" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="533" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">முதல் வரி: "சூழலில்"-க்கு மாதிரி தரும் நிகழ்தகவு?</text><text x="450" y="580" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">கணிப்பு: சூழலில் 42% · இடத்தில் 28% · உலகில் 15% · பிற 15%</text><text x="450" y="612" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">இந்த நிலையின் இழப்பு −ln(0.42) ≈ 0.87</text><path d="M450 653 L450 688" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="688" width="860" height="108" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="688" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="721" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">எல்லா நிலைகளின் இழப்பையும் கூட்டி மாதிரியைப் புதுப்பி</text><text x="450" y="768" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">L = −Σₜ log P(xₜ | x₁,…,xₜ₋₁) → சாய்வு → உகப்பாக்கி</text><defs /></svg>
