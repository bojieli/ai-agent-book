<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="71.491mm" viewBox="0 0 900 607" role="img" aria-labelledby="title desc">
<title id="title">மருத்துவப் படிம Agent-இன் நான்கு புதுப்பிப்பு இடங்கள்</title><desc id="desc">ஒரே அமைப்பு மாதிரியால் படத்தை அறிகிறது, நிரலால் அளவீடுகளைக் கணிக்கிறது, வழிகாட்டுதல்களைத் தேடுகிறது, பின் அறிக்கை நெறிமுறைப்படி முடிவுகளைத் தொகுக்கிறது.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="607" fill="#ffffff" y="0" />
<text x="450" y="48" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="30.0" font-weight="700" fill="#292929">ஒரே படிம அறிக்கை: மாற்றம் எங்கே விழலாம்?</text><rect x="48" y="90" width="350" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="48" y="90" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="123" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">மாதிரி அளவுருக்கள்</text><text x="223" y="170" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">படிமத்தில் இலக்கை அறி</text><text x="223" y="202" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பிழையெனில் மாதிரி மேம்பாடு</text><rect x="500" y="90" width="352" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="500" y="90" width="352" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="123" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">நிரல்</text><text x="676" y="170" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="25.4" font-weight="400" fill="#292929">அறிந்ததிலிருந்து அளவீடு கணி</text><text x="676" y="202" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">விதி மாறினால் குறியீடு மாற்று</text><path d="M398 167 L500 167" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="48" y="324" width="350" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="48" y="324" width="350" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="223" y="357" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">அறிவுத் தளம்</text><text x="223" y="404" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பொருந்தும் வழிகாட்டுதல்</text><text x="223" y="436" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">புதிய பதிப்பில் மூலம் மாற்று</text><rect x="500" y="324" width="352" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="500" y="324" width="352" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="357" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">அறிவுறுத்தல் (Skill)</text><text x="676" y="404" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">நெறிப்படி முடிவைத் தொகு</text><text x="676" y="436" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">வழிகாட்டுதல், பதிப்பு பட்டியல்</text><path d="M398 400 L500 400" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M676 235 L676 324" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="565" y="288" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">அளவீட்டு மதிப்பு</text><path d="M676 469 L676 505" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="470" y="505" width="412" height="74" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="676" y="553" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">அறிக்கை வரைவு → மனித ஆய்வு</text><defs /></svg>
