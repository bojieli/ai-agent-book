<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="62.776mm" viewBox="0 0 900 533" role="img" aria-labelledby="title desc">
<title id="title">சரிபார்ப்பு முறைகளின் நிறமாலை: உறுதியான சரிபார்ப்பிலிருந்து மாதிரி மதிப்பீடு வரை</title><desc id="desc">குறிப்பிட்ட அளவுகோலுக்கு ஏற்ப நிரல் சோதனையையோ பொருள்சார் மதிப்பீட்டையோ தேர்வு செய்யலாம்.</desc>
