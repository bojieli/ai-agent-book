<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="105.764mm" viewBox="0 0 900 898" role="img" aria-labelledby="title desc">
<title id="title">ஏஜெண்டுகளை உருவாக்கக்கூடிய ஏஜெண்டின் குழாய்</title><desc id="desc">இரண்டு உருவாக்க வழிகளும் ஒரே ஏற்பு நிபந்தனைகளைப் பயன்படுத்தி, தரத்தையும் உருவாக்கச் செலவையும் தனித்தனியே பதிவுசெய்கின்றன.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="898" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பயனர் தேவை</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.3" font-weight="400" fill="#292929">வெளியீட்டு மதிப்பாய்வு ஏஜெண்ட்: சோதனைப் பதிவைப் படித்து, வெளியிடலாமா என முடிவு</text><path d="M450 140 L450 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 190 L225 160 L675 160 L675 190" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="190" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="223" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">வழி A: புதிதாக உருவாக்கல்</text><text x="225" y="270" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">இயக்கச் சுழற்சி, செய்தி கையாளல்</text><text x="225" y="302" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">கருவி நெறிமுறை, துறைக் கருவிகள்</text><text x="225" y="334" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">கட்டளை வரி நுழைவு, சோதனைகள்</text><rect x="470" y="190" width="410" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="190" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="223" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="19.5" font-weight="700" fill="#292929">வழி B: குறிப்புச் செயலாக்கத்தைத் தகவமைத்தல்</text><text x="675" y="270" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.4" font-weight="400" fill="#292929">கட்டமைந்த பதிவு படிக்கும் சட்டக நகல்</text><text x="675" y="302" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="20.0" font-weight="400" fill="#292929">சோதனை நிலைப் புலம், தேர்ச்சி நிபந்தனை</text><text x="675" y="334" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="19.1" font-weight="400" fill="#292929">துறை ப்ராம்ப்ட், கருவி வரையறை, விளக்கம்</text><path d="M225 370 L225 415 L675 415 L675 370" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 415 L450 460" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="460" width="860" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="460" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="493" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பொது ஏற்பு</text><text x="450" y="540" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">கோப்பு அமைப்பு, தொகுப்பு → சோதனை உருவாக்கம் → கருவி அழைப்பு இணை</text><text x="450" y="572" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">உண்மை மாதிரிப் பணி → பல சுற்று நிலை → சூழல் வெட்டல், அழைப்பு வரம்பு</text><path d="M450 625 L450 645" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M225 670 L225 645 L675 645 L675 670" fill="none" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="670" width="410" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="670" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="703" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பணித் தரம்</text><text x="225" y="750" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">துறைப் பணி முடிந்ததா</text><text x="225" y="782" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">செய்தி–கருவி முடிவு தொடர்பு</text><text x="225" y="814" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">நிலை, வெளியேற்றம் சரியா</text><rect x="470" y="670" width="410" height="200" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="670" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="675" y="703" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">உருவாக்கச் செலவு</text><text x="675" y="750" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22.0" font-weight="400" fill="#292929">உருவாக்க நேரம்</text><text x="675" y="782" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="19.7" font-weight="400" fill="#292929">மாதிரி உள்ளீடு, வெளியீட்டுப் பயன்பாடு</text><text x="675" y="814" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="21.2" font-weight="400" fill="#292929">திருத்தம், சரிபார்ப்புச் சுற்றுகள்</text><defs /></svg>
