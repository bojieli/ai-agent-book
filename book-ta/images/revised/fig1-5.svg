<title id="title">மாதிரி வழிநடத்தும் கருவி அழைப்பு: கிளையண்ட் சுழற்சியும் சேவையகம் நிர்வகிக்கும் சுழற்சியும்</title><desc id="desc">Kimi தேடலில் சுழற்சியைக் கிளையண்ட் ஒழுங்கமைக்கிறது; நிர்வகிக்கப்பட்ட தேடலிலும் குறியீடு இயக்கத்திலும் சர்வர் ஒழுங்கமைக்கிறது. பணி, வினவல், திரும்பும் முடிவுகள், பகுப்பாய்வுப் படிகள் காட்டப்பட்டுள்ளன.</desc>
