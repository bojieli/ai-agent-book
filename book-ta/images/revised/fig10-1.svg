<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="112.242mm" viewBox="0 0 900 953" role="img" aria-labelledby="title desc">
<title id="title">பகிரப்பட்ட சூழலும் பகிரப்படாத சூழலும்: ஓர் ஒப்பீடு</title><desc id="desc">CSV ஸ்கிரிப்டில் பங்கு மாறும்போது சூழல் தொடர்கிறது; நூல் மொழிபெயர்ப்பில் ஒவ்வொரு ஏஜெண்டும் தனிச் சூழலுடன் வெளியீடுகளை ஒப்படைக்கிறது.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="953" fill="#ffffff" y="0" />
<text x="225" y="35" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="24.0" font-weight="700" fill="#292929">வரலாறு தொடர்கிறது: CSV பகுப்பாய்வு</text><text x="675" y="35" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.0" font-weight="700" fill="#292929">தனிச் சூழல்: அத்தியாய மொழிபெயர்ப்பு</text><rect x="20" y="65" width="410" height="230" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="65" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="225" y="98" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">தேவைப் பகுப்பாய்வாளர்</text><text x="225" y="145" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">அறிவுறுத்தல்: தேவையை உறுதிசெய்</text><text x="225" y="177" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">கருவி: ask_question / save_req</text><text x="225" y="209" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">பயனர்: CSV ஸ்கிரிப்ட் எழுது</text><text x="225" y="241" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">கேள்வி: எந்தக் கோப்பு வகைகள்?</text><rect x="470" y="65" width="410" height="230" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="470" y="65" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
