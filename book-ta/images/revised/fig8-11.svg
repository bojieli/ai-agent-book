<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="75.731mm" viewBox="0 0 900 643" role="img" aria-labelledby="title desc">
<title id="title">Mid-training, SFT, RL: தேர்வும் இணைப்பும்</title><desc id="desc">பணிக் கண்டறிதலிலிருந்து பயிற்சிக்குச் சென்று, தனி மதிப்பீட்டின் மூலம் அடுத்த கட்டத்தைத் தீர்மானித்தல்.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="643" fill="#ffffff" y="0" />
<rect x="20" y="20" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">முதலில் பணிச் செயல்திறனைக் கண்டறி</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">pass@k · வடிவப் பாகுபடுத்தல் · பகுதி முன்னேற்றம் · தோல்விக் காரணம்</text><path d="M160 125 L160 180" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M450 125 L450 180" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<path d="M740 125 L740 180" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="180" width="270" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="180" width="270" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="155" y="213" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">Mid-training</text><text x="155" y="260" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="22" font-weight="400" fill="#292929">துறை அறிவு, வெளிப்பாடு</text><text x="155" y="292" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">நீளம், அடிப்படை</text><text x="155" y="324" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">துறைத் தரவு</text><text x="155" y="356" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="21" font-weight="400" fill="#292929">நீளப் பாடம் / கலப்புத் தரவு</text><rect x="315" y="180" width="270" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="315" y="180" width="270" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="213" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">SFT</text><text x="450" y="260" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பதில், செயல் மாதிரி</text><text x="450" y="292" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">வடிவம் / நெறி / மீட்பு</text><text x="450" y="324" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">உயர்தர இலக்கு</text><text x="450" y="356" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">Token மேற்பார்வை</text><rect x="610" y="180" width="270" height="215" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="610" y="180" width="270" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="745" y="213" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">RL</text><text x="745" y="260" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="21" font-weight="400" fill="#292929">இயங்கும், மதிப்பிடும் பாதை</text><text x="745" y="292" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="21" font-weight="400" fill="#292929">குழு வேறுபாடு / பின்னூட்டம்</text><text x="745" y="324" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">சூழலும் வெகுமதியும்</text><text x="745" y="356" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="23.0" font-weight="400" fill="#292929">எடு → மதிப்பிடு → புதுப்பி</text><path d="M160 395 L160 430 L740 430 L740 395" fill="none" stroke="#333333" stroke-width="1.8" />
<path d="M450 395 L450 470" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="20" y="470" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="20" y="470" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="503" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">தனி மதிப்பீடும் அடுத்த தேர்வும்</text><text x="450" y="550" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">இலக்குத் திறன் · இடமாற்றம் · தக்கவைத்த திறன் · பயிற்சி, இயக்கச் செலவு</text><text x="450" y="582" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="19" font-weight="400" fill="#292929">அடிப்படை நிரப்பு → செயல்விளக்கம் மேம்படுத்து → உத்தி உகப்பாக்கு; சிக்கலுக்கேற்ப இணைப்பைத் தேர்</text><defs /></svg>
