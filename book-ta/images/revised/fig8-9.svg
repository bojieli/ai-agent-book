<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="106.589mm" viewBox="0 0 900 905" role="img" aria-labelledby="title desc">
<title id="title">காட்சி–மொழி மாதிரி (VLM) கட்டமைப்பு</title><desc id="desc">MiniMind காட்சி projection அளவுகளும் இரு கட்டப் பயிற்சியும்.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
