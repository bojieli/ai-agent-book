<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106.000mm" height="89.276mm" viewBox="0 0 900 758" role="img" aria-labelledby="title desc">
<title id="title">Agent தொடர் பரிணாமத்தின் ஒட்டுமொத்த வளையம்</title><desc id="desc">இயக்கம், மதிப்பீடு, வேட்புப் புதுப்பிப்பு, சரிபார்ப்பு, வெளியீடு; புதுப்பிப்பு அடுத்த சுற்று இயக்கத்துடன் இணைகிறது.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333" /></marker></defs>
<rect width="900" height="758" fill="#ffffff" y="0" />
<rect x="70" y="20" width="760" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="20" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="53" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பணியை இயக்கு</text><text x="450" y="100" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">பயனர், சூழல், கருவிகளுடன் ஊடாட்டம்</text><path d="M450 150 L450 186" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="186" width="760" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="186" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="219" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">பாதைப் பதிவும் சமிக்ஞை உருவாக்கமும்</text><text x="450" y="266" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">செயல் · முடிவு · பின்னூட்டம் → முடிவு, செயல்முறை, தர மதிப்பீடு</text><path d="M450 316 L450 352" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="352" width="760" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="352" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="385" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">வேட்புப் புதுப்பிப்பு உருவாக்கம்</text><text x="450" y="432" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">அறிவு · அறிவுறுத்தல் (Prompt / Skill) · நிரல் · அளவுரு</text><path d="M450 482 L450 518" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<rect x="70" y="518" width="760" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8" />
<rect x="70" y="518" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8" />
<text x="450" y="551" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="28.0" font-weight="700" fill="#292929">சரிபார்ப்பும் வெளியீடும்</text><text x="450" y="598" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">தனிப் பணி · பின்னடைவு · படிப்படி வெளியீடு · கண்காணி · rollback</text><path d="M830 583 L865 583 L865 718 L35 718 L35 85 L70 85" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" />
<text x="450" y="690" text-anchor="middle" font-family="&quot;Noto Sans Tamil&quot;, &quot;Noto Serif Tamil&quot;, &quot;Tamil Sangam MN&quot;, sans-serif" font-size="26.0" font-weight="400" fill="#292929">புதிய பதிப்பு அடுத்த சுற்றில்</text><defs /></svg>
