<title id="title">Prompt Cache: கோரிக்கைகளைக் கடந்து முன்னொட்டின் KV Cache-ஐ மீண்டும் பயன்படுத்துதல்</title><desc id="desc">மூன்று கோரிக்கைகளின் ஒப்பீடு: பொதுவான கணினி அறிவுறுத்தலும் கருவி வரையறைகளும் மீண்டும் பயன்படும்; தொடக்கத்தில் நேர முத்திரையைச் செருகினால் அடுத்துவரும் முன்னொட்டு மாறுகிறது.</desc>
